# What the Finder searches for: problems Kite Pulse solves, and the phrases
# people use when they have that problem.
#
# Written by a person, tuned by reading what each phrase finds. A phrase that
# returns mostly noise should be removed, not kept "for recall": every thread it
# finds is one a reviewer has to read.
#
# Hacker News search (Algolia) matches all the words of a phrase, in any order,
# with some typo tolerance. It does not require them to be adjacent.
#
# First version, 2026-11-06. Not yet tuned against real results.

problems:
  claude-limits:
    description: People hitting Claude or Claude Code usage limits
    phrases:
      hackernews:
        - claude code usage limit
        - hit claude limit
        - claude max plan limit

  ai-cost-per-developer:
    description: Teams trying to see what AI coding tools cost, per developer or project
    phrases:
      hackernews:
        - AI coding cost per developer
        - claude code cost team
        - track AI spend engineering

  agent-stuck:
    description: Coding agents that loop, stall or get stuck
    phrases:
      hackernews:
        - claude code stuck
        - coding agent stuck loop

  ai-usage-visibility:
    description: Managers wanting visibility into how their team uses AI coding tools
    phrases:
      hackernews:
        - track AI coding usage team
        - measure AI coding productivity
