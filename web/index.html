<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0C0E" />
    <!-- THEME, BEFORE THE FIRST PAINT (2026-10-28). The visitor's choice from
         the switch in the top bar (localStorage "mb-theme"), else their
         device's setting. Here, not in React, so a light page never flashes
         dark while the app loads. Storage can be blocked: the device's
         setting still applies. -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('mb-theme') } catch (e) { /* blocked: use the device */ }
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.setAttribute('data-theme', t)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', t === 'light' ? '#F7F7F8' : '#0C0C0E')
      })()
    </script>

    <!-- SEARCH. The title and description lead with the searches the landing
         targets: "best AI model" and "AI model comparison" (Keyword Planner,
         10K-100K and 1K-10K), then the brand. The description says the old
         Ask-era line ("You describe the work...") no longer: the board files
         reports by job, capability and metric, it does not take a brief.
         COUNTS, NOT QUOTES (2026-10-20): the public pages show how many
         engineers reported each model working or not, never their words, so
         the description no longer promises "their exact words". 155 characters
         at most, the length a results page shows. -->
    <title>Best AI model for the job | Model Information Board</title>
    <meta name="description" content="Find the best AI model for the job from what engineers report in production, by job, capability and metric. Compare LLMs, prices and specs." />
    <!-- NOINDEX BY DEFAULT: the site is login-only, so a crawler would index only
         redirects to /login. The build flips this to "index, follow" when
         PUBLIC_SITE=1 and SITE_URL are both set (vite.config.js seoFiles). -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- The canonical link and og:url need the site's real address, so the
         build adds them only when SITE_URL is set (vite.config.js). -->

    <!-- SHARING. What a link preview shows on Slack, LinkedIn, X. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Model Information Board" />
    <meta property="og:title" content="Best AI model for the job — proven by the engineers who use it" />
    <meta property="og:description" content="An AI model comparison built from what engineers report in production, counted by job, capability and metric." />
    <meta name="twitter:card" content="summary" />

    <!-- STRUCTURED DATA, in the HTML itself so a crawler reads it without
         running JavaScript. No `url` until the site has an address. -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[
        {"@type":"WebSite","name":"Model Information Board","alternateName":"ModelBoard",
         "description":"An AI model comparison built from what engineers report in production, counted by job, capability and metric, with each model's price and specs."},
        {"@type":"Organization","name":"Model Information Board"}
      ]}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
