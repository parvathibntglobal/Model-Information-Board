# ── estimating searches a month ──────────────────────────────────────────────
# MEASURED: a Keyword Planner band from the workbook's "Planner volumes
# (measured)" sheet (global, all languages, Jan-Jul 2026). ESTIMATED: a
# keyword Planner did not measure, whose head it did, is the head's band
# midpoint x the share of searches that add that modifier. Each share is
# MEASURED by the script from the workbook's own pairs; a modifier with no
# pair gets no share and no estimate. Everything else: "not measured".
share_classes:
  pricing: ["{model} pricing", "{model} price", "{model} api price", "{model} cost per token"]
  what_is: ["what is {model}", "what is {concept}"]
  review: ["{model} review", "{model} reddit", "{casual} reddit", "{casual} honest review"]
