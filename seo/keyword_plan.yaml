# ── estimating searches a month ──────────────────────────────────────────────
# MEASURED: Keyword Planner bands on the workbook's "Planner volumes
# (measured)" sheet (global, all languages, Jan-Jul 2026). A band is a range;
# its geometric midpoint is used to compare and to estimate (10K-100K ->
# 31,623), and the band itself is what the dashboard shows.
#
# ESTIMATED: a keyword Planner did not measure, made from a head it did
# ("claude opus" -> "claude opus pricing"), is the head's midpoint times the
# share of the head's searches that add that modifier. The script MEASURES
# each share from the workbook's own pairs - a head and its modified form both
# measured - and a modifier with no such pair has no share and its keywords no
# estimate (CLAUDE.md rule 6: an unknown is not a guess). A pair keyword
# ("a vs b") takes the smaller head.
#
# Each class lists the templates it covers: the {placeholder} is the head.
share_classes:
  pricing: ["{model} pricing", "{model} price", "{model} api pricing", "{model} cost per token",
            "{model} cost per million tokens", "{vendor} api pricing", "{vendor} pricing", "{model} cost"]
  versus: ["{model} vs {model_b}", "{vendor} vs {vendor_b}", "difference between {model} and {model_b}"]
  what_is: ["what is {model}", "what is {benchmark}", "what is {capability}", "what is {metric}"]
  review: ["{model} review", "{model} reddit", "{model} honest review", "{vendor} reddit", "{vendor} review"]
  alternatives: ["{model} alternatives", "alternatives to {model}", "{vendor} alternatives", "alternatives to {vendor}"]
  best_for: ["best model for {job}", "best llm for {job}", "best ai for {job}", "best ai model for {job}"]
  open_source: ["is {model} open source", "is {model} free", "{model} open weights", "{model} free", "free {model}"]
  context: ["{model} context window", "{model} token limit"]
  api: ["{model} api", "{vendor} api", "{model} sdk", "{vendor} sdk"]
  leaderboard: ["{benchmark} leaderboard", "{job} leaderboard", "{capability} leaderboard"]
