# The keyword plan: which keywords to use on which public page.
#
# Read by scripts/build_keyword_plan.py, which expands every combination below
# with the values at the bottom, gives each keyword a monthly search volume -
# measured where Google Keyword Planner measured it, estimated where it did not
# - and writes seo/keyword_plan.json for the "Keyword plan" tab of
# /seo-keywords. Proposed 2026-10-19 (anooj); everything here is editable.
#
# SOURCE: the Combinations sheet of "Model Information Board —SEO keywords.xlsx"
# (262 combinations). Each combination keeps its combo code; its keywords are
# written out here as templates because the sheet's patterns pack alternatives
# into one line ("<model> latency / tokens per second" is two keywords) and a
# mechanical split of them produced keywords nobody types.
#
# PUBLIC PAGES ONLY. Nothing behind the sign-in (/board, /models, /admin) is a
# target: a search visitor cannot reach it.

#: A keyword is listed when its monthly searches (global) are at least this,
#: measured or estimated. The dashboard can show the rest on request.
min_monthly_searches: 10000

#: The year a "<year>" placeholder takes.
year: 2026

# ── the pages ────────────────────────────────────────────────────────────────
# kind: page (exists today) · new-page / new-tool (suggested, does not exist)
pages:
  home:            {kind: page, name: Home, url: /, about: "The front door: best AI model for the job, LLM leaderboard alternative."}
  tools:           {kind: page, name: Tools, url: /tools, about: "The three tools, side by side."}
  picker:          {kind: page, name: Best AI model picker, url: /model-picker, about: "Best model for a job or capability, or a cheaper alternative."}
  specs:           {kind: page, name: Model specs finder, url: /model-finder, about: "Filter every model by advertised spec: context, price, open weights, tools."}
  tokens:          {kind: page, name: Token counter and cost calculator, url: /token-counter, about: "Count a prompt's tokens and price it on every model."}
  blogs:           {kind: page, name: Blogs, url: /blogs, about: "The blog index."}
  directory:       {kind: page, name: Blog directory, url: /blogs/directory, about: "Every post by model, topic, title or date."}
  post:            {kind: page, name: Blog post, url: "/blogs/<slug>", about: "One post per topic: guides, explainers, comparisons, field reports."}
  catalog:         {kind: page, name: All models, url: /catalog, about: "Every model by provider and type (provider and type views)."}
  new:             {kind: page, name: New releases, url: /catalog/new, about: "Models released recently."}
  model:           {kind: page, name: Model page, url: "/catalog/model/<model>", about: "One model: price, context, specs, what engineers report."}
  compare:         {kind: page, name: Compare models, url: "/compare?ids=<a>,<b>", about: "Two or three models side by side."}
  reports:         {kind: page, name: Most reported - models, url: /reports/models, about: "Which models engineers report on most, working or failing."}
  reports_jobs:    {kind: page, name: Most reported - by job, url: /reports/jobs, about: "Each job and the models reported for it."}
  reports_caps:    {kind: page, name: Most reported - by capability, url: /reports/capabilities, about: "Each capability and the models reported for it."}
  reports_metrics: {kind: page, name: Most reported - by metric, url: /reports/metrics, about: "Figures engineers measured: speed, cost, benchmark results."}
  discussions:     {kind: page, name: Discussions, url: /discussions, about: "Readers' own experiences with models."}
  faq:             {kind: page, name: FAQ, url: "/#faq", about: "The questions section of the home page."}

  new_glossary:    {kind: new-page, name: Glossary, url: /glossary, about: "One definition per term: what is an LLM, a context window, a benchmark. (The blog's unrouted glossary is a start.)"}
  new_benchmarks:  {kind: new-page, name: Benchmarks, url: "/benchmarks/<benchmark>", about: "Each benchmark: what it measures, whether it is saturated, the scores engineers reported."}
  new_providers:   {kind: new-page, name: Provider pages, url: "/providers/<vendor>", about: "One provider: its models, pricing, terms, alternatives. Today only a filter of All models."}
  new_guides:      {kind: new-page, name: Developer guides, url: "/guides/<topic>", about: "API getting started, SDKs, errors, rate limits, integrations."}
  new_local:       {kind: new-page, name: Run models locally, url: /local, about: "Local and self-hosted models: what runs where, hardware, open weights."}
  new_trust:       {kind: new-page, name: "Data, privacy and compliance", url: /trust, about: "What each provider does with your data, and its certifications."}
  new_changes:     {kind: new-page, name: What changed, url: /changes, about: "Model updates, deprecations and reported quality drift. The backend's /changelog is a start."}
  new_industries:  {kind: new-page, name: Best model by industry or team, url: "/best-for/<industry>", about: "Healthcare, legal, finance, support, marketing."}
  tool_price:      {kind: new-tool, name: LLM price tracker, url: /tools/price-tracker, about: "Every model's price over time, from the price history the registry already records."}
  tool_vram:       {kind: new-tool, name: Hardware and VRAM calculator, url: /tools/hardware, about: "How much GPU memory a model needs, by size and quantisation."}
  tool_checklist:  {kind: new-tool, name: Model selection checklist, url: /tools/checklist, about: "A checklist and evaluation template to download."}
  tool_export:     {kind: new-tool, name: Comparison download, url: /compare, about: "A comparison as a spreadsheet or PDF, from Compare."}

