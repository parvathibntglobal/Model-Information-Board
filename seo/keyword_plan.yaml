# The keyword plan: which keywords to use on which public page.
#
# Read by scripts/build_keyword_plan.py, which writes seo/keyword_plan.json for
# the "Keyword plan" tab of /seo-keywords. Proposed 2026-10-19 (anooj); every
# line here is editable.
#
# ONE SECTION PER PAGE, and each section's keywords are written from THAT
# page's intent: what a person searching would want the page to answer. Every
# phrasing carries the combo code of the SEO workbook's Combinations sheet it
# comes from, so a keyword traces back to the category grammar.
#
# REAL QUERIES, NOT NAME SWAPS. A section has many phrasings; the builder draws
# a different mix of values for each and takes keywords from the phrasings in
# turn, so no section reads "claude latency, gpt latency, grok latency" - each
# phrasing contributes a handful (scripts/build_keyword_plan.py, `pick`). At
# least `per_section` keywords per section; a section that cannot reach it
# says so on the dashboard rather than padding.
#
# PUBLIC PAGES ONLY. Nothing behind the sign-in (/board, /models, /admin).

per_section: 520

pages:
  home:            {kind: page, name: Home, url: /, about: "Find the best AI model for the job, from what engineers report. An LLM leaderboard alternative."}
  tools:           {kind: page, name: Tools, url: /tools, about: "Free AI model tools: pick a model, filter by spec, price a prompt."}
  picker:          {kind: page, name: Best AI model picker, url: /model-picker, about: "The best model for a job or capability, or a cheaper one that does it as well."}
  specs:           {kind: page, name: Model specs finder, url: /model-finder, about: "Filter every model by advertised spec: context window, price, open weights, vision, tools."}
  tokens:          {kind: page, name: Token counter and cost calculator, url: /token-counter, about: "Count a prompt's tokens and see what it costs on every model."}
  blogs:           {kind: page, name: Blogs, url: /blogs, about: "Long-form posts on how AI models behave in production."}
  directory:       {kind: page, name: Blog directory, url: /blogs/directory, about: "Every post, by model, topic, title or date."}
  post:            {kind: page, name: Blog post, url: "/blogs/<slug>", about: "One post per topic: field reports, explainers, cost teardowns, migration guides."}
  catalog:         {kind: page, name: All models, url: /catalog, about: "Every AI model, by provider and by type."}
  new:             {kind: page, name: New releases, url: /catalog/new, about: "AI models released recently."}
  model:           {kind: page, name: Model page, url: "/catalog/model/<model>", about: "One model: price, context, specs, and what engineers report about it."}
  compare:         {kind: page, name: Compare models, url: "/compare?ids=<a>,<b>", about: "Two or three models side by side."}
  reports:         {kind: page, name: Most reported - models, url: /reports/models, about: "Which models engineers report on most, and whether it worked."}
  reports_jobs:    {kind: page, name: Most reported - by job, url: /reports/jobs, about: "Each job (coding agents, RAG, code review) and the models engineers used for it."}
  reports_caps:    {kind: page, name: Most reported - by capability, url: /reports/capabilities, about: "Each capability (reasoning, tool use, vision) and how models did at it."}
  reports_metrics: {kind: page, name: Most reported - by metric, url: /reports/metrics, about: "Figures engineers measured: speed, cost, benchmark scores."}
  discussions:     {kind: page, name: Discussions, url: /discussions, about: "Readers' own experiences with AI models."}
  faq:             {kind: page, name: FAQ, url: "/#faq", about: "Short answers to common questions about AI models and this board."}

  glossary:        {kind: new-page, name: Glossary, url: "/glossary/<concept>", about: "One plain definition per term: tokens, context window, RAG, quantization. (The blog's unrouted glossary is a start.)"}
  changes:         {kind: new-page, name: What changed, url: /changes, about: "Model updates, deprecations, version history and reported quality drift. The backend's /changelog is a start."}
  guides:          {kind: new-page, name: Developer guides, url: "/guides/<devtask>", about: "Using model APIs: getting started, SDKs, errors, rate limits, streaming, tools."}
  alternatives:    {kind: new-page, name: Alternatives, url: "/alternatives/<model>", about: "For one model, the models engineers moved to instead, and why: cheaper, faster, open."}
  prompts:         {kind: new-page, name: Prompt library, url: "/prompts/<job>", about: "Prompts and system prompts that work, per model and per job."}
  context_tool:    {kind: new-tool, name: Context window checker, url: /tools/context-checker, about: "Will this document, codebase or chat fit in a model's context window, and what does it cost to send."}
  migration_tool:  {kind: new-tool, name: Migration helper, url: /tools/migration, about: "Moving from one model to another: settings that break, price change, what engineers report after switching."}

