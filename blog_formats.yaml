# ── GUIDES: what a guide pack is built from (2026-10-30, Guides phase B) ─────
# Read by generate_sample_blogs.guides_cfg. Every key is required; a missing
# one raises (rule 12). Unmeasured starting values throughout: nobody has
# measured what these weights or caps miss, so they RANK and CAP and never drop
# anything for scoring low (rule 8) - the pack records the scores it ranked by.
guides:
  # The providers a guide can be about: the official_sources.yaml providers
  # that are also in seo/keyword_plan.yaml's `vendor` list. `registry` is the
  # provider as model_version names it (Mistral is `mistralai` there); `api`
  # is how a searcher names the API, and what the title must carry.
  vendors:
    openai: {name: OpenAI, api: OpenAI API, registry: openai}
    anthropic: {name: Anthropic, api: Claude API, registry: anthropic}
    google: {name: Google, api: Gemini API, registry: google}
    mistral: {name: Mistral, api: Mistral API, registry: mistralai}
  # The search phrases, filled per subject ({api}, {vendor}, {devtask},
  # {error}, {title}), from keyword_plan.yaml's how_to_dev and troubleshooting
  # patterns.
  keywords:
    developer-guide: {primary: "how to {devtask} with the {api}", secondary: ["{api} python example", "{vendor} api {devtask}"]}
    tutorial: {primary: "{api} tutorial", secondary: ["{title}"]}
    error-fix: {primary: "{api} {error}", secondary: ["how to fix {api} {error}", "{vendor} api {error}"]}
  # TERM MATCHING, plain words, whole words, any case. A document's score is
  # the sum over terms of: `title` if the term is in its title, `path` if in
  # its path, and `text` per occurrence in its text up to `text_hits_cap`.
  # A WEIGHT: it orders the material. A document with no term at all is not
  # about the subject; a subject with no such official document is passed
  # over, and the run says so.
  match_weights: {title: 5, path: 3, text: 1}
  text_hits_cap: 10
  # CAPS - what a pack carries. What a cap left out is counted in the pack,
  # with the scores of the first `scores_recorded` of it.
  max_official_docs: 4
  max_official_doc_chars: 24000
  max_release_notes: 6
  max_release_note_chars: 3000
  max_board_threads: 5
  # Threads read from the store to score, those with the most matching quotes
  # first: a bound on reading, recorded in the pack when reached.
  board_candidates: 300
  max_videos: 3
  # A talk PyVideo's index tagged with LLM words (video_ref.llm_terms) ranks
  # this much higher. A weight; an untagged talk can still be chosen.
  llm_talk_weight: 10
  scores_recorded: 15
  # A GUIDE QUOTES ITS SOURCES, IT DOES NOT REPRINT THEM ("published content is
  # quote + attribution + link, never full text"). At most this share of one
  # official source's code may be copied into one post. Unmeasured.
  max_source_code_share: 0.5
  # TERMS for every phrase in keyword_plan.yaml's `devtask` and `error` lists.
  # A phrase missing here stops the run rather than matching on nothing.
  devtask_terms:
    stream responses: [stream responses, streaming, stream=True, server-sent events, text_stream, stream_options]
    use function calling: [function calling, function call, tool use, tool_use, tool calling, tool_choice]
    get json output: [json mode, structured output, structured outputs, response_format, json schema, json_schema, json output]
    count tokens: [count tokens, count_tokens, token count, token counting, tiktoken, countTokens]
    use prompt caching: [prompt caching, prompt cache, cache_control, context caching, cached tokens, cached_content]
    send batch requests: [batch api, message batches, batch requests, batch prediction, batch job, batch mode, batches]
    set a system prompt: [system prompt, system message, system_instruction, developer message]
    send images: [vision, image input, image_url, images, multimodal]
    handle rate limits: [rate limit, rate limits, RateLimitError, too many requests, backoff, max_retries]
    build an agent: [agent, agents, agentic, agent sdk, tool loop]
    create embeddings: [embedding, embeddings, embed_content, text-embedding]
    upload a pdf: [pdf, pdfs, file upload, files api, upload_file, document input]
  error_terms:
    429 too many requests: ["429", too many requests, RateLimitError, rate limit]
    rate limit exceeded: [rate limit exceeded, rate_limit_error, RateLimitError, rate limit, "429"]
    401 unauthorized: ["401", unauthorized, AuthenticationError, authentication_error]
    500 internal server error: ["500", internal server error, InternalServerError, api_error]
    529 overloaded: ["529", overloaded, overloaded_error, OverloadedError]
    context length exceeded: [context length exceeded, context_length_exceeded, maximum context length, prompt is too long, context window]
    timeout: [timeout, timed out, APITimeoutError, request timeout]
    invalid api key: [invalid api key, invalid_api_key, invalid x-api-key, api key, AuthenticationError]
    quota exceeded: [quota exceeded, insufficient_quota, RESOURCE_EXHAUSTED, quota]
