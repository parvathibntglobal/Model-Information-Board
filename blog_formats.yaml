# Blog formats and the planner that picks the next posts.
#
# DRAFT, NOT CONTRACT. Read by generate_sample_blogs.py --plan. Thresholds and
# formats are configuration (rule 5), so the agreed home is contract/ - and a
# contract/ change is proposed and reviewed, never taken solo. This file lives
# at the repo root until that proposal is made.
#
# WHERE THE FORMATS CAME FROM. Read off the collected practitioner blogs, not
# invented: 70 posts sampled from the 173 blog/dev.to threads whose full text
# was readable on this machine, out of the 400 most recent blog/dev.to root
# documents on staging (2026-10-01). Each format below names the heading
# pattern it was taken from. A format is a SHAPE - section rhythm, voice and
# which blocks it carries - never a topic; topics come from the planner.
#
# WHAT DECIDES WHAT GETS WRITTEN: code, not the model. The planner lists
# subjects with enough evidence, pairs them with a compatible format, skips any
# (format, subject) already written, and picks N posts in distinct formats.
#
# WHAT MAKES A BATCH LOOK DIFFERENT (added 2026-10-05). The first nine posts
# shared one renderer, one paragraph shape (median 78-110 words, most opening
# on "The"/"A") and one block set, so they read alike even with no heading
# reused. Each format now also fixes:
#   layout          its own page structure and accent (web/src/board/views.js)
#   voice           how its paragraphs are built
#   paragraphs      words per paragraph and paragraphs per section - CHECKED
#   heading_rules   rules, never example headings: the old examples were copied
#   special         one structured block only this format carries
# A format's word floor must sit below the length its own sections and
# paragraphs typically produce; load_formats() refuses one that does not.
# Code also refuses a heading any other post already uses, and a draft whose
# paragraphs open on the same word too often.

# FAST PROSE AND DIFFERENT ENDS (added 2026-10-06). Was, over the 12 drafts on
# 2026-10-06: median sentence 19 words (p90 30), median paragraph 82 words,
# median post 1,915 words; 12 of 12 opened on the same summary box and 11 of 12
# closed on a section about choosing, routing or adopting. The team read them
# as slow and samey. So, for every planned post:
#   prose      sentence and lead limits - CHECKED (generate_sample_blogs._pace)
#   opening    what the first section opens on, per format
#   closing    what the last section is, per format; a last heading that is a
#              choice ("which", "when to use", "should you") is refused
prose:
  sentence_median_max: 15
  sentence_max: 30
  lead_words_max: 40
  # SKIM LINES (2026-10-08). The skim view showed each paragraph's first
  # sentence, and of 224 paragraphs 27 opened on fewer than 8 words, 13 on a
  # sentence leaning on the one before ("That...", "This..."), and 3 on a quote.
  # Each paragraph now carries its own skim sentence, written to stand alone.
  skim_words: [12, 28]
  # LIVELIER AND LESS ALIKE (2026-10-08), measured over the same 12 posts:
  #   rhythm        sentence-length spread / mean was 0.32-0.43 - an even beat
  #   short         1 of 12 to 10 of 24 paragraphs (of 3+ sentences) per post
  #                 held any sentence of 8 words or fewer
  #   tics          'rather' up to 10 a post, 'while' 8, 'whether' 10
  #   price recital 'per million' up to 5 a post, though the rate card shows it
  #   set phrases   'does not establish' and 'not proof that' in 6 of 12 posts,
  #                 'is listed at' in 7
  rhythm_cv_min: 0.45
  short_sentence_words: 8
  short_sentence_paragraph_share_min: 0.4
  word_caps: {rather: 2, while: 2, whether: 2, however: 1, ultimately: 0, notably: 0, crucially: 0, moreover: 0}
  avoid_phrases: ["does not establish", "not proof that", "is listed at", "it is worth noting", "when it comes to", "in practice,"]
  price_recital_max: 1

planner:
  # A subject is a candidate only with this much evidence on staging
  # (verified, non-declined board entries). Was measured 2026-10-01: 23
  # models, 21 pairs and 10 capabilities/jobs cleared these.
  min_threads_model: 8
  min_threads_pair: 5
  min_threads_topic: 8
  min_models_topic: 3
  # How many candidates per subject kind the planner considers, most-evidenced
  # first. An internal ordering; nothing about it reaches a page.
  candidates_per_kind: 25

formats:
  - key: field-report
    name: Field report
    subject: model
    layout: report
    derived_from: "What happened / The evidence / What stayed green anyway / What I might have wrong"
    shape: >-
      A field report on how this model behaves once it is in a real system. Open on the
      concrete behaviour practitioners hit, lay out the evidence, separate what is
      established from what is not, and close on what an engineering team should change.
    voice: >-
      Terse and observational, like an incident write-up. Short paragraphs of two to four
      sentences. Lead each paragraph with the observation itself, then the condition it
      held under. No scene-setting and no rhetorical openings.
    paragraphs: {per_section: [2, 4], words: [30, 65]}
    heading_rules: >-
      Each heading states one specific observation about this model in plain words, as a
      short sentence a reader could quote. Headings must not start with "What", "Why" or
      "How", and must not be generic labels such as "Evidence" or "Conclusion".
    opening: >-
      the most surprising behaviour practitioners hit with this model, stated as a fact in the first sentence, with the condition it held under
    closing: >-
      what is still not established about this model, and what evidence would settle it - never a recommendation
    special: findings
    sections: [4, 6]
    words: [550, 1300]
    blocks: {matrix: false, tree: false, code: [0, 1], prices: true}

  - key: head-to-head
    name: Head-to-head
    subject: pair
    layout: versus
    derived_from: "What do the release benchmarks say? / Does the cheaper claim hold? / What happens in a tool loop?"
    shape: >-
      A head-to-head between the two models, organised as the questions an engineer would
      actually ask before choosing, each answered from what practitioners measured or hit.
    voice: >-
      Each section opens with a one-paragraph direct answer to its question, naming which
      model wins that question and under what condition, then gives the reasoning. Medium
      paragraphs; contrast the two models explicitly in every section.
    paragraphs: {per_section: [2, 4], words: [35, 75]}
    heading_rules: >-
      Every heading is a specific question ending with "?", naming a concrete workload,
      failure or cost, never a generic one such as "Which is better?".
    headings_end_with_question: true
    opening: >-
      the sharpest difference between the two models, with the figure or the words that show it
    closing: >-
      the question the evidence cannot settle yet, and what a team would have to measure to settle it
    special: picks
    sections: [5, 7]
    words: [800, 1700]
    blocks: {matrix: true, tree: false, code: [0, 1], prices: true}
    matrix_title: "When to use {a} vs {b}"

  - key: cost-teardown
    name: Cost teardown
    subject: model
    layout: ledger
    derived_from: "The pricing change that matters here / The napkin math / Two breaking changes / Tokens per task is the hidden multiplier"
    shape: >-
      A teardown of what this model actually costs to run: which mechanics move the bill
      (caching, verbosity, retries, effort settings, tool schemas) and what to change.
      Use only figures stated in the discussions or the fact sheet - explain the
      mechanics, never compute a new number.
    voice: >-
      Mechanism first and numbers-led: every paragraph names one cost mechanism, the figure
      the discussions or fact sheet give for it, and the lever that changes it. Compact
      paragraphs; no narrative throat-clearing.
    paragraphs: {per_section: [2, 3], words: [30, 70]}
    heading_rules: >-
      Each heading names one cost mechanism as a noun phrase (for example the thing that
      grows the bill), never a question and never starting with "What", "Why" or "How".
    opening: >-
      the line on the bill that surprises people most, with its figure
    closing: >-
      the cost nobody has a figure for yet - a mechanism the discussions name but do not measure
    special: drivers
    sections: [4, 6]
    words: [500, 1300]
    blocks: {matrix: true, tree: false, code: [0, 1], prices: true}
    matrix_title: "What moves the bill"

  - key: migration-guide
    name: Migration guide
    subject: pair
    layout: runbook
    derived_from: "Before you start / Step 1: Pick your model / The confusing part / Breaking changes / When not to"
    shape: >-
      A practical guide for a team moving traffic between these two models: what breaks,
      what to check before switching, how to run the switch safely, and when not to.
    voice: >-
      Second person and imperative, like a runbook: tell the reader what to do and what to
      check. Short paragraphs; one action per paragraph; put the reason after the action.
    paragraphs: {per_section: [1, 3], words: [25, 60]}
    heading_rules: >-
      Each heading is an instruction starting with a verb (for example "Pin ...",
      "Measure ...", "Roll back ..."), never a question and never starting with "What".
    opening: >-
      the first thing that breaks when traffic moves, as an instruction
    closing: >-
      how to roll back: the signal that says stop, and how traffic returns
    special: steps
    sections: [5, 7]
    words: [400, 1300]
    blocks: {matrix: false, tree: true, code: [1, 2], prices: true}
    tree_question: "Should this workload move between {a} and {b}, and in which direction?"

  - key: architecture-pattern
    name: Architecture pattern
    subject: topic
    layout: blueprint
    derived_from: "Overview: isolate generation, distrust everything / Layer 1 / Layer 2 / Design decisions worth stealing"
    shape: >-
      An architecture write-up for this kind of work: the pattern that holds up in
      production, layer by layer, the failure each layer contains, and the decisions worth
      copying.
    voice: >-
      Structural and precise, like a design document: describe components, their
      boundaries and the failure each one contains. Medium paragraphs; name the component
      in the first sentence of each.
    paragraphs: {per_section: [2, 4], words: [35, 75]}
    heading_rules: >-
      Each heading names a component or boundary of the architecture as a noun phrase,
      never a question and never starting with "What", "Why" or "How".
    opening: >-
      the failure this architecture exists to contain, described as a concrete incident
    closing: >-
      the failure this pattern still does not contain
    special: layers
    sections: [5, 7]
    words: [800, 1700]
    blocks: {matrix: true, tree: false, code: [1, 2], prices: false}
    matrix_title: "Pattern versus anti-pattern"

  - key: release-analysis
    name: Release analysis
    subject: model
    layout: brief
    derived_from: "Grok 4.7 Shipped / The benchmark you cite is the argument you're making / Price cuts: practical migration steps"
    shape: >-
      An analysis of this model as it lands in practice: what engineers report after
      adopting it, how the claims around it hold up, who should switch and who should wait.
    voice: >-
      A news analyst's voice: lead with the finding, then the evidence, then what it means
      for an adopting team. Punchy, varied sentence length; short paragraphs.
    paragraphs: {per_section: [2, 3], words: [30, 65]}
    heading_rules: >-
      Each heading is a short, specific verdict-style statement about one claim or
      consequence (a reader should know the answer from the heading alone), never a
      question and never starting with "What", "Why" or "How".
    opening: >-
      the finding that contradicts a launch claim, or confirms the strongest one
    closing: >-
      what to watch next: the claim still open and the evidence that would decide it
    special: claims
    sections: [4, 6]
    words: [450, 1300]
    blocks: {matrix: false, tree: true, code: [0, 1], prices: true}
    tree_question: "Should your team adopt {a} now?"

  - key: evaluation-critique
    name: Evaluation critique
    subject: topic
    layout: critique
    derived_from: "My factual-recall tasks were scoring format, not facts / What the extra data did not buy / What I might have wrong"
    shape: >-
      A critique of how this capability is measured and reported: what common evaluations
      and claims actually test, what they miss, where practitioner experience diverges
      from the scores, and how to evaluate it for your own workload.
    voice: >-
      Argumentative: build one argument across sections, each paragraph advancing it by
      one step; concede the strongest counter-point once.
    paragraphs: {per_section: [2, 4], words: [45, 90]}
    heading_rules: >-
      Each heading states a claim of the argument as a full sentence (it may be
      contrarian), never a question and never starting with "What", "Why" or "How".
    opening: >-
      the claim being challenged, stated plainly, then the counter-claim in one sentence
    closing: >-
      the strongest counter-argument, conceded fairly, and what it still does not explain
    special: probes
    sections: [4, 6]
    words: [800, 1500]
    blocks: {matrix: false, tree: false, code: [0, 1], prices: false}
