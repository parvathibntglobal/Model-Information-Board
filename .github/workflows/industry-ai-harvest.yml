# The Industry AI agent and its observer, daily (weekly from 2026-11-20; daily since
# 2026-11-25, anooj).
#
# scripts/run_industry_ai.py harvests data about AI across industries and roles
# (the contract's active domains) with the queries in contract/industry_ai.yaml,
# and, with `--watch`, the observer's watch lists; labels it with the code rules there and
# stores it in `iai_item` / `iai_run` only. No language model is called. A
# SEPARATE LANE: it reads and writes none of the model board's tables.
#
# SWITCHED OFF UNTIL THE TEAM TURNS IT ON. It runs only when the repository
# variable INDUSTRY_AI_ENABLED is '1' - set after the first dry runs and the
# sample check (docs/industry-ai-agent.md §13). Unset, a scheduled run says so and does nothing.
#
# DAILY, IN TWO RUNS (2026-11-25). First the KEYWORD run: one of the contract's two
# rotation groups of ten domains (`run.rotation`, `--group auto` = today's UTC day),
# without the watch lists (`--no-watch`). Then the OBSERVER run (`--watch-only`), when
# `watch.enabled` is true in the contract. Each is its own `iai_run` row and its own
# summary on INDUSTRY_AI_ISSUE. The observer runs even when the keyword run failed:
# they share no state, and one failure should not cost the other's day.
#
# SPEND: Reddit and X are metered (RapidAPI) and share their monthly quota with
# the model fetches. Every platform has a request cap per run in the contract
# (`run.max_requests`), checked before each query. A hand start can run a dry
# run (harvest and count, write nothing) or narrow the domains and platforms.
#
# Writes are to `iai_item` and `iai_run` only. judge/writeguard refuses a
# remote write unless ENVIRONMENT=staging, which is why it is set here.

name: Industry AI harvest

on:
  # AFTER THE MODEL FETCH, NEVER BESIDE IT (#669 review, 2026-11-25). Both ask the same
  # RapidAPI Reddit plan, which refuses past about 32 calls a minute (429 at the
  # 32nd rapid call, measured 2026-08-14; contract/sources.yaml), and each process
  # paces itself at 25 a minute: two at once ask about 50. So this starts when the
  # model fetch finishes, as the model fetch starts when the agents finish
  # (contract/nightly_guard.yaml), and the guard job below stands it down while a
  # model fetch is still going or once it already harvested today.
  workflow_run:
    workflows: ["Scheduled fetches"]
    types: [completed]
  schedule:
    # BACKUP, 17:00 UTC: for a day the model fetch did no real work, so nothing
    # chained. GitHub starts it 3-10 hours late (measured 2026-11-13), so it lands
    # 20:00-03:00, before the next 04:00 window opens; it stands down while a model
    # fetch runs (its finish starts this) or once this harvested today. Was 09:00
    # daily in this PR's first draft, and Wednesdays 09:00 until 2026-11-25.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Harvest and count only; write nothing"
        type: boolean
        default: true
      group:
        description: "Rotation group: auto (today's), a or b. Empty = use 'domains' below"
        required: false
        default: "auto"
      domains:
        description: "Space-separated domains, when 'group' is empty (empty = every active one)"
        required: false
        default: ""
      platforms:
        description: "Space-separated platforms (empty = all), e.g. hackernews devto"
        required: false
        default: ""
      # THE OBSERVER, BY HAND: its own run after the keyword run, as on the schedule.
      # Ticked, it runs even while `watch.enabled` is false (its dry runs). A
      # scheduled run follows the contract's `watch.enabled`.
      watch:
        description: "Also run the observer's watch lists, in their own run after the keyword run"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read      # the guard reads the model fetch's runs and this workflow's
  issues: write      # the run's counts go to INDUSTRY_AI_ISSUE

concurrency:
  group: industry-ai-harvest
  cancel-in-progress: false

jobs:
  # A `schedule` or chained `workflow_run` start stands down here while a model fetch
  # is going or once this harvested today; a hand start always runs. See the contract.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/nightly_guard.py --workflow industry-ai-harvest.yml

  harvest:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    # A FIXED IMAGE, not -latest (#679 step 3): it pins the Tesseract package version
    # that reads pictures, so a GitHub image change cannot swap the reader unannounced.
    runs-on: ubuntu-24.04
    # 180 (2026-11-25; was 90, and 45 before 2026-11-24). Two runs now, a group of ten
    # domains and then the observer. The 2026-11-25 run (5 domains and the 20-account
    # watch lists, 381 requests) took 8 minutes from its first request to its stored
    # labels; a group asks for up to about 800 and the observer up to about 450
    # (#667's lists), so this is the margin, not the estimate.
    timeout-minutes: 180
    env:
      ENVIRONMENT: staging
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      USER_AGENT: ${{ vars.USER_AGENT }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      X_RAPIDAPI_KEY: ${{ secrets.X_RAPIDAPI_KEY }}
      REDDIT_PROVIDER: ${{ vars.REDDIT_PROVIDER }}
      SCRAPER_PROVIDER: ${{ vars.SCRAPER_PROVIDER }}
      # The observer's Instagram arm (2026-11-25): provider name (repo variable)
      # and an optional own key (secret; empty falls back to RAPIDAPI_KEY).
      INSTAGRAM_PROVIDER: ${{ vars.INSTAGRAM_PROVIDER }}
      INSTAGRAM_RAPIDAPI_KEY: ${{ secrets.INSTAGRAM_RAPIDAPI_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      INDUSTRY_AI_ENABLED: ${{ vars.INDUSTRY_AI_ENABLED }}
      INDUSTRY_AI_ISSUE: ${{ vars.INDUSTRY_AI_ISSUE }}
      # NO SHARED RAW STORE FOR THIS LANE (#656, anooj 2026-11-24): its search
      # pages carry every post's full text, Personal posts included, and
      # `raw_blob` would keep them for good while text retention clears
      # `iai_item`. scripts/run_industry_ai.py builds its store with remote=None
      # whatever this says; RAW_STORE_REMOTE is left unset so the file agrees.
      # The pages stay on this runner and go when the run ends.
      RAW_STORE_PATH: raw_store
      DRY_RUN: ${{ inputs.dry_run }}
      DOMAINS: ${{ inputs.domains }}
      # A scheduled or chained run has no inputs: it takes today's group.
      GROUP: ${{ github.event_name != 'workflow_dispatch' && 'auto' || inputs.group }}
      PLATFORMS: ${{ inputs.platforms }}
      WATCH: ${{ inputs.watch }}
    steps:
      - name: Is the Industry AI agent switched on, and configured?
        id: gate
        run: |
          if [ "$INDUSTRY_AI_ENABLED" != "1" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "::notice::INDUSTRY_AI_ENABLED is not 1 - nothing harvested. This is the switch, not a failure."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -n "$DATABASE_URL" ] || missing="$missing STAGING_DATABASE_URL"
          [ -n "$USER_AGENT" ]   || missing="$missing USER_AGENT"
          if [ "$DRY_RUN" != "true" ]; then
            [ -n "$INDUSTRY_AI_ISSUE" ] || missing="$missing INDUSTRY_AI_ISSUE"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Industry AI agent not configured:$missing"
            exit 1
          fi
          [ -n "$RAPIDAPI_KEY" ]   || echo "::warning::RAPIDAPI_KEY not set - Reddit is skipped this run"
          [ -n "$X_RAPIDAPI_KEY" ] || echo "::warning::X_RAPIDAPI_KEY not set - X is skipped this run"
          [ -n "$INSTAGRAM_PROVIDER" ] || echo "::warning::INSTAGRAM_PROVIDER not set - the observer skips Instagram this run"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v5

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - if: steps.gate.outputs.enabled == 'true'
        run: pip install -e .

      # PICTURE TEXT (#679 step 3, shadow mode): Tesseract from Ubuntu's own package,
      # installed only when the contract's `ocr.enabled` is true. THE VERSION IS PINNED
      # BY THE RUNNER IMAGE (this job runs on ubuntu-24.04, not -latest), and printed
      # so every run's log says which reader read the pictures (CLAUDE.md rule 2's
      # record for Tesseract, #683). With it off, nothing is installed and the run
      # fetches no picture.
      - name: Tesseract, when picture text is on
        if: steps.gate.outputs.enabled == 'true'
        run: |
          if python -c "import sys, yaml; c = yaml.safe_load(open('contract/industry_ai.yaml', encoding='utf-8')); sys.exit(0 if c['ocr']['enabled'] is True else 1)"; then
            sudo apt-get update -q
            sudo apt-get install -y -q tesseract-ocr
            tesseract --version
          else
            echo "ocr.enabled is not true: picture text is off, Tesseract not installed"
          fi

      - name: Keyword run - today's group (or the domains given), no watch lists
        if: steps.gate.outputs.enabled == 'true'
        run: |
          args="--no-watch"
          if [ -n "$GROUP" ]; then args="$args --group $GROUP"
          elif [ -n "$DOMAINS" ]; then args="$args --domains $DOMAINS"; fi
          [ -n "$PLATFORMS" ] && args="$args --platforms $PLATFORMS"
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/run_industry_ai.py --dry-run $args
          else
            python scripts/run_industry_ai.py --post-summary $args
          fi

      - name: Is the observer on?
        id: observer
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        run: |
          if [ "$WATCH" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          on=$(python -c "from collect.industry_ai import config as c; print(c.load().watch['enabled'])")
          if [ "$on" = "True" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::watch.enabled is false in contract/industry_ai.yaml - the observer does not run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Observer run - the watch lists
        if: ${{ !cancelled() && steps.observer.outputs.run == 'true' }}
        run: |
          args="--watch-only"
          [ -n "$PLATFORMS" ] && args="$args --platforms $PLATFORMS"
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/run_industry_ai.py --dry-run $args
          else
            python scripts/run_industry_ai.py --post-summary $args
          fi
