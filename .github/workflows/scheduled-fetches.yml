# Scheduled per-model fetches, as a GitHub Action (2026-10-06).
#
# #494 built the scheduler to run as a Railway service. The repository is staying
# public, and standard GitHub-hosted runners are free for public repositories
# (GitHub's billing docs, read 2026-10-06), so the team chose Actions instead.
# The runner is unchanged: `scripts/run_scheduled_fetches.py` picks the due
# models (judge/scheduler.py, contract/scheduler.yaml) and runs fetch_model for
# each, exactly as the Fetch button does.
#
# ON SINCE 2026-10-21, AND STILL A PERSON'S SWITCH. Nothing harvests unless the
# repository variable SCHEDULER_ENABLED is `1`. Unset, the job ends green having
# done nothing - a switch that is off is not a failure.
#
# NIGHTLY, AND EACH MODEL EVERY THIRD NIGHT (contract/scheduler.yaml
# `cadence_hours: 60`): every tracked model twice a week or more, about 11 a
# night, rather than all of them in one run that would not fit the job.
#
# THREE THINGS AN ACTION CHANGES, stated so nobody is surprised by them:
#   1. THE 6-HOUR JOB LIMIT. A first fetch at the 100-thread cap measured
#      ~2-2.5 h on 2026-10-06 (median 28 s, mean 85 s per thread over 26
#      threads). The runner launches models until minute 300
#      (--deadline-minutes) and stops a fetch still running at minute 345
#      (--job-limit-minutes 355, minus 10), so the summary always posts. Each
#      thread commits as it finishes, so a stopped fetch loses one thread at
#      most and its model stays due; every model not reached is named, and the
#      next night continues from there.
#   2. THE RAW STORE IS THE SHARED DATABASE (RAW_STORE_REMOTE=postgres, the
#      `raw_blob` table, migration 20261007T1200). A runner starts empty;
#      without a shared store it can read only what it harvests in the same
#      job - measured 2026-10-06, the first run read 0 of 2,217 waiting
#      documents and 0 of 6,087 unread threads. A bucket (RAW_STORE_S3_*) was
#      planned and needed an external account the team does not have; the
#      database needs nothing new (2026-10-07). Every machine that has fetched
#      runs scripts/sync_raw_store.py --apply once. Actions artifacts must NOT
#      be used instead: in a public repository they would publish Reddit and X
#      payloads.
#   3. THE LOGS ARE PUBLIC. The runner prints model names, counts and its
#      decisions; fetch_model's own output is captured, not printed, and the
#      summary is host-free by construction (judge/scheduler.summarise_runs).
#
# SET BEFORE TURNING IT ON (repository settings - names only here):
#   secrets    STAGING_DATABASE_URL (exists), OPENROUTER_API_KEY,
#              RAPIDAPI_KEY (Reddit), X_RAPIDAPI_KEY (X) - two keys, two providers
#   (no raw-store settings: RAW_STORE_REMOTE=postgres is set below and uses
#    the same STAGING_DATABASE_URL secret)
#   variables  USER_AGENT (exists), EXTRACTION_DAILY_BUDGET_USD,
#              REDDIT_PROVIDER (reddit34), SCRAPER_PROVIDER (twitter241),
#              SCHEDULER_ISSUE (an issue for the nightly summary),
#              SCHEDULER_ENABLED=1 - last.

name: Scheduled fetches
# "(nightly)" marks the night's run, so a test can be told from it
# (contract/dispatch_schedule.yaml: `nightly_dispatch`).
run-name: ${{ inputs.slot == 'nightly' && format('{0} (nightly)', github.workflow) || github.workflow }}

on:
  # Started when the agent fetch finishes, so the two never overlap
  # (contract/dispatch_schedule.yaml); 21:00 UTC is our dispatcher's fallback.
  workflow_run:
    workflows: ["Agent fetches"]
    types: [completed]
  schedule:
    # 20:30 UTC = 02:00 IST, daily. GitHub may start a scheduled run late under
    # load; nothing here depends on the minute.
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Leave empty for a test. 'nightly' = this IS the night's run (the dispatcher sets it)"
        required: false
        default: ""
      max_models:
        description: "Run at most this many due models (empty = all that fit)"
        required: false
        default: ""
      sources:
        description: "Comma-separated harvest sources (empty = all), e.g. github"
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  actions: read      # the on-time guard lists this workflow's runs

concurrency:
  group: scheduled-fetches
  cancel-in-progress: false

jobs:
  # ON TIME, ONCE (contract/dispatch_schedule.yaml, scripts/dispatch_workflows.py).
  # Our own cron starts this workflow on time; GitHub's late `schedule` start (and,
  # where listed, a chained start) stands down here if it already did real work.
  on-time:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dispatch_workflows.py guard --workflow scheduled-fetches.yml

  fetch:
    needs: on-time
    if: needs.on-time.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      ENVIRONMENT: staging
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # REDDIT AND X ARE TWO RAPIDAPI PROVIDERS WITH TWO KEYS. Measured
      # 2026-09-10: the Reddit key is refused by the X provider and vice versa
      # (collect/config.py). Each arm also needs its provider's name.
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      X_RAPIDAPI_KEY: ${{ secrets.X_RAPIDAPI_KEY }}
      REDDIT_PROVIDER: ${{ vars.REDDIT_PROVIDER }}
      SCRAPER_PROVIDER: ${{ vars.SCRAPER_PROVIDER }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      USER_AGENT: ${{ vars.USER_AGENT }}
      EXTRACTION_DAILY_BUDGET_USD: ${{ vars.EXTRACTION_DAILY_BUDGET_USD }}
      SCHEDULER_ENABLED: ${{ vars.SCHEDULER_ENABLED }}
      SCHEDULER_ISSUE: ${{ vars.SCHEDULER_ISSUE }}
      RAW_STORE_PATH: raw_store
      # THE SHARED RAW STORE (collect/rawstore_remote.py): the `raw_blob` table
      # in the same database. Without it a runner starts empty and can read only
      # what it harvests itself - the first scheduled run read 0 of 2,217
      # waiting documents. Fixed here, not a variable: the runner has no other
      # way to read the team's payloads.
      RAW_STORE_REMOTE: postgres
      MAX_MODELS: ${{ inputs.max_models }}
      SOURCES: ${{ inputs.sources }}
      # EXTRACTING AGAIN (2026-10-26): a new OpenRouter key is in the secrets
      # (verified live that day: limit $50, nothing spent). It was "off" -
      # collect-only - from #563 while the old key was dead; set it to "off"
      # again if the key stops answering, and the key and the budget stop
      # being required. EXTRACTION_DAILY_BUDGET_USD caps each night ($2.00 on
      # 2026-10-26), so at full spend the $50 key lasts about 25 nights.
      FETCH_EXTRACT: "on"
    steps:
      - name: Is the scheduler switched on?
        id: gate
        run: |
          if [ "$SCHEDULER_ENABLED" != "1" ]; then
            echo "::notice::SCHEDULER_ENABLED is not 1 - nothing harvested. This is the switch, not a failure."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -n "$DATABASE_URL" ]                || missing="$missing STAGING_DATABASE_URL"
          [ -n "$USER_AGENT" ]                  || missing="$missing USER_AGENT"
          [ -n "$SCHEDULER_ISSUE" ]             || missing="$missing SCHEDULER_ISSUE"
          # The key and the budget matter only to a batch that extracts.
          if [ "$FETCH_EXTRACT" != "off" ]; then
            [ -n "$OPENROUTER_API_KEY" ]          || missing="$missing OPENROUTER_API_KEY"
            [ -n "$EXTRACTION_DAILY_BUDGET_USD" ] || missing="$missing EXTRACTION_DAILY_BUDGET_USD"
          fi
          if [ -n "$missing" ]; then
            echo "::error::scheduler switched on but not configured:$missing"
            exit 1
          fi
          # The RapidAPI keys and providers are not required: without them the
          # Reddit and X arms skip themselves with a reason (#491), and the
          # GitHub, dev.to, HN and Hugging Face arms still run.
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v5

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - if: steps.gate.outputs.enabled == 'true'
        run: pip install -e .

      # THE BLOG AND NEWSLETTER FEEDS, ONCE A NIGHT, BEFORE THE MODELS
      # (2026-10-26). A feed has no per-model search (fetch_model's E2B), so
      # every seated feed in contract/sources.yaml is harvested wholesale here
      # and each model's E5 reads the threads that name it. --new-only: an
      # entry already stored is not requested again. --max-new-articles 10:
      # at most ten article requests per self-hosted feed a night, newest
      # first, so a long backlog (swyx.io: 432 entries, 25 stored) is caught
      # up over nights instead of overrunning the step. Feed-only newsletters
      # make no article request at all. A failure here turns the job red and
      # the models still run. Skipped when a manual run scopes SOURCES to
      # platforms that are not blogs. --scheduled: feeds marked
      # `harvest: manual` (the *.substack.com newsletters, which refuse
      # robots.txt to this runner; own-domain ones do not) are left out before any request and named in the log; a
      # developer machine harvests them by hand (#599).
      - name: Harvest the blog and newsletter feeds
        if: >-
          steps.gate.outputs.enabled == 'true'
          && (inputs.sources == '' || inputs.sources == null || contains(inputs.sources, 'blog'))
        timeout-minutes: 20
        run: python scripts/harvest_blogs.py --scheduled --new-only --max-new-articles 10

      # THE DEVELOPER FORUMS, ONCE A NIGHT, BEFORE THE MODELS (2026-10-26).
      # The Google AI Developers Forum's robots.txt disallows search, so it is
      # read as a listing of its newest topics (scripts/harvest_forums.py) and
      # each model's fetch reads the threads that name it. At most 150 new
      # topics a night, two requests each, a second apart: about 5 minutes.
      # Same failure rule as the feeds: red job, models still run.
      - name: Harvest the developer forums
        if: >-
          !cancelled() && steps.gate.outputs.enabled == 'true'
          && (inputs.sources == '' || inputs.sources == null || contains(inputs.sources, 'forum'))
        timeout-minutes: 15
        run: python scripts/harvest_forums.py --max-new-topics 150

      # THE MEDIA SEARCH SWEEP, ONCE A WEEK, BEFORE THE MODELS (#602, 2026-11-09).
      # Six Reddit searches from contract/sources.yaml `sweep_media_subreddits`
      # (seedance, kling, google veo, nano banana, gpt image, elevenlabs),
      # newest first. Every post found is stored; comments are
      # read only for posts naming a model the registry or the catalogue knows.
      # At most `max_requests` (100) Reddit requests a run, pages and comments
      # together, on the Reddit RapidAPI key. Each media model's fetch below then
      # reads the threads that name it. WEEKLY: on Mondays (UTC), or whenever the
      # workflow is started by hand. No key: skipped, said so.
      - name: Search Reddit for media models (weekly)
        if: >-
          !cancelled() && steps.gate.outputs.enabled == 'true'
          && (inputs.sources == '' || inputs.sources == null || contains(inputs.sources, 'reddit'))
        timeout-minutes: 10
        run: |
          if [ "$(date -u +%u)" != "1" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "::notice::the media search sweep runs weekly, on Mondays (UTC): not today."
            exit 0
          fi
          # A WARNING, NOT A NOTICE (#612 review, point 8). This runs once a week,
          # so a missing setting skipped quietly costs a week nobody sees. The run
          # stays green - the per-model arms skip themselves the same way - but
          # the warning is on the run's summary page.
          if [ -z "$RAPIDAPI_KEY" ]; then
            echo "::warning::RAPIDAPI_KEY is not set - this week's media search sweep was skipped."
            echo "Media search sweep SKIPPED: RAPIDAPI_KEY is not set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # NO REDDIT HOST, NO RUN: without one the sweep refuses with a
          # configuration error. REDDIT_PROVIDER is the only host setting this
          # job's env carries.
          if [ -z "$REDDIT_PROVIDER" ]; then
            echo "::warning::REDDIT_PROVIDER is not set - this week's media search sweep was skipped."
            echo "Media search sweep SKIPPED: REDDIT_PROVIDER is not set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m collect.cli ops sweep-reddit --media --store raw_store

      - name: Fetch the due models
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        # --job-limit-minutes 320 is timeout-minutes (355) less the feed step's
        # 20 and the forum step's 15: a fetch still running at 320 min of THIS
        # step is stopped by the runner, which then posts the summary. Each
        # thread commits as it finishes, so that loses one thread at most and
        # the model stays due. That makes a late launch cheap, so
        # --deadline-minutes 300 starts models until minute 300.
        # ON A SWEEP NIGHT ONLY (Mondays, or a run started by hand) the media
        # search sweep's 10 minutes come off both (#612 review, point 10): the
        # other six nights keep their full time.
        run: |
          args="--job-limit-minutes 320 --deadline-minutes 300"
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args="--job-limit-minutes 310 --deadline-minutes 290"
          fi
          [ -n "$MAX_MODELS" ] && args="$args --max-models $MAX_MODELS"
          [ -n "$SOURCES" ]    && args="$args --sources $SOURCES"
          python -m scripts.run_scheduled_fetches $args
