[project]
name = "modelboard"
version = "0.1.0"
description = "What engineers actually say about AI models, and which cheaper one is safe for your task"
requires-python = ">=3.11"

dependencies = [
  "httpx>=0.27",           # all fetching. official APIs only, no scraping
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",         # strict schema on extraction output
  "pyyaml>=6.0",           # contract/ config
  "python-dotenv>=1.0",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",           # server-rendered pages
  "datasketch>=1.6",       # MinHash + LSH for short-document dedupe
  "simhash>=2.1",          # long-form dedupe
  "feedparser>=6.0",       # blog RSS

  # PINNED TO A MAJOR. Extraction output is load-bearing for quote
  # verification and offset stability: `thread_context.offset_map` maps
  # flattened offsets back to raw ones, and a different extractor produces
  # different flattened text for the same bytes. A quote then verifies
  # against text nobody has, or fails against text that is still there.
  #
  # CI installs from scratch every run and a laptop does not, so an unpinned
  # major drifts between them silently — the failure surfaces as an offset
  # that no longer resolves, not as an install error.
  #
  # A pin alone is prevention nobody can verify, and holds only until somebody
  # widens it without knowing why it was narrow. The other half is recording
  # WHICH version produced a given flattened text, proposed for
  # `thread_context` on issue #5.
  "trafilatura>=2.2,<3",   # blog article text extraction
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

# Deliberately absent, and not to be added without a conversation:
#   - any workflow engine (Prefect, Dagster, Airflow) — cron and a jobs table
#     is enough for eight scheduled jobs
#   - Kafka, TimescaleDB, ClickHouse — one Postgres until it hurts
#   - any headless browser — official APIs and public feeds only

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Sign-off item 1. Without this, `pip install -e .` fails outright: setuptools
# refuses the flat layout because four top-level directories are present
# (collect, judge, contract, fixtures) and none is declared.
#
# The `find` directive, not `packages = ["collect", "judge"]`. The latter looks
# equivalent and is not: it misses every subpackage, so collect.registry and
# judge.ask would not be installed.
#
# ⚠  Install with the extras. `pip install -e .` WITHOUT [dev] silently drops
#    ruff, mypy and pytest-asyncio. The failure is quiet: the async adapter
#    tests would not fail, they would not run. Use `pip install -e ".[dev]"`,
#    and have CI assert that pytest-asyncio imports.
[tool.setuptools.packages.find]
include = ["collect*", "judge*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
