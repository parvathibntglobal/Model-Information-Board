# What may appear on a PUBLIC surface, by source.
#
# PROPOSED 2026-10-05 by anooj; APPROVED 2026-10-19 through the go-public
#   contract PR (#535), reviewed by parvathi. contract/ gets two eyes. The
#   original argument is in docs/proposals/public-surfaces-withhold-reddit-arxiv-x.md;
#   the publication basis it serves is `use_basis_undertaking` in
#   contract/sources.yaml.
#
# THE AGREED POSITION (team, 2026-10-05): nothing from Reddit, arXiv or X is
# shown on our public platform's board. We may still collect from them for
# internal work. Derived blog posts are the one exception, below.
#
# WHAT "WITHHELD" MEANS ON THE BOARD: no quote, no link, no handle, no
# platform name, and NO PER-PLATFORM COUNT. A public page that leaves out a
# withheld source's quotes must SAY that some sources are not quoted (rule 4) -
# an absence we cause must not read as one we found.
#
# TOTALS INCLUDE EVERY SOURCE (amended 2026-10-15 by anooj; proposed, needs the
# second reviewer like the rest of this file). Was "no count that includes
# them". A model with 20 voices, 10 of them from Reddit, shows "20 voices" and
# nothing about Reddit: the total is ours, the split is not shown. A count is
# not publication (contract/sources.yaml, "What counts as publication": "'7
# voices, 2 platforms' is a count and publishes nothing quotable"). What stays
# withheld is anything that would let a reader tell which platform a figure or
# a quote came from.
#
# DERIVED POSTS ARE THE EXCEPTION (decided by anooj, 2026-10-05) - see
# `derived_posts` below.
#
# WHO READS THIS
#   judge/publication.py        the one loader; every public read goes through it
#   generate_sample_blogs.py    reads `derived_posts` to decide whether a blog
#                               draft may draw on a withheld source
#   judge/assistants.py         reads `assistants_page` (proposed, #625) for the
#                               public AI assistants page
#
# ABSENT IS NOT PERMISSIVE (rule 6, rule 12). A missing file, a missing key or
# an empty list raises - it never silently publishes everything.

version: "0.1"
status: approved
proposed_on: 2026-10-05
proposed_by: anooj
approved_on: 2026-10-19   # through the go-public contract PR; reviewer below
reviewed_by: parvathi     # by approving that PR

withheld_from_public:
  # `document.source` values, exactly as the collectors write them.
  sources:
    - reddit
    - arxiv
    - x
    # HELD, NOT RULED OUT (2026-10-26, #567 review). Bluesky's developer
    # guidelines require a public, monitored contact address and records of
    # requests before we may show its users' posts; until both are named in
    # contract/sources.yaml `bluesky-appview-terms`, its quotes stay off public
    # pages. Remove this line, and the one under `derived_posts.embed_only`, in
    # the same change that names them - so the ruling and the site cannot drift.
    - bluesky
  # Whether a public TOTAL (voices, reports, entries, models) counts rows from
  # the sources above. true since 2026-10-15 (approved 2026-10-19): totals
  # include every source, and no page shows a per-platform count. Must be true
  # or false - absent raises (rule 6, rule 12): judge/publication.py
  # `totals_include_withheld`.
  totals_include_withheld: true

derived_posts:
  # BLOG DRAFTS MAY BE WRITTEN FROM WITHHELD SOURCES. Decided by anooj on
  # 2026-10-05: we cannot write useful posts while avoiding Reddit, X and arXiv,
  # and a post that discusses what practitioners report is not a republication
  # of their posts. Narrowed the 2026-10-05 first draft of this file, which
  # withheld derived prose too.
  #
  # WHAT A DRAFT CARRIES FROM THEM, stated so a reviewer rules on the real
  # thing: prose written from the threads, PLUS the short verbatim fragments
  # (marked «») the generator requires, copied exactly from the source. No
  # link, no handle, no platform name - those stay refused by the generator's
  # export and banned-phrase checks.
  #
  # Must be true or false. Absent raises (rule 6): the generator never guesses.
  may_draw_on_withheld: true

  # EMBED ONLY - RE-REVIEWED 2026-10-13 by anooj, approved by the MD (whose idea
  # it was). docs/proposals/publish-blogs-with-official-embeds.md.
  #
  # A source listed here appears in a published post ONLY as the platform's
  # official embed of the post (X for Websites; Reddit's oEmbed markup), placed
  # beside our own-words description that names the platform. Its text is never
  # copied into our prose - not in «», not as a pull quote - and no handle,
  # subreddit or URL is typed by us. The generator refuses a draft that quotes
  # one of these sources, and refuses an embed of any source NOT listed here.
  #
  # EVERY OTHER SOURCE a post draws on is quoted exactly and credited with its
  # platform and a link (quote + attribution + link, BUILD-PLAN's form). The
  # 2026-10-05 "no link, no platform name" position for blog drafts is
  # superseded by this re-review.
  #
  # What this does NOT change: the board stays as `withheld_from_public` says,
  # and the collection routes stay as `contract/sources.yaml` records them.
  #
  # Must be a list. Absent raises (rule 6). An empty list is a definite answer -
  # "quote every source" - and is never what a missing key means.
  embed_only:
    - reddit
    - x
    # HELD (2026-10-26), with `withheld_from_public` above and for the same
    # reason. Withholding alone would still let a post carry «» fragments of a
    # Bluesky post with NO credit; listed here, the generator refuses to quote
    # it, and there is no Bluesky embed yet, so a post cannot carry Bluesky at
    # all until both lines are removed together.
    - bluesky

evidence_feed:
  # ⚠ PROPOSED 2026-10-21 by anooj, on branch feat/evidence-feed - NOT RATIFIED.
  #   Needs the second reviewer like every change to this file, and reaches
  #   main only with the rule-2 amendment (docs/proposals/evidence-feed.md).
  #
  # THE FEED IS THE DRILL-DOWN FROM A COUNT TO ITS REPORTS (contract/
  # evidence_feed.yaml). Totals already count every source (above), so a feed
  # that lists only the non-withheld ones would back up about half of each
  # number: measured 2026-10-21 on the shared DB, 1,595 of 2,725 documents
  # behind board entries (58.5%) are Reddit, X or arXiv.
  #
  # So the feed follows the DERIVED-POST terms, not the board's:
  #   - every report appears, as OUR paraphrase - never its text. The
  #     paraphrase is checked in code to share no run longer than
  #     `max_copied_words` with the excerpts it was written from.
  #   - a source in `embed_only` is cited ONLY as the platform's official
  #     embed, loaded when the reader asks for it. No link, handle or
  #     subreddit typed by us.
  #   - every other source is cited with its platform name and a link;
  #     arXiv carries `credits.arxiv_acknowledgement` wherever it appears.
  #   - no verbatim quote from ANY source reaches the feed.
  #   - THE FEED OVERRIDES "NO PER-PLATFORM COUNT" (above), for the feed only
  #     (PROPOSED 2026-10-23, #558 second review). Each item names its platform
  #     - "arXiv ↗", "Show the original post on Reddit" - and the list can be
  #     narrowed to one polarity, so a reader CAN count one platform's items
  #     for a model, e.g. its negative reports from Reddit. The feed prints no
  #     such count itself; it does not prevent a reader making one, and this
  #     line says so rather than leaving the board's rule to read as covering it.
  # The board itself stays as `withheld_from_public` says.
  #
  # Must be true or false, and a list. Absent raises (rule 6).
  status: proposed
  may_draw_on_withheld: true
  embed_only:
    - reddit
    - x
  # HELD (2026-10-26, #567 review): sources whose terms carry a condition not
  # yet met. A held source's reports stay LISTED and COUNTED but show no
  # paraphrase and no source - `{"kind": "withheld"}` - whatever
  # `may_draw_on_withheld` says, and the paraphraser spends nothing on them
  # (judge/publication.py `feed_hides`, used by the feed, its summaries and
  # the paraphraser alike).
  #
  # bluesky: its developer guidelines require a public, monitored contact
  # address and a request log before we show its users' posts. Removed in the
  # same change as its lines under `withheld_from_public` and
  # `derived_posts.embed_only`, so all three surfaces release together.
  #
  # Must be a list. Absent raises (rule 6); an empty list is a definite answer
  # - "nothing held" - never what a missing key means.
  held:
    - bluesky

assistants_page:
  # ⚠ PROPOSED 2026-11-12 by anooj on #625 (the public AI assistants page,
  #   /ai-assistants/<id>) - NOT RATIFIED. Asked for in Parvathi's #625 review:
  #   the page is a drill-down from a count to its reports, like the feed, but
  #   it shows VERBATIM quotes, which is the `derived_posts` form, not the
  #   feed's paraphrase-only rule. Nothing said which rule the page follows, so
  #   this block says it, and a reviewer rules on it here.
  #
  # WHAT THE PAGE SHOWS under each job and problem, per report (judge/
  # assistants.py `_treatment` and `_support`, which read this block):
  #   - a source in `held`: nothing - no text, no embed, no link. Counted.
  #   - a source in `embed_only`: the platform's official embed only, loaded
  #     when the reader asks. No text, link, handle or subreddit typed by us.
  #   - a source in `withheld_from_public` and not in `embed_only` (arXiv, and a
  #     report with no recorded source): nothing. Counted.
  #   - every other source: the verified quote, exactly as stored, with its
  #     platform credit and an https link to it - all three or none. A quote
  #     whose source has no https link is NOT shown; it is counted as "no link
  #     to the original" (#625 review: text without its link is the
  #     undertaking's second `voided_by` case).
  #   Every count above the reports includes every source (`withheld_from_public.
  #   totals_include_withheld`), and the page says how many it does not show and
  #   why, in words (rule 4).
  #
  # LIKE THE FEED, IT OVERRIDES "NO PER-PLATFORM COUNT" for this page only: each
  # report names its platform, so a reader could count one platform's reports
  # for an assistant. The page prints no such count.
  #
  # A SECOND PUBLIC PATH THAT QUOTES. `voice_cloning_in_blog_posts` below rests
  # on "the blog generator is the one public path that quotes or embeds
  # evidence". If this block is approved, that is no longer true, and its rule
  # (no real person whose voice was cloned) should cover this page too. Not
  # changed here: that block was agreed by parvathi and anooj, so it changes
  # only when both rule on this one. On 2026-11-06 the shared DB held no quote
  # about voice cloning.
  #
  # quote_form: `quote_with_credit_and_link` is the only form the page renders.
  #   A ruling for paraphrase-only changes the code; the loader refuses any
  #   other value rather than falling back to quotes (rule 12).
  # embed_only: must be a subset of `evidence_feed.embed_only`, because the
  #   page cites through the feed's `cite_source`; the loader checks it.
  # Every key required; absent raises (rule 6).
  status: proposed
  quote_form: quote_with_credit_and_link
  embed_only:
    - reddit
    - x
  held:
    - bluesky

credits:
  # ARXIV'S ACKNOWLEDGEMENT, as its API terms ask (2026-10-19, review of #535).
  # Attached at SERVE time to every post whose sources include an arXiv paper
  # (judge/publication.py `with_credits`), so no post goes out without it however
  # it was written. The undertaking's `arxiv_acknowledged: true` rests on this.
  # Required: absent or empty raises (rule 12).
  arxiv_acknowledgement: "Thank you to arXiv for use of its open access interoperability."

# ── VOICE CLONING: NO REAL PERSON NAMED IN A BLOG POST ──────────────────────
# AGREED 2026-11-06 by parvathi and anooj on #602, between the two of us: it
# only narrows what a blog post publishes, so it did not need the MD.
#
# WHY HERE. The board is behind login and the Reports pages are counts only,
# so a voice-cloning report is kept and COUNTED (positive / negative / neutral)
# like any other. The blog generator is the one public path that quotes or
# embeds evidence (`derived_posts` above), so this is where the rule lives.
#
# THE RULE: a blog post never names a real person whose voice was cloned, and
# never quotes or embeds a post that does. Our own words are fine ("users report
# it clones a voice from a short sample"). It is not a blog topic on its own.
#
# NOT ENFORCED IN CODE YET, AND THAT IS STATED: the generator check follows
# when speech evidence arrives in volume (on 2026-11-06 the shared DB held no
# quote about voice cloning at all). Until then this record is the rule the
# check will point at. Nothing reads this block yet.
voice_cloning_in_blog_posts:
  agreed_on: 2026-11-06
  agreed_by: [parvathi, anooj]
  rule: >-
    A blog post never names a real person whose voice was cloned, and never
    quotes or embeds a post that does. Our own words are allowed; it is not a
    blog topic on its own.
  enforced_by: null    # the generator check, when speech evidence arrives in volume
