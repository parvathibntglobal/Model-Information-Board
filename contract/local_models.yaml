# THE MODELS THE LOCAL VRAM TOOL SHOWS (PROPOSED 2026-10-23,
# docs/proposals/can-i-run-it.md). Reviewed list, rule 5: a model is added here
# by a commit somebody reads, never discovered and published by code.
#
# WHAT EACH ENTRY IS FOR
#   gguf_repo + files   the EXACT files whose sizes the tool shows. The collector
#                       measures these and nothing else - it never searches a repo
#                       for "something that looks like Q4_K_M". A looser match took
#                       a 177B model's speculative-decoding helper (`mtp-...`) for
#                       the model itself, and a combined vision repo for MiniMax H3.
#                       Split files are listed part by part; the size is their sum.
#   original            the vendor's own repo, as the GGUF repo's `base_model`
#                       names it. null when it names none - left unlinked, not
#                       guessed (rule 6).
#   openrouter          the OpenRouter id whose `hugging_face_id` equals `original`
#                       - an exact join, never a name match - so the tool can show
#                       the API price beside a model that does not fit.
#
# HOW THE SEED WAS CHOSEN, 2026-10-23. The families asked for (Llama, Qwen, Gemma,
# Phi, Mistral) plus DeepSeek distills, gpt-oss, GLM, Nemotron and SmolLM, picked
# from the most-downloaded GGUF repos of unsloth, ggml-org, bartowski and
# lmstudio-community (60 each, Hugging Face API, sort=downloads). Vendor models
# only: no community fine-tunes, no "abliterated"/"uncensored" variants, text
# LLMs only. 52 tried, 50 kept:
#   - MiniMax H3: its repo holds pruned variants and a combined vision model, not
#     one model's files.
#   - GLM 5.3 Flash: about 318 GiB at Q8_0 and no Q4_K_M at all - a server model.
#
# ⚠ gpt-oss IS ABOUT THE SAME SIZE AT EVERY QUANT (Q4_K_M 10.83 GiB, Q8_0 11.28
#   GiB for 20B). Not a mistake: it ships in a native 4-bit format (MXFP4), so
#   requantizing barely changes the file.

