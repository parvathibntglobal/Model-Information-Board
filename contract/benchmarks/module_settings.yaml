# How the benchmark scraper behaves (workflow doc 4, 4.1, 23).
#
# SCRAPING IS THE WAY DATA COMES IN (Parvathi, 2026-10-22): runs will be
# scheduled later, and every source is read from its page - static HTML, or
# the page rendered in a headless browser. No data-file downloads, no keys,
# no accounts, nothing paid.

# robots.txt is always respected - not a setting (CLAUDE.md, the Benchmarks exception).
timeouts:
  static_seconds: 30
  browser_seconds: 45
  run_minutes: 20
retries: 3
# Fetched pages are kept once per distinct content and never deleted (raw
# payloads are immutable; PR #573 review). There is no keep-N setting.
log_dir: collect/benchmarks/logs     # one file per run (git-ignored)
verbosity: normal                    # quiet | normal | verbose
