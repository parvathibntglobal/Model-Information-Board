# The Benchmarks page's sections and columns (BENCHMARK_PIPELINE_WORKFLOW.md
# section 3.2, 2026-10-22). Each (benchmark, metric) pair is one column,
# named <key>_<metric>. Values are shown RAW, exactly as the source publishes
# them, with their source, link and date: no derived rank or percentile
# (Parvathi, 2026-10-22 - CLAUDE.md rule 3).
#
# volatility: static (vendor-published once; re-check monthly) | rolling
# (benchmark revisions; weekly) | live (ratings and every rank; daily).
# There is no scheduler yet: runs are started by hand.
#
# A column no scrapeable source can fill for the tracked models is removed
# from this file, not kept switched off (2026-10-26); values already stored
# for it stop being published.
#
# duplicates (required): what to do when one page lists a cell twice -
#   match_variant (the accepted test setup decides), latest, identical.
#
# variant_rule.accept: the test setups a column takes, earliest preferred.
# null = no setup stated; "*" = any setup the board states, recorded on the
# value (for a column defined as "as the board ran it").

categories:
  - { key: knowledge,  label: "Knowledge & Reasoning", order: 1 }
  - { key: coding,     label: "Coding",                order: 2 }
  - { key: agents,     label: "Agents & Tools",        order: 3 }
  - { key: math,       label: "Math",                  order: 4 }
  - { key: multimodal, label: "Multimodal",            order: 5 }
  - { key: general,    label: "General",               order: 6 }
  # Image, video and speech models (Parvathi, 2026-11-03). Their rows come from
  # the model catalogue, not only the registry (module_settings.yaml
  # catalog_models).
  - { key: image,      label: "Image",                 order: 7 }
  - { key: video,      label: "Video",                 order: 8 }
  - { key: speech,     label: "Speech",                order: 9 }

benchmarks:
  # ── knowledge & reasoning ────────────────────────────────────────────────
  # The MMLU-Pro board marks each row "TIGER-Lab" (their own run) or
  # "Self-Reported" (the vendor's number); their own run is preferred.
  - { key: mmlu_pro,      label: "MMLU-Pro",      category: knowledge, order: 2,
      metrics: [score, rank], score_unit: percent, higher_is_better: true, volatility: rolling,
      variant_rule: { accept: ["TIGER-Lab", "Self-Reported", null] }, duplicates: match_variant }
  # agreement_margin: two independent runs of the same model differ by noise
  # alone. One standard error of their difference at the worst case (50%
  # correct) is 100 * sqrt(0.5 / questions): 5.0 points for GPQA Diamond's 198
  # questions. Set only where the benchmark's size is certain; the rest use
  # validation.yaml `tolerance` (2026-10-28).
  - { key: gpqa_diamond,  label: "GPQA Diamond",  category: knowledge, order: 3,
      metrics: [score, rank], score_unit: percent, higher_is_better: true, volatility: rolling,
      variant_rule: { accept: [null] }, duplicates: match_variant, agreement_margin: 5.0 }
  # rank: the position on HLE's own board (labs.scale.com, Scale AI co-created HLE).
  - { key: hle,           label: "Humanity's Last Exam", category: knowledge, order: 4,
      metrics: [score, rank], score_unit: percent, higher_is_better: true, volatility: rolling,
      variant_rule: { accept: [null] }, duplicates: match_variant }
  # ARC Prize's own leaderboard (arcprize.org), added 2026-10-23.
  - { key: arc_agi_1,     label: "ARC-AGI-1",     category: knowledge, order: 5,
      metrics: [score], score_unit: percent, higher_is_better: true, volatility: rolling,
      variant_rule: { accept: [null] }, duplicates: match_variant }
  - { key: arc_agi_2,     label: "ARC-AGI-2",     category: knowledge, order: 6,
      metrics: [score], score_unit: percent, higher_is_better: true, volatility: rolling,
      variant_rule: { accept: [null] }, duplicates: match_variant }
  # ARC-AGI-3, the same board's newest set (added 2026-10-28). The board gives
  # two results a cell - "Standard" and "Provider Adapter"; this column is the
  # Standard one only (sources.yaml arc_prize, `labelled: Standard`).
  - { key: arc_agi_3,     label: "ARC-AGI-3",     category: knowledge, order: 7,
      metrics: [score], score_unit: percent, higher_is_better: true, volatility: rolling,
      variant_rule: { accept: [null] }, duplicates: match_variant }

  # ── coding ───────────────────────────────────────────────────────────────
  # The column means "the model in the standard harness": the official board's
  # own bash-only agent (mini-SWE-agent). Commercial agent systems (TRAE,
  # live-SWE-agent, ...) are a different setup and never fill it.
  # agreement_margin 3.2: SWE-bench Verified's 500 tasks (see gpqa_diamond).
  - { key: swe_bench_verified, label: "SWE-bench Verified", category: coding, order: 1,
      metrics: [score, rank], score_unit: percent, higher_is_better: true, volatility: live,
      variant_rule: { accept: ["mini-SWE-agent"] }, duplicates: match_variant,
      agreement_margin: 3.2 }
  # Scale AI's own board (SWE-Bench Pro, public set, Full view). Each model is run
  # under one agent (Claude Code, Codex, mini-swe-agent); the agent is recorded on
  # the value. Added 2026-10-23.
  - { key: swe_bench_pro, label: "SWE-Bench Pro", category: coding, order: 2,
      metrics: [score, rank], score_unit: percent, higher_is_better: true, volatility: live,
      variant_rule: { accept: ["*"] }, duplicates: match_variant,
      setup_note: "Each value is in the agent it was submitted with (shown in its hover), so sorting compares model-and-agent pairs, not models alone." }
  # Score only, run by Vals AI. The rank came from the official board alone, which
  # has not been updated since May 2025 and lists no registry model (2026-10-26).
  - { key: livecodebench,  label: "LiveCodeBench",  category: coding, order: 3,
      metrics: [score, rank], score_unit: percent, higher_is_better: true, volatility: live,
      variant_rule: { accept: [null] }, duplicates: match_variant }
  # International Olympiad in Informatics problems, run by Vals AI. Added 2026-10-23.
  - { key: ioi,            label: "IOI",            category: coding, order: 4,
      metrics: [score, rank], score_unit: percent, higher_is_better: true, volatility: rolling,
      variant_rule: { accept: [null] }, duplicates: match_variant }
  # Scientific coding, run by Artificial Analysis. Added 2026-10-23.
  - { key: scicode,        label: "SciCode",        category: coding, order: 5,
      metrics: [score], score_unit: percent, higher_is_better: true, volatility: rolling,
      variant_rule: { accept: [null] }, duplicates: match_variant }

  # ── agents ───────────────────────────────────────────────────────────────
  # Terminal-Bench's own board (tbench.ai, tier 1) first, each model as it was
  # submitted - in its maker's agent (Claude Code, Codex, ...), recorded on the
  # value as its test setup - as SWE-Bench Pro does. Vals AI's run, every model
  # in Mini-SWE-agent (tier 2), fills a model the official board does not list.
  # Was Vals only, for one harness (2026-10-23); official first since the source
  # tiers (Parvathi, 2026-10-28). The accept order only matters within a tier.
  # setup_note: the column header's hover - the values mix agents (PR #580 review).
  - { key: terminal_bench_4, label: "Terminal-Bench 4.0", category: agents, order: 1,
      metrics: [score, rank], score_unit: percent, higher_is_better: true, volatility: rolling,
      variant_rule: { accept: ["Mini-SWE-agent", "*"] }, duplicates: match_variant,
      setup_note: "Each value is in the agent it was submitted with (shown in its hover), so sorting compares model-and-agent pairs, not models alone." }
  # Building a working app from a description, run by Vals AI in OpenHands. Added 2026-10-23.
  - { key: vibe_code, label: "Vibe Code Bench", category: agents, order: 2,
      metrics: [score, rank], score_unit: percent, higher_is_better: true, volatility: rolling,
      variant_rule: { accept: ["OpenHands"] }, duplicates: match_variant }

  # ── math ─────────────────────────────────────────────────────────────────
  # MathArena's own board, AIME 2026 (?comp=aime--aime_2026). Added 2026-10-23.
  - { key: aime_2026,    label: "AIME 2026",     category: math, order: 1,
      metrics: [score, rank], score_unit: percent, higher_is_better: true, volatility: static,
      variant_rule: { accept: [null] }, duplicates: match_variant }
  # NOT AIME 2025 either: Vals AI's AIME is AIME 2024 and AIME 2025 together,
  # one accuracy over both papers (vals.ai/benchmarks/aime, checked 2026-10-22).
  - { key: aime_2024_25, label: "AIME 2024+2025", category: math, order: 2,
      metrics: [score, rank], score_unit: percent, higher_is_better: true, volatility: rolling,
      variant_rule: { accept: [null] }, duplicates: match_variant }
  # Writing proofs, run by Vals AI. Added 2026-10-23.
  - { key: proof_bench,  label: "ProofBench",    category: math, order: 3,
      metrics: [score, rank], score_unit: percent, higher_is_better: true, volatility: rolling,
      variant_rule: { accept: [null] }, duplicates: match_variant }

  # ── multimodal ───────────────────────────────────────────────────────────
  - { key: mmmu_pro, label: "MMMU-Pro", category: multimodal, order: 2,
      metrics: [score, rank], score_unit: percent, higher_is_better: true, volatility: rolling,
      variant_rule: { accept: [null] }, duplicates: match_variant }
  # Issues with images (screenshots, diagrams), run by Vals AI. Added 2026-10-23.
  - { key: swe_bench_multimodal, label: "SWE-bench Multimodal", category: multimodal, order: 3,
      metrics: [score, rank], score_unit: percent, higher_is_better: true,
      volatility: rolling, variant_rule: { accept: [null] }, duplicates: match_variant }

  # ── general ──────────────────────────────────────────────────────────────
  - { key: livebench, label: "LiveBench (Overall)", category: general, order: 1,
      metrics: [score, rank], score_unit: percent, higher_is_better: true, volatility: live,
      variant_rule: { accept: [null] }, duplicates: match_variant }
  # Mercor's AI Productivity Index, APEX-1: single-turn professional tasks
  # (banking, consulting, law, medicine), its "Mean Score". Added 2026-10-28.
  - { key: apex_1, label: "APEX-1", category: general, order: 2,
      metrics: [score], score_unit: percent, higher_is_better: true, volatility: rolling,
      variant_rule: { accept: [null] }, duplicates: match_variant }
  # Vals AI's own index across its finance, coding, legal and tax benchmarks
  # (its "Accuracy"). Added 2026-10-28.
  - { key: vals_index, label: "Vals Index", category: general, order: 3,
      metrics: [score, rank], score_unit: percent, higher_is_better: true, volatility: rolling,
      variant_rule: { accept: [null] }, duplicates: match_variant }

  # ── image, video, speech (Parvathi, 2026-11-03) ──────────────────────────
  # Each arena column is Artificial Analysis's Elo from blind votes between two
  # outputs, as printed: a rating, not a percent, so it shows as a number and
  # never as a bar. rating_range only refuses a value that cannot be an Elo.
  - { key: aa_text_to_image, label: "Text to Image Arena", category: image, order: 1,
      metrics: [rating], rating_range: [0, 3000], higher_is_better: true, volatility: live,
      variant_rule: { accept: [null] }, duplicates: match_variant }
  - { key: aa_image_editing, label: "Image Editing Arena", category: image, order: 2,
      metrics: [rating], rating_range: [0, 3000], higher_is_better: true, volatility: live,
      variant_rule: { accept: [null] }, duplicates: match_variant }
  # Silent video only: the page's "with audio" boards are separate lists and
  # are not read.
  - { key: aa_text_to_video, label: "Text to Video Arena", category: video, order: 1,
      metrics: [rating], rating_range: [0, 3000], higher_is_better: true, volatility: live,
      variant_rule: { accept: [null] }, duplicates: match_variant }
  - { key: aa_image_to_video, label: "Image to Video Arena", category: video, order: 2,
      metrics: [rating], rating_range: [0, 3000], higher_is_better: true, volatility: live,
      variant_rule: { accept: [null] }, duplicates: match_variant }
  # Each provider's own default voice ("provider voice"), not the controlled
  # same-voice board.
  - { key: aa_text_to_speech, label: "Text to Speech Arena", category: speech, order: 1,
      metrics: [rating], rating_range: [0, 3000], higher_is_better: true, volatility: live,
      variant_rule: { accept: [null] }, duplicates: match_variant }
  # Word error rate, LOWER IS BETTER: Artificial Analysis's AA-WER index over
  # its own speech sets. Each value is from one host's API (recorded as its
  # setup); a model two hosts serve with different values goes to review.
  - { key: aa_wer, label: "AA-WER (word error rate)", category: speech, order: 2,
      metrics: [score], score_unit: percent, higher_is_better: false, volatility: rolling,
      variant_rule: { accept: ["*", null] }, duplicates: match_variant,
      setup_note: "Lower is better. Each value is from the host's API it was measured on (shown in its hover)." }
  # Hugging Face's Open ASR Leaderboard, its English board's "Average WER" over
  # its own sets (a different set from AA-WER, so its own column). Lower is better.
  - { key: open_asr_wer, label: "Open ASR (average WER)", category: speech, order: 3,
      metrics: [score, rank], score_unit: percent, higher_is_better: false, volatility: rolling,
      variant_rule: { accept: [null] }, duplicates: match_variant,
      setup_note: "Lower is better." }
  # TTS Arena V2's rating from blind votes between two voices.
  - { key: tts_arena, label: "TTS Arena", category: speech, order: 4,
      metrics: [rating, rank], rating_range: [0, 3000], higher_is_better: true, volatility: live,
      variant_rule: { accept: [null] }, duplicates: match_variant }
  # The VBench team's own boards: VBench (text to video) and VBench-I2V (image
  # to video), each its "Total Score".
  - { key: vbench, label: "VBench", category: video, order: 3,
      metrics: [score], score_unit: percent, higher_is_better: true, volatility: rolling,
      variant_rule: { accept: [null] }, duplicates: match_variant }
  - { key: vbench_i2v, label: "VBench-I2V", category: video, order: 4,
      metrics: [score], score_unit: percent, higher_is_better: true, volatility: rolling,
      variant_rule: { accept: [null] }, duplicates: match_variant }
