  # ── independent evaluator: Epoch AI ──────────────────────────────────────
  # A DATA FILE, SO IT IS SKIPPED while module_settings.yaml allow_data_files is
  # off (scraping first, 2026-10-22). Epoch AI's visible pages draw their
  # results in a chart (canvas) built from CSV files the page downloads; there
  # is no table of model scores on the page to scrape. So with data files off,
  # GPQA Diamond, OTIS Mock AIME, FrontierMath and Epoch's HLE / SWE-bench
  # numbers have no source for the tracked models until vendor model cards
  # (doc 3.5, tier 90) are added. Kept configured so that turning the switch
  # on is a one-line decision.
  - key: epoch_hub
    label: "Epoch AI Benchmarking Hub"
    kind: evaluator
    priority: 70
    enabled: false
    why_disabled: "A data file (allow_data_files is off), and three of its columns (OTIS Mock AIME, FrontierMath, MATH Level 5) are retired (2026-10-23)."
    method: data_file
    # The download the hub offers its visitors on /benchmarks/use-this-data.
    url: https://epoch.ai/data/benchmark_data.zip
    page_url: https://epoch.ai/benchmarks
    license: "CC BY 4.0 (README.md inside the download)"
    attribution: "Epoch AI, 'Capabilities & benchmarking', epoch.ai/benchmarks (CC BY 4.0)"
    tables:
      - locate: { type: zip_csv, file: gpqa_diamond.csv }
        model_column: "Model version"
        date_column: "Started at"
        benchmark_map:
          "mean_score": { benchmark: gpqa_diamond, metric: score, scale: fraction }
      - locate: { type: zip_csv, file: otis_mock_aime_2024_2025.csv }
        model_column: "Model version"
        date_column: "Started at"
        benchmark_map:
          "mean_score": { benchmark: otis_mock_aime, metric: score, scale: fraction }
      - locate: { type: zip_csv, file: frontiermath_tiers_1_3_v2.csv }
        model_column: "Model version"
        date_column: "Started at"
        benchmark_map:
          "mean_score": { benchmark: frontiermath, metric: score, scale: fraction }
      - locate: { type: zip_csv, file: math_level_5.csv }
        model_column: "Model version"
        date_column: "Started at"
        benchmark_map:
          "mean_score": { benchmark: math_l5, metric: score, scale: fraction }
      # Epoch AI's own run of SWE-bench Verified, in its own harness. A model run
      # twice is a re-run of the same setup, so the newest run is taken.
      - locate: { type: zip_csv, file: swe_bench_verified.csv }
        model_column: "Model version"
        date_column: "Started at"
        variant: "Epoch AI harness"
        duplicates: latest
        benchmark_map:
          "mean_score": { benchmark: swe_bench_verified, metric: score, scale: fraction }
      # "_external" files are numbers Epoch AI re-publishes from the benchmark's
      # own authors, so they rank as re-published (60), below the original board.
      - locate: { type: zip_csv, file: hle_external.csv }
        model_column: "Model version"
        priority: 60
        duplicates: latest
        benchmark_map:
          "Accuracy": { benchmark: hle, metric: score, scale: fraction }

