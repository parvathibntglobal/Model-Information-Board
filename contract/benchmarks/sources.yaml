  # ── independent evaluator: Vals AI ────────────────────────────────────────────────────────
  # Vals AI runs each benchmark itself and publishes one page per benchmark, as
  # a plain HTML table (Rank, Model, Accuracy). Each page's own heading says what
  # it measures, and two are not what the URL suggests (checked 2026-10-22):
  #   /benchmarks/aime   is AIME 2024 + AIME 2025 together  -> aime_2024_25
  #   /benchmarks/mmmu   is MMMU Pro                        -> mmmu_pro
  # The rank column is Vals AI's own position among the models it tested; it is
  # not mapped, because these columns are score-only.
  - key: vals_gpqa
    label: "Vals AI · GPQA Diamond"
    kind: evaluator
    tier: 2
    tier_note: "Vals AI runs the benchmark on the models itself, on its own setup; it did not make the benchmark. Below Artificial Analysis within tier 2."
    priority: 70
    enabled: true
    method: static
    url: https://www.vals.ai/benchmarks/gpqa
    license: "Not stated on the page."
    attribution: "Vals AI, vals.ai"
    tables:
      - locate: { type: html_table, must_contain: "Accuracy" }
        model_column: "Model"
        benchmark_map:
          "Accuracy": { benchmark: gpqa_diamond, metric: score, scale: percent }

