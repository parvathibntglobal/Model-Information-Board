    # voice (`collect/adapters/arxiv.py:author_external_id`), so it can
    # corroborate the platform half of the publication gate and never the
    # voice half. That is a structural ceiling, not a comment on rigour.
    terms_ruling: arxiv-api-terms
    terms_evidence:
      checked_on: 2026-09-07
      access_path: api
      republication_claimed: false
      terms_document_read: false
      robots_api_host_disallows: true
    tos_notes: >-
      Ruling arxiv-api-terms, 2026-09-08. Access is the Atom API at
      export.arxiv.org; arxiv.org's HTML and the PDFs are never fetched.
      Request rate honoured as arXiv publishes it: one per three seconds, one
      connection.

      PERMITTED TODAY: internal development and testing only, and the position
      HOLDS ONLY WHILE NOTHING IS PUBLISHED EXTERNALLY — a quote shown with a
      link to anybody outside the team. See "WHAT COUNTS AS PUBLICATION" in
      this file for the definition.

      robots.txt on the API host is `Disallow: /` (read 2026-09-07) while arXiv
