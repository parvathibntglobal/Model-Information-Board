# ============================================================================
#  Harvest sources — the platforms, the blog feeds, their trust weight, and
#  the terms review NFR-5 requires.
#
#  SHARED. Changes go through a PR.
#
#  Rule 5: `base_trust` is a weight, so it lives here rather than in code.
#  Loaded into the `source` table by collect/, the same way seed_models.yaml
#  is loaded into model_version.
#
#  WHY THIS FILE BLOCKS HARVEST
#
#  `watermark.source_id` references `source(id)`. With no source rows, the
#  first INSERT INTO watermark fails on the foreign key, so FR-9's durable
#  cursors cannot store their first row. That would have surfaced on the first
#  adapter run as a foreign key violation and read as an adapter bug rather
#  than a missing seed.
#
#  HOW A TERMS REVIEW IS RECORDED  (NFR-5)
#
#  Three parts, and the split is the point:
#
#    terms_rulings   the reading of a body of terms, made once, dated, with
#                    an expiry. A ruling is about a *party* — a self-hosting
#                    publisher, or a platform.
#    terms_ruling    each source names the ruling that governs it.
#    terms_evidence  each source carries its own mechanical observations:
#                    robots status and HTTP code, which paths are permitted,
#                    paywall, feed type, and the date checked.
#
#  A ruling reads a document. Evidence measures a host. Neither substitutes
#  for the other, and `assert_terms_reviewed()` demands both: a known,
#  unexpired ruling id, live preconditions re-verified on the run, and
#  recorded evidence that has not gone stale. It no longer greps for a
#  placeholder marker. A class ruling asserted forever against a site that
#  changed in October is the placeholder failure with extra steps.
#
#  Per-host exceptions get their own ruling and override the class.
#
#  WHY TWO CLASSES RATHER THAN FORTY READINGS
#
#  Class A is self-hosted: the publication and the domain are the same party,
#  so the publisher's own terms govern and their robots.txt is that party
#  speaking.
#
#  Class B is platform-hosted, one ruling per platform. The reason for the
#  split is Medium specifically. Airbnb's engineers wrote the post; Medium
#  wrote the terms, and Airbnb cannot grant what Medium withholds. Reading
#  airbnb.com's terms to decide whether we may fetch
#  medium.com/airbnb-engineering reads the wrong document — and a per-host
#  reading would read the wrong document once per host, forty times over.
#
#  Evidence that the platform is the party speaking, not the publisher:
#  medium.com/robots.txt and netflixtechblog.com/robots.txt were fetched
#  separately on 2026-08-14 and are the same rule set, down to the shared
#  `License: https://medium.com/license.xml` line. One host's rules, served
#  under two publishers' domains.
# ============================================================================

version: "2.0"

#: Retained for the prose it appears in and for the loader's own check that a
#: reviewed row does not still carry it. It is no longer what the assertion
#: gates on — see `terms_rulings` and collect/registry/assertions.py.
review_marker: "REVIEW REQUIRED"


# ============================================================================
#  TERMS RULINGS
#
#  `live_preconditions` are re-verified on every run, before the first
#  content request. An observation that is missing is not an observation that
#  passed (rule 6) — the run is refused.
#
#  `recorded_evidence` is measured by hand, dated per source in
#  `terms_evidence`, and expires. It covers what a run cannot cheaply
#  re-observe: paywalls, login walls, whether an article path answers at all.
#
#  Values are lists of acceptable values. Anything else refuses the run.
# ============================================================================

terms_rulings:

  # ── Class A ──────────────────────────────────────────────────────────────
  - id: blog-class-a-self-hosted
    class: A
    party: publisher
    reviewed_on: 2026-08-14
    reviewed_by: anooj
    basis: internal-development-only
    review_valid_days: 90
    evidence_valid_days: 90
    fetch_articles: true
    summary: >-
      Self-hosted practitioner or company blog: the publication and the domain
      are the same party. A public feed served without login or payment, with
      robots.txt permitting the feed path and the article paths it links.

      WHAT WAS ACTUALLY CHECKED, AND IT IS NOT THE TERMS. Per feed: robots.txt
      read and re-read on every run, the feed path and article paths tested
      against it, no paywall observed, no login required, feed type recorded.
      That is mechanical evidence about the SERVER's stated crawl policy.
      NO TERMS PAGE HAS BEEN READ FOR ANY OF THE NINE FEEDS.

      So this ruling does not say the terms permit this, and no per-feed
      `tos_notes` may say it either. It says what was observed, and it records
      that the reading which would turn observation into permission has not
      happened. TERMS REVIEW IS DEFERRED — a team decision, taken while the
      project is internal — and the deferral is written here rather than left
      as an absence somebody later reads as a clearance.

      CURRENT USE: internal development and testing. Not published, no
      external users, not monetized.

      UNRESOLVED, DELIBERATELY RECORDED:
        - No terms of service page has been read for any seeded feed. Robots
          permission and terms permission are different things from different
          documents, and only the first has been established.
        - A 404 robots.txt is the absence of a crawl policy, not consent —
          see THE 404 CAVEAT below. Where robots is silent the class A
          reading carries the whole weight, and that reading is an inference
          about a public feed rather than a permission anybody granted.
        - Retention of full article text is governed by NFR-6 and
          `document_status_ck`'s `tombstoned`: expiry is triggered here and
          respected by `judge/pages/filtered.py`, which never renders one.

      RE-REVIEW REQUIRED BEFORE: any external publication, any external user,
      any monetization, or adding a feed outside the nine assessed.

      Permitted under that basis: fetch the declared feed and the article URLs
      in it, one request per second or slower, robots re-checked on every
      redirect hop, conditional GET so an unchanged feed costs a 304. Published
      content is quote + attribution + link; full text is retained privately
      for verification and reprocessing and is never republished (NFR-5).
      A source whose terms forbid this use is dropped, not worked around — and
      since no terms page has been read, that condition has not been tested.

      THE 404 CAVEAT, which belongs in the ruling and not in a footnote.
      A robots.txt that 404s means "no crawl rules" and nothing whatsoever
      about terms of service. The server answered, and the answer was that
      there is no crawl policy; that is a definite value, not a missing one
      (collect/adapters/blog/robots.py). It is not permission granted by the
      publisher, because the publisher never spoke. Among the seeded feeds
      this is engineering.grab.com, whose robots.txt returned 404 on
      2026-08-14 — and it was also true of dropbox.tech, which is dropped for
      an unrelated reason. Where robots is silent, the class A reading is
      doing all of the work, so it is the reading that has to be right: a
      public feed, no login, and no payment. NOT "no terms page forbidding
      automated retrieval" — that clause was here and is withdrawn, because no
      terms page has been read for any seeded feed and the sentence asserted the
      check that was skipped. Silence is not consent, it is only the absence of
      a refusal — and an unread terms page is not silence, it is unread.

    live_preconditions:
      robots_status: [rules, no-rules]
      feed_path_allowed: [true]
    recorded_evidence:
      article_path_allowed: [true]
      paywall_observed: [false]
      login_required: [false]

  # ── Class B: Medium ──────────────────────────────────────────────────────
  - id: blog-class-b-medium
    class: B
    party: platform
    platform_host: medium.com
    reviewed_on: 2026-08-14
    reviewed_by: anooj
    basis: internal-development-only
    review_valid_days: 90
    evidence_valid_days: 90

    #: FEED ONLY. Not a preference — the article path is refused, twice over.
    fetch_articles: false

    summary: >-
      Medium-hosted publication, whether served from medium.com or from a
      publisher's custom domain. Medium's robots.txt governs, and the
      publisher's does not — the publisher cannot grant what Medium withholds.

      TERMS REVIEW IS DEFERRED HERE TOO, and the distinction matters more on
      this class than on A. What was established is that MEDIUM IS THE PARTY
      SPEAKING — demonstrated by two byte-identical robots.txt files — and that
      its robots refuses the article path. Medium's terms of service have not
      been read. So the article refusal rests on robots, which is sufficient to
      refuse and would not be sufficient to permit.

      CURRENT USE: internal development and testing. Not published, no external
      users, not monetized.

      RE-REVIEW REQUIRED BEFORE: any external publication, any external user,
      any monetization, or fetching anything beyond the feed body.

      THAT THE PLATFORM IS THE PARTY SPEAKING IS DEMONSTRATED, NOT ASSERTED.
      medium.com/robots.txt and netflixtechblog.com/robots.txt were fetched
      separately on 2026-08-14. Both are 39 lines, and all 37 rule lines —
      every `User-Agent`, `Disallow` and `Allow` — are identical. Exactly one
      line differs: `Sitemap`, whose host is substituted per publication
      (`netflixtechblog.com/sitemap/sitemap.xml`). The `License` line is not
      substituted; it reads `https://medium.com/license.xml` from both hosts.
      So the one thing Medium templates for a publisher is the sitemap, and
      the licensing terms are pointedly not it. A custom domain is a skin over
      one host's rules, which is precisely why reading the publisher's terms
      would be reading the wrong document.

      THE REVIEW IS PER DOMAIN, NOT PER PUBLISHER, AND BYTE-IDENTICAL ROBOTS
      DOES NOT COLLAPSE TWO DOMAINS INTO ONE REVIEW. This is the general form
      of the netflixtechblog.com finding below, and it is the rule to carry
      forward rather than the instance.

      A robots rule is PATH-SHAPED. `Disallow: /*/*source=` needs two slashes
      before `source=`, so it reaches `/<publication>/<slug>` on medium.com and
      does not reach `/<slug>` on a custom domain. The rule text is identical
      and its effect is not, because the effect depends on the URL shape the
      domain serves — which is a property of the domain, not of the terms.
      Two publications under one platform can therefore have genuinely
      different permitted paths while quoting the same file.

      So a custom-domain mirror is a separate NFR-5 review: it names the class
      B ruling for the platform's terms, and it measures its own
      `terms_evidence` against its own URL shapes. Sharing a ruling is not
      sharing evidence. `assert_terms_reviewed` already enforces the second
      half — evidence is per source row and dated per source row — and this
      paragraph is why that is not redundant with the ruling.

      Moot for netflixtechblog.com, which is dropped from article fetching on
      other grounds anyway. It is written down for the next custom-domain
      publication with real per-post bylines, where the difference decides
      whether we may fetch the articles at all.

      ARTICLE PATHS ARE NOT PERMITTED, on two grounds observed 2026-08-14. A
      direct GET returns 403 behind Cloudflare — 3 of 3 Netflix URLs and 3 of
      3 Airbnb URLs, a 5,020 and 5,042 byte error page respectively, with no
      article body. And on medium.com itself, robots.txt disallows them.

      ⚠ THE ROBOTS GROUND HOLDS FOR ONE OF THE TWO HOSTS, NOT BOTH, and the
      first version of this ruling said otherwise. Corrected 2026-08-14 after
      measuring rather than reasoning; the correction is recorded rather than
      quietly applied, because a ruling that states a reason nobody checked is
      the exact failure this format exists to prevent, and it happened here.

      `Disallow: /*/*source=` requires two slashes before `source=`. A
      publication on medium.com is `/<publication>/<slug>`, which has two, so
      Airbnb's article links are disallowed — 5 of 6 sampled URLs. A custom
      domain is `/<slug>`, which has one, so **netflixtechblog.com's article
      links are NOT disallowed by robots** even though the host serves the
      identical 37 rule lines. On that host the 403 is the only thing stopping
      us, and the class B reading is what makes feed-only the ruling rather
      than a workaround.

      The gate now evaluates the rule. `urllib.robotparser` implements the
      1996 draft — no `*`, no `$`, and first-match-in-file-order instead of
      most-specific-match — so `/*/*source=` was read as a literal prefix,
      matched nothing, and `gate.allows()` returned True for URLs Medium
      disallows. Replaced by `collect/adapters/blog/rules.py`, which
      implements RFC 9309 §2.2.2 and §2.2.3 over the same parsed groups.
      Until that landed the 403 was what actually stopped us, and a refusal we
      happen to receive is not a rule we chose to obey.

      Consequently articles are never requested from a Medium host, and the
      403 is never worked around — no browser User-Agent, no cookie, no
      rendering service. That is NFR-5 and collect/CLAUDE.md, not a
      workaround we have not thought of yet.

      This costs nothing, because the feed carries the whole post. All ten
      entries in each publication carry `content:encoded`, median 18,722
      characters for Netflix and 15,636 for Airbnb, ending in Medium's own
      "Originally published in … on Medium" footer rather than a truncation.

      THE NAMED-BOT GROUP. Medium's robots.txt has a second group naming
      ClaudeBot, GPTBot, Bytespider, Amazonbot, Applebot-Extended,
      FacebookBot, GoogleOther and meta-externalagent, and disallows all of
      them from everything. Our User-Agent is `modelboard/0.1
      (+https://github.com/parvathibntglobal/Model-Information-Board)`, which
      matches none of those tokens, so the `User-Agent: *` group applies. If
      the harvest User-Agent is ever changed to a string containing one of
      those tokens, this ruling is void and the feeds are disallowed
      entirely — including the feed path.

      PAYWALL: recorded as unknown, deliberately, and not conditioned on. A
      403 error page cannot show a paywall either way, so we have not
      observed one and will not claim we have (rule 6). It does not need
      resolving, because we publish quote + attribution + link taken from the
      feed body Medium served us, and never the article page.

    live_preconditions:
      robots_status: [rules]
      feed_path_allowed: [true]
    recorded_evidence:
      feed_carries_full_text: [true]
      article_fetch_refused: [true]
      login_required: [false]

  # ── The blog platform row, which is not a fetch target ───────────────────
  - id: blog-umbrella-not-a-fetch-target
    class: null
    party: none
    reviewed_on: 2026-08-14
    review_valid_days: 3650
    evidence_valid_days: 3650
    fetch_articles: false
    summary: >-
      The `blogs` row carries the platform trust weight and nothing else. It
      has no endpoint and is never fetched from, so there is no request for a
      terms reading to permit or refuse. The rulings that matter for blogs are
      made per feed, on the feed's own source row, because terms are a
      property of a host and not of a channel. Handing this row to a fetcher
      is a bug, and `fetcher_for_source()` refuses it.

    live_preconditions:
      endpoint_is_null: [true]
    recorded_evidence: {}

  # ── GitHub ───────────────────────────────────────────────────────────────
  - id: github-api-terms
    class: null
    party: platform
    platform_host: github.com
    reviewed_on: 2026-08-13
    review_valid_days: 90
    evidence_valid_days: 90
    fetch_articles: true
    summary: >-
      Reviewed 2026-08-13. Terms: GitHub Terms of Service §H "API Terms"
      (https://docs.github.com/en/site-policy/github-terms/github-terms-of-service)
      — "Abuse or excessively frequent requests to GitHub via the API may
      result in temporary or permanent suspension of your Account's access to
      the API", and "You may not share API tokens to exceed GitHub's rate
      limitations". Acceptable Use Policies §7 Information Usage Restrictions
      (https://docs.github.com/en/site-policy/acceptable-use-policies/github-acceptable-use-policies)
      — "Scraping does not refer to the collection of information through our
      API", so our access path is the API and the scraping restrictions do
      not govern it. RATE LIMITS observed 2026-08-13 via GET /rate_limit on
      the harvest token: core 5,000/hour, search 30/minute, graphql
      5,000/hour; the documented REST limit is "5,000 requests per hour" and
      the search endpoints are documented as "more restrictive" without a
      figure, so the observed 30/minute is the number to budget against.

      REPUBLICATION: not granted by the terms. §D.5's licence to "use,
      display, perform and reproduce (by forking) Your Content" is scoped
      "through the Service", which is GitHub, not us. We publish quote +
      attribution + link only, on short-quotation grounds; full text is
      retained privately for verification and reprocessing and is never
      republished (NFR-5). One identified User-Agent with a contact URL,
      conservative rate limits, no token sharing.

    live_preconditions:
      access_path: [api]
    recorded_evidence:
      republication_claimed: [false]

  # ── Reddit, via a RapidAPI reseller ──────────────────────────────────────
  #
  # ⚠  THIS RULING PERMITS ONE THING: INTERNAL DEVELOPMENT AND TESTING.
  #
  # It is not a clearance. Four conditions are UNRESOLVED and recorded below
  # rather than cleared, and two of them are direct conflicts with design
  # decisions already made in this repository. Both surface on the day
  # somebody builds the publish path, which is why they are also written
  # where a publisher would be built and not only here:
  #
  #     Developer Terms 5.2  vs  author.handle_hash   -> collect/assemble/authors.py
  #     Data API Terms 3.2   vs  the immutable store  -> collect/rawstore.py
  #
  # A condition recorded only in a ruling is read by whoever writes rulings.
  # These need to be read by whoever writes the publisher.
  - id: reddit-via-rapidapi
    party: platform
    platform_host: reddit.com
    reviewed_on: 2026-08-18
    reviewed_by: anooj
    basis: internal-development-only
    review_valid_days: 90
    evidence_valid_days: 90
    summary: >-
      Access via a RapidAPI reseller, verified as a proxy of Reddit's official
      Data API rather than a scrape: t2_ fullnames, subreddit_id, Reddit's own
      cursor, 104 fields per post.

      CURRENT USE: internal development and testing. Not published, no
      external users, not monetized. On that basis Developer Terms 4.1's
      monetization limb does not apply today.

      UNRESOLVED, DELIBERATELY RECORDED:
        - 4.1 also restricts access "by or on behalf of a business". Not
          cleared. No legal review has happened.
        - Data API Terms 2.8 requires credentials issued by Reddit and
          prohibits masking the OAuth identity. A reseller route does not
          satisfy this regardless of use.
        - Developer Terms 5.2 requires citing the author's username. Our
          schema stores handle_hash only, by design.
        - Data API Terms 3.2 requires deleting data not required for the
          approved use case. Our raw store is immutable by design (NFR-4).

      RE-REVIEW REQUIRED BEFORE: any external publication, any external user,
      any monetization, or a switch to a direct Reddit key.
      Escalated to the MD 2026-08-18.

      ONE RULING COVERS BOTH AN EVIDENCE SWEEP AND A MEASUREMENT SWEEP.
      The alternative was a second, lighter ruling for sampling runs that
      quote nobody and publish nothing, and it was refused: PURPOSE IS
      SELF-DECLARED. An exempt category is one everything ends up filed
      under, and the person writing the justification is the person who wants
      the data. `assert_terms_reviewed` has no concept of purpose,
      deliberately — it takes a source row and this run's observations, and a
      fetch is a fetch. The retention difference is real and cuts the other
      way: a measurement sweep keeps documents BECAUSE MOST OF THEM ARE ABOUT
      NOTHING, and "we cited you" and "you were in a denominator" are
      different answers to the same question. That is a reason to handle the
      sample more strictly, not to hold it under different terms — Reddit's
      terms do not vary by our motive. So it is a property of the SAMPLE:
      stored outside raw/, a deletion date recorded at collection, this
      ruling and every precondition it carries.

    # THE BASIS IS ENFORCED, NOT REMEMBERED. `use_basis` is re-read on every
    # run, so the ruling stops applying the moment the deployment stops being
    # internal — rather than the moment somebody remembers to revisit it.
    #
    # It is a PROXY and its limits are stated where it is observed
    # (`collect/adapters/reddit.py:observe_reddit_use`): it catches a
    # production deployment and does NOT catch a staging instance that has
    # acquired external users. That gap is why the four conditions above are
    # recorded rather than treated as handled.
    live_preconditions:
      use_basis: [internal-development-only]
    recorded_evidence:
      official_api_proxy: [true]
      full_text_republished: [false]
      credentials_issued_by_reddit: [false]   # 2.8 unresolved, recorded as false
      legal_review_completed: [false]         # 4.1 business limb, not cleared


# ============================================================================
#  WHAT COUNTS AS PUBLICATION — the trigger three rulings turn on
#
#  RULED 2026-09-08 by anooj. `reddit-via-rapidapi` has carried
#  "RE-REVIEW REQUIRED BEFORE: any external publication" since 2026-08-18 and
#  never said what publication meant. An untriggered trigger and an undefined
#  one look identical from inside the repository, and the two new rulings below
#  rest on the same condition, so it is defined once here rather than three
#  times differently.
#
#  THE DEFINITION, and it is deliberately not "launch":
#
#      A QUOTE FROM A PLATFORM, SHOWN WITH A LINK, TO SOMEBODY OUTSIDE THE
#      TEAM.
#
#  Three parts, and each is doing work:
#
#    a quote        the platform's own words, reproduced. An aggregate over
#                   those words is not one — "7 voices, 2 platforms" is a count
#                   and publishes nothing quotable.
#    with a link    the form BUILD-PLAN commits to (quote + attribution +
#                   link). Naming a source is what makes the display a use of
#                   that platform's content rather than a statement of ours.
#    outside the
#    team           one reader who is not one of us is enough. NOT a launch,
#                   NOT an announcement, NOT a domain. A demo to a prospective
#                   user, a screenshot in a deck, a link to a deployed build,
#                   a shared PDF of a board page — each one trips this.
#
#  WHY THE BAR IS ONE READER RATHER THAN A LAUNCH. A launch is an event we
#  would schedule and therefore remember. Every instance of this trigger that
#  has nearly happened so far would have been an afternoon's decision by one
#  person — which is exactly the class of thing a recorded condition has to
#  cover, because nobody would have thought to re-read a ruling first.
#
#  WHERE THE BOARD STANDS AGAINST IT TODAY, MEASURED 2026-09-08 rather than
#  assumed — AND IT IS CLOSER THAN THE WORD "DEMO" SUGGESTS:
#
#    NOT TRIPPED, AND THE REASON IS THE AUDIENCE, NOT THE DATA. The one page
#    carrying an `illustrative` badge is Landing's throughput panel
#    (`web/src/routes/Landing.jsx`: 10,000 / 1,200 / 1,700 / 96), which is
#    invented and labelled as such. THE ARTICLES PAGES ARE NOT ILLUSTRATIVE.
#    `web/src/data/articles.js` imports ten static platform files for
#    DeepSeek V4 Pro and they carry REAL verbatim quotes, REAL handles and REAL
#    permalinks, at this size:
#
#        deepseek-v4-pro-x.json        149 posts     handle, profile_url,
#                                                    status_url, quote
#        deepseek-v4-pro-reddit.json   150 posts     author, url, excerpt
#        deepseek-v4-pro-hn.json        34 posts     author, url, quote
#        deepseek-v4-pro-devto.json     53 posts     author, url, excerpt
#        deepseek-v4-pro-arxiv.json     43 articles  authors, abs_url
#
#    So what holds the trigger off is that nothing is served to anybody
#    outside the team — NOT that the quotes are stand-ins. Recording the
#    difference matters because "it is only a demo" is how this gets tripped:
#    the sentence is true about the AUDIENCE and false about the CONTENT, and
#    the audience is the half that changes with one URL.
#
#    ⚠ THE SIGN-IN DOES NOT NARROW THIS. `web/src/App.jsx` guards every route
#      with `<Require session>`, which is a CLIENT-SIDE guard, and
#      `web/src/auth.js` says so in its own words: "A guard in the client
#      protects the view. It never protected the data." Those ten JSON files
#      are imported into the bundle, so the quotes ship inside the built
#      JavaScript and are readable without signing in. A deployed build is
#      published under this definition whether or not anyone logs in.
#
#      THE DEPLOYMENT DECISION IS NOT THIS FILE'S, and it is not a pipeline
#      question. It sits with whoever ships the frontend, as issue #225 with
#      three options, and in
#      `docs/for-the-frontend-owner-the-bundle-is-the-access-boundary.md`.
#      Stated here only because the trigger above turns on it.
#
#  NOTHING IN THE PIPELINE ENFORCES THIS. See ENFORCEMENT, below the two
#  rulings, which says exactly what is checked and what is not.
# ============================================================================


  # ── arXiv ────────────────────────────────────────────────────────────────
  #
  # RATIFIED 2026-09-08 ON THE SAME FOOTING AS REDDIT, AND THE ROBOTS QUESTION
  # IS NOT ANSWERED BY DOING SO. It is answered-for-now by the CONDITION: while
  # nothing is published externally (see the definition above), arXiv proceeds;
  # the moment anything is, this ruling stops applying and the API Terms of Use
  # have to be read first. That is a narrower claim than "the API terms beat
  # robots" and it is the only one the evidence supports.
  #
  # THE EVIDENCE IS THE MEASUREMENT AND IT STAYS AS MEASURED, not as read
  # favourably (docs/measurements/new-platform-robots-2026-09-07.json):
  #
  #     export.arxiv.org/api/query   200, Disallow: /   THE HOST WE CALL
  #     arxiv.org/abs/…              200, allowed, Crawl-delay: 15
  #
  # So the host serving arXiv's documented Atom API disallows crawling it,
  # WHILE arXiv publishes request-rate guidance for that same API — one request
  # every three seconds, one connection, honoured in
  # `collect/adapters/arxiv.py:MIN_INTERVAL_SECONDS`. Those two facts point
  # opposite ways. GitHub's ruling did not have to settle it (api.github.com
  # serves no robots.txt at all, 404), so THERE IS NO PRECEDENT TO INHERIT
  # HERE — which is why this is the internal-only footing and not a clearance.
  - id: arxiv-api-terms
    party: platform
    platform_host: arxiv.org
    reviewed_on: 2026-09-08
    reviewed_by: anooj
    basis: internal-development-only
    review_valid_days: 90
    evidence_valid_days: 90
    fetch_articles: true
    summary: >-
      RULED 2026-09-08. Access is the Atom API at export.arxiv.org and never
      arxiv.org's HTML or the PDFs.

      THE RULING, IN ONE SENTENCE: arXiv proceeds on an
      internal-development-only footing, and THAT POSITION HOLDS ONLY WHILE
      NOTHING IS PUBLISHED EXTERNALLY - a quote from this platform, shown with
      a link, to anybody outside the team. See "WHAT COUNTS AS PUBLICATION"
      above this ruling for the definition, which is a trigger and not a
      launch.

      WHAT WAS ACTUALLY CHECKED, AND IT IS NOT THE TERMS. robots.txt read on
      both hosts 2026-09-07 and recorded per source; the API's published
      request-rate guidance is honoured as given; the response shape was
      verified to be the documented Atom feed.

      NO TERMS DOCUMENT HAS BEEN READ. arXiv's API Terms of Use and its
      Licences page are the two to read, and neither has been. This ruling
      records the deferral rather than leaving it as an absence somebody later
      reads as a clearance - the same treatment, and the same wording, as
      `blog-class-a-self-hosted`, which states that no terms page has been read
      for any of the nine feeds.

      UNRESOLVED, DELIBERATELY RECORDED:
        - export.arxiv.org/robots.txt is `Disallow: /`, on the host that serves
          the documented API, while arXiv publishes rate guidance for that same
          API. Whether the API terms govern the API path is UNANSWERED. There
          is no precedent to inherit: api.github.com serves no robots.txt at
          all, so `github-api-terms` never had to say what an explicit
          `Disallow: /` on an API host means.
        - Abstracts are third-party text under a mix of licences. No licence
          page has been read to confirm that short quotation is permitted for
          each.
        - An arXiv abstract is a THIRD-PARTY measurement of somebody else's
          model rather than own-experience. A weighting question for `judge/`,
          not a terms question, and recorded here because this is where a
          reader decides whether to admit the platform.

      CURRENT USE: internal development and testing. Not published, no
      external users, not monetized.

      RE-REVIEW REQUIRED BEFORE: any external publication as defined above,
      any external user, any monetization, or fetching arxiv.org's HTML or
      PDFs rather than the API.
    # THE BASIS IS A LIVE PRECONDITION, NOT A SENTENCE. `TermsRuling.basis`
    # says it: "Where a basis is named it should also be a `live_precondition`,
    # so the fuse is checked rather than remembered."
    # `collect/adapters/arxiv.py:observe_arxiv_use` supplies both facts on
    # every run. READ THE ENFORCEMENT BLOCK BELOW BEFORE TRUSTING THAT — what
    # `use_basis` observes is ENVIRONMENT, which is a proxy for the deployment
    # and NOT an observation of whether anything has been published.
    live_preconditions:
      access_path: [api]
      use_basis: [internal-development-only]
    recorded_evidence:
      republication_claimed: [false]
      terms_document_read: [false]
      robots_api_host_disallows: [true]   # measured, and recorded as measured

  # ── X, via a RapidAPI scraper provider ───────────────────────────────────
  #
  # RATIFIED 2026-09-08, INHERITING THE REDDIT PRECEDENT, because it is not an
  # analogy — it is the same gateway, the same `RAPIDAPI_KEY`, the same billed
  # subscription and the same robots reading:
  #
  #     reddit34.p.rapidapi.com     200, Disallow: /    harvested today under
  #                                                     reddit-via-rapidapi
  #     twitter241.p.rapidapi.com   200, Disallow: /    this ruling
  #
  # `reddit-via-rapidapi`'s live precondition is the ACCESS PATH and not
  # robots, so X was never a new question about robots. It is the existing
  # Reddit question one platform wider, and it is escalated WITH Reddit's
  # rather than separately, because it is one question about one gateway.
  #
  # ⚠ api.x.com WAS ALSO READ (200, `Disallow: /`) AND IS NOT THE HOST WE CALL.
  #   That reading is about the API we are NOT using, and it is kept in the
  #   measurement file with a note saying so rather than dropped, because a
  #   deleted reading looks like a reading nobody took.
  #
  # ⚠ THE SUBSCRIPTION IS SHARED. An X sweep spends Reddit's quota: 1,000,000
  #   requests over a 23.893-day window as read 2026-08-18, BILLED TIER STILL
  #   UNVERIFIED, and nothing has re-read it since. See the `reddit` row.
  - id: x-via-rapidapi-scraper
    party: platform
    platform_host: x.com
    reviewed_on: 2026-09-08
    reviewed_by: anooj
    basis: internal-development-only
    review_valid_days: 90
    evidence_valid_days: 90
    fetch_articles: true
    summary: >-
      RULED 2026-09-08, INHERITING `reddit-via-rapidapi`. Access is a RapidAPI
      scraper provider selected by `SCRAPER_PROVIDER` (`twitter241` today), NOT
      X's own API - the same gateway, the same `RAPIDAPI_KEY` and the same
      billed subscription as the Reddit path.

      THE RULING, IN ONE SENTENCE: X proceeds on an internal-development-only
      footing, and THAT POSITION HOLDS ONLY WHILE NOTHING IS PUBLISHED
      EXTERNALLY - a quote from this platform, shown with a link, to anybody
      outside the team. See "WHAT COUNTS AS PUBLICATION" above.

      THIS IS A PERMISSION, NOT A CLEARANCE, and it is the same one Reddit
      holds. A reseller route does not use credentials issued by X, which is
      the condition Reddit's Data API Terms 2.8 records as unresolved
      REGARDLESS OF USE. An internal-development basis does not clear it and
      is not claimed to.

      WHAT WAS ACTUALLY CHECKED, AND IT IS NOT THE TERMS. robots.txt read
      2026-09-07 on the host the adapter derives from `SCRAPER_PROVIDER`,
      `twitter241.p.rapidapi.com`: 200, `Disallow: /` - the same reading as
      `reddit34.p.rapidapi.com`, which this project harvests today under a
      ruling whose live precondition is the access path. The parser was
      verified against recorded fixtures. NO REQUEST HAS EVER BEEN MADE FROM
      THIS REPOSITORY'S PIPELINE PATH.

      NO TERMS DOCUMENT HAS BEEN READ. Three, not one, and that is the point of
      a reseller route: X's Developer Agreement and Policy, RapidAPI's terms,
      and the provider's own listing terms. None has been read.

      UNRESOLVED, DELIBERATELY RECORDED - and the first three are Reddit's,
      one platform over:
        - Credentials are not issued by X (Reddit's 2.8). NOT cleared by an
          internal-development basis.
        - Display requirements naming the author, against `author.handle_hash`
          (Reddit's 5.2). Surfaces when a publish path is built -
          `collect/assemble/authors.py`.
        - Deletion obligations against an immutable raw store, NFR-4
          (Reddit's 3.2). Surfaces in `collect/rawstore.py:evict`.
        - What the read allowance is. A property of the subscription, shared
          with Reddit, and no request settles it - the figure would come from
          the party whose figure is in doubt.

      CURRENT USE: internal development and testing. Nothing has run yet.

      RE-REVIEW REQUIRED BEFORE: any external publication as defined above,
      any external user, any monetization, a switch to a direct X key, or a
      change of `SCRAPER_PROVIDER`.
      Escalated to the MD WITH Reddit's on 2026-09-08, as one question about
      one gateway.

    # THE PROVIDER IS A PRECONDITION, NOT A DETAIL. A ruling is a reading of one
    # party's terms, and swapping `SCRAPER_PROVIDER` swaps the party - as well
    # as the response envelope the parser reads. Pinning it here means a swap
    # REFUSES at the gate rather than silently parsing nothing and reporting the
    # platform as quiet, which is rule 4 one stage earlier.
    #
    # `credential_present: [true]` is kept as a precondition and it is NOT a
    # clearance — the gate runs BEFORE the credential check in
    # `collect/adapters/x.py:harvester_for_source`, deliberately, so the answer
    # to "why can't I harvest X" is never "you need a key" when the real answer
    # is that a term has not been read.
    live_preconditions:
      access_path: [rapidapi-reseller]
      scraper_provider: [twitter241]
      credential_present: [true]
      use_basis: [internal-development-only]
    recorded_evidence:
      republication_claimed: [false]
      terms_document_read: [false]
      credentials_issued_by_platform: [false]   # the 2.8-shaped condition
      legal_review_completed: [false]


# ============================================================================
#  ENFORCEMENT — what actually notices, and what does not
#
#  WRITTEN 2026-09-08 BECAUSE AN INTERNAL-ONLY RULING THAT NOTHING ENFORCES IS
#  A NOTE, NOT A CONTROL, and three rulings in this file now rest on one.
#  Stating what is checked without stating what is not would make this file the
#  fourth instance of the shape CLAUDE.md's `assert_no_fixtures` entry has
#  already been wrong about three times: a claim about wiring, read as a
#  guarantee.
#
#  WHAT IS ENFORCED, on `reddit-via-rapidapi`, `arxiv-api-terms` and
#  `x-via-rapidapi-scraper` alike:
#
#    use_basis   re-read on every run. `observe_reddit_use`,
#                `observe_arxiv_use` and `observe_x_use` each return
#                `internal-development-only` unless `ENVIRONMENT=production`,
#                in which case `assert_terms_reviewed` refuses the source and
#                the harvest stops. That is real and it fires.
#
#  WHAT IS NOT ENFORCED, AND THE HONEST ANSWER IS NO:
#
#    ⚠  NOTHING IN THE PIPELINE WOULD NOTICE IF THE PUBLICATION CONDITION WERE
#       BREACHED. There is no check, anywhere, that observes whether a quote
#       has been shown with a link to somebody outside the team. Not a gate,
#       not a weight, not a counter. If a build were deployed tomorrow with
#       those 149 X quotes and 150 Reddit quotes in the bundle, every terms
#       assertion in this repository would still pass.
#
#  THREE REASONS IT CANNOT NOTICE, and they are structural rather than missing
#  work, which is why this is a recorded gap and not a TODO:
#
#    1. THE GATE IS ON THE FETCH PATH AND PUBLICATION IS ON THE SERVE PATH.
#       `assert_terms_reviewed` has exactly the callers CLAUDE.md's Conventions
#       list, plus one `harvester_for_source` per adapter — every one of them a
#       fetch. `judge/app.py`, `judge/gate.py` and the web bundle consult no
#       ruling and reference none. A breach therefore stops the NEXT HARVEST at
#       worst, and never the page.
#
#    2. `use_basis` OBSERVES `ENVIRONMENT`, WHICH IS A DIFFERENT FACT.
#       `observe_reddit_use` says so in its own docstring: it is a proxy that
#       catches a production deployment silently inheriting a
#       development-only ruling, and does NOT catch a staging instance that has
#       acquired external users. Publication is a property of WHO IS LOOKING.
#       No environment variable knows that.
#
#    3. THE ARTICLES DATA IS STATIC AND ALREADY BUILT. Those ten JSON files are
#       imported by `web/src/data/articles.js` into the bundle. Nothing
#       re-derives them at serve time, so there is no moment at which any code
#       could be asked to check a ruling.
#
#  SO THE CONTROL IS A PERSON, AND SAYING SO IS THE POINT. The condition is
#  honoured by whoever is about to show the board to somebody, and the only
#  thing this file contributes is that they can find out what the condition is
#  before they do it, rather than after. A reader who wanted a guard here
#  should read this as the argument for building one — the cheapest candidate is
#  a serve-path check that refuses to render a quote whose source row's ruling
#  rests on `internal-development-only`, which does not exist and is not
#  scheduled.
# ============================================================================


# ============================================================================
#  PLATFORM ROWS — the trust weights, and one row per platform.
# ============================================================================

  # ── dev.to ────────────────────────────────────────────────────────────────
  - id: devto-api-terms
    party: platform
    platform_host: dev.to
    reviewed_on: 2026-09-09
    reviewed_by: parvathi
    basis: internal-development-only
    review_valid_days: 90
    evidence_valid_days: 90
    fetch_articles: true
    live_preconditions:
