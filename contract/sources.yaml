      access_path: [discourse-json]
      # The terms make robots.txt the permission, so every path this source
      # requests is re-tested against it on every run, before the first
      # request (collect/adapters/discourse.py `observe`).
      robots_status: [rules]
      listing_path_allowed: [true]
      topic_path_allowed: [true]
      raw_path_allowed: [true]
    recorded_evidence:
      republication_claimed: [false]
      terms_document_read: [true]
      robots_checked: [true]
      legal_review_completed: [false]
    summary: |
      RULED 2026-10-26 (anooj; for review on the PR that carries it). The
      forum's `/tos` redirects to the Google Terms of Service
      (policies.google.com/terms, "Effective July 30, 2026"), read that day.
      Its one clause on automated access, under "Don't abuse our services",
      prohibits "using automated means to access content from any of our
      services in violation of the machine-readable instructions on our web
      pages (for example, robots.txt files that disallow crawling, training,
      or other activities)".

      SO ROBOTS.TXT IS THE PERMISSION, and it was read the same day. For
      `User-agent: *` it disallows /admin/, /auth/, /email/, /session,
      /user-api-key, /badges, /my, /search, /tag/*/l, /g, /t/*/*.rss and
      /c/*.rss. This source requests only what is left: the newest-created
      listing (`/latest.json?order=created`), a topic's JSON (`/t/<id>.json`)
      and its opening post's markdown (`/raw/<id>/1`). `/search` is
      disallowed, so there is NO per-model search here: the forum is read as
      a nightly listing, and extraction finds the models in it.

      The three paths are live preconditions, observed through the same
      robots gate the blogs use on every run. The day robots.txt disallows
      one of them, this source refuses before its first request.

      MEASURED 2026-10-26: 3,022 topics in 30 days (`/categories.json`
      `topics_month`; gemini-api 1,712, antigravity 665, ai-studio 588). Mostly
      operational - 429s, quota, behaviour regressions - and first-hand.

      ROBOTS.TXT PERMITS THE READING; THIS IS WHAT THE QUOTING RESTS ON (added
      after #568's review). The same Terms, under "Other content", say of
      content other people post on Google services: "You may not use this
      content without that person or organization's permission, or as
      otherwise allowed by law." Forum posts are other users' content, and the
      board quotes them. We have no permission from the authors, so the basis
      is the second half - "as otherwise allowed by law": a short quotation,
      attributed and linked, for commentary and comparison, never the full
      text, as the use-basis undertaking at the top of this file commits for
      every source. That is a reliance on the quotation allowances of the
      applicable law (fair dealing / fair use) for criticism, review and
      comparison - which allowance applies depends on where we operate, so
      no single doctrine is named - recorded here as the accepted basis, not
      as a permission anybody granted.

      PUBLICATION, ON PURPOSE (2026-10-26, anooj, after #568's review). Forum
      posts are QUOTED on public pages like Hacker News and dev.to - not
      withheld, not embed-only. A public page credits the PLATFORM NAME and
      LINKS THE TOPIC, and shows no forum username or user id: no identity we
      do not hold (the adapter stores only the forum-local numeric id), and
      the reader can open the post (judge/feed/items.py `cite_source`).

      UNRESOLVED, DELIBERATELY RECORDED: posts carry no stated licence for
      quotation; the basis above is reliance on the law, which is weaker than
      a licence and is the accepted risk.

      RE-REVIEW REQUIRED BEFORE: any monetization, any path robots.txt does not
      allow, or a change to Google's terms after July 30, 2026.

  # ── Bluesky, via the public AppView ──────────────────────────────────────
  - id: bluesky-appview-terms
    party: platform
    platform_host: bsky.app
    reviewed_on: 2026-10-26
    reviewed_by: anooj
    basis: public-derived-publication
    review_valid_days: 90
    evidence_valid_days: 90
    fetch_articles: true
    live_preconditions:
      use_basis: [public-derived-publication]
      access_path: [api]
      search_endpoint: ["/app.bsky.feed.searchPosts"]
    recorded_evidence:
      republication_claimed: [false]
      terms_document_read: [true]
      robots_checked: [true]
      legal_review_completed: [false]
      deletion_on_request_honoured: [true]
    summary: |
      RULED 2026-10-26 (anooj; for review on the PR that carries it). Access is
      Bluesky's public AppView API, `app.bsky.feed.searchPosts` at
      `api.bsky.app`, with no credential - the developer docs say these
      endpoints "do not support authentication" and carry "generous
      rate-limits". Site HTML is never fetched.

      WHAT WAS READ, 2026-10-26:
        - Terms of Service (bsky.social/about/support/tos, "Last Updated" 14
          Aug 2025): no clause on reading, crawling or scraping, and none on AI
          use of public posts.
        - robots.txt (bsky.app): `User-Agent: *` / `Allow: /`; the file says
          bots "may crawl anything on this domain" and points bulk users to the
          protocol API, which is the route this adapter takes.
        - Developer guidelines (bsky-docs repository,
          docs/support/developer-guidelines.md, undated; re-read in full
          2026-10-26 - the first reading said ONE obligation and missed two).
          THREE APPLY TO A SERVICE THAT ONLY READS, quoted:
            3. "All services must have a method for deleting content a user
               has requested to be deleted."
            5. "Developers must maintain updated contact information accessible
               to the public including an email address that is regularly
               monitored."
            7. "Developers should keep records of all reports of violations
               and their responses".
          TWO MORE ARE TAKEN AS APPLYING (#567 review), because our pages
          will show Bluesky posts a reader may want to report:
            2.1 "A method to report illegal content";
            4.  "Developers must have a system for appropriately responding to
                all user reports of violations within their apps."
          Items 1, 2.2, 2.3 and 6 concern apps where users post, follow or
          hold accounts, which this service does not have.

      THE OBLIGATIONS, AND HOW THEY ARE MET. A request to remove a Bluesky
      post is handled as any takedown here: the raw payload is tombstoned
      (NFR-6) and the claims from it withdrawn. `deletion_on_request_honoured`
      records that commitment; it is a promise this ruling makes, so breaking
      it voids the ruling. ONE CONTACT ADDRESS SERVES ALL FOUR: a removal
      request (3), a report of a quoted post (2.1, 4) and the public contact
      itself (5), and every request and our response is logged (7).
      ⚠ OPEN, AND ENFORCED UNTIL IT IS NOT: the address and where the log is
      kept are to be decided by anooj and recorded here, with the date, when
      decided - as #564 recorded the newsletter decision. Until then `bluesky`
      is in contract/publication.yaml `withheld_from_public` and
      `derived_posts.embed_only`, so its posts reach no public page; both
      lines come out in the same change that names the address.

      PUBLICATION, ON PURPOSE (2026-10-26, anooj, after #567's review). Bluesky
      is QUOTED like Hacker News and dev.to - not withheld, and not embed-only
      like X. The Terms of Service set no embed or attribution requirement,
      users "retain ownership" of their posts, and "Bluesky does not control
      how others may use your Content"; we quote a short excerpt, never full
      text, under the use-basis undertaking at the top of this file. A public
      page credits the PLATFORM NAME and LINKS THE POST, and shows no handle,
      display name or DID: no identity we do not hold, and the reader can open
      the post (judge/feed/items.py `cite_source`). The link itself is the
      post's address, `bsky.app/profile/<did>/post/<rkey>`.

      UNRESOLVED, DELIBERATELY RECORDED:
        - Some accounts are automated (price and release bots). They are kept,
          not filtered: a filter whose error rate nobody has measured ships as a
          weight, never a gate (rule 8).
        - Non-English posts are kept (`document.lang` is recorded, not
          filtered); quotes verify in the original script. The "7 of 25
          first-hand" estimate was read from English posts only.
        - A model name inside a longer one ("GLM 5.3" in "GLM 5.3 Flash") is
          kept by the adapter and separated at extraction by the longer name,
          as on every source; per-model retrieval counts are not exact.

      RE-REVIEW REQUIRED BEFORE: any monetization, any use of the firehose or a
      PDS rather than the AppView search, or fetching bsky.app HTML.


