sources:

  - id: github
    platform: github
    endpoint: https://api.github.com
    base_trust: 0.95
    provenance: seed
    # The failure channel: repro steps, error strings, real schemas. Highest
    # trust precisely because it is structurally negative — nobody opens an
    # issue to report that something worked.
    terms_ruling: github-api-terms
    terms_evidence:
      checked_on: 2026-08-13
      access_path: api
      republication_claimed: false
    tos_notes: >-
      Ruling github-api-terms, reviewed 2026-08-13. Access is the REST and
      GraphQL API, never the HTML. Observed limits 2026-08-13: core
      5,000/hour, search 30/minute. Republication is not granted by the
      terms; we publish quote + attribution + link only.

  - id: blogs
    platform: blog
    endpoint: null            # per-feed; see `feeds` below
    base_trust: 0.90
    provenance: seed
    # THE ONLY POSITIVE-EVIDENCE CHANNEL. Without it, silent-failure
    # capabilities like summarisation can never reach positive consensus and
    # the advisor can never approve a cheaper summariser — the single
    # recommendation this product exists to make.
    terms_ruling: blog-umbrella-not-a-fetch-target
    terms_evidence:
      checked_on: 2026-08-14
      endpoint_is_null: true
    tos_notes: >-
      Ruling blog-umbrella-not-a-fetch-target. This row carries the blog trust
      weight and has no endpoint; it is never fetched from. Every blog terms
      ruling is recorded on the feed's own source row, because terms belong to
      a host and not to a channel. See `feeds` below and, for feeds found in
      already-harvested content, `source.provenance = 'discovered'`.

  - id: reddit
    platform: reddit
    endpoint: https://oauth.reddit.com
    base_trust: 0.85
    provenance: seed
    # RULED 2026-08-18, INTERNAL DEVELOPMENT ONLY. See
    # `reddit-via-rapidapi` above for what that permits and, more
    # importantly, for the four conditions it does NOT clear.
    #
    # The endpoint below is Reddit's official OAuth host, which is what the
    # ruling is about. Access today is through a RapidAPI reseller
    # (`RAPIDAPI_HOST`), and Data API Terms 2.8 is one of the unresolved
    # conditions precisely because of that.
    terms_ruling: reddit-via-rapidapi
    terms_evidence:
      checked_on: 2026-08-18
      official_api_proxy: true
      full_text_republished: false
      credentials_issued_by_reddit: false
      legal_review_completed: false
    tos_notes: >-
      Reviewed 2026-08-18 (User Agreement, Developer Terms, Data API Terms).
      Their terms prohibit scraping, so the official API is mandatory; access
      is via a RapidAPI reseller verified as a proxy of that API rather than a
      scrape.

      PERMITTED TODAY: internal development and testing only. Not published,
      no external users, not monetized.

      NOT CLEARED, and escalated to the MD on 2026-08-18: Developer Terms
      4.1's "by or on behalf of a business" limb, Data API Terms 2.8
      (credentials issued by Reddit, OAuth identity unmasked — a reseller
      route does not satisfy this regardless of use), Developer Terms 5.2
      (cite the author's username, against our handle_hash design) and Data
      API Terms 3.2 (delete data not required for the approved use case,
      against NFR-4's immutable store). The last two are conflicts with
      decisions already made and surface when the publish path is built.

      RATE LIMIT: 429 measured at the 32nd rapid call (2026-08-14), working
      figure 25/min. The plan's actual per-minute allowance has never been
      read — no header states one — so it stays unknown rather than becoming
      32 by repetition. The "60/min" this note used to cite to BUILD-PLAN is
      not in BUILD-PLAN and never was.

      QUOTA, READ 2026-08-18 and no longer carried over from a docstring:
        x-ratelimit-requests-limit       1000000
        x-ratelimit-requests-remaining    998660
        x-ratelimit-requests-reset       2064366  = 23.893 days,
                                                   resets 2026-09-11 09:45 UTC
      Exactly one unit per request, over 558 requests across six runs and per
      individual call over the last 186. All three headers are now captured on
      every call (collect/adapters/reddit.py:_QUOTA_HEADERS), so each is a
      dated observation rather than a constant somebody wrote.

      THE WINDOW IS 23.9 DAYS, NOT A MONTH. Anything costed as a "share of a
      month" against this quota is a third too low. The reset is stored as the
      duration it is; a date without its read_at is stale inside the window.

      THE BILLED TIER IS STILL UNVERIFIED. This note said "1,000,000/month"
      for weeks on the strength of a docstring, and the reading confirms the
      number - which is the uncomfortable outcome, because a right answer from
      an unsourced method is the one nobody revisits. What the reading does NOT
      establish: the plan page says 500,000, and a gateway header is the
      gateway's view rather than proof of what RapidAPI bills and serves. If
      the subscription is a 500,000 tier we are cut off there with the header
      reading ~500,000 remaining and looking healthy. No request can settle it
      - the value would come from the party whose figure is in doubt - so it
      closes on somebody opening the RapidAPI subscription page. A browser, not
      a call. Same folklore shape as the "60/min" above, caught the same way.
      See docs/measurements/reddit-rate-and-quota.md §1.4.

  - id: arxiv
    platform: arxiv
    endpoint: https://export.arxiv.org/api/query
    base_trust: 0.70
    provenance: seed
    # RULED 2026-09-08, INTERNAL DEVELOPMENT ONLY, on the same footing as
    # `reddit`. See `arxiv-api-terms` above for the condition it rests on and,
    # more importantly, for what it does NOT clear — no arXiv terms document
    # has been read.
    #
    # `base_trust` 0.70 IS THE LOWEST OF THE FIVE NEW PLATFORMS AND IT IS A
    # GUESS, like the other five weights in this file — nothing has calibrated
    # any of them. The argument, which is the part to disagree with: an
    # abstract is a THIRD-PARTY benchmark of somebody else's model rather than
    # own-experience, and every arXiv document is unattributable to a single
    # voice (`collect/adapters/arxiv.py:author_external_id`), so it can
    # corroborate the platform half of the publication gate and never the
    # voice half. That is a structural ceiling, not a comment on rigour.
    terms_ruling: arxiv-api-terms
    terms_evidence:
      checked_on: 2026-09-07
      access_path: api
      republication_claimed: false
      terms_document_read: false
      robots_api_host_disallows: true
    tos_notes: >-
      Ruling arxiv-api-terms, 2026-09-08. Access is the Atom API at
      export.arxiv.org; arxiv.org's HTML and the PDFs are never fetched.
      Request rate honoured as arXiv publishes it: one per three seconds, one
      connection.

      PERMITTED TODAY: internal development and testing only, and the position
      HOLDS ONLY WHILE NOTHING IS PUBLISHED EXTERNALLY — a quote shown with a
      link to anybody outside the team. See "WHAT COUNTS AS PUBLICATION" in
      this file for the definition.

      robots.txt on the API host is `Disallow: /` (read 2026-09-07) while arXiv
      publishes request-rate guidance for that same API. THE API-VERSUS-ROBOTS
      QUESTION IS UNRESOLVED and is recorded as such rather than resolved by
      the ruling; there is no precedent to inherit, because api.github.com
      serves no robots.txt at all. No terms document has been read — arXiv's
      API Terms of Use and its Licences page are the two to read.

  - id: x
    platform: x
    endpoint: https://twitter241.p.rapidapi.com
    base_trust: 0.60
    provenance: seed
    # RULED 2026-09-08, INTERNAL DEVELOPMENT ONLY, INHERITING THE REDDIT
    # PRECEDENT. `twitter241.p.rapidapi.com` and `reddit34.p.rapidapi.com` are
    # the same case: one gateway, one key, one billed subscription, and the
    # same `Disallow: /`. See `x-via-rapidapi-scraper` above for the four
    # conditions it does NOT clear.
    #
    # `base_trust` 0.60 IS THE LOWEST WEIGHT IN THIS FILE and it is a STANCE
    # rather than an observation: the Articles-page sweep found 573 keyword
    # posts across 46 queries for one model, of which the substantive ones had
    # to be separated by hand from announcements, roundups and promo. Until a
    # filter does that separation, the channel is mostly marketing. Say so here
    # rather than in a commit message, because a weight nobody can argue with
    # is a weight nobody will fix.
    terms_ruling: x-via-rapidapi-scraper
    terms_evidence:
      checked_on: 2026-09-07
      access_path: rapidapi-reseller
      republication_claimed: false
      terms_document_read: false
      credentials_issued_by_platform: false
      legal_review_completed: false
    tos_notes: >-
      Ruling x-via-rapidapi-scraper, 2026-09-08. Access is a RapidAPI scraper
      provider selected by `SCRAPER_PROVIDER` (`twitter241` today), NOT X's own
      API — the same gateway and the same `RAPIDAPI_KEY` as the Reddit path, so
      an X sweep spends the Reddit quota.

      PERMITTED TODAY: internal development and testing only, and the position
      HOLDS ONLY WHILE NOTHING IS PUBLISHED EXTERNALLY — a quote shown with a
      link to anybody outside the team. See "WHAT COUNTS AS PUBLICATION" in
      this file.

      NOT CLEARED, and escalated to the MD with Reddit's on 2026-09-08 as one
      question about one gateway: credentials are not issued by X (Reddit's
      Data API Terms 2.8, which an internal-development basis does not clear),
      display requirements naming the author against our `handle_hash` design
      (Reddit's 5.2), and deletion obligations against NFR-4's immutable store
      (Reddit's 3.2). No terms document has been read, and there are THREE on a
      reseller route rather than one: X's Developer Agreement and Policy,
      RapidAPI's terms, and the provider's own listing terms.

      `endpoint` above is the host the provider name DERIVES to
      (`collect/adapters/x.py:host_for`), not a value the adapter reads. The
      adapter follows `SCRAPER_PROVIDER`; this row records which provider the
      ruling was made for, and the ruling's `scraper_provider` precondition
      makes a swap REFUSE rather than silently parse a different envelope and
      report the platform as quiet.

      NOTHING HAS RUN. No X request has ever been made from this repository's
      pipeline path. The terms gate now passes, so the remaining stop is the
      credential — `RAPIDAPI_KEY`, checked after the gate and not before it.



# ============================================================================
#  SEEDED BLOG FEEDS
#
#  WHY THESE ARE HERE AND NOT ONLY IN THE TABLE
#
#  Same pattern as `seed_models.yaml` → `model_version`, and for the same
#  reason: the initial list is a decision somebody made, so it belongs
#  somewhere reviewable and diffable, and it becomes ordinary rows at runtime.
#  Every feed is a `source` row when it runs. Feeds DISCOVERED from links in
#  already-harvested content are data and are inserted into `source`
#  directly, never back into this file.
#
#  Unlike `seed_models.yaml`, this is NOT a build fixture and has no removal
#  date. `assert_no_fixtures()` does not look at `source`, and must not be
#  taught to: a seeded feed is a curation decision, not a stand-in for
#  machinery that does not exist yet.
#
#  WHY `provenance` IS ON EVERY ROW
#
#  Without it a discovered feed is indistinguishable from a vetted one, and
#  inherits a class ruling nobody made about it. That is item 20's shape — a
#  value that cannot be told apart from a reviewed one, feeding a decision
#  that gates behaviour. `provenance = 'discovered'` is what makes a feed
#  that arrived by link visible as such, and its terms ruling is its own.
#
#  IDS. `blog:<host>`, plus the publication path where the host carries more
#  than one publication (medium.com does; netflixtechblog.com does not).
#
#  EVERY MEASUREMENT IS DATED. A class ruling resting on a stale robots check
#  is the same failure as a placeholder nobody re-reads, so both
#  `terms_evidence.checked_on` and `measured.checked_on` are compared against
#  the ruling's `evidence_valid_days` at startup.
#
#  DROPBOX IS NOT HERE. dropbox.tech passed every terms and retrieval check
#  on 2026-08-14 and is dropped on data quality: its `dc:creator` is
#  cumulative, so the ten entries carry ten bylines that grow by accretion —
#  "Andrew Cheung,Binoy Dash", then that plus two more, then that plus three
#  more. That is not a coarse identity that resolves to one voice, it is
#  broken data that would resolve to ten different multi-person strings and
#  corroborate itself. Over-clustering is worse than under-clustering
#  (collect/CLAUDE.md), and this is the input that produces it.
#
#  BYLINE RESOLUTION, per Engineer 2's ruling.
#    entry          the entry carries its own byline. It wins, always.
#    feed_declared  the feed declares a single author and the entries do not
#                   dissent. The declaration stands until an entry byline
#                   disagrees with it, at which point the entry wins and the
#                   feed is flagged.
#    team           one organisational byline for every post. Collapses to
#                   one voice, not zero — a team blog is one voice, and
#                   reading it as no voice loses the evidence entirely.
#    none           no byline at either level and no organisational identity
#                   to collapse to. Stays unresolved. It is not silently
#                   assigned to the domain owner (rule 6).
# ============================================================================

  - id: devto
    platform: devto
    endpoint: https://dev.to/api/articles/search
    base_trust: 0.60
    provenance: seed
    terms_ruling: devto-api-terms
    terms_evidence:
      checked_on: 2026-09-09
      access_path: api
      search_endpoint: "/articles/search"
