    recorded_evidence:
      republication_claimed: [false]
      terms_document_read: [false]
      robots_checked: [false]
      legal_review_completed: [false]
    summary: |
      RULED 2026-09-09. Access is the documented public API at huggingface.co/api
      - repo search and the discussions endpoints - never the site HTML and never
      model weights.

      THE RULING, IN ONE SENTENCE: Hugging Face proceeds on an
      internal-development-only footing, and THAT POSITION HOLDS ONLY WHILE
      NOTHING IS PUBLISHED EXTERNALLY - a quote shown with a link to anybody
      outside the team.

      WHAT WAS ACTUALLY CHECKED, AND IT IS NOT THE TERMS. That the adapter calls
      the documented JSON API under /api, that it reads discussions rather than
      downloading weights, and that no credential is sent.

      NO TERMS DOCUMENT HAS BEEN READ, and robots.txt has not been fetched.
      Hugging Face publishes a Terms of Service and a Content Policy; neither has
      been read, and this ruling records the deferral rather than leaving an
      absence that later reads as a clearance.

      UNRESOLVED, DELIBERATELY RECORDED:
        - Discussion comments are USER-AUTHORED third-party text with no stated
          licence. Quotation rights are UNANSWERED.
        - A model card is frequently the VENDOR describing its own model. That is
          `vendor-about-own-product` at extraction and must not be weighted as
          own-experience - a weighting question for judge/ rather than a terms
          question, recorded here because this is where a reader decides whether
          to admit the platform at all.
        - No documented rate limit was read for the unauthenticated API. The
          adapter is polite by construction; that is our restraint, not their
