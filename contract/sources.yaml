  - id: reddit
    platform: reddit
    endpoint: https://oauth.reddit.com
    base_trust: 0.85
    provenance: seed
    # RULED 2026-08-18, INTERNAL DEVELOPMENT ONLY. See
    # `reddit-via-rapidapi` above for what that permits and, more
    # importantly, for the four conditions it does NOT clear.
    #
    # The endpoint below is Reddit's official OAuth host, which is what the
    # ruling is about. Access today is through a RapidAPI reseller
    # (`RAPIDAPI_HOST`), and Data API Terms 2.8 is one of the unresolved
    # conditions precisely because of that.
    terms_ruling: reddit-via-rapidapi
    terms_evidence:
      checked_on: 2026-08-18
      official_api_proxy: true
      full_text_republished: false
      credentials_issued_by_reddit: false
      legal_review_completed: false
    tos_notes: >-
      Reviewed 2026-08-18 (User Agreement, Developer Terms, Data API Terms).
      Their terms prohibit scraping, so the official API is mandatory; access
      is via a RapidAPI reseller verified as a proxy of that API rather than a
      scrape.

      PERMITTED TODAY: internal development and testing only. Not published,
      no external users, not monetized.

      NOT CLEARED, and escalated to the MD on 2026-08-18: Developer Terms
      4.1's "by or on behalf of a business" limb, Data API Terms 2.8
      (credentials issued by Reddit, OAuth identity unmasked — a reseller
      route does not satisfy this regardless of use), Developer Terms 5.2
      (cite the author's username, against our handle_hash design) and Data
      API Terms 3.2 (delete data not required for the approved use case,
      against NFR-4's immutable store). The last two are conflicts with
      decisions already made and surface when the publish path is built.

      RATE LIMIT: 429 measured at the 32nd rapid call (2026-08-14), working
      figure 25/min. The plan's actual per-minute allowance has never been
      read — no header states one — so it stays unknown rather than becoming
      32 by repetition. The "60/min" this note used to cite to BUILD-PLAN is
      not in BUILD-PLAN and never was.

      QUOTA, READ 2026-08-18 and no longer carried over from a docstring:
        x-ratelimit-requests-limit       1000000
        x-ratelimit-requests-remaining    998660
        x-ratelimit-requests-reset       2064366  = 23.893 days,
                                                   resets 2026-09-11 09:45 UTC
      Exactly one unit per request, over 558 requests across six runs and per
      individual call over the last 186. All three headers are now captured on
      every call (collect/adapters/reddit.py:_QUOTA_HEADERS), so each is a
      dated observation rather than a constant somebody wrote.

      THE WINDOW IS 23.9 DAYS, NOT A MONTH. Anything costed as a "share of a
      month" against this quota is a third too low. The reset is stored as the
      duration it is; a date without its read_at is stale inside the window.

      THE BILLED TIER IS STILL UNVERIFIED. This note said "1,000,000/month"
      for weeks on the strength of a docstring, and the reading confirms the
      number - which is the uncomfortable outcome, because a right answer from
      an unsourced method is the one nobody revisits. What the reading does NOT
      establish: the plan page says 500,000, and a gateway header is the
      gateway's view rather than proof of what RapidAPI bills and serves. If
      the subscription is a 500,000 tier we are cut off there with the header
      reading ~500,000 remaining and looking healthy. No request can settle it
      - the value would come from the party whose figure is in doubt - so it
      closes on somebody opening the RapidAPI subscription page. A browser, not
      a call. Same folklore shape as the "60/min" above, caught the same way.
      See docs/measurements/reddit-rate-and-quota.md §1.4.

