# ============================================================================
#  Harvest sources — the three platforms, their trust weight, and the terms
#  review NFR-5 requires.
#
#  SHARED. Changes go through a PR.
#
#  Rule 5: `base_trust` is a weight, so it lives here rather than in code.
#  Loaded into the `source` table by collect/, the same way seed_models.yaml
#  is loaded into model_version.
#
#  WHY THIS FILE BLOCKS HARVEST
#
#  `watermark.source_id` references `source(id)`. With no source rows, the
#  first INSERT INTO watermark fails on the foreign key, so FR-9's durable
#  cursors cannot store their first row. That would have surfaced on the first
#  adapter run as a foreign key violation and read as an adapter bug rather
#  than a missing seed.
#
#  ┌──────────────────────────────────────────────────────────────────────┐
#  │  tos_notes BELOW ARE PLACEHOLDERS. THE REVIEW HAS NOT HAPPENED.      │
#  │                                                                      │
#  │  They ship so a schema fix is not held hostage to a reading task     │
#  │  with no owner and no date. They are not a claim that terms were     │
#  │  reviewed — they say the opposite, in the value itself.              │
#  │                                                                      │
#  │  assert_terms_reviewed() refuses to harvest from any source whose    │
#  │  tos_notes still carries the marker. NFR-5's acceptance is that      │
#  │  terms are reviewed and recorded PER SOURCE, so a placeholder        │
#  │  surviving to first harvest is a requirement failure and stops the   │
#  │  run. See collect/registry/assertions.py.                            │
#  │                                                                      │
#  │  Blocking from week 2, when the blog adapter lands.                  │
#  └──────────────────────────────────────────────────────────────────────┘
# ============================================================================

version: "1.0"

#: The string that makes an unreviewed source detectable by code rather than
#: by a human noticing. Do not reword it without changing the assertion.
review_marker: "REVIEW REQUIRED"

sources:

  - id: github
    platform: github
    endpoint: https://api.github.com
    base_trust: 0.95
    # The failure channel: repro steps, error strings, real schemas. Highest
    # trust precisely because it is structurally negative — nobody opens an
    # issue to report that something worked.
    # NFR-5 review, recorded 2026-08-13. Four things the placeholder asked for,
    # in order: terms URL, date read, observed rate limit, republication.
    #
    # The fourth is the one that does not reduce to a yes. ToS §D.5 grants other
    # users a licence to "use, display, perform and reproduce (by forking) Your
    # Content THROUGH THE SERVICE" — scoped to GitHub itself, so it is not a
    # grant to republish issue text on our own pages. Quote + attribution + link
    # therefore stands on short-quotation-with-attribution grounds, not on a
    # licence from GitHub, and full text stays private. That is what NFR-5
    # already requires; the point of recording it is that the reason is now on
    # the record instead of being assumed.
    tos_notes: >-
      Reviewed 2026-08-13. Terms: GitHub Terms of Service §H "API Terms"
      (https://docs.github.com/en/site-policy/github-terms/github-terms-of-service)
      — "Abuse or excessively frequent requests to GitHub via the API may result
      in temporary or permanent suspension of your Account's access to the API",
      and "You may not share API tokens to exceed GitHub's rate limitations".
      Acceptable Use Policies §7 Information Usage Restrictions
      (https://docs.github.com/en/site-policy/acceptable-use-policies/github-acceptable-use-policies)
      — "Scraping does not refer to the collection of information through our
      API", so our access path is the API and the scraping restrictions do not
      govern it. RATE LIMITS observed 2026-08-13 via GET /rate_limit on the
      harvest token: core 5,000/hour, search 30/minute, graphql 5,000/hour;
      documented REST limit is "5,000 requests per hour" and the search
      endpoints are documented as "more restrictive" without a figure, so the
      observed 30/minute is the number to budget against.
      REPUBLICATION: not granted by the terms. §D.5's licence to "use, display,
      perform and reproduce (by forking) Your Content" is scoped "through the
      Service", which is GitHub, not us. We publish quote + attribution + link
      only, on short-quotation grounds; full text is retained privately for
      verification and reprocessing and is never republished (NFR-5). One
      identified User-Agent with a contact URL, conservative rate limits, no
      token sharing.

  - id: blogs
    platform: blog
    endpoint: null            # per-feed; discovered feeds become source rows
    base_trust: 0.90
    # THE ONLY POSITIVE-EVIDENCE CHANNEL. Without it, silent-failure
    # capabilities like summarisation can never reach positive consensus and
    # the advisor can never approve a cheaper summariser — the single
    # recommendation this product exists to make.
    tos_notes: >-
      REVIEW REQUIRED before first harvest. RSS and sitemaps only, robots.txt
      respected, no paywall circumvention. A source whose terms forbid this
      use is dropped, not worked around. Record per host.

  - id: reddit
    platform: reddit
    endpoint: https://oauth.reddit.com
    base_trust: 0.85
    # DEFERRED: the company holds the account and access will be requested
    # later. The adapter is not being built. Blocking from week 3, because
    # FR-6's acceptance is all three adapters returning content and FR-17's
    # cross-platform identity clustering cannot be tested with one social
    # platform. See docs/phase2-readiness.md.
    tos_notes: >-
      REVIEW REQUIRED before first harvest. Their terms prohibit scraping, so
      the official API is mandatory. Record the current rate limit and
      free-tier eligibility rather than trusting BUILD-PLAN's 60/min figure.


