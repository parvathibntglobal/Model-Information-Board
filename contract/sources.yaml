# ============================================================================
#  Harvest sources — the platforms, the blog feeds, their trust weight, and
#  the terms review NFR-5 requires.
#
#  SHARED. Changes go through a PR.
#
#  Rule 5: `base_trust` is a weight, so it lives here rather than in code.
#  Loaded into the `source` table by collect/, the same way seed_models.yaml
#  is loaded into model_version.
#
#  WHY THIS FILE BLOCKS HARVEST
#
#  `watermark.source_id` references `source(id)`. With no source rows, the
#  first INSERT INTO watermark fails on the foreign key, so FR-9's durable
#  cursors cannot store their first row. That would have surfaced on the first
#  adapter run as a foreign key violation and read as an adapter bug rather
#  than a missing seed.
#
#  HOW A TERMS REVIEW IS RECORDED  (NFR-5)
#
#  Three parts, and the split is the point:
#
#    terms_rulings   the reading of a body of terms, made once, dated, with
#                    an expiry. A ruling is about a *party* — a self-hosting
#                    publisher, or a platform.
#    terms_ruling    each source names the ruling that governs it.
#    terms_evidence  each source carries its own mechanical observations:
#                    robots status and HTTP code, which paths are permitted,
#                    paywall, feed type, and the date checked.
#
#  A ruling reads a document. Evidence measures a host. Neither substitutes
#  for the other, and `assert_terms_reviewed()` demands both: a known,
#  unexpired ruling id, live preconditions re-verified on the run, and
#  recorded evidence that has not gone stale. It no longer greps for a
#  placeholder marker. A class ruling asserted forever against a site that
#  changed in October is the placeholder failure with extra steps.
#
#  Per-host exceptions get their own ruling and override the class.
#
#  WHY TWO CLASSES RATHER THAN FORTY READINGS
#
#  Class A is self-hosted: the publication and the domain are the same party,
#  so the publisher's own terms govern and their robots.txt is that party
#  speaking.
#
#  Class B is platform-hosted, one ruling per platform. The reason for the
#  split is Medium specifically. Airbnb's engineers wrote the post; Medium
#  wrote the terms, and Airbnb cannot grant what Medium withholds. Reading
#  airbnb.com's terms to decide whether we may fetch
#  medium.com/airbnb-engineering reads the wrong document — and a per-host
#  reading would read the wrong document once per host, forty times over.
#
#  Evidence that the platform is the party speaking, not the publisher:
#  medium.com/robots.txt and netflixtechblog.com/robots.txt were fetched
#  separately on 2026-08-14 and are the same rule set, down to the shared
#  `License: https://medium.com/license.xml` line. One host's rules, served
#  under two publishers' domains.
# ============================================================================

version: "2.0"

#: Retained for the prose it appears in and for the loader's own check that a
#: reviewed row does not still carry it. It is no longer what the assertion
#: gates on — see `terms_rulings` and collect/registry/assertions.py.
review_marker: "REVIEW REQUIRED"


# ============================================================================
#  THE USE-BASIS UNDERTAKING          ⚠ PROPOSED 2026-09-15 - NOT YET ASSERTED
#
#  Eight rulings below rest on `basis: internal-development-only`. That basis
#  is a fact about WHO CAN REACH THIS DEPLOYMENT, and until now the only thing
#  answering it was `ENVIRONMENT`, which is a DEPLOYMENT MODE. Two different
#  facts, one answering for the other.
#
#  `collect/adapters/basis.py` named the gap in its own docstring before it
#  cost anything: "Publication is a property of who is looking at a page. No
#  environment variable knows that." So a PERSON asserts it here, with a name
#  and a date, and `observe_use_basis()` reads the assertion.
#
#  ✔ ASSERTED 2026-09-15 BY anooj. Before that this block shipped UNSIGNED and
#    every ruling resting on it refused - deliberately, because an undertaking
#    nobody has signed must not be readable as one somebody has. That remains
#    the behaviour for an absent, expired or self-contradicting block.
#
#    THIS IS A PERSON'S STATEMENT, NOT A CONFIGURATION VALUE. It says the four
#    conditions below were true of every reachable surface on the date named,
#    and it is wrong the moment one of them stops being true - which is what
#    `voided_by` is for and why the expiry is 30 days rather than 90.
#
#  ABSENT IS NOT PERMISSIVE (rule 6). No undertaking, an expired one, or one
#  that contradicts itself all mean NO BASIS, which means every ruling that
#  rests on one refuses.
#
#  WHY THE EXPIRY IS SHORTER THAN A RULING'S. `review_valid_days: 90` on a
#  ruling is about a TERMS DOCUMENT, which changes in months. This is about a
#  fact that is one careless link away from false, so it expires in 30 days.
#  It is also a visible count of how long a terms reading has been deferred:
#  an undertaking renewed four times has been standing in for a reading for
#  four months.
# ============================================================================

use_basis_undertaking:
  asserts: internal-development-only
  asserted_by: anooj
  asserted_on: 2026-09-17
  review_valid_days: 30

  #: RE-ASSERTED 2026-09-17, NOT REFRESHED. READ THIS BEFORE TOUCHING THE DATE.
  #:
  #: The position changed: we intend to publish DERIVED content - Reddit posts,
  #: independent blogs, social posts - written from what we gather. That is
  #: publishing, and it is not what this undertaking was signed against.
  #:
  #: IT DID NOT VOID, AND THAT IS WHY THIS BLOCK CHANGED BY HAND.
  #: All four conditions and all four `voided_by` clauses describe ACCESS TO
  #: THE BOARD. Writing a Reddit post from gathered evidence issues no account,
  #: publishes no board URL, removes no auth wall and takes no payment - so all
  #: four stayed literally true, `_undertaking_basis()` went on returning
  #: `internal-development-only`, and eight rulings went on passing their
  #: `use_basis` precondition. The harvest would have continued on a basis that
  #: had stopped describing our intent, with nothing in code able to notice.
  #: Diagnosed in docs/proposals/the-undertaking-does-not-cover-derived-
  #: publication.md, merged 2026-09-17 as #344.
  #:
  #: WHY RE-ASSERT RATHER THAN LET IT EXPIRE ON 2026-10-15.
  #: Expiry would have produced the same refusal, and produced it as an
  #: ACCIDENT. `_undertaking_basis()` would have returned
  #: `undertaking-expired (asserted 2026-09-15, expired 2026-10-15)` - which
  #: reads as an administrative lapse, and the obvious fix for a stale date is
  #: a fresh date. Somebody would have re-dated the block to clear a red
  #: harvest and re-asserted, in one keystroke, a basis nobody re-examined.
  #: The expiry exists to FORCE a review; letting it fire turns it into a
  #: rubber stamp.
  #:
  #: WHAT IS ASSERTED NOW, AND IT IS NARROWER THAN IT LOOKS.
  #: `derived_publication: false` says NOTHING HAS BEEN PUBLISHED YET - which
  #: is true on 2026-09-17 and is a fact about the world, not about our plans.
  #: It is not a decision against derived publication. It is the honest state
  #: while the basis that would permit it (`derived-publication-only`, proposed
  #: in docs/proposals/the-derived-publication-basis.md) is unratified and its
  #: per-source `publication` records do not exist as fields.
  #:
  #: SO THE FIRST DERIVED POST VOIDS THIS BLOCK, deliberately and by its own
  #: terms. Flip `conditions.derived_publication` to `true` and the checker
  #: refuses every ruling that names a basis - which is the correct refusal and
  #: a full harvest outage, so the replacement basis wants to be ready first.
  #: That is the ordering this re-assertion buys time for. It does not remove
  #: the decision; it stops the decision being made by a calendar.

  #: THE CLOSED SET, AND WHAT EACH MUST BE.
  #:
  #: ⚠ THIS EXISTS BECAUSE `basis.py` CARRIED ITS OWN COPY AND IGNORED THE REST.
  #:   `_undertaking_basis` looped a hardcoded four-tuple, so a key in
  #:   `conditions` that it did not recognise was never read. Measured on main
  #:   2026-09-15 (#314): an undertaking asserting
  #:   `indexed_by_search_engines: true` and `shared_with_client: true`
  #:   observed as `internal-development-only`. The block could say the board
  #:   was indexed and shared with a client and still read as internal.
  #:
  #: So the contract lives HERE and the checker reads it. Adding a condition is
  #: a two-line change to this file with a diff, rather than a code change
  #: somebody has to remember to mirror.
  #:
  #: `conditions` below must match this EXACTLY - same keys, same values. An
  #: unknown key VOIDS rather than being ignored, because somebody adding one is
  #: telling us something and being overruled by silence is the worst available
  #: response. A missing key voids too: not observed is not a pass (rule 6).
  required_conditions:
    auth_walled: true
    external_users: false
    publicly_linked: false
    monetized: false
    derived_publication: false

  #: WHAT THE PERSON ASSERTS IS TRUE. Each is a fact a person can check in ten
  #: minutes and no process can check at all.
  conditions:
    auth_walled: true        # every reachable surface requires a sign-in
    external_users: false    # nobody outside the team holds an account
    publicly_linked: false   # the URL is not published, linked or indexed
    monetized: false
    # NOTHING DERIVED FROM THE CORPUS HAS BEEN PUBLISHED OUTSIDE THE TEAM.
    # A fact about today, checkable the same way the four above are: somebody
    # looks. It is NOT a statement that we will not - see the header.
    derived_publication: false

  #: ANY ONE OF THESE VOIDS IT IMMEDIATELY, before the date. Listed rather than
  #: left to judgement, because "is it still internal?" is a question somebody
  #: answers optimistically at speed.
  voided_by:
    - an account issued to anybody outside the team
    - the URL published, linked or indexed anywhere
    - the auth wall removed or bypassed on any surface
    - any payment taken for access to the board
    # ⚠ THE FIRST FOUR ARE ALL ABOUT THE BOARD, WHICH IS HOW THIS LIST MISSED
    #   DERIVED PUBLICATION ENTIRELY. Added 2026-09-17 so the list covers what
    #   leaves the team as well as what reaches the board.
    - any derived post, article or social message published outside the team
      from material in this corpus


# ============================================================================
#  TERMS RULINGS
#
#  `live_preconditions` are re-verified on every run, before the first
#  content request. An observation that is missing is not an observation that
#  passed (rule 6) — the run is refused.
#
#  `recorded_evidence` is measured by hand, dated per source in
#  `terms_evidence`, and expires. It covers what a run cannot cheaply
#  re-observe: paywalls, login walls, whether an article path answers at all.
#
#  Values are lists of acceptable values. Anything else refuses the run.
# ============================================================================

terms_rulings:

  # ── Class A ──────────────────────────────────────────────────────────────
  - id: blog-class-a-self-hosted
    class: A
    party: publisher
    reviewed_on: 2026-09-21          # was 2026-08-14; re-read on adding nine feeds
    reviewed_by: anooj
    basis: internal-development-only
    review_valid_days: 90
    evidence_valid_days: 90
    fetch_articles: true
    summary: >-
      Self-hosted practitioner or company blog: the publication and the domain
      are the same party. A public feed served without login or payment, with
      robots.txt permitting the feed path and the article paths it links.

      RE-READ 2026-09-21, ON ADDING NINE FEEDS. EIGHTEEN FEEDS AS OF THIS
      READING, NOT NINE. The clause below fires on "adding a feed outside the
      nine assessed", and this is that reading. It covers everything added in
      this pass in one go: the three proposed in #372 and not seated by it
      (lilianweng.github.io, eugeneyan.com, jack-clark.net) and the six probed
      2026-09-21 (minimaxir.com, maggieappleton.com, swyx.io, mattrickard.com,
      www.fast.ai, thorstenball.com). #372 merged a PROPOSAL DOCUMENT and did
      not change this file; the nine rows arrive together, here.

      1 · THE DEFERRAL NOW HAS ONE CONFIRMED COUNTER-EXAMPLE AND ONE CONFIRMED
      COUNTER-COUNTER-EXAMPLE, which is why this is a re-reading and not a date
      change. The text below says terms review is deferred and that the
      condition "a source whose terms forbid this use is dropped" HAS NOT BEEN
      TESTED. It has now been tested twice, in opposite directions:

        - SUBSTACK, 2026-09-18, REFUSED. robots ALLOWED the article path and
          the feed; the Acceptable Use Policy prohibited crawling any page or
          portion of the platform and separately prohibited storing any
          significant portion of its content; the prohibition was
          UNCONDITIONAL, so internal-development-only did not reach it.
        - SWYX.IO, 2026-09-21, PERMITTED, AND IT IS THE FIRST FEED IN THIS FILE
          WITH `terms_document_read: true`. See that row. The terms document
          affirmatively permits what this project publishes, in its own words:
          "You're welcome to quote, with attribution and a link back here."

      Two things follow and neither is hypothetical. ROBOTS AND TERMS CAN
      DIVERGE IN THE PERMISSIVE-TO-RESTRICTIVE DIRECTION - Substack is a case
      where robots was not silent, was affirmative, and did not predict the
      outcome. And AN UNCONDITIONAL PROHIBITION IS NOT HELD OPEN BY THE BASIS:
      every other unresolved condition here is about publication, monetization
      or audience, which internal-development-only genuinely speaks to; a crawl
      clause contingent on nothing has nothing for the basis to hold.

      WHAT THAT DOES NOT SAY. The denominator is 2 terms documents read, of
      18 feeds. One was a PLATFORM with a drafted AUP and one a practitioner
      blog with a self-described non-binding one, and they went opposite ways -
      which is evidence that the deferral is a real risk rather than a
      formality, and NOT that the other sixteen are likely to refuse. Sixteen
      of eighteen remain `terms_document_read: false`.

      WHERE THE RISK STILL CONCENTRATES, AND IT IS CHEAP TO CLOSE. The feeds
      likely to carry a drafted terms document are the corporate three - Grab,
      Slack, Spotify - measured at 1 model-naming document each and 0 resolving
      to a single model. Reading those three closes the deferral exactly where
      an unconditional clause is plausible, and drops them at near-zero
      evidentiary cost if any refuses. A person-afternoon, and it is the next
      thing this ruling should have done to it.

      2 · WHAT "TERMS PAGE NOT FOUND" IS ALLOWED TO MEAN. Eight of the nine
      added today record it, and it is a finding about PLACES CHECKED, never
      about the site. The check is three places: the sitemap robots advertises,
      the front page's own markup, and eight conventional paths (/terms, /tos,
      /legal, /privacy, /colophon, /license, /copyright and /terms/). Zero
      matches in all three is as far as this goes without a lawyer. It is NOT
      permission, and a row's `tos_notes` may not round it to one - that would
      be rule 6 pointed outward, an absence read as a definite allowance.

      3 · THE CRITERION FOR RANKING A CANDIDATE IS NAMING, NOT
      RESOLVES-TO-ONE. Recorded in the ruling because it changed which feeds
      are here. `resolves_to_one` counts documents about exactly ONE model, so
      it penalises breadth by construction: a post naming eighteen models
      resolves to none and a post naming one resolves to one, and the richest
      source sorts last. The corpus says that ranking is backwards. Over 544
      threads that reached the extractor and whose text is readable, documents
      naming 2+ models produced at least one claim 43-47% of the time and
      documents naming 0-1 models managed 18%; and of documents that produced
      claims, 58% of those naming ten or more models produced claims about two
      or more distinct models (mean 3.25). Extraction SPLITS a comparison post.
      Measured in issue #375, `scripts/_comparison_post_extraction.py`.
      Two limits kept attached to that number, because they are the reason it
      is a ranking criterion and not a promise: the population is POST-SIEVE,
      and only 52 blog threads have ever been extracted, from three hosts. The
      widest blog post ever extracted named 14 models and produced nothing -
      a population of 1, recorded so nobody rediscovers it as a surprise.
      So `minimaxir.com` at 9/10 naming is the STRONGEST of the six seated
      today, not the weakest, and `jack-clark.net`'s 8/10-naming-0/10-resolving
      survey shape is a reason to seat it rather than a reservation about it.

      3a · A TEN-ENTRY SAMPLE OVERSTATES NAMING BY 3-5x ON ANY FEED DEEPER
      THAN TEN ENTRIES. **This is a rule for the NEXT candidate, not a fact
      about these nine.** Measure a candidate's naming rate however you like;
      do not let the sampled figure stand as the feed's rate, and do not rank
      two candidates against each other unless both figures are the same kind.

      It is a rule because it was measured, on the harvest of 2026-09-21,
      after nine feeds had already been seated on the sampled number:

          feed                     sampled        full window      error
          lilianweng.github.io      6/10  60%      6/53   11.3%    5.3x over
          eugeneyan.com             4/10  40%     21/212   9.9%    4.0x over
          swyx.io                   1/10  10%     12/432   2.8%    3.6x over
          maggieappleton.com        2/10  20%     10/142   7.0%    2.8x over
          ---------------------------------------------------------------
          minimaxir.com             9/10  90%      9/10   90.0%    exact
          jack-clark.net            8/10  80%      8/10   80.0%    exact
          mattrickard.com           0/10   0%      0/10    0.0%    exact
          www.fast.ai               1/10  10%      2/20   10.0%    exact

      THE SPLIT IS NOT ABOUT THE HOSTS AND IT IS NOT LUCK. The four that
      regressed are the four with archives deeper than ten entries. The four
      that held exactly are the ones whose whole feed IS about ten, so the
      sample WAS the population and had nothing to regress against. The
      mechanism is ordinary: a feed is newest-first, model mentions cluster in
      recent posts, and the ten most recent are therefore the densest ten the
      blog has. Nothing was measured wrongly - "6 of the 10 most recent" was
      true when written and was never "60% of the feed".

      Rule 7, landing on our own instrument: a real value answering a question
      it was not asked, which survived inspection because a spot-check of any
      one figure confirms it. THE CHECK THAT CATCHES IT NEEDS NO SUSPICION -
      ask how deep the feed is. If it is deeper than the sample, the sampled
      rate is an upper bound and should be written down as one.

      WHAT THIS DOES AND DOES NOT CHANGE ABOUT §3. The ranking stands and gets
      firmer: `minimaxir.com` at 9/10 is a FULL-POPULATION 90%, while
      `lilianweng.github.io`'s 60% is a sample that is really 11.3%. So the
      criterion picked the right feed and §3's stated reason was only half the
      reason it had. Nothing is re-seated on this; it is recorded because the
      next candidate will arrive with a ten-entry figure and somebody will
      compare it to these.

      BOTH NUMBERS STAY ON EVERY ROW, WITH THEIR DENOMINATORS. The sample is
      not deleted, because it is what the seating decision was actually made
      on and overwriting it would erase that. The population is not omitted,
      because a row carrying only the sample misleads in exactly the way this
      harvest demonstrated. See each row's `measured` block.

      4 · A FEED ROW NAMES THE HOST THAT SERVES THE ARTICLES. Seating hygiene,
      and it is a defect the moment it is got wrong rather than a preference.
      `_blog_corpus_census.py:feed_of` joins on the ARTICLE URL's hostname, so
      a row naming a redirect SOURCE harvests normally and reports every one of
      its own documents as `(unseated: ...)` - an absence we caused, which is
      rule 4 one stage before the page. Two of the six probed today redirect:
      `matt-rickard.com` 308s to `mattrickard.com` and `fast.ai` 301s to
      `www.fast.ai`. Both are seated under their TARGETS, and both targets
      serve their own robots.txt, which is the one obeyed.

      5 · THE BYLINE ARITHMETIC, IN THE RULING RATHER THAN IN A FOOTNOTE,
      because it is the cost of this pass and no per-row field shows it.
      `judge/store/cells.py:177` computes `voice_id = author_id or
      "anonymous:" + platform`, and `judge/curate/gate.py` DEDUPS BY
      `voice_id`. So every blog document with a NULL author_id is one voice,
      platform-wide, however many feeds and posts it came from.

      Three of the six seated today carry no byline at all - minimaxir.com
      (0 of 10), maggieappleton.com (0 of 142), swyx.io (0 of 432). That is
      584 declared entries at `byline_source: none`, which writes NO author
      row (correctly - "unknown, not anonymous"), and they therefore merge
      into the single `anonymous:blog` voice, with each other and with the
      already-seated unbylined feeds. They do not merely fail to corroborate.

      ⚠ AND `www.fast.ai` DOES NOT CURRENTLY BUY THE SEVEN VOICES IT LOOKS
      LIKE IT BUYS. It is 20 of 20 bylined across SEVEN distinct authors, and
      `byline_source: entry` with more than one distinct byline hits the
      `authors_per_entry_unwired` branch in `collect/adapters/blog/write.py`:
      the author rows are written and `document.author_id` is left NULL. That
      is open issue #373 - 19 orphaned rows and 31 unattributed documents
      already. Until it closes, fast.ai's seven authors are seven rows nothing
      links, and its documents land in `anonymous:blog` beside the three
      unbylined feeds. SEATED ANYWAY AND DELIBERATELY: the bylines are real in
      the feed, the defect is ours and downstream, and the feed is the reason
      to fix it. The row records this in `notes` rather than claiming 7 voices.

      Two of the nine DO produce a voice today: `mattrickard.com`, one distinct
      entry byline, which takes the single-row branch; and `thorstenball.com`,
      `feed_declared` with a declared author, the same shape simonwillison.net
      already uses. `thorstenball.com` was called a recoverable case in the
      probe write-up on the grounds that an entry-level reader misses a
      feed-level author - that was wrong about THIS pipeline, which handles
      `feed_declared` and has since the nine were seated.

      THE TRADE IS THE POINT: the most voices and the most model mentions are
      on different hosts, the board's corroboration rule counts VOICES, and of
      the nine feeds seated today exactly TWO add one. The consequence to
      watch is a capability whose evidence is loud, plentiful and
      single-voiced, which is what a corroboration rule is supposed to catch
      and cannot when the voice count is an artefact of a NULL.

      WHAT WAS ACTUALLY CHECKED, AND IT IS NOT THE TERMS. Per feed: robots.txt
      read and re-read on every run, the feed path and article paths tested
      against it, no paywall observed, no login required, feed type recorded.
      That is mechanical evidence about the SERVER's stated crawl policy.
      ONE TERMS PAGE OF EIGHTEEN HAS BEEN READ — swyx.io, 2026-09-21, and it
      permits quote with attribution and a link. Seventeen are unread, and
      eight of those were searched for in three places and not found. This
      sentence said "NO TERMS PAGE HAS BEEN READ FOR ANY OF THE NINE FEEDS"
      until the re-read above, and it is the sentence a reader checks.

      So this ruling does not say the terms permit this, and no per-feed
      `tos_notes` may say it either. It says what was observed, and it records
      that the reading which would turn observation into permission has not
      happened. TERMS REVIEW IS DEFERRED — a team decision, taken while the
      project is internal — and the deferral is written here rather than left
      as an absence somebody later reads as a clearance.

      CURRENT USE: internal development and testing. Not published, no
      external users, not monetized.

      UNRESOLVED, DELIBERATELY RECORDED:
        - No terms of service page has been read for any seeded feed. Robots
          permission and terms permission are different things from different
          documents, and only the first has been established.
        - A 404 robots.txt is the absence of a crawl policy, not consent —
          see THE 404 CAVEAT below. Where robots is silent the class A
          reading carries the whole weight, and that reading is an inference
          about a public feed rather than a permission anybody granted.
        - Retention of full article text is governed by NFR-6 and
          `document_status_ck`'s `tombstoned`: expiry is triggered here and
          respected by `judge/pages/filtered.py`, which never renders one.

      RE-REVIEW REQUIRED BEFORE: any external publication, any external user,
      any monetization, or adding a feed outside the EIGHTEEN assessed.
      (Was "the nine assessed". The count moves with every re-reading, and
      leaving it stale is how a tenth feed arrives without one.)

      Permitted under that basis: fetch the declared feed and the article URLs
      in it, one request per second or slower, robots re-checked on every
      redirect hop, conditional GET so an unchanged feed costs a 304. Published
      content is quote + attribution + link; full text is retained privately
      for verification and reprocessing and is never republished (NFR-5).
      A source whose terms forbid this use is dropped, not worked around — and
      since no terms page has been read, that condition has not been tested.

      THE 404 CAVEAT, which belongs in the ruling and not in a footnote.
      A robots.txt that 404s means "no crawl rules" and nothing whatsoever
      about terms of service. The server answered, and the answer was that
      there is no crawl policy; that is a definite value, not a missing one
      (collect/adapters/blog/robots.py). It is not permission granted by the
      publisher, because the publisher never spoke. Among the seeded feeds
      this is engineering.grab.com, whose robots.txt returned 404 on
      2026-08-14, and — added 2026-09-21 — thorstenball.com, whose robots.txt
      returned 404 on that date. It was also true of dropbox.tech, which is
      dropped for an unrelated reason. TWO OF EIGHTEEN now rest on the class
      A reading alone, and a third is adjacent: eugeneyan.com answers 200
      with a bare `Sitemap:` line and NO `User-agent` group, which is silence
      with a different status code and not "rules, everything allowed". Where robots is silent, the class A reading is
      doing all of the work, so it is the reading that has to be right: a
      public feed, no login, and no payment. NOT "no terms page forbidding
      automated retrieval" — that clause was here and is withdrawn, because no
      terms page has been read for any seeded feed and the sentence asserted the
      check that was skipped. Silence is not consent, it is only the absence of
      a refusal — and an unread terms page is not silence, it is unread.

    live_preconditions:
      robots_status: [rules, no-rules]
      feed_path_allowed: [true]
      # ⚠ ADDED 2026-09-15 WITH THE UNDERTAKING. This ruling NAMED the basis
      # and did not check it, so the same deployment refused Reddit and
      # harvested from here under the identical sentence. See
      # docs/proposals/the-undertaking-replaces-environment.md.
      use_basis: [internal-development-only]
    recorded_evidence:
      #: ⚠ WAS `article_path_allowed`, SPLIT 2026-09-17. One boolean was
      #:   carrying two different facts and only prose told them apart - see
      #:   the note above `blog-class-b-medium`. On THIS class the two agree
      #:   (robots permits AND the fetch returns 200), which is exactly why
      #:   the conflation was invisible here and load-bearing there.
      robots_allows_article_path: [true]
      paywall_observed: [false]
      login_required: [false]
      # Recorded as a fact so a machine reading `recorded_evidence` sees a
      # value rather than ABSENT — rule 6 inside the contract. Same footing as
      # arxiv, x, devto, hackernews and huggingface.
      #
      # ⚠ WAS `[false]` AND THAT WAS A GATE POINTING THE WRONG WAY, found
      #   2026-09-21 by the first row that ever set it true. `swyx.io`'s terms
      #   document was located and READ, and a permitted-values list of
      #   `[false]` would have REFUSED the only feed that did the reading this
      #   ruling keeps saying it wants. The field records whether the reading
      #   happened; it is not a verdict, and the verdict lives in `tos_notes`.
      #   Both values are acceptable and a MISSING value still refuses.
      terms_document_read: [false, true]

  # ── Class B: Medium ──────────────────────────────────────────────────────
  - id: blog-class-b-medium
    class: B
    party: platform
    platform_host: medium.com
    reviewed_on: 2026-08-14
    reviewed_by: anooj
    basis: internal-development-only
    review_valid_days: 90
    evidence_valid_days: 90

    #: FEED ONLY. Not a preference — the article path is refused, twice over.
    fetch_articles: false

    summary: >-
      Medium-hosted publication, whether served from medium.com or from a
      publisher's custom domain. Medium's robots.txt governs, and the
      publisher's does not — the publisher cannot grant what Medium withholds.

      TERMS REVIEW IS DEFERRED HERE TOO, and the distinction matters more on
      this class than on A. What was established is that MEDIUM IS THE PARTY
      SPEAKING — demonstrated by two byte-identical robots.txt files — and that
      its robots refuses the article path. Medium's terms of service have not
      been read. So the article refusal rests on robots, which is sufficient to
      refuse and would not be sufficient to permit.

      CURRENT USE: internal development and testing. Not published, no external
      users, not monetized.

      RE-REVIEW REQUIRED BEFORE: any external publication, any external user,
      any monetization, or fetching anything beyond the feed body.

      THAT THE PLATFORM IS THE PARTY SPEAKING IS DEMONSTRATED, NOT ASSERTED.
      medium.com/robots.txt and netflixtechblog.com/robots.txt were fetched
      separately on 2026-08-14. Both are 39 lines, and all 37 rule lines —
      every `User-Agent`, `Disallow` and `Allow` — are identical. Exactly one
      line differs: `Sitemap`, whose host is substituted per publication
      (`netflixtechblog.com/sitemap/sitemap.xml`). The `License` line is not
      substituted; it reads `https://medium.com/license.xml` from both hosts.
      So the one thing Medium templates for a publisher is the sitemap, and
      the licensing terms are pointedly not it. A custom domain is a skin over
      one host's rules, which is precisely why reading the publisher's terms
      would be reading the wrong document.

      THE REVIEW IS PER DOMAIN, NOT PER PUBLISHER, AND BYTE-IDENTICAL ROBOTS
      DOES NOT COLLAPSE TWO DOMAINS INTO ONE REVIEW. This is the general form
      of the netflixtechblog.com finding below, and it is the rule to carry
      forward rather than the instance.

      A robots rule is PATH-SHAPED. `Disallow: /*/*source=` needs two slashes
      before `source=`, so it reaches `/<publication>/<slug>` on medium.com and
      does not reach `/<slug>` on a custom domain. The rule text is identical
      and its effect is not, because the effect depends on the URL shape the
      domain serves — which is a property of the domain, not of the terms.
      Two publications under one platform can therefore have genuinely
      different permitted paths while quoting the same file.

      So a custom-domain mirror is a separate NFR-5 review: it names the class
      B ruling for the platform's terms, and it measures its own
      `terms_evidence` against its own URL shapes. Sharing a ruling is not
      sharing evidence. `assert_terms_reviewed` already enforces the second
      half — evidence is per source row and dated per source row — and this
      paragraph is why that is not redundant with the ruling.

      Moot for netflixtechblog.com, which is dropped from article fetching on
      other grounds anyway. It is written down for the next custom-domain
      publication with real per-post bylines, where the difference decides
      whether we may fetch the articles at all.

      ARTICLE PATHS ARE NOT PERMITTED, on two grounds observed 2026-08-14. A
      direct GET returns 403 behind Cloudflare — 3 of 3 Netflix URLs and 3 of
      3 Airbnb URLs, a 5,020 and 5,042 byte error page respectively, with no
      article body. And on medium.com itself, robots.txt disallows them.

      ⚠ THE ROBOTS GROUND HOLDS FOR ONE OF THE TWO HOSTS, NOT BOTH, and the
      first version of this ruling said otherwise. Corrected 2026-08-14 after
      measuring rather than reasoning; the correction is recorded rather than
      quietly applied, because a ruling that states a reason nobody checked is
      the exact failure this format exists to prevent, and it happened here.

      `Disallow: /*/*source=` requires two slashes before `source=`. A
      publication on medium.com is `/<publication>/<slug>`, which has two, so
      Airbnb's article links are disallowed — 5 of 6 sampled URLs. A custom
      domain is `/<slug>`, which has one, so **netflixtechblog.com's article
      links are NOT disallowed by robots** even though the host serves the
      identical 37 rule lines. On that host the 403 is the only thing stopping
      us, and the class B reading is what makes feed-only the ruling rather
      than a workaround.

      The gate now evaluates the rule. `urllib.robotparser` implements the
      1996 draft — no `*`, no `$`, and first-match-in-file-order instead of
      most-specific-match — so `/*/*source=` was read as a literal prefix,
      matched nothing, and `gate.allows()` returned True for URLs Medium
      disallows. Replaced by `collect/adapters/blog/rules.py`, which
      implements RFC 9309 §2.2.2 and §2.2.3 over the same parsed groups.
      Until that landed the 403 was what actually stopped us, and a refusal we
      happen to receive is not a rule we chose to obey.

      Consequently articles are never requested from a Medium host, and the
      403 is never worked around — no browser User-Agent, no cookie, no
      rendering service. That is NFR-5 and collect/CLAUDE.md, not a
      workaround we have not thought of yet.

      This costs nothing, because the feed carries the whole post. All ten
      entries in each publication carry `content:encoded`, median 18,722
      characters for Netflix and 15,636 for Airbnb, ending in Medium's own
      "Originally published in … on Medium" footer rather than a truncation.

      THE NAMED-BOT GROUP. Medium's robots.txt has a second group naming
      ClaudeBot, GPTBot, Bytespider, Amazonbot, Applebot-Extended,
      FacebookBot, GoogleOther and meta-externalagent, and disallows all of
      them from everything. Our User-Agent is `modelboard/0.1
      (+https://github.com/parvathibntglobal/Model-Information-Board)`, which
      matches none of those tokens, so the `User-Agent: *` group applies. If
      the harvest User-Agent is ever changed to a string containing one of
      those tokens, this ruling is void and the feeds are disallowed
      entirely — including the feed path.

      PAYWALL: recorded as unknown, deliberately, and not conditioned on. A
      403 error page cannot show a paywall either way, so we have not
      observed one and will not claim we have (rule 6). It does not need
      resolving, because we publish quote + attribution + link taken from the
      feed body Medium served us, and never the article page.

    live_preconditions:
      robots_status: [rules]
      feed_path_allowed: [true]
      # ⚠ ADDED 2026-09-15 WITH THE UNDERTAKING. This ruling NAMED the basis
      # and did not check it, so the same deployment refused Reddit and
      # harvested from here under the identical sentence. See
      # docs/proposals/the-undertaking-replaces-environment.md.
      use_basis: [internal-development-only]
    recorded_evidence:
      feed_carries_full_text: [true]
      article_fetch_refused: [true]
      login_required: [false]
      # As class A. The summary states "Medium's terms of service have not been
      # read"; this records it where a reader that is not a person can see it.
      terms_document_read: [false]

