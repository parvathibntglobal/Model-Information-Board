      legal_review_completed: [false]
    summary: |
      RULED 2026-09-09. Access is the documented public API at dev.to/api and
      never the site HTML. The search endpoint needs no credential, which is a
      fact about the route and NOT a statement about permission.

      THE RULING, IN ONE SENTENCE: dev.to proceeds on an internal-development-only
      footing, and THAT POSITION HOLDS ONLY WHILE NOTHING IS PUBLISHED EXTERNALLY
      - a quote from this platform, shown with a link, to anybody outside the
      team. See "WHAT COUNTS AS PUBLICATION" above; it is a trigger, not a launch.

      WHAT WAS ACTUALLY CHECKED, AND IT IS NOT THE TERMS. That the adapter calls
      the documented JSON API, that the search path is /articles/search, and that
      no credential is sent. That is the whole list.

      NO TERMS DOCUMENT HAS BEEN READ, and robots.txt has not been fetched for
      dev.to. Both are recorded rather than left absent, on the same footing as
      `blog-class-a-self-hosted` and `arxiv-api-terms`.

      UNRESOLVED, DELIBERATELY RECORDED:
        - Articles are USER-AUTHORED and carry per-post licences. dev.to's own
          terms and the default article licence have not been read, so whether
          short quotation is permitted per article is UNANSWERED.
        - dev.to publishes no documented rate limit for this endpoint. The
          adapter is polite by construction; that is our restraint, not their
          stated allowance, and it must not be recorded as one.

      CURRENT USE: internal development and testing. Not published, no external
      users, not monetized.
      RE-REVIEW REQUIRED BEFORE: any external publication as defined above, any
      external user, any monetization, or fetching dev.to HTML rather than the API.

  # ── Hacker News, via Algolia ──────────────────────────────────────────────
  - id: hackernews-algolia-terms
    party: platform
    platform_host: news.ycombinator.com
    reviewed_on: 2026-09-09
    reviewed_by: parvathi
    basis: internal-development-only
    review_valid_days: 90
    evidence_valid_days: 90
    fetch_articles: true
    live_preconditions:
      access_path: [api]
    recorded_evidence:
      republication_claimed: [false]
      terms_document_read: [false]
      third_party_route: [true]
      credentials_issued_by_platform: [false]
      legal_review_completed: [false]
    summary: |
      RULED 2026-09-09. Access is the Algolia-hosted HN Search API at
      hn.algolia.com/api/v1, never scraped HTML.

      TWO PARTIES, NOT ONE, AND THAT IS THE POINT OF THIS RULING. The route is a
      THIRD PARTY serving somebody else's content: Algolia operates the search
      service, Y Combinator owns Hacker News, and the comments are written by
      neither of them. So there are three sets of terms in play and this ruling
      has read NONE of them. Same shape as `reddit-via-rapidapi` and
      `x-via-rapidapi-scraper`, where the route is also not the platform, and
      recorded here for the same reason: a reader must not mistake "the API
      answered" for "the platform permitted".

      THE RULING, IN ONE SENTENCE: Hacker News proceeds on an
      internal-development-only footing, and THAT POSITION HOLDS ONLY WHILE
      NOTHING IS PUBLISHED EXTERNALLY - a quote shown with a link to anybody
      outside the team.

      WHAT WAS ACTUALLY CHECKED, AND IT IS NOT THE TERMS. That the adapter calls
      the documented Algolia endpoints, that no credential is sent, and that item
      text comes back as JSON rather than as scraped markup.

      NO TERMS DOCUMENT HAS BEEN READ - not Algolia's terms of service for the
      free HN index, not Y Combinator's, and not any statement about comment
      licensing. Nothing here settles who may quote an HN comment.

      UNRESOLVED, DELIBERATELY RECORDED:
        - Algolia serves this index as a free public service to the HN
          community. Whether OUR use is within that intent is UNANSWERED, and
          "it is unauthenticated" is not an answer to it.
        - HN comments are third-party text with no stated licence. Quotation
          rights per comment are UNANSWERED.

      CURRENT USE: internal development and testing. Not published, no external
      users, not monetized.
      RE-REVIEW REQUIRED BEFORE: any external publication as defined above, any
      external user, any monetization, or fetching news.ycombinator.com HTML.

  # ── Hugging Face ──────────────────────────────────────────────────────────
  - id: huggingface-api-terms
    party: platform
    platform_host: huggingface.co
    reviewed_on: 2026-09-09
    reviewed_by: parvathi
    basis: internal-development-only
    review_valid_days: 90
    evidence_valid_days: 90
