        - Deletion obligations against an immutable raw store, NFR-4
          (Reddit's 3.2). Surfaces in `collect/rawstore.py:evict`.
        - What the read allowance is. A property of the subscription, shared
          with Reddit, and no request settles it - the figure would come from
          the party whose figure is in doubt.

      CURRENT USE: internal development and testing. Nothing has run yet.

      RE-REVIEW REQUIRED BEFORE: any external publication as defined above,
      any external user, any monetization, a switch to a direct X key, or a
      change of `SCRAPER_PROVIDER`.
      Escalated to the MD WITH Reddit's on 2026-09-08, as one question about
      one gateway.

    # THE PROVIDER IS A PRECONDITION, NOT A DETAIL. A ruling is a reading of one
    # party's terms, and swapping `SCRAPER_PROVIDER` swaps the party - as well
    # as the response envelope the parser reads. Pinning it here means a swap
    # REFUSES at the gate rather than silently parsing nothing and reporting the
    # platform as quiet, which is rule 4 one stage earlier.
    #
    # `credential_present: [true]` is kept as a precondition and it is NOT a
    # clearance — the gate runs BEFORE the credential check in
    # `collect/adapters/x.py:harvester_for_source`, deliberately, so the answer
    # to "why can't I harvest X" is never "you need a key" when the real answer
    # is that a term has not been read.
    live_preconditions:
      access_path: [rapidapi-reseller]
      scraper_provider: [twitter241]
      credential_present: [true]
      use_basis: [internal-development-only]
    recorded_evidence:
      republication_claimed: [false]
      terms_document_read: [false]
      credentials_issued_by_platform: [false]   # the 2.8-shaped condition
      legal_review_completed: [false]


# ============================================================================
#  ENFORCEMENT — what actually notices, and what does not
#
#  WRITTEN 2026-09-08 BECAUSE AN INTERNAL-ONLY RULING THAT NOTHING ENFORCES IS
#  A NOTE, NOT A CONTROL, and three rulings in this file now rest on one.
#  Stating what is checked without stating what is not would make this file the
#  fourth instance of the shape CLAUDE.md's `assert_no_fixtures` entry has
#  already been wrong about three times: a claim about wiring, read as a
#  guarantee.
#
#  WHAT IS ENFORCED, on `reddit-via-rapidapi`, `arxiv-api-terms` and
#  `x-via-rapidapi-scraper` alike:
#
#    use_basis   re-read on every run. `observe_reddit_use`,
#                `observe_arxiv_use` and `observe_x_use` each return
#                `internal-development-only` unless `ENVIRONMENT=production`,
#                in which case `assert_terms_reviewed` refuses the source and
#                the harvest stops. That is real and it fires.
#
#  WHAT IS NOT ENFORCED, AND THE HONEST ANSWER IS NO:
#
#    ⚠  NOTHING IN THE PIPELINE WOULD NOTICE IF THE PUBLICATION CONDITION WERE
#       BREACHED. There is no check, anywhere, that observes whether a quote
#       has been shown with a link to somebody outside the team. Not a gate,
#       not a weight, not a counter. If a build were deployed tomorrow with
#       those 149 X quotes and 150 Reddit quotes in the bundle, every terms
#       assertion in this repository would still pass.
#
#  THREE REASONS IT CANNOT NOTICE, and they are structural rather than missing
#  work, which is why this is a recorded gap and not a TODO:
#
#    1. THE GATE IS ON THE FETCH PATH AND PUBLICATION IS ON THE SERVE PATH.
#       `assert_terms_reviewed` has exactly the callers CLAUDE.md's Conventions
#       list, plus one `harvester_for_source` per adapter — every one of them a
#       fetch. `judge/app.py`, `judge/gate.py` and the web bundle consult no
#       ruling and reference none. A breach therefore stops the NEXT HARVEST at
#       worst, and never the page.
#
#    2. `use_basis` OBSERVES `ENVIRONMENT`, WHICH IS A DIFFERENT FACT.
#       `observe_reddit_use` says so in its own docstring: it is a proxy that
#       catches a production deployment silently inheriting a
#       development-only ruling, and does NOT catch a staging instance that has
#       acquired external users. Publication is a property of WHO IS LOOKING.
#       No environment variable knows that.
#
#    3. THE ARTICLES DATA IS STATIC AND ALREADY BUILT. Those ten JSON files are
#       imported by `web/src/data/articles.js` into the bundle. Nothing
#       re-derives them at serve time, so there is no moment at which any code
#       could be asked to check a ruling.
#
#  SO THE CONTROL IS A PERSON, AND SAYING SO IS THE POINT. The condition is
#  honoured by whoever is about to show the board to somebody, and the only
#  thing this file contributes is that they can find out what the condition is
#  before they do it, rather than after. A reader who wanted a guard here
#  should read this as the argument for building one — the cheapest candidate is
#  a serve-path check that refuses to render a quote whose source row's ruling
#  rests on `internal-development-only`, which does not exist and is not
#  scheduled.
# ============================================================================


# ============================================================================
#  PLATFORM ROWS — the trust weights, and one row per platform.
# ============================================================================

  # ── dev.to ────────────────────────────────────────────────────────────────
  - id: devto-api-terms
    party: platform
    platform_host: dev.to
    reviewed_on: 2026-09-09
    reviewed_by: parvathi
    basis: internal-development-only
    review_valid_days: 90
