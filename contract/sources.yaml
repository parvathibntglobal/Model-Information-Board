      NOTHING HAS RUN. No X request has ever been made from this repository's
      pipeline path. The terms gate now passes, so the remaining stop is the
      credential — `RAPIDAPI_KEY`, checked after the gate and not before it.



# ============================================================================
#  SEEDED BLOG FEEDS
#
#  WHY THESE ARE HERE AND NOT ONLY IN THE TABLE
#
#  Same pattern as `seed_models.yaml` → `model_version`, and for the same
#  reason: the initial list is a decision somebody made, so it belongs
#  somewhere reviewable and diffable, and it becomes ordinary rows at runtime.
#  Every feed is a `source` row when it runs. Feeds DISCOVERED from links in
#  already-harvested content are data and are inserted into `source`
#  directly, never back into this file.
#
#  Unlike `seed_models.yaml`, this is NOT a build fixture and has no removal
#  date. `assert_no_fixtures()` does not look at `source`, and must not be
#  taught to: a seeded feed is a curation decision, not a stand-in for
#  machinery that does not exist yet.
#
#  WHY `provenance` IS ON EVERY ROW
#
#  Without it a discovered feed is indistinguishable from a vetted one, and
#  inherits a class ruling nobody made about it. That is item 20's shape — a
#  value that cannot be told apart from a reviewed one, feeding a decision
#  that gates behaviour. `provenance = 'discovered'` is what makes a feed
#  that arrived by link visible as such, and its terms ruling is its own.
#
#  IDS. `blog:<host>`, plus the publication path where the host carries more
#  than one publication (medium.com does; netflixtechblog.com does not).
#
#  EVERY MEASUREMENT IS DATED. A class ruling resting on a stale robots check
#  is the same failure as a placeholder nobody re-reads, so both
#  `terms_evidence.checked_on` and `measured.checked_on` are compared against
#  the ruling's `evidence_valid_days` at startup.
#
#  DROPBOX IS NOT HERE. dropbox.tech passed every terms and retrieval check
#  on 2026-08-14 and is dropped on data quality: its `dc:creator` is
#  cumulative, so the ten entries carry ten bylines that grow by accretion —
#  "Andrew Cheung,Binoy Dash", then that plus two more, then that plus three
#  more. That is not a coarse identity that resolves to one voice, it is
#  broken data that would resolve to ten different multi-person strings and
#  corroborate itself. Over-clustering is worse than under-clustering
#  (collect/CLAUDE.md), and this is the input that produces it.
#
#  BYLINE RESOLUTION, per Engineer 2's ruling.
#    entry          the entry carries its own byline. It wins, always.
#    feed_declared  the feed declares a single author and the entries do not
#                   dissent. The declaration stands until an entry byline
#                   disagrees with it, at which point the entry wins and the
#                   feed is flagged.
#    team           one organisational byline for every post. Collapses to
#                   one voice, not zero — a team blog is one voice, and
#                   reading it as no voice loses the evidence entirely.
#    none           no byline at either level and no organisational identity
#                   to collapse to. Stays unresolved. It is not silently
#                   assigned to the domain owner (rule 6).
# ============================================================================

