# ============================================================================
#  Tombstoned models - canonical ids the registry must NOT re-create.
#
#  SHARED. Changes go through a PR and get two eyes (contract/).
#
#  WHY THIS EXISTS. Deleting a `provenance='polled'` model_version row does not
#  remove the model: the OpenRouter poll upserts every model the catalogue
#  lists, so the next poll re-inserts it with an empty history. On 2026-09-24
#  107 of the first 140 models deleted were still in the catalogue. Without
#  this file the deletion undoes itself on the first scheduled poll.
#
#  WHAT READS IT
#    collect/ops/chain.py        poll-registry: drops these ids between
#                                parse_models and write_model_versions, and
#                                REPORTS how many it dropped (never silent)
#    scripts/load_unpolled_models.py   refuses to hand-load a tombstoned id
#
#  MATCHING IS ON THE BASE ID, after service tiers are folded in, so
#  `openai/gpt-4o:batch` is covered by `openai/gpt-4o`.
#
#  UNDOING ONE: remove its entry here (a PR), and the next poll re-inserts it
#  as a NEW row with no history. The deleted history is only in the backup
#  named below; nothing in the database remembers it.
# ============================================================================

version: "1.0"

