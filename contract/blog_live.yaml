# The blog's live pages: claim walls, "Where engineers disagree", "This week in
# models" and the daily quote quiz (judge/blog_live.py).
#
# ⚠ PROPOSED 2026-10-15 BY anooj, ON BRANCH anooj_010newdesign - NOT RATIFIED.
#   contract/ gets two eyes: this file reaches main only through a reviewed PR.
#
# THESE PAGES ARE CODE, NOT POSTS. No model writes them and nobody reviews them
# one by one: they re-render board rows that public pages already show, from
# PUBLIC SOURCES ONLY (contract/publication.yaml `withheld_from_public`),
# whatever view the deployment runs. Every figure on them is a count or a
# measured price (rule 3), and nothing here is a score.
#
# ABSENT IS NOT PERMISSIVE (rule 6, rule 12): a missing key raises. There is no
# default for any of these in code.

version: "0.1"
status: proposed
proposed_on: 2026-10-15
proposed_by: anooj

quiz:
  # How many quotes make one day's quiz. The same day gives every reader the
  # same questions, so a score can be compared.
  questions_per_day: 5
  # Quote length, in characters. Shorter rarely says enough to guess from;
  # longer is a paragraph, not a quote.
  min_chars: 60
  max_chars: 280
  # Choices shown per question, the answer included.
  options: 4

this_week:
  # How many past weeks the page offers, the current week included.
  weeks_shown: 12
  # Retirement dates shown: those falling within this many days after the
  # week ends, as the catalogue reads TODAY (we keep no history of when a date
  # was announced, so "announced this week" cannot be said).
  retiring_within_days: 56
  # The busiest models of the week, by engineers who wrote about them that week.
  models_listed: 10
