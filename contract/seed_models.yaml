    price_in: 5.00
    price_out: 25.00
    price_cached_read: 0.50
    batch_discount: 0.500
    advertised_context: 1000000
    max_output_tokens: 128000
    knowledge_cutoff: 2026-05        # "reliable knowledge cutoff", see item 17
    supports_tools: true
    supports_vision: true
    supports_caching: true
    supports_batch: true
    # supports_structured_output NOT PUBLISHED as a capability flag by Anthropic.
    aliases:
      surface: "claude opus 5"
