# ============================================================================
#  Seed models — build fixture, NOT production data
#
#  Eleven hardcoded models so work can start before the registry poller
#  exists. Replaced in week 5 by OpenRouter polling, which writes into THE
#  SAME `model_version` table — so the swap is a data-source change, not a
#  rewrite.
#
#  ┌──────────────────────────────────────────────────────────────────────┐
#  │  EVERY ROW LOADS WITH provenance: seed                               │
#  │  Production refuses to start if any seeded row is present.           │
#  │  See collect/registry/assertions.py                                  │
#  └──────────────────────────────────────────────────────────────────────┘
#
#  ────────────────────────────────────────────────────────────────────────
#  SOURCING PASS, 2026-08-13  (sign-off items 3, 4b, 5, 8, 16)
#
#  Every value below was either read off the provider's own page on
#  2026-08-13 and carries a `sources` entry, or it was NOT PUBLISHED by the
#  provider and has been REMOVED rather than left as an unsourced assertion.
#
#  Nulling shrinks this file. That is the honest outcome: FR-2 exists because
#  a populated field is a claim, and a claim with no source is worse than an
#  absence because it looks settled. Where a provider does not publish a
#  figure, the comment says so by name, since the week 5 poller will hit the
#  same wall on the same pages.
#
#  PROVIDER PAGES ONLY. Aggregators (openrouter.ai) and encyclopaedias
#  (wikipedia.org) were removed, not replaced with each other: they were the
#  reason sign-off item 6 existed.
#
#  Three models here are RETIRED and kept deliberately. The schema carries
#  `lifecycle`, `deprecation_date` and `retirement_date`, and the answer path
#  filters on `lifecycle != 'retired'`, but nothing exercised any of it. A
#  retired model has NO CURRENT PRICE rather than an unknown one, which is a
#  distinction the poller will meet constantly.
#  ────────────────────────────────────────────────────────────────────────
# ============================================================================

version: "1.1"
provenance: seed


# ----------------------------------------------------------------------------
#  SLOT ALLOCATION
#
#    2 × frontier      the reference point
#    3 × mid-tier      where runners-up come from
#    3 × budget        where the savings are
#    2 × open-weight   ◀ ONE MORE THAN BUILD-PLAN §3.6 SPECIFIES.
#                        mistral-large-3 is the live open-weight model the
#                        slot exists to test; deepseek-v3 is retained as a
#                        RETIRED open-weight, which is coverage §3.6 did not
#                        anticipate needing. Flagged rather than resolved.
#    1 × just-launched so the `just-launched` discount has something to act on
#
#  ▸ SAME-FAMILY GROUP: claude-opus-5 / claude-sonnet-5 / claude-haiku-4-5.
#    A post saying "sonnet" or "haiku" with no version must resolve at
#    specificity: family, never snapshot.
#
#  ▸ LIFECYCLE COVERAGE: mistral-large-2411, deepseek-v3 and deepseek-r1 are
#    all retired, with real deprecation and retirement dates.
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
#  WHAT `release_date` MEANS  (sign-off item 4a)
#
#  The date this version became GENERALLY AVAILABLE at its canonical id.
#  Not the preview date, not the announcement date.
#
#  It drives f_launch (frozen at extraction) and in_window, so the preview /
#  GA distinction is not cosmetic. Applying the rule moved BOTH Gemini
#  models, which sign-off item 4b did not anticipate: Flash from 2025-05-19
#  (the 05-20 I/O preview) and Pro from 2025-03-25 (its original preview),
#  both to the GA date of 2025-06-17.
#
#  ANTHROPIC PUBLISHES NO RELEASE DATES. Its deprecations page gives only
#  tentative retirement floors ("not sooner than"). Those floors sit exactly
#  one year after the dates this file used to carry, which is corroboration
#  and not a source, so the dates are removed rather than kept.
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
#  `sources.*.provider_page`  (sign-off item 6)
#
#  After the 2026-08-13 pass every remaining source IS a provider page, so
#  every entry is `true`. The field stays because the poller will add
#  third-party sources again and the distinction has to survive.
# ----------------------------------------------------------------------------

models:

