  # ════════════════════════════ JUST-LAUNCHED ═════════════════════════════
  #
  #  ⚠  SLOT 10 IS EMPTY — fill it yourself.
  #
  #  It must be a model released in the LAST 30 DAYS, and only you can know
  #  what that is. Its job is to make the launch-window discount fire:
  #
  #      f_launch = 0.45 + 0.55 × min(1, days_since_release / 21)
  #
  #  Without a genuinely recent model, that logic sits untested until a real
  #  launch happens mid-build — which is the worst time to discover it is
  #  wrong. Pick whatever shipped this month, from any provider.
  #
  # - canonical_id: <provider>/<model>
  #   provider: <provider>
  #   family: <family>
  #   display_name: <name>
  #   slot: just-launched
  #   lifecycle: ga | preview
  #   release_date: <within 30 days>
  #   ... same shape as above ...


# ----------------------------------------------------------------------------
#  CHECKLIST — before the first commit
#
#    [ ] Slot 10 filled with something released in the last 30 days
#    [ ] Every `# VERIFY` replaced with a value read off a provider page
#    [ ] Every `sources` entry has a real URL and a real date
#    [x] Same-family group present — claude opus/sonnet/haiku, plus gemini
#        pro/flash. A bare "sonnet" or "haiku" must resolve at
#        specificity: family, never snapshot
#    [x] Context-gap example present — gemini-2.5-flash
#    [x] Open-weight present — deepseek-v3, with hosted_by required in claims
#    [x] 4–5 alias variants each: enough coverage without blowing the budget
#        (10 × 5 × 12 = 600 queries per platform, ~20 min on GitHub)
#    [ ] Loader stamps provenance: seed on every row
#    [ ] assert_no_fixtures() wired into startup
#
#  Widen to 15 seeded models once the loop runs end to end — a real thread
#  becoming a verified claim becoming a published cell — and before switching
#  to OpenRouter. Ten produces thin cells, and thin cells make the publication
#  gate look broken when it is working correctly.
# ----------------------------------------------------------------------------
