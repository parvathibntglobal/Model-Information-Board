# ============================================================================
#  Seed models — build fixture, NOT production data
#
#  Ten hardcoded models so work can start before the registry poller exists.
#  Replaced in week 5 by OpenRouter polling, which writes into THE SAME
#  `model_version` table — so the swap is a data-source change, not a rewrite.
#
#  ┌──────────────────────────────────────────────────────────────────────┐
#  │  EVERY ROW LOADS WITH provenance: seed                               │
#  │  Production refuses to start if any seeded row is present.           │
#  │  See collect/registry/assertions.py                                  │
#  └──────────────────────────────────────────────────────────────────────┘
#
#  ⚠  MOST NUMBERS HERE ARE STILL UNVERIFIED. Measured, not estimated:
#
#      FR-2 coverage        40 of 130 populated fields carry a source
#      of those 40           9 cite a provider page, 31 cite a third party
#      unsourced            90 fields, nine per model: lifecycle,
#                           max_output_tokens, knowledge_cutoff,
#                           price_cached_read and the five supports_* flags
#
#  Run `python -m collect.cli registry check-sources` for the current figure.
#  The loader therefore needs `--allow-unsourced`, and will until sign-off
#  item 16 lands. That is a recorded gap, not a code defect.
#
#  Two source citations point at the WRONG MODEL (sign-off item 5):
#  deepseek-r1's prices cite a Gemini cost blog, and claude-haiku-4-5's cite
#  a Claude Opus 5 pricing blog. A citation for a different model passes the
#  coverage check while asserting nothing, which is worse than no citation.
#
#  Open each provider's pricing and model-card pages, correct the values,
#  and fill the `sources` block with the URL and the date you read it.
#  FR-2 requires that for every registry field, and it applies to seeded
#  rows too. Doing it here means the poller inherits a working pattern.
#
#  ▸ Sign-off items 5, 8 and 16 are ONE JOB. All three need somebody with
#    provider pages open, and they all touch this file. Doing them in one
#    pass costs one context switch; doing them separately costs three.
#    See docs/contract-signoff-phase1.md.
#
#  Slot 10 is filled: deepseek/deepseek-v4-flash, released 2026-07-31.
# ============================================================================

version: "1.0"
provenance: seed


# ----------------------------------------------------------------------------
#  SLOT ALLOCATION — chosen for VARIETY, not popularity.
#
#    2 × frontier      the reference point — "what you'd have picked anyway"
#    3 × mid-tier      where runners-up come from
#    3 × budget        where the savings are; the likely recommendations
#    1 × open-weight   different provider shape, different hosting story
#    1 × just-launched so the `just-launched` discount has something to act on
#
#  ▸ SAME-FAMILY GROUP: claude-opus-5 / claude-sonnet-5 / claude-haiku-4-5
#    all share family `claude`. This is the case that breaks entity
#    resolution — a post saying "sonnet" or "haiku" with no version must
#    resolve to the right tier, or attach to nothing. Three tiers of one
#    line gives that logic real work from day one.
#
#  ▸ CONTEXT-GAP EXAMPLE: gemini-2.5-flash advertises 1M and practitioners
#    report degradation well below it. Exercises the advertised-vs-reported
#    logic from week 1 instead of week 7.
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
#  WHAT `release_date` MEANS  (sign-off item 4a)
#
#  The date this version became GENERALLY AVAILABLE at its canonical id.
#  Not the preview date, not the announcement date.
#
#  It drives two things, which is why the distinction is not cosmetic:
#    - f_launch, the 21-day launch-window discount, FROZEN at extraction
#    - in_window, the trailing-window filter (contract/registry.yaml)
#
#  Where a model previewed first, record the GA date here and note the preview
#  date in a comment beside it.
#
#  STILL OPEN (item 4b): gemini-2.5-flash carries 2025-05-19 here and
#  2025-06-17 in BUILD-PLAN.md. One is preview, one is GA. Choosing between
#  them needs a provider page, and BUILD-PLAN.md is Engineer 2's file.
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
#  `sources.*.provider_page`  (sign-off item 6)
#
#  false means the value was read off a third party rather than the provider's
#  own page. Third-party prices go stale silently, so this is worth knowing at
#  a glance. It replaces a bare `#` at end of line, which carried the same
#  meaning but which no loader could read.
#
#  Derived from each URL's host against the model's own provider, NOT
#  transcribed from the old markers — transcribing would have preserved the
#  bug: gemini-2.5-flash.release_date cites en.wikipedia.org and carried no
#  marker, so it would have been recorded as a provider page.
# ----------------------------------------------------------------------------

