# ============================================================================
#  Seed models — build fixture, NOT production data
#
#  Ten hardcoded models so work can start before the registry poller exists.
#  Replaced in week 5 by OpenRouter polling, which writes into THE SAME
#  `model_version` table — so the swap is a data-source change, not a rewrite.
#
#  ┌──────────────────────────────────────────────────────────────────────┐
#  │  EVERY ROW LOADS WITH provenance: seed                                │
#  │  Production refuses to start if any seeded row is present.            │
#  │  See collect/registry/assertions.py                                   │
#  └──────────────────────────────────────────────────────────────────────┘
#
#  ⚠  VERIFY EVERY NUMBER BEFORE THE FIRST RUN
#
#  Canonical ids, families, aliases and feature flags below are reliable.
#  Every field marked `# VERIFY` is a best-known value that has NOT been
#  read off a provider page — prices in particular move without notice, and
#  a stale price silently corrupts every cost estimate and every ranking.
#
#  Open each provider's pricing and model-card pages, correct the values,
#  and fill the `sources` block with the URL and the date you read it.
#  FR-2 requires that for every registry field, and it applies to seeded
#  rows too. Doing it here means the poller inherits a working pattern.
#
#  Slot 10 is deliberately empty — only you can know what launched in the
#  last 30 days.
# ============================================================================

version: "1.0"
provenance: seed


# ----------------------------------------------------------------------------
#  SLOT ALLOCATION — chosen for VARIETY, not popularity.
#
#    2 × frontier      the reference point — "what you'd have picked anyway"
#    3 × mid-tier      where runners-up come from
#    3 × budget        where the savings are; the likely recommendations
#    1 × open-weight   different provider shape, different hosting story
#    1 × just-launched so the `just-launched` discount has something to act on
#
#  ▸ SAME-FAMILY GROUP: claude-opus-5 / claude-sonnet-5 / claude-haiku-4-5
#    all share family `claude`. This is the case that breaks entity
#    resolution — a post saying "sonnet" or "haiku" with no version must
#    resolve to the right tier, or attach to nothing. Three tiers of one
#    line gives that logic real work from day one.
#
#  ▸ CONTEXT-GAP EXAMPLE: gemini-2.5-flash advertises 1M and practitioners
#    report degradation well below it. Exercises the advertised-vs-reported
#    logic from week 1 instead of week 7.
# ----------------------------------------------------------------------------

