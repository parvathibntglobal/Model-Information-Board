# The FAQ page — from the landing demo's eleven questions, eight of them served.
#
# WHY THIS IS CONFIG AND NOT JSX. Rule 5: config lives in versioned YAML, not in
# code. An FAQ is editorial copy that changes without a deploy, gets reviewed by
# somebody who does not read React, and is served to an answer engine as
# structured data. All three of those want one reviewable file.
#
# TWO KINDS OF ANSWER HERE, AND THE DIFFERENCE MATTERS MORE THAN IT LOOKS.
#
#   basis: policy     The answer describes how the board WORKS. It is true
#                     because of how the code is built, so it is safe as static
#                     copy and stays correct until the design changes.
#
#   basis: live       The answer asserts something about MODELS - which is
#                     cheapest, which engineers report for coding. In the demo
#                     those were hand-written from demo data. In the real
#                     product they are claims about the registry and the
#                     evidence corpus, and rules 1 and 3 apply: no claim without
#                     a code-verified quote, no synthesised number on a page.
#
#                     All three of those are currently WITHHELD - see the block
#                     at the foot of this file. Serving them as "not yet
#                     established" put three shrugs on a page whose job is to
#                     explain, so they wait until the corpus can answer them.
#                     The `basis: live` path in judge/app.py stays, tested,
#                     because the next live question would otherwise be written
#                     straight onto the page with no guard on it.
#
# The alternative was to paste all eleven answers as static copy. That would put
# "$0.14 in and $0.28 out" on a live page with no row behind it, which is the
# exact failure rule 3 exists to stop - and it would be invisible, because the
# sentence reads like every other sentence on the page.

version: 1
updated: 2026-10-15
source: model-board-landing-demo.html (FAQ section, 11 questions — 8 served, 3 withheld)

# Rendered into schema.org FAQPage JSON-LD as well as onto the page. Only
# answers that are actually served get into the structured data: telling an
# answer engine something we are not telling a reader is cloaking.
schema_type: FAQPage

questions:
  # ── REWRITTEN 2026-10-15 for the public site as it now stands ───────────
  # The pages a visitor can open are the Models pages (/catalog, /reports),
  # the tools (Best AI model picker, Model specs finder, Token counter),
  # Compare and Blogs. They publish COUNTS - how many different people reported
  # a model working, failing or neither - never the posts themselves, and the
  # Board is not published. The old answers promised quotes "word for word" and
  # links to every post, and spoke of "the board"; neither is what a reader sees.
  #
  # KEYWORDS ARE MEASURED ONLY: Google Keyword Planner bands in
  # seo/excel files/model-board-seo-category-selection.xlsx, sheet "Planner
  # volumes (measured)". Each entry names the ones it carries.
  #
  # Two of the old eight are folded in rather than dropped: "is it free" into
  # the first answer, "how current" into the drift one.

  - id: not-a-leaderboard
    basis: policy
    open: true
    q: Is the Model Information Board an LLM leaderboard?
    # KEYWORDS: llm leaderboard, ai leaderboard, ai model rankings, chatbot
    # arena, llm arena, llm rankings (10K-100K each).
    a: >-
      No — it is an LLM leaderboard alternative. An AI leaderboard, an LLM arena
      such as Chatbot Arena, or a table of AI model rankings gives each model one
      score, averaged across tasks you may never run. The Model Information Board
      counts how many different engineers reported each AI model working or
      failing at the job they were doing, and shows those counts rather than one
      overall score. It is free to use, sells no model and takes no paid placement.

  - id: how-ranked
    basis: policy
    q: How do I find the best AI model for my job?
    # KEYWORDS: best ai model (10K-100K), coding agent, ai agents, rag
    # (10K-1M), best llm for coding (1K-10K).
    a: >-
      Start from the job in the Best AI model picker — a coding agent, a RAG
      pipeline, code review, AI agents — or from a capability or a model you
      already use. A model appears there only where at least 5 different people
      reported on it, and each one shows how many said it worked, how many said
      it failed and how many took no side. The words follow a fixed rule, never a
      score: *reported working* when nobody reported a failure, *mostly working*
      when working reports outnumber failures three to one, *mixed* otherwise.
      The best LLM for coding is the one engineers reported working for your
      kind of coding, not the top of a list.

  - id: where-evidence
    basis: policy
    # THE COUNT IS READ FROM contract/sources.yaml, NOT WRITTEN HERE, and on a
    # public view it follows the withheld sources (contract/publication.yaml):
    # the endpoint substitutes the real count into `{n}`. No platform names, so
    # the answer cannot contradict what a page shows (2026-10-06, Parvathi).
    q: Where do the reports come from?
    a_template: >-
      From what engineers publicly wrote about the AI models they use in real
      work, on {n} public platforms. Every statement is checked in code against
      the post it came from before it is counted, and each person is counted
      once per job however often they posted. The pages publish the counts that
      result rather than republishing the posts; the two short lines quoted on
      the home page are shown with where they were written. Where a platform was
      assessed and ruled out, the reason is published rather than hidden.
    demo_answer: >-
      Ten public platforms — arXiv, Reddit, Hacker News, dev.to, Hugging Face,
      X, TikTok, Instagram, Hashnode and WordPress. Every claim carries a
      verbatim quote, verified in code against its source, with a link back —
      and where a platform was assessed and ruled out, the reason is published
      rather than hidden.

  - id: compare-models
    basis: policy
    q: How do I compare AI models side by side?
    # KEYWORDS: ai model comparison, compare ai models, llm comparison
    # (1K-10K), claude vs gemini, opus vs sonnet (10K-100K).
    a: >-
      Open Compare and pick up to three models — Claude vs Gemini, Opus vs
      Sonnet, or any three from the Models pages. The AI model comparison lines
      up the jobs and capabilities engineers reported on for each, with the
      working, failing and neutral counts side by side, and picks no winner.
      The ones all of them were reported on get their own table, so each row is
      a count against a count; a job nobody reported for one model is left out
      for it rather than shown as a zero. Price and context window are on each
      model's own page, kept apart from the reports because they are what the
      provider advertises, not what engineers found.

  - id: price-a-prompt
    basis: policy
    q: How much will an AI model cost me to run?
    # KEYWORDS: openai api pricing, claude api pricing, gemini api pricing
    # (10K-100K), cheapest llm api (1K-10K).
    # NAMES NO MODEL: "which is cheapest" is the withheld question below; this
    # one says how to work it out, which needs no claim about any model.
    a: >-
      Paste your prompt into the Token counter. It counts the tokens in your
      browser — your text never leaves the page — and prices them as input or
      output on every model, so OpenAI API pricing, Claude API pricing and Gemini
      API pricing sit side by side for the same prompt, along with whether it
      fits each model's context window. The Model specs finder filters every
      model by context window, price, tool calling and structured output. Both
      show what providers advertise; the cheapest LLM API is only worth it if
      engineers reported it working for your job, which is what the reports are
      for.

  - id: free-and-open
    basis: policy
    # The registry has no licence column, so the demo's "names the licence
    # beside every model" stays dropped; the answer says so instead.
    q: Is there a good free, open source or local LLM?
    # KEYWORDS: open source llm, local llm, free llm api (10K-100K), best free
    # llm, best open source llm, best local llm, open weight models, self hosted
    # llm (1K-10K).
    a: >-
      Several open weight models hold up on specific jobs, and engineers report
      running some of them as a local LLM or a self hosted LLM on their own
      hardware. The best open source LLM for coding is not the one for long
      context, so look the job up rather than the model: the reports show where
      a free or local model was reported to be enough, and the Models pages list
      every model by provider and type with its advertised price, free ones
      included. Open weights and open source are different licences; where a
      licence has not been recorded, the pages say so rather than guess.
    demo_answer: >-
      Several open-weight models hold up on specific tasks. The best open source
      LLM for coding is not the one for long context, and open weights vs open
      source are different licences with different commercial terms. The board
      names the licence beside every model, and says where a local LLM is
      reported to be enough.

  - id: did-it-get-worse
    basis: policy
    q: Did Claude get worse, or is it just me?
    # KEYWORDS: model drift (1K-10K), claude opus (100K-1M).
    a: >-
      One person's experience cannot settle it, which is the whole difficulty.
      Model drift is only established when several engineers independently
      report the same change, so the reports are kept per model and dated, and
      the public record is re-read as new posts appear. A report from March sits
      beside its date rather than being folded into a running average, so a
      change shows up as newer reports saying something different.

  - id: not-discussed
    basis: policy
    q: Why is a model or a job missing, or showing no reports?
    # KEYWORDS: none forced; it explains the 5-people floor the pages state.
    a: >-
      A model is counted for a job, capability or metric only once at least 5
      different people have reported on it. Fewer is not a low score and not a
      criticism — it means not enough engineers have written about that model
      for that job yet. New releases appear on the Models pages straight away
      with their advertised specs and price, and their reports fill in as
      people use them.

# ── WITHHELD FROM THE PAGE ──────────────────────────────────────────────────
#
# `/faq` does not read this list. These three ask about MODELS rather than about
# the board, and the board cannot answer them from evidence yet - so rather than
# publishing three "not yet established" shrugs and a paragraph explaining the
# shrugs, they are off the page until there is something to say.
#
# WHAT WOULD BRING EACH ONE BACK is the condition in its `needs` line. Move the
# entry back under `questions:` when that holds; the wording is already written
# and the `basis: live` path in judge/app.py still handles it.
#
# `demo_answer` stays as the audit trail: it records what the landing mock-up
# asserted from demo data - "$0.14 in and $0.28 out", "engineers most often
# report Claude Opus 5" - and that those figures were considered and
# deliberately not shipped. Deleting these blocks would delete that record.
withheld:
  - id: best-for-coding
    needs: >-
      a coding job on the board's Jobs tab (key best_for) where a model is in the reported-working group with two or more independent reports behind it
    basis: live
    q: What is the best AI model for coding?
    claims:
      - a model most reported for multi-file refactors and long agent loops
      - a cheaper model reported at near-frontier coding quality
    # Served while nothing in the corpus supports a named model. It answers the
    # question rather than dodging it: the shape of the answer is the finding.
    unestablished_answer: >-
      It depends on the job inside the job — hard multi-file refactors, a cheap
      coding agent and a code-review pass on every pull request are three
      different purchases. The board will not name a model here until engineers
      have reported one for that specific job: it reads the public record rather
      than holding an opinion, and on coding it has not yet collected enough
      first-hand reports to name anyone. When it has, this answer will name the
      model and link to the quotes behind it.
    demo_answer: >-
      It depends on the job inside the job. For hard multi-file refactors and
      long agent loops, engineers most often report Claude Opus 5. For a cheap
      AI coding agent at near-frontier quality, DeepSeek V4 Pro; and for a
      code-review LLM running on every pull request, something cheaper again.

  - id: cheapest-per-token
    needs: >-
      at least one priced model carrying reports, so 'cheapest' can be said of a model somebody has actually used rather than of a price list
    basis: live
    q: Which AI model is cheapest per token?
    claims:
      - the cheapest input price among models with enough first-hand reports to rank
    # The registry HAS prices, so this one can be answered the moment any model
    # carries reports. `cheapest_priced` is computed by the endpoint from
    # `model_version.price_in` - a measured figure, not a synthesised one - and
    # is only offered where that model also has reports behind it.
    unestablished_answer: >-
      The registry knows what every provider charges, and the board can sort by
      it — but "cheapest" on its own is not an answer worth giving. The cheapest
      LLM API is not the same as the cheapest one that works, so the board only
      names a cheapest model among those with enough first-hand reports to rank,
      and it does not have those reports yet. Until then the price column is
      advertised rates, honestly labelled as such.
    demo_answer: >-
      Among models with enough first-hand reports to rank, DeepSeek V4 Flash at
      $0.14 in and $0.28 out. The cheapest LLM API is not the same as the
      cheapest one that works, which is why every price sits beside the
      capability engineers vouch for at that price.

  - id: swe-bench-saturated
    needs: >-
      benchmark headroom figures in the corpus, published by somebody with their working - the board computes no benchmark standing of its own
    basis: live
    q: Is SWE-bench saturated?
    claims:
      - how much headroom is left on SWE-bench
      - that a two-point MMLU-Pro difference has stopped meaning anything
    unestablished_answer: >-
      Saturation is a claim about a benchmark's remaining headroom, and the
      board only makes it from figures somebody published with their working. It
      does not yet hold benchmark-headroom data, so it will not tell you either
      way — what it will do, once it does, is publish the caveat beside the
      number rather than under it.
    demo_answer: >-
      Not yet — the board publishes how much headroom is left. MMLU-Pro is the
      one where a two-point difference has stopped meaning anything, and the
      board publishes that caveat beside the number rather than under it.

