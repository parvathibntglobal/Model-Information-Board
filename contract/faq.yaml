# The FAQ page — from the landing demo's eleven questions, eight of them served.
#
# WHY THIS IS CONFIG AND NOT JSX. Rule 5: config lives in versioned YAML, not in
# code. An FAQ is editorial copy that changes without a deploy, gets reviewed by
# somebody who does not read React, and is served to an answer engine as
# structured data. All three of those want one reviewable file.
#
# TWO KINDS OF ANSWER HERE, AND THE DIFFERENCE MATTERS MORE THAN IT LOOKS.
#
#   basis: policy     The answer describes how the board WORKS. It is true
#                     because of how the code is built, so it is safe as static
#                     copy and stays correct until the design changes.
#
#   basis: live       The answer asserts something about MODELS - which is
#                     cheapest, which engineers report for coding. In the demo
#                     those were hand-written from demo data. In the real
#                     product they are claims about the registry and the
#                     evidence corpus, and rules 1 and 3 apply: no claim without
#                     a code-verified quote, no synthesised number on a page.
#
#                     All three of those are currently WITHHELD - see the block
#                     at the foot of this file. Serving them as "not yet
#                     established" put three shrugs on a page whose job is to
#                     explain, so they wait until the corpus can answer them.
#                     The `basis: live` path in judge/app.py stays, tested,
#                     because the next live question would otherwise be written
#                     straight onto the page with no guard on it.
#
# The alternative was to paste all eleven answers as static copy. That would put
# "$0.14 in and $0.28 out" on a live page with no row behind it, which is the
# exact failure rule 3 exists to stop - and it would be invisible, because the
# sentence reads like every other sentence on the page.

version: 1
updated: 2026-10-01
source: model-board-landing-demo.html (FAQ section, 11 questions — 8 served, 3 withheld)

# Rendered into schema.org FAQPage JSON-LD as well as onto the page. Only
# answers that are actually served get into the structured data: telling an
# answer engine something we are not telling a reader is cloaking.
schema_type: FAQPage

questions:
  - id: not-a-leaderboard
    basis: policy
    open: true                    # the demo had this one expanded
    q: Is the Model Information Board an LLM leaderboard?
    # REWRITTEN 2026-10-01. It said the board "ranks fit for your task by cost"
    # and "backs every recommendation" - the Ask flow, which is gone. The board
    # files reports and counts them; it recommends nothing.
    # KEYWORDS 2026-10-01: "LLM leaderboard", "AI leaderboard", "Chatbot
    # Arena", "LLM rankings" (Keyword Planner, 10K-100K each).
    a: >-
      No — it is an LLM leaderboard alternative. An AI leaderboard, a Chatbot
      Arena vote or a table of LLM rankings gives each model one score on
      curated tasks. The board keeps what engineers actually wrote about each
      AI model, word for word, files every report under the job, capability or
      metric it describes, and links it to the post it came from. It counts
      people rather than posts, and shows those counts rather than a score.

  - id: how-ranked
    basis: policy
    q: How are AI models ranked on the board?
    # REWRITTEN 2026-10-01 to say what the board does: the three groups of
    # `board_sections` (judge/store/board_entries.py), ordered without a shown
    # score. The old answer weighed cost into position, which nothing does.
    a: >-
      There is no score. On each job or capability page, AI models with at
      least one report of it working come first, ordered by how consistently
      the reports that took a side say it worked; then models whose reports are
      only neutral; then models reported only as failing. Every row shows its
      own counts, so the order can be checked, and where reports disagree the
      page shows both rather than averaging them into one number.

  - id: where-evidence
    basis: policy
    # THE COUNT IS READ FROM contract/sources.yaml, NOT WRITTEN HERE. The demo
    # said "ten public platforms" and named ten. The real contract holds eight
    # with a terms ruling, and TikTok, Instagram, Hashnode and WordPress are not
    # among them. A hardcoded ten would be a claim about coverage that the
    # sources file contradicts, so the endpoint substitutes the real platforms
    # and the real count into `{platforms}` and `{n}`.
    a_template: >-
      {n} public platforms — {platforms}. Every claim carries a verbatim quote,
      verified in code against its source, with a link back — and where a
      platform was assessed and ruled out, the reason is published rather than
      hidden.
    q: Where does the evidence come from?
    demo_answer: >-
      Ten public platforms — arXiv, Reddit, Hacker News, dev.to, Hugging Face,
      X, TikTok, Instagram, Hashnode and WordPress. Every claim carries a
      verbatim quote, verified in code against its source, with a link back —
      and where a platform was assessed and ruled out, the reason is published
      rather than hidden.

  - id: free-and-open
    basis: policy
    # The demo's version named a licence beside every model. The registry has no
    # licence column, so that sentence is dropped rather than softened - see
    # `docs` note in the endpoint. Everything else here is policy and stands.
    q: Is there a good free, open-source or local LLM?
    a: >-
      Several open-weight models hold up on specific tasks, and engineers report
      running some of them as a local LLM on their own hardware. The best open
      source LLM for coding is not the one for long context, and open weights
      versus open source are different licences with different commercial
      terms. The board shows where a free or local model was reported to be
      enough — and where a licence has not been recorded, it says that rather
      than guessing at one.
    demo_answer: >-
      Several open-weight models hold up on specific tasks. The best open source
      LLM for coding is not the one for long context, and open weights vs open
      source are different licences with different commercial terms. The board
      names the licence beside every model, and says where a local LLM is
      reported to be enough.

  - id: did-it-get-worse
    basis: policy
    q: Did Claude get worse, or is it just me?
    a: >-
      Nobody can answer that from one person's experience, which is the whole
      difficulty. LLM drift is only ever established by several engineers
      reporting the same change independently, so the board collects those
      reports per model and shows the date each one landed.

  - id: how-current
    basis: policy
    q: How current is the board, and who maintains it?
    a: >-
      Models change faster than any review cycle, so the board re-reads the
      public record and dates every claim it keeps. A report from March sits
      beside its date rather than being folded into a running average — and a
      deprecated model is a date somebody has to plan around.

  - id: not-discussed
    basis: policy
    q: What does “not discussed” mean on the board?
    a: >-
      That nobody has publicly reported using that AI model for that job or
      capability yet. It is not a low score and not a criticism: a model with no
      reports is a model nobody has checked, not a model that failed.

  - id: is-it-free
    basis: policy
    q: Is the Model Information Board free to use?
    # "WITHOUT AN ACCOUNT" REMOVED 2026-10-01: every page sits behind a sign-in
    # today, so the sentence was false. Put it back when the board is public.
    a: >-
      Yes. The board publishes what engineers found and links every report to
      its source, so anything on it can be checked. It sells no model and takes
      no placement, which is why it can say when a cheaper option holds up.

# ── WITHHELD FROM THE PAGE ──────────────────────────────────────────────────
#
# `/faq` does not read this list. These three ask about MODELS rather than about
# the board, and the board cannot answer them from evidence yet - so rather than
# publishing three "not yet established" shrugs and a paragraph explaining the
# shrugs, they are off the page until there is something to say.
#
# WHAT WOULD BRING EACH ONE BACK is the condition in its `needs` line. Move the
# entry back under `questions:` when that holds; the wording is already written
# and the `basis: live` path in judge/app.py still handles it.
#
# `demo_answer` stays as the audit trail: it records what the landing mock-up
# asserted from demo data - "$0.14 in and $0.28 out", "engineers most often
# report Claude Opus 5" - and that those figures were considered and
# deliberately not shipped. Deleting these blocks would delete that record.
withheld:
  - id: best-for-coding
    needs: >-
      a coding job on the board's Jobs tab (key best_for) where a model is in the reported-working group with two or more independent reports behind it
    basis: live
    q: What is the best AI model for coding?
    claims:
      - a model most reported for multi-file refactors and long agent loops
      - a cheaper model reported at near-frontier coding quality
    # Served while nothing in the corpus supports a named model. It answers the
    # question rather than dodging it: the shape of the answer is the finding.
    unestablished_answer: >-
      It depends on the job inside the job — hard multi-file refactors, a cheap
      coding agent and a code-review pass on every pull request are three
      different purchases. The board will not name a model here until engineers
      have reported one for that specific job: it reads the public record rather
      than holding an opinion, and on coding it has not yet collected enough
      first-hand reports to name anyone. When it has, this answer will name the
      model and link to the quotes behind it.
    demo_answer: >-
      It depends on the job inside the job. For hard multi-file refactors and
      long agent loops, engineers most often report Claude Opus 5. For a cheap
      AI coding agent at near-frontier quality, DeepSeek V4 Pro; and for a
      code-review LLM running on every pull request, something cheaper again.

  - id: cheapest-per-token
    needs: >-
      at least one priced model carrying reports, so 'cheapest' can be said of a model somebody has actually used rather than of a price list
    basis: live
    q: Which AI model is cheapest per token?
    claims:
      - the cheapest input price among models with enough first-hand reports to rank
    # The registry HAS prices, so this one can be answered the moment any model
    # carries reports. `cheapest_priced` is computed by the endpoint from
    # `model_version.price_in` - a measured figure, not a synthesised one - and
    # is only offered where that model also has reports behind it.
    unestablished_answer: >-
      The registry knows what every provider charges, and the board can sort by
      it — but "cheapest" on its own is not an answer worth giving. The cheapest
      LLM API is not the same as the cheapest one that works, so the board only
      names a cheapest model among those with enough first-hand reports to rank,
      and it does not have those reports yet. Until then the price column is
      advertised rates, honestly labelled as such.
    demo_answer: >-
      Among models with enough first-hand reports to rank, DeepSeek V4 Flash at
      $0.14 in and $0.28 out. The cheapest LLM API is not the same as the
      cheapest one that works, which is why every price sits beside the
      capability engineers vouch for at that price.

  - id: swe-bench-saturated
    needs: >-
      benchmark headroom figures in the corpus, published by somebody with their working - the board computes no benchmark standing of its own
    basis: live
    q: Is SWE-bench saturated?
    claims:
      - how much headroom is left on SWE-bench
      - that a two-point MMLU-Pro difference has stopped meaning anything
    unestablished_answer: >-
      Saturation is a claim about a benchmark's remaining headroom, and the
      board only makes it from figures somebody published with their working. It
      does not yet hold benchmark-headroom data, so it will not tell you either
      way — what it will do, once it does, is publish the caveat beside the
      number rather than under it.
    demo_answer: >-
      Not yet — the board publishes how much headroom is left. MMLU-Pro is the
      one where a two-point difference has stopped meaning anything, and the
      board publishes that caveat beside the number rather than under it.

