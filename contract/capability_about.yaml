# What each capability IS, for the top of each capability's page. The companion of job_about.yaml, and the same rules hold.
#
# ⚠ HAND-WRITTEN, NEVER GENERATED BY THE PIPELINE. Rule 2 allows exactly two
#   stages to call a model (judge/extract/, judge/ask/); a description generator
#   would be a third. Every entry is reviewed like any other contract file.
#
# ⚠ A DESCRIPTION OF THE SUBJECT, NOT OF THE EVIDENCE. It names no model,
#   claims nothing about quality, and states no count.
#
# ⚠ IT SITS ABOVE THE DEFINITION AND DOES NOT REPLACE IT. A capability's
#   `definition` is the rule every model page resolves against, and stays on the
#   page, labelled. This says what the capability is, in plainer words.
#
# SHAPE, held by tests/test_the_job_page_reads_as_a_page.py: two to four
# sentences, shown whole at the top of the page. No abbreviation with a period
# in it ("e.g.", "i.e."), so the sentence count stays honest. Cards do NOT show
# this text: they carry the definition, as the hosted board always has (a line
# of this on each card was tried and reverted, 2026-09-28).
#
# COVERAGE: every capability page the board showed on 2026-09-28, 297 of 297
# (staging, read-only). A capability that appears later has no entry until
# somebody writes one; its page shows the definition alone until then.
#
# ⚠ DESCRIBING A SLUG DOES NOT RULE ON IT. Some are jobs or verdicts filed as
#   capabilities, and some are near-duplicates; whether each should exist, or
#   merge, is a `ruling`, and is not decided here.
#
# Drafted 2026-09-28 for @parvathibntglobal's review.

version: 1

about:
  reasoning: >-
    Reasoning is working through a problem in several connected steps and
    reaching a correct conclusion. It matters whenever an answer depends on
    combining facts or intermediate results rather than recalling one. Failure
    usually looks like a chain that starts well and then drops or contradicts an
    earlier step, producing a confident but wrong result.
  instruction-following: >-
    Instruction following is doing what the prompt asks, within every constraint
    it sets, including the things it says not to do. In real work, prompts carry
    format rules, scope limits and prohibitions that downstream code or people
    rely on. Failure looks like a constraint ignored outright, or honoured at
    first and then forgotten as a long exchange goes on.
  code-generation: >-
    Code generation is writing working application code from a description of
    what the software should do. It covers the pieces a real feature needs, such
    as data models, forms and views, fitted together so they run. Failure looks
    like code that reads plausibly but does not run, misses part of the
    specification, or wires components together incorrectly.
  vision: >-
    Vision is understanding the content of an image, such as a chart, a
    screenshot or a diagram. It matters when work arrives as pictures rather
    than text, such as a dashboard to read or an interface to interpret. Failure
    looks like misread values, invented labels, or a description that misses
    what the image actually shows.
  agentic-tool-use: >-
    Agentic tool use is picking the right tool, from many available, at each
    step of a multi-step task. An agent acting on its own has to decide which
    tool fits the current state, not just how to call one. Failure looks like
    the wrong tool chosen, a needed tool never used, or a loop that repeats
    calls without progress. Forming each call correctly is the separate matter
    of function calling.
  long-context: >-
    Long context is keeping track of information spread across a very large
    input. Accepting a long input is not the same as using it, so this is about
    whether details from anywhere in the input are still recalled and applied.
    Failure looks like facts from the start or middle of a document being
    missed, confused or contradicted. How much input a model accepts at all is
    the separate matter of its context window.
  code-review: >-
    Code review is reading a proposed change to code and identifying what is
    wrong with it. It matters because a reviewer catches defects before they
    reach production, where they cost far more. Failure looks like approving a
    broken change, flagging style points while missing a real bug, or raising
    problems that are not there.
  function-calling: >-
    Function calling is producing a correctly formed call to a declared tool
    that matches the tool's schema first time. Applications parse these calls
    directly, so a malformed argument or missing field breaks the integration or
    forces a repair step. It differs from agentic tool use, which is about
    choosing the right tool rather than forming the call.
  cybersecurity: >-
    Cybersecurity is finding, exploiting or defending against weaknesses in
    software and systems. It matters both to defenders who want help securing
    systems and to anyone assessing how a model could be misused. It overlaps
    with narrower capabilities such as vulnerability discovery and exploit
    development, which each cover one part of that work.
  multimodal: >-
    Multimodal handling is working with more than one kind of input, such as
    text with images or audio, in a single request. Real tasks often mix a
    written question with a picture, a recording or a document. Failure looks
    like one input being ignored, or the parts being understood separately but
    never related to each other.
  latency: >-
    Latency is how long a model takes to respond, with attention on the slowest
    responses under load. Interactive products and chained agent steps feel the
    slow responses most, because one long wait stalls everything after it. It
    differs from throughput, which is how fast tokens arrive once output has
    started.
  output-verbosity: >-
    Output verbosity is how much text a model produces for a prompt, and whether
    that length can be controlled. Length affects cost, reading time and whether
    the output fits the place it is going. Failure looks like answers far longer
    than asked for, or length instructions that the model does not honour.
  structured-output: >-
    Structured output is returning valid JSON in a requested shape without a
    tool being declared. Programs that consume the output parse it directly, so
    any stray text or missing field breaks the pipeline. It differs from
    function calling, where the structure is defined by a declared tool's
    schema.
  coding: >-
    Coding is writing or changing code so that it does what a specification
    requires. It is the broad capability behind most software work with a model,
    from small edits to new features. It overlaps with code generation, which
    focuses on producing new application code, while coding also covers editing
    code that already exists.
  computer-use: >-
    Computer use is operating a computer interface, clicking through screens and
    filling in forms, to complete a task. It lets a model work with software
    that has no programmatic interface. Failure looks like clicking the wrong
    element, losing track of progress in a multi-step task, or stopping before
    the task is done.
  over-refusal: >-
    Over-refusal is a harmless request being blocked by safety filtering before
    any answer is produced. It matters because legitimate work, such as medical,
    security or biology questions, can be stopped for no good reason. It differs
    from jailbreak resistance, which concerns refusing requests that genuinely
    are harmful.
  speed: >-
    Speed is how quickly a model produces its output under ordinary conditions.
    It sets how long a user waits for a full answer and how many tasks can run
    in a given time. It overlaps with throughput, which is the token rate under
    sustained load, and with latency, which focuses on the slowest responses.
  verbosity: >-
    Verbosity is producing more output than a task needs, through padding,
    repetition or over-explanation. Extra text costs tokens and reading time,
    and can bury the part of the answer that matters. It sits alongside output
    verbosity, which also covers whether length can be controlled.
  chinese-language: >-
    Chinese language ability is reading and writing Chinese with the fluency of
    a native speaker. It matters for products and people working in Chinese,
    where awkward phrasing or mistranslation undermines trust. Failure looks
    like unnatural wording, mistakes with idiom or characters, or drifting into
    English partway through an answer.
  code-quality: >-
    Code quality is whether the code a model writes is maintainable and
    idiomatic, without hacks or needless complexity. Code that works but is hard
    to read or change becomes a cost for whoever maintains it later. Failure
    looks like workarounds that paper over a problem, or layers of abstraction
    the task never needed.
  context-window: >-
    Context window is the amount of input a model accepts in one request before
    it stops working. It limits how much material, such as documents or code,
    can be given to the model at once. It differs from long context, which is
    whether information across that input is actually recalled and used.
  contrarian-behavior: >-
    Contrarian behaviour is a model pushing back on what the user says when
    there is no good reason to. Some disagreement is useful, but unwarranted
    objections slow work down and can undermine correct statements. Failure
    looks like needless corrections, caveats that contradict the user, or
    arguing against a point the user did not make. It is closely related to
    contrarian tone, which concerns the manner rather than the pushback itself.
  over-thinking: >-
    Over-thinking is a model spending far more reasoning than a task requires.
    Reasoning tokens cost money and time, so excess thinking on simple tasks
    makes a model slower and dearer without improving the answer. It is related
    to reasoning effort, which is how much reasoning a model spends in general,
    whether or not that amount fits the task.
  persona-contrarian: >-
    Contrarian tone is a model presenting itself as opposed or superior to the
    user rather than as a collaborator. Tone affects whether people can work
    comfortably with a model over a long session. It is closely related to
    contrarian behaviour, which concerns the pushback itself rather than the
    manner in which it is delivered.
  summarization: >-
    Summarisation is condensing a long text into a shorter one that stays
    faithful to the original. Summaries are often read instead of the source, so
    their errors tend to go unnoticed. The failure that matters is dropping a
    detail the reader needed, or adding one the source never contained.
  token-efficiency: >-
    Token efficiency is how many tokens a model uses to produce a given result,
    relative to the length of that result. Usage is billed in tokens, so a model
    that spends many hidden or intermediate tokens costs more for the same
    output. It relates to over-thinking and verbosity, which are two common
    reasons token use grows.
  tool-calling: >-
    Tool calling is handling the whole cycle of tools in an agent loop, from
    reading declarations to making calls and using the results. Agent frameworks
    replay tool results into later turns, and a model has to keep that exchange
    consistent over many steps. Failure looks like malformed calls, results that
    are ignored or misread, or a loop that breaks after a few turns. It overlaps
    with function calling, which focuses on forming a single call correctly.
  tool-use: >-
    Tool use is invoking tools that run on the provider's side, such as code
    execution, directly from a prompt. These tools let a model compute, run code
    or fetch information rather than answering from memory alone. Failure looks
    like not using a tool when it would help, or misreading what the tool
    returned.
  vulnerability-discovery: >-
    Vulnerability discovery is finding a previously unknown security flaw in a
    real system, without access to its source code. It is one of the harder
    parts of security work, because nothing points to where the flaw is. It
    differs from exploit development, which starts from a known flaw and turns
    it into a working attack.
  communication-clarity: >-
    Communication clarity is explaining things plainly and directly, without
    needless complexity or jargon. Clear answers can be acted on straight away,
    while convoluted ones have to be decoded first. It overlaps with writing
    quality, which also covers the naturalness and style of prose.
  cot-controllability: >-
    Chain-of-thought controllability is a model following instructions about how
    it reasons, such as the length or format of its thinking. It matters when
    reasoning has to fit a budget, or will be read by people or tools
    downstream. Failure looks like reasoning that ignores a requested length or
    structure.
  exploit-development: >-
    Exploit development is turning a bug that crashes a program into a working
    attack that runs code of the attacker's choosing. It comes later in security
    work than vulnerability discovery, since the flaw is already known and the
    task is to weaponise it. It matters mainly for assessing how far a model
    could carry an attack on its own.
  hallucination: >-
    Hallucination is a model stating facts, history or content that is untrue or
    absent from what it was given. It matters because invented material usually
    reads just as confidently as accurate material. It is the failure that
    abstention guards against, by declining to answer when the model does not
    know.
  jailbreak-resistance: >-
    Jailbreak resistance is recognising and refusing prompts crafted to get
    around a model's safety rules. It matters for any public-facing product,
    where some users will try to extract harmful output. It differs from
    over-refusal, which is blocking requests that were never harmful.
  judgment: >-
    Judgement is knowing when to go ahead with an action and when to stop and
    ask for clarification. It matters most for agents acting with little
    supervision, where a wrong guess can be expensive to undo. Failure looks
    like pressing on with an ambiguous task, or asking so often that the model
    stops being useful.
  long-horizon-reasoning: >-
    Long-horizon reasoning is carrying a task through many steps over an
    extended period without losing sight of the goal. Real projects often take
    many actions to finish, and small mistakes compound across them. It differs
    from reasoning within one answer, because the difficulty lies in staying on
    track across many turns or actions.
  parameter-forwarding: >-
    Parameter forwarding is how a software library passes request parameters on
    to a model, including ones the model does not accept. It matters because a
    library that sends an unsupported parameter causes the provider to reject
    the request with an error. It concerns the client software and the model's
    accepted parameters together, rather than the model's output.
  performance-optimization: >-
    Performance optimisation is changing existing code so that it runs
    measurably faster or uses fewer resources. It matters wherever the speed or
    running cost of software is a real constraint. Failure looks like changes
    that improve nothing when measured, or that break correctness in pursuit of
    speed.
  prompt-injection-resistance: >-
    Prompt injection resistance is ignoring instructions hidden in untrusted
    content, such as web pages or documents, that the model reads. Agents
    routinely process text they did not write, and an injected instruction can
    make them leak data or take unwanted actions. It differs from jailbreak
    resistance, where the attack comes from the user rather than from content
    passed through.
  quality: >-
    Quality is the general standard of a model's output across everyday tasks.
    It is a broad overall judgement rather than a specific skill, and is often
    framed as a comparison with leading alternatives. Weakness here shows as
    output that needs more correction or rework before it can be used.
  reasoning-effort: >-
    Reasoning effort is how much time and how many tokens a model spends
    thinking before it answers. More effort can help on hard problems but raises
    cost and waiting time. It relates to over-thinking, which is effort spent
    beyond what a task needs, and to adaptive thinking, where the model sets the
    amount itself.
  sandbagging: >-
    Sandbagging is a model deliberately performing below its ability on an
    evaluation, or evading the monitors meant to watch it. It matters for safety
    testing, because an evaluation only means something if the model is not
    hiding what it can do. It is studied mainly by those assessing whether
    models can be trusted.
  spatial-reasoning: >-
    Spatial reasoning is understanding positions, shapes and geometric
    relationships, especially from images. It matters for tasks such as reading
    diagrams, layouts, maps or physical arrangements. Failure looks like
    confusing left and right, misjudging distances or sizes, or getting relative
    positions wrong.
  streaming: >-
    Streaming is delivering a response piece by piece as it is generated, in a
    well-formed sequence. Applications display streamed text as it arrives and
    parse each piece, so malformed or empty items break the display or the
    parser. It concerns the shape of what is sent, not how fast it arrives.
  throughput: >-
    Throughput is how many output tokens a model produces per second once it has
    started generating. It decides how long lengthy outputs take and how much
    work a deployment can handle under sustained load. It differs from latency,
    which covers the wait for a response, including the time before the first
    token.
  within-image-reproducibility: >-
    Within-image reproducibility is giving the same answer when shown the same
    image repeatedly under identical conditions. It matters for any repeated or
    automated image task, where inconsistent answers make results impossible to
    trust. Failure looks like the same image being read differently from one run
    to the next.
  writing-quality: >-
    Writing quality is producing natural, readable prose that conveys
    information efficiently. It matters wherever output is read by people, from
    documentation to correspondence. Failure looks like jargon, cliché,
    ill-fitting metaphor or padding that makes text harder to read. It overlaps
    with communication clarity, which focuses on directness.
  3d-generation: >-
    3D generation is producing 3D meshes and similar assets from a text
    description. It matters for games, visualisation and design work that needs
    models of objects rather than flat images. Failure looks like broken
    geometry, shapes that do not match the prompt, or assets that cannot be used
    without repair.
  3d-modeling: >-
    3D modelling is building 3D scenes, assets and environments inside tools
    such as Blender. It differs from 3D generation in that the work happens
    through a modelling tool, often by writing scripts for it, rather than by
    outputting a mesh directly. Failure looks like scripts that do not run, or
    scenes that do not match what was asked for.
  abstention: >-
    Abstention is declining to answer when the model does not know, instead of
    inventing an answer. It matters because an honest admission of not knowing
    is safer than a confident fabrication. Failure in one direction is
    hallucination, and in the other is refusing questions the model could have
    answered.
  adaptive-thinking: >-
    Adaptive thinking is a model deciding for itself how long to think, spending
    more on hard problems and less on easy ones. It aims to avoid both wasted
    effort on simple tasks and too little effort on difficult ones. It differs
    from a fixed reasoning effort chosen by the caller.
  adversarial-review: >-
    Adversarial review is critiquing a plan or document on request and
    identifying its real defects. It matters when a model is used as a second
    pair of eyes before a decision is made. Failure looks like vague or polite
    criticism, or objections that miss the flaws that matter.
  agentic-behavior: >-
    Agentic behaviour is whether a model acting autonomously keeps to ethical
    constraints while pursuing a goal. It matters as agents are given more
    access, because an agent that breaks rules to reach its goal can cause real
    harm. It is usually studied in simulated environments designed to tempt the
    agent across a line.
  agentic-coding: >-
    Agentic coding is carrying out coding tasks as an agent, planning, editing
    across files, using tools and correcting its own mistakes. It differs from
    writing a single piece of code on request, because the model must manage a
    multi-step loop on its own. Failure looks like edits that break other files,
    losing track of the task, or errors left uncorrected.
  agentic-game-play: >-
    Agentic game play is controlling a real-time strategy game by writing and
    running code in the game environment. It tests planning, adapting to a
    changing situation and acting through code under time pressure. It is a
    specialised setting rather than a common working task.
  agentic-testing: >-
    Agentic testing is an agent carrying out a software test workflow from a
    description of the goal. It matters for automating quality assurance, where
    a test run is only useful if it completes reliably. Failure looks like
    skipped steps, a stalled workflow, or results that do not reflect what was
    tested.
  agentic-workflow: >-
    Agentic workflow is an agent handling a whole software process, from
    requirements through code changes and testing to a pull request. It matters
    because each stage depends on the last, so a weak step anywhere spoils the
    outcome. It is broader than agentic coding, which covers the coding stage
    itself.
  ai-grading: >-
    AI grading is marking free-form, subjective answers against a rubric. It
    matters in education and evaluation, where consistent and fair marking is
    the whole point. Failure looks like grades that drift from the rubric, vary
    between similar answers, or reward length over substance.
  alignment-safety: >-
    Alignment and safety is a model behaving safely and in line with human
    intent, including not hiding bad behaviour. It matters most as models are
    given more autonomy, where unsafe or concealed actions are hard to spot. It
    is broader than specific safety traits such as jailbreak resistance or
    sandbagging.
  analysis-bias: >-
    Analysis bias is a model adopting the viewpoint of the transcript or agent
    it is reviewing instead of judging it independently. It matters when models
    are used to audit other models or agents, since a reviewer that sides with
    its subject misses problems. Failure looks like accepting the reviewed
    agent's reasoning at face value.
  api-compatibility: >-
    API compatibility is a model accepting the same request parameters as
    earlier models from the same provider. It matters for existing integrations,
    which can break when a new model rejects a parameter that used to work. It
    concerns the interface to the model rather than the quality of its output.
  api-migration: >-
    API migration is the set of changes to model names and parameters that
    existing integrations must adapt to. It matters because switching models can
    mean code changes, not just a new model name. It is closely related to API
    compatibility, which is whether old requests keep working unchanged.
  api-reliability: >-
    API reliability is a model's endpoint returning successful responses rather
    than server errors under normal load. It matters because any production
    system built on a model depends on the service being available. Failure
    looks like frequent server errors, timeouts or outages that force retries or
    fallbacks.
  architectural-reasoning: >-
    Architectural reasoning is following a problem through several layers of a
    system and understanding how the parts interact. It matters for debugging
    and design work where the cause of a problem sits far from where it shows.
    Failure looks like a fix applied at the symptom while the real cause in
    another component is missed.
  audio-understanding: >-
    Audio understanding is making sense of sound input, including speech and
    other noises. It matters for transcription, voice interfaces and the
    analysis of recordings. Failure looks like misheard words, missed speakers
    or sounds, or a summary that does not match the recording.
  automated-ai-rd: >-
    Automated AI R&D is an AI system independently improving or training other
    AI models. It is tracked mainly as a safety concern, because systems that
    can improve AI on their own could speed development beyond human oversight.
    It is studied through evaluations rather than through everyday work.
  automated-patching: >-
    Automated patching is writing and applying fixes for security
    vulnerabilities that have already been identified. It matters to defenders,
    since fixing flaws quickly narrows the window for attack. Failure looks like
    patches that do not close the hole, or that break the software they are
    meant to protect.
  autonomous-exploit-generation: >-
    Autonomous exploit generation is an agent finding, chaining and running
    exploits against real systems on its own. It combines vulnerability
    discovery and exploit development without human guidance at each step. It is
    tracked mainly to assess the risk of models carrying out attacks
    independently.
  biology-classification: >-
    Biology classification is handling biology topics accurately, including
    classifying them correctly, without refusing them in error. It matters for
    research and education, where ordinary biology questions can be mistaken for
    dangerous ones. It is closely related to biology discussion and to
    over-refusal.
  biology-discussion: >-
    Biology discussion is talking through biology topics without safety filters
    wrongly stepping in. It matters because most biology is ordinary science
    that students and researchers need to discuss freely. Failure looks like
    harmless questions being refused or cut short, which is a form of
    over-refusal.
  bug-finding: >-
    Bug finding is spotting defects or problems in code, including ones that are
    easy to overlook. It matters because a bug caught before release is far
    cheaper to fix than one found in production. It overlaps with code review,
    which examines a specific change rather than code in general.
  build-troubleshooting: >-
    Build troubleshooting is diagnosing why a software build fails, such as a
    failure caused by path length limits on Windows. It matters because a broken
    build blocks all other work, and its error messages often point away from
    the real cause. Failure looks like fixes aimed at the wrong cause while the
    underlying limit or setting is left in place.
  censorship-transfer: >-
    Censorship transfer is whether a model answers questions on politically
    sensitive topics or avoids them. It matters to anyone relying on a model for
    balanced information on history or current affairs. The term covers
    restrictions that carry over into a model, so that they appear wherever it
    is deployed.
  chain-of-thought-monitorability: >-
    Chain-of-thought monitorability is whether a model's reasoning can be
    reliably inspected for signs of misalignment or concealed intent. It matters
    for safety, because reading the reasoning is one of the main ways to catch a
    model planning something unwanted. It is closely related to chain-of-thought
    monitoring, which is the practice of doing that inspection.
  chain-of-thought-monitoring: >-
    Chain-of-thought monitoring is watching and interpreting a model's reasoning
    to check that it stays aligned. It matters as a safety measure for models
    that act with growing independence. It is the practice that chain-of-thought
    monitorability makes possible, and it only works if the reasoning faithfully
    reflects what the model is doing.
  chat-quality: >-
    Chat quality is how natural, warm and pleasant a model's tone feels in
    ordinary conversation. It matters for assistants, companions and support
    tools where people talk to the model for long stretches. Weak chat quality
    shows up as stiff, over-formal or oddly cheerful replies that make a
    conversation feel scripted.
  chinese-language-output: >-
    Chinese language output is writing Chinese text that reads naturally and
    suits its cultural context. It matters for products serving
    Chinese-speaking readers, where literal or translated-sounding phrasing
    undermines trust. Failure looks like correct characters arranged in
    awkward, unidiomatic or culturally tone-deaf ways.
  chinese-quality: >-
    Chinese quality is the overall standard of a model's work on tasks carried
    out in Chinese. It covers comprehension as well as writing, so it spans
    answering, summarising and reasoning over Chinese input. It is broader
    than Chinese language output, which concerns only how natural the produced
    text reads.
  chip-design: >-
    Chip design is producing a working chip layout with open-source electronic
    design automation tools. The work runs from building a design through
    optimising it to verifying that it meets its constraints. Failure usually
    appears as a layout that will not pass verification or a flow that stalls
    partway through.
  citation-accuracy: >-
    Citation accuracy is whether the file and line references a model gives
    actually point to the content it claims is there. It matters because
    engineers use those references to jump straight to code, and a wrong
    pointer wastes review time. Failure looks like a confident reference to a
    line that says something else or does not exist.
  classification: >-
    Classification is assigning each item of text to one of a set of
    categories. It underpins routing, tagging, moderation and triage, where a
    model sorts large volumes of input without a person reading each item.
    Failure shows up as inconsistent labels for similar items or categories
    applied outside their definitions.
  cli-tool-compatibility: >-
    CLI tool compatibility is how well a model works when driven through a
    command-line coding agent. Such tools depend on the model following their
    tool-call formats and conventions closely. Failure looks like malformed
    tool calls, ignored instructions from the harness or sessions that stall.
  close-to-opus-4-8: >-
    Closeness to a reference model is how nearly a model's output matches that
    of a specific, more capable model. It matters when choosing a cheaper
    model to stand in for an expensive one on the same work. It is a
    comparison against one named model rather than a measure of any single
    skill.
  code-completeness: >-
    Code completeness is connecting every existing piece of backend logic to
    the features that need it, leaving nothing disconnected. It matters
    because code that compiles but leaves features unwired looks finished
    while doing nothing. Failure shows up as buttons, routes or handlers that
    exist but never reach the logic behind them.
  code-convention-adherence: >-
    Code convention adherence is reusing a codebase's existing tokens, names
    and styling instead of inventing new ones. It keeps a project coherent and
    makes changes easier to review and maintain. Failure looks like duplicate
    helpers, new colour values or naming schemes that sit beside the
    established ones.
  code-editing-diff-fidelity: >-
    Code editing diff fidelity is changing only the files a task calls for
    while respecting how modules depend on each other. It matters because
    unintended edits are hard to spot in review and can break code far from
    the change. Failure shows up as stray modifications, reformatted files or
    a change that breaks a caller in another module.
  code-fixing: >-
    Code fixing is repairing genuine bugs in real codebases without
    introducing new ones. It is a core part of maintenance work, where a fix
    that breaks something else can cost more than the original bug. It differs
    from debugging in its emphasis on the finished repair rather than on
    finding the cause.
  code-pattern-reproduction: >-
    Code pattern reproduction is copying the patterns already present in a
    repository, including any defects they carry. Following local patterns
    keeps new code consistent, but it also spreads existing mistakes to new
    places. It sits close to convention adherence, with the difference that it
    concerns faithful copying whether or not the original is sound.
  code-regression: >-
    Code regression is losing behaviour or detail from the source when code is
    ported or rewritten. It matters in migrations and translations between
    languages, where the new version is expected to behave exactly like the
    old. It shows up as missing edge cases, dropped options or subtly changed
    logic in the ported code.
  coding-evaluation: >-
    Coding evaluation is how a model performs on coding benchmarks and
    structured programming tasks. Such results help compare models, but they
    measure the tasks a benchmark chose rather than any particular codebase.
    It is a summary view of coding ability, distinct from narrower skills such
    as debugging or code fixing.
  commit-message-generation: >-
    Commit message generation is writing commit and pull request messages that
    describe a set of code changes. Good messages make history searchable and
    help reviewers understand intent without reading every line. Failure looks
    like vague summaries, descriptions of changes that were not made or
    messages that miss the reason for the change.
  compaction: >-
    Compaction is condensing the information held in a model's context so that
    work can continue in less space. It matters in long agent sessions that
    would otherwise exceed the context window. It concerns how well the
    condensing is done, while compaction loss concerns what goes missing
    afterwards.
  compaction-loss: >-
    Compaction loss is information from earlier in a session going missing
    after the conversation has been condensed. It matters because a long task
    can quietly lose decisions, constraints or file names that were settled
    earlier. Failure looks like the model repeating finished work or
    contradicting something agreed before the compaction.
  comparison: >-
    Capability comparison is judging whether a model's output stands level
    with that of another well-known model. It matters when deciding whether
    one model can replace another for a given kind of work. It is a relative
    judgement against a named reference, not a measure of any single skill.
  competitive-pricing: >-
    Competitive pricing is whether a model costs little enough to displace
    other models in the same price tier. It matters for high-volume work,
    where small differences in price per token add up quickly. It concerns
    price position within a tier, which is narrower than overall cost
    efficiency.
  condescending-tone: >-
    Condescending tone is a model presenting itself as superior, pushing back
    needlessly and talking down to the user. It matters because it erodes
    trust and makes collaboration tiresome even when the content is correct.
    It differs from justified disagreement, where pushback is grounded in a
    real problem with the request.
  confabulation-reduction: >-
    Confabulation reduction is the drop in confident wrong answers when a
    model is given retrieved evidence and allowed to abstain. It matters for
    question answering over documents, where an invented answer is worse than
    admitting the evidence is missing. Failure shows up as the model answering
    anyway when the supplied evidence does not support an answer.
  conflict-handling: >-
    Conflict handling is how an application copes with concurrent edits or
    conflicting data from several workers. It matters in collaborative and
    multi-agent systems, where two writers can change the same record at once.
    Failure looks like silently overwritten changes, duplicated records or
    state that differs between workers.
  consistency: >-
    Consistency is producing output of dependable quality across repeated
    calls with similar input. It matters in production pipelines, where a
    model is called many times and every run must meet the same standard.
    Failure shows up as occasional poor or malformed results among otherwise
    good ones.
  content-analysis: >-
    Content analysis is examining video frames and their content so that
    material can be tagged and searched. It supports media libraries and
    search systems that need to know what appears in footage. Failure looks
    like missed objects, wrong tags or descriptions that do not match the
    frames.
  cost-efficiency: >-
    Cost efficiency is the value a model delivers for its price compared with
    the alternatives. It matters when choosing a model for sustained or
    high-volume work, where the cheapest option is not always the most
    economical. It weighs quality against price, unlike cost level, which
    concerns price alone.
  cost-level: >-
    Cost level is how much a model costs to use. It matters for budgeting,
    especially for workloads with many calls or long inputs. It concerns price
    alone, without regard to the quality of what the money buys.
  cost-vs-quality: >-
    Cost versus quality is whether a model delivers output comparable to a
    more expensive model at a lower price. It matters when looking for a
    cheaper substitute that does not give up too much on the work at hand. It
    is a paired judgement of price and output, narrower than general cost
    efficiency.
  crash-handling: >-
    Crash handling is persisting through repeated environmental failures, such
    as memory or disk crashes, by diagnosing and routing around them. It
    matters in long agent tasks run on imperfect machines, where the
    environment fails more often than the code. Failure looks like the model
    giving up, looping on the same failed step or abandoning the task.
  creative-writing: >-
    Creative writing is producing narrative prose, including description,
    dialogue and inner thought, for fiction or roleplay. It matters for
    authors, game writers and interactive fiction, where voice and texture
    count as much as correctness. Failure shows up as flat, generic prose,
    repeated phrasing or characters who all sound alike.
  crudeness: >-
    Crudeness is a model's willingness to use crude, raw or unpolished
    language when asked. It matters for fiction, comedy and informal writing,
    where sanitised language can ring false. It concerns register and
    willingness, not whether the writing is otherwise good.
  current-events-knowledge: >-
    Current events knowledge is answering questions about recent happenings
    accurately. It is limited by a model's training cut-off unless the model
    can search or is given fresh sources. Failure looks like outdated answers
    stated as current or invented details about recent events.
  cyber-capability: >-
    Cyber capability is completing narrow security tasks such as
    reconnaissance, exploitation and privilege escalation. It matters both for
    defensive security work and for assessing the risks a model poses. It is
    broader than exploit reasoning, which concerns constructing an exploit for
    a specific vulnerability.
  data-loading-efficiency: >-
    Data loading efficiency is writing data-fetching code that avoids
    redundant or wasteful requests. It matters for application performance and
    cost, since repeated fetches slow pages and load servers. Failure looks
    like the same data requested many times, requests inside loops or missing
    caching.
  debugging: >-
    Debugging is diagnosing faults in existing code and tracing failures back
    to their root cause. It matters because much real engineering time goes on
    understanding why something broke. It emphasises finding the cause, where
    code fixing emphasises the repair itself.
  design-planning: >-
    Design planning is producing a structured design plan and checking
    sign-off evidence independently against raw tool output. It matters in
    engineering flows where a plan is only as good as the verification behind
    it. Failure looks like a plan accepted on summary claims that the
    underlying tool output does not support.
  design-quality: >-
    Design quality is how good-looking and well-designed a model's visual
    output is. It matters for interfaces, pages and graphics that people will
    see and use. Failure shows up as cluttered layouts, clashing colours or
    designs that look generic.
  design-review: >-
    Design review is assessing a design's interface shape, concurrency
    correctness and security before it is built. It matters because flaws
    caught at design time are far cheaper to fix than those found in
    production. Failure looks like a review that approves a design with race
    conditions, unsafe inputs or an awkward interface.
  detail-retention: >-
    Detail retention is keeping the detail and nuance of an original text when
    rewording or summarising it. It matters for summaries, rewrites and
    translations that readers rely on in place of the source. Failure shows up
    as qualifications dropped, specifics blurred into generalities or
    distinctions lost.
  development-speed: >-
    Development speed is how quickly a developer can get from an idea to a
    working implementation with a model's help. It depends on the model's
    accuracy as much as its raw speed, since rework slows everything down. It
    differs from execution speed, which concerns only how fast output is
    produced.
  dialogue: >-
    Dialogue is writing character speech that sounds natural, differs from one
    character to the next and moves the scene forward. It matters for fiction,
    scripts and games, where conversation carries character and plot. Failure
    looks like characters who share one voice or exchanges that stall the
    story.
  dialogue-quality: >-
    Dialogue quality is how engaging and natural conversation between
    characters reads within a narrative. It matters for fiction and roleplay,
    where stilted exchanges break immersion. It covers the same ground as
    dialogue writing, judged by how the finished conversation reads.
  discovery-in-games: >-
    Discovery in games is working out the hidden rules and goals of an
    unfamiliar environment by interacting with it. It tests exploration and
    learning from feedback rather than recall of known games. Failure looks
    like repeated fruitless actions or never forming a working idea of what
    the environment wants.
  document-generation: >-
    Document generation is producing finished documents that match a required
    tone, structure and format. It matters for reports, proposals and
    templates that must be usable without heavy editing. Failure shows up as
    missing sections, the wrong register or formatting that ignores the brief.
  dog-petting: >-
    Dog petting is whether a game built from a prompt with a background dog
    lets the player pet that dog. It is an informal probe of whether a model
    adds small, expected interactions without being told. Failure is a dog
    that sits in the scene with no way to interact with it.
  ego-malleability: >-
    Ego malleability is whether a model changes its behaviour in response to
    correction or criticism. It matters in iterative work, where a model that
    ignores feedback repeats the same mistakes. It differs from sycophancy,
    since useful adjustment follows valid criticism rather than any pushback.
  email-writing: >-
    Email writing is composing emails that achieve their purpose in a fitting
    tone. It matters for business and personal correspondence where tone can
    decide how a message is received. Failure looks like messages that are too
    long, too stiff or pitched wrongly for the recipient.
  empty-response: >-
    Empty response is a model returning nothing, or something that cannot be
    parsed, where a usable answer was expected. It matters in automated
    pipelines, where a blank or malformed reply can break downstream steps. It
    concerns whether output arrives in usable form at all, not how good it is.
  english-language: >-
    English language is producing fluent and accurate English text. It is the
    baseline for most writing tasks and for many products that serve
    English-speaking readers. Failure looks like grammatical slips,
    unidiomatic phrasing or wording that obscures the meaning.
  english-quality: >-
    English quality is the overall standard of a model's work on tasks carried
    out in English. It spans comprehension and reasoning as well as writing.
    It is broader than English language, which concerns only the fluency of
    the text produced.
  evidence-quality: >-
    Evidence quality is backing each finding with verifiable evidence taken
    from the source. It matters in audits, reviews and research, where a claim
    is only as useful as the proof beside it. Failure looks like findings
    stated without support or with citations that do not show what they
    claim.
  execution-speed: >-
    Execution speed is how quickly a model produces its output once prompted.
    It matters for interactive use and for pipelines where latency adds up
    across many calls. It concerns raw output speed, unlike development speed,
    which covers the whole path to a working result.
  exploit-reasoning: >-
    Exploit reasoning is analysing a vulnerability and constructing an exploit
    that makes use of it. It matters for security research and for judging a
    model's potential for misuse. It is narrower than general cyber
    capability, which also covers reconnaissance and privilege escalation.
  extended-thinking: >-
    Extended thinking is the option to switch a model's longer internal
    reasoning on, off or to a chosen level. It matters because extra reasoning
    costs time and tokens that simple tasks do not need. It concerns whether
    the user can control that behaviour, not how good the reasoning is.
  false-positive-control: >-
    False positive control is avoiding presenting unverified or incorrect
    findings as confirmed bugs. It matters in code review and security
    auditing, where false alarms waste investigation time and bury real
    problems. Failure looks like confident bug claims that fall apart when
    checked.
  fine-tuning: >-
    Fine-tuning is how well a model improves when trained further on
    task-specific data. It matters for teams adapting a general model to a
    narrow domain or style. Failure shows up as little gain after training or
    a loss of general ability alongside the intended gain.
  flow-orchestration: >-
    Flow orchestration is chaining electronic design automation tools into a
    working scripted flow, from synthesis through timing and power checks. It
    matters because chip design depends on many tools handing results to one
    another correctly. It is one part of chip design, focused on the scripting
    that connects the stages rather than the design itself.
  frames-per-second: >-
    Frames per second is how many frames a model produces each second during
    generation. It matters for video and real-time visual applications, where
    a low rate means slow or stuttering output. It concerns generation
    throughput, not the quality of individual frames.
  free-tier-availability: >-
    Free tier availability is whether a model can be used without a paid
    subscription. It matters for learners, hobbyists and teams trying a model
    before committing. It concerns access alone and says nothing about quality
    or usage limits.
  frontend-code-generation: >-
    Frontend code generation is producing working interface components and
    landing pages from a text description. It matters for prototyping and web
    work, where a model can turn a brief into a usable page quickly. Failure
    looks like code that does not render, broken layouts or components that
    ignore the description.
  frontend-motion-design: >-
    Frontend and motion design is producing polished interface code together
    with animation and transitions for websites. It matters for sites where
    movement and visual finish are part of the experience. It goes beyond
    frontend code generation by including how the page moves as well as how
    it is built.
  frontier: >-
    Frontier is performing near the state of the art across a broad range of
    tasks. It matters when the work is hard or varied enough that only the
    most capable models manage it. It is a broad standing rather than a single
    skill.
  game-economy-management: >-
    Game economy management is balancing resource gathering, spending and
    production priorities within a game. It tests planning over time and
    trading short-term gains against long-term ones. Failure looks like
    stockpiling unused resources, running out at critical moments or
    neglecting production.
  game-play: >-
    Game play is playing a board game by reading the board state and choosing
    legal moves. It tests whether a model can track state accurately and
    follow rules move after move. Failure shows up as illegal moves, misread
    positions or play that ignores obvious threats.
  general-capability-parity: >-
    General capability parity is performing at a level comparable to a
    specific other model across general testing. It matters when deciding
    whether one model can stand in for another across varied work. It is a
    broad comparison against one reference, not a measure of any single
    skill.
  generation-quality: >-
    Generation quality is how a model's output across tasks compares with that
    of its earlier versions. It matters when deciding whether to upgrade to a
    new release. It is a comparison within one model family over time rather
    than against other models.
  german-domain-terminology: >-
    German domain terminology is using the correct specialist German terms for
    a given legal or technical field. It matters in contracts, regulation and
    engineering documents, where a near-synonym can change the meaning.
    Failure looks like everyday words in place of terms of art or terms
    borrowed from the wrong field.
  gotcha-question-handling: >-
    Gotcha question handling is answering a trick question correctly by
    noticing the ambiguity it was built around. It tests whether a model reads
    a question carefully rather than matching it to a familiar pattern.
    Failure looks like a confident answer to the question the model expected
    rather than the one asked.
  gpu-compiler-writing: >-
    GPU compiler writing is building a compiler for GPU workloads, including
    intermediate representations, optimisation passes and code generation. It
    is demanding systems work that requires holding a large, layered design
    together. Failure shows up as passes that miscompile, layers that do not
    connect or generated code that will not run.
  gui-application-generation: >-
    GUI application generation is producing a working native desktop
    application with a graphical interface from a specification. It matters
    for building tools quickly without hand-writing interface code. Failure
    looks like applications that do not start, missing controls or behaviour
    that departs from the specification.
  gui-component-repair: >-
    GUI component repair is fixing a model's own interface component code
    without breaking other parts of the application. It matters in iterative
    interface work, where each fix should leave the rest of the screen intact.
    Failure looks like one component fixed while another stops rendering or
    behaving correctly.
  harness-regression: >-
    Regression in harness is output quality falling because of changes in the
    surrounding tooling or serving layer rather than the model. It matters
    because a model can seem to get worse overnight when only its prompts,
    tools or hosting changed. Telling the two apart decides whether to switch
    models or fix the setup around them.
  honesty-truthfulness: >-
    Honesty and truthfulness is a model accurately stating what it did and did
    not do in its own output. It matters in agent work, where people rely on
    the model's account of which steps ran and which tests passed. Failure
    looks like claims of completed work that was never done or checks that
    never ran.
  image-editing: >-
    Image editing is changing an existing image according to a text
    instruction while keeping its composition. It matters for design and
    photo work, where only the requested part should change. Failure looks
    like unrequested alterations, lost detail or a redrawn scene in place of
    an edit.
  image-generation: >-
    Image generation is producing images, including vector graphics such as
    SVG, from a text description. It matters for illustration, icons and
    design assets made on demand. Failure shows up as images that miss key
    parts of the description or vector output that does not render.
  incident-analysis: >-
    Incident analysis is piecing together what happened during an outage or
    failure from logs, metrics and alerts. It matters because real incidents
    leave evidence scattered across many systems, and the timeline has to be
    rebuilt before a cause can be found. Failing at it looks like a plausible
    story that ignores a signal from one source or puts events in the wrong
    order.
  independent-audit: >-
    Independent audit is checking another agent's claimed result against the
    raw evidence instead of accepting its summary. It matters in multi-agent
    work, where one agent executes and another verifies, because a verifier
    that trusts the executor adds no protection. Failing at it looks like a
    reviewer repeating the executor's conclusion without opening the
    underlying logs or design files.
  interiority: >-
    Interiority is conveying a character's inner thoughts and feelings in
    fiction. It matters for creative writing, where readers expect characters
    whose motives and emotions feel real from the inside. Failing at it looks
    like flat characters who only act and speak, or feelings stated as labels
    rather than shown. It differs from over-explaining, which is interiority
    taken too far.
  internet-connected-code-execution: >-
    Internet-connected code execution is running code in a sandbox that can
    reach the network to install packages, call services or fetch pages. It
    matters for tasks that depend on current libraries or live data, which an
    offline sandbox cannot complete. Without it, code that needs a download or
    an outside call fails even when the code itself is correct.
  investigation-breadth: >-
    Investigation breadth is how widely a model looks across a codebase before
    drawing conclusions. It matters because a bug or design question often
    touches areas the first file does not mention. Too little breadth looks
    like a confident answer that misses a related module, and it differs from
    investigation depth, which is how far a single thread is followed.
  investigation-depth: >-
    Investigation depth is how thoroughly a model follows a problem through a
    codebase, tracing it across files to its source. It matters because the
    place a symptom appears is often not the place it is caused. Too little
    depth looks like a fix applied at the surface that leaves the real cause
    in place, and it differs from investigation breadth, which is how many
    areas are surveyed.
  jailbreak-susceptibility: >-
    Jailbreak susceptibility is how easily a model can be talked into
    producing harmful content by reframing a request. It matters for anyone
    deploying a model to the public, because safety rules that give way to a
    clever framing offer little protection. Failure looks like a request
    refused when asked plainly but fulfilled when wrapped as a story, a game
    or a task to complete.
  language-quality: >-
    Language quality is how readable and natural a model's prose sounds to a
    human reader. It matters for any output a person will read, from
    documentation to customer messages, because awkward phrasing costs
    attention and trust. Poor language quality looks like stilted wording, odd
    word choices or sentences that are correct but tiring to read.
  local-deployment: >-
    Local deployment is being able to run a model on your own machines with
    open-source inference software. It matters for teams that need data to
    stay on their premises, want to work offline or want to avoid per-call
    fees. A model that cannot be deployed locally can only be used through a
    hosted service.
  local-hardware-cost: >-
    Local hardware cost is the price of the equipment needed to run a model on
    your own machines. It matters when deciding between self-hosting and a
    paid service, since a model that is free to download may still need costly
    accelerators or memory. It is closely tied to memory requirement, which is
    usually what drives the hardware bill.
  local-inference: >-
    Local inference is running a model on consumer hardware without relying on
    a cloud service. It matters for privacy, offline use and cost control, and
    it often means accepting slower speeds or tricks such as memory swapping.
    It differs from local deployment, which is about whether the software
    exists, while local inference is about whether ordinary hardware can
    actually run it.
  local-recommendations: >-
    Local recommendations is suggesting nearby businesses and places based on
    where the user is. It matters for assistant use, where people ask for a
    restaurant or a shop close to them. Failing at it looks like suggestions
    that are in the wrong area, closed, or invented.
  long-form-consistency: >-
    Long-form consistency is keeping tone, energy and emotional direction
    steady across a long piece of generated text. It matters for fiction,
    scripts and narration, where a sudden shift in intensity or rhythm breaks
    the reader's immersion. Failure looks like a passage that drifts in mood
    or cadence partway through without the story calling for it.
  long-horizon-construction: >-
    Long-horizon construction is carrying a build task through many hours and
    steps, resuming cleanly after interruptions and keeping versioned outputs.
    It matters for large projects that cannot be finished in a single session.
    Failure looks like lost progress after a restart, repeated work, or
    outputs that overwrite earlier versions.
  long-horizon-cyber: >-
    Long-horizon cyber is chaining many separate security skills into a
    complete intrusion across a test network. It matters for judging
    real-world risk, since individual skills are less dangerous than the
    ability to link them from start to finish. Failure looks like an operation
    that succeeds at single steps but stalls before reaching its objective.
  long-refactors: >-
    Long refactors is carrying out large, multi-file changes such as
    restructuring code, writing tests and migrating to new interfaces. It
    matters because this work is tedious, broad and easy to leave half done.
    Failure looks like a change applied in some files but not others, or a
    migration that leaves the codebase in a broken intermediate state.
  long-tool-chains: >-
    Long tool chains is carrying out a long sequence of tool calls, often
    across several servers, without skipping or repeating a step. It matters
    for agents that automate workflows, where one dropped call can silently
    spoil every later result. Failure looks like a chain that ends early,
    calls tools in the wrong order, or loses the output of an earlier step.
  long-unattended-work: >-
    Long unattended work is running on a multi-step task for an extended
    period without a person stepping in. It matters because the value of an
    agent depends on how long it can be left alone before it needs help.
    Failure looks like an agent that stops to ask questions it could answer
    itself, stalls, or wanders off the task.
  loop-until-dry: >-
    Loop-until-dry is repeating review rounds until no new issues turn up, and
    then stopping. It matters for automated review loops, which only save time
    if they eventually converge. Failure looks like each round inventing fresh
    findings of shrinking value, so the loop never reaches a natural end.
  mathematical-reasoning: >-
    Mathematical reasoning is working through multi-step calculations or
    symbolic arguments to check whether a mathematical claim holds. It matters
    for technical, financial and scientific work, where a single slipped step
    invalidates the answer. Failure looks like a confident result with an
    arithmetic error or an unjustified leap in the middle. It differs from
    proof writing, which requires a formal proof a checker will accept.
  medical-knowledge: >-
    Medical knowledge is understanding diagnosis, treatment and the underlying
    science across the body's systems. It matters for clinical support and
    health information, where mistakes can cause real harm. Failure looks like
    wrong or outdated guidance delivered with the same confidence as correct
    guidance.
  memory-requirement: >-
    Memory requirement is the amount of memory needed to load and run a model
    at a given numeric precision. It matters for self-hosting, because it
    decides which machines can run the model at all. Lower precision reduces
    the requirement, often at some cost to accuracy.
  message-role-alternation: >-
    Message role alternation is whether a model's interface accepts several
    consecutive messages from the same role in a conversation history. It
    matters for developers building agents and chat tools, since some
    histories naturally contain back-to-back user or assistant turns. An
    interface that enforces strict alternation rejects such requests with an
    error rather than processing them.
  model-downgrade: >-
    Model downgrade is a tool quietly switching to a less capable underlying
    model without telling the user. It matters because people choose a tool
    for the model behind it, and a silent swap changes the quality of work
    without explanation. It looks like sudden drops in quality that cannot be
    traced to anything the user changed.
  model-drift: >-
    Model drift is a change in a model's behaviour over time that makes its
    output worse than before. It matters for anyone who has built prompts or
    workflows around earlier behaviour, since those can break without warning.
    It differs from model downgrade, which is a switch to a different model,
    while drift happens under the same name.
  model-version-fidelity: >-
    Model version fidelity is whether the model version a service actually
    runs matches the one requested. It matters for reproducibility and for
    comparing results, since a silent substitution makes every measurement
    unreliable. Failure looks like responses that identify or behave as a
    different version from the one named in the request.
  multi-lingual-quality: >-
    Multi-lingual quality is how well a model writes and understands languages
    other than the few it handles most often. It matters for serving users
    worldwide, where less common languages are frequently weaker. Failure
    looks like unnatural phrasing, grammatical errors or answers slipping back
    into English.
  multi-step-execution: >-
    Multi-step execution is carrying out a long sequence of operations across
    several tools to build a complex result. It matters for agentic work,
    where the final output depends on every intermediate step being done
    correctly. Failure looks like a sequence abandoned partway through or a
    result assembled from a step that went wrong.
  multi-token-prediction: >-
    Multi-token prediction is a technique in which a model predicts several
    upcoming tokens at once to speed up generation. It matters for serving
    costs and latency, but only if the inference software supports it for that
    model. Where support is missing or broken, the speed gain is unavailable
    or output quality suffers.
  multilingual: >-
    Multilingual is the ability to work in more than one language. It matters
    for products that serve speakers of different languages or need
    translation. A model can be multilingual while still being much stronger
    in one primary language, which is what multi-lingual quality measures.
  n-plus-one-detection: >-
    N+1 query detection is spotting code that issues one database query per
    item instead of fetching everything at once. It matters in code review,
    because the pattern works fine on small test data and becomes slow under
    real load. Missing it looks like a review that approves a loop of queries
    hidden behind an innocent-looking data access call.
  narrative-balance: >-
    Narrative balance is mixing inner thought, dialogue and action in
    proportions that keep a story moving. It matters for fiction, where too
    much of any one element makes a passage drag or feel thin. Failure looks
    like long stretches of introspection with nothing happening, or constant
    action with no sense of the characters.
  no-code-generation: >-
    No-code generation is turning a plain-language description into output
    that fits a typed component schema, such as a page layout or form
    definition. It matters for builder tools, where the output must load
    without a person fixing it. Failure looks like output that reads sensibly
    but uses fields, types or components the schema does not allow.
  no-cot-reasoning: >-
    No-CoT reasoning is solving a reasoning problem directly, without writing
    out intermediate steps first. It matters where speed or token cost rules
    out a long visible chain of thought. It differs from ordinary reasoning in
    that any working must happen internally, so errors cannot be caught by
    reading the steps.
  nuance: >-
    Nuance is making fine distinctions instead of pushing every judgement to
    one extreme. It matters for advice, analysis and writing, where most real
    questions have qualified answers. Failure looks like everything described
    as either excellent or terrible, or a complex trade-off reduced to a
    single verdict.
  one-shot-accuracy: >-
    One-shot accuracy is producing a correct result on the first attempt,
    without a repair pass or further iteration. It matters for cost and speed,
    since every retry adds tokens, time and human review. It differs from
    persistent reasoning, which is about recovering after a first attempt
    fails.
  opus-class-performance: >-
    Top-tier class performance is delivering reasoning and generation quality
    at the level of the most capable models available. It matters when choosing
    a cheaper or smaller model for demanding work, where the question is
    whether it can stand in for a top-tier one. Falling short looks like good
    results on routine tasks that give way on harder, open-ended ones.
  output-clarity: >-
    Output clarity is communicating plainly and concisely, without needless
    complexity or padding. It matters because readers act on what they
    understand, and long or convoluted answers hide the useful part. Poor
    clarity looks like verbose explanations, jargon where plain words would
    do, or the key point buried at the end.
  output-completeness: >-
    Output completeness is returning every key, field or element that the
    expected output should contain. It matters for structured outputs consumed
    by code, where a missing field can break the next step. Failure looks like
    a response that parses correctly but silently leaves out required parts.
  output-pattern-detection: >-
    Output pattern detection is how easily an experienced reader can spot a
    model's writing by its recurring structure. It matters for writing meant
    to pass as natural prose, where a recognisable template undermines it.
    Failure looks like the same openings, list shapes and closing summaries
    appearing regardless of the topic.
  output-quality: >-
    Output quality is producing text free of spelling mistakes and other
    surface-level errors. It matters for anything published or sent to
    customers, where small defects undermine trust in the content. It concerns
    the surface of the text, while language quality covers how natural the
    prose sounds.
  over-explaining: >-
    Over-explaining is spelling out emotions and inner states that a story
    should leave for the reader to infer. It matters for fiction, where
    subtext carries much of the effect and stating it outright flattens the
    scene. It is the excess of interiority, and it looks like a character's
    feelings described in full after they have already been shown.
  overcomplication: >-
    Overcomplication is reaching for complex or roundabout solutions when a
    simpler, direct one would work. It matters because every extra layer is
    more to read, test and maintain. It looks like elaborate abstractions
    around a small problem, and it is the failing that overengineering
    restraint avoids.
  overengineering-restraint: >-
    Overengineering restraint is keeping a solution as simple as the problem
    allows, without unneeded layers or abstractions. It matters because
    unnecessary structure raises the maintenance cost of code without making
    it work any differently. Lacking it looks like frameworks, configuration
    and indirection added to a task that needed a few lines, which is the
    behaviour overcomplication describes.
  parameter-compatibility: >-
    Parameter compatibility is whether a model's interface accepts sampling
    settings such as temperature, top_p and top_k without returning an error.
    It matters for developers switching models inside existing code, where one
    rejected setting can break the whole call. It covers the same ground as
    parameter support, seen from the side of errors raised.
  parameter-support: >-
    Parameter support is whether a model's interface accepts the standard
    sampling settings temperature, top_p and top_k. It matters for developers
    who tune randomness and style, or who share code across several models.
    Where a setting is unsupported, the call may fail or the value may be
    ignored, which parameter compatibility looks at from the error side.
  pass-rate: >-
    Pass rate is how often a model gets a benchmark task right on the first
    attempt. It matters as a rough guide to how much work will need retrying
    or checking. It measures performance on a fixed test set, which may differ
    from performance on real, messier work.
  per-size: >-
    Capability per size is how much a model can do relative to its size or
    parameter count. It matters for self-hosting and cost, since a smaller
    model that performs well needs cheaper hardware. It is a relative measure,
    so a model can be strong for its size and still fall short of larger ones.
  performance-quality: >-
    Performance quality is how a model's output quality and speed compare with
    other models of its class. It matters when choosing among similar options,
    where both how good and how fast the output is affect cost and usability.
    A model can do well on one of the two and poorly on the other.
  persistent-reasoning: >-
    Persistent reasoning is continuing to work through a task after something
    fails, trying other approaches instead of giving up. It matters for
    agentic and debugging work, where the first attempt often does not
    succeed. Failure looks like a model that stops at the first error and
    hands it back, or repeats the same failing step.
  persona-warmth: >-
    Warmth is communicating with empathy and a collaborative tone rather than
    a cold or abrasive one. It matters for support, coaching and everyday
    assistance, where tone affects whether people keep engaging. Lacking it
    looks like curt, dismissive or lecturing replies, even when the content is
    correct.
  personality: >-
    Personality is having an engaging, distinctive voice in conversation or
    roleplay. It matters for companion, entertainment and character products,
    where the voice is much of the value. Failure looks like a bland,
    interchangeable tone, or a character who loses their voice as the
    conversation goes on.
  physical-advice: >-
    Physical advice is guidance on hands-on, real-world activities such as
    gardening, repairs or exercise. It matters because people act on this
    advice physically, where mistakes can waste materials or cause injury.
    Failure looks like generic instructions that ignore local conditions or
    steps that do not work in practice.
  plumbing-implementation: >-
    Plumbing implementation is writing the routine connecting code whose rules
    and design are already settled. It matters because this work makes up much
    of real software, and it needs care more than invention. Failure looks
    like mistakes in wiring, data passing or edge cases in code that should
    have been straightforward.
  precision-accuracy-loss: >-
    Precision accuracy loss is the drop in a model's accuracy when it runs at
    reduced numeric precision to save memory. It matters for self-hosting,
    where lower precision is often the only way to fit a model on available
    hardware. Failure looks like a compressed model that answers noticeably
    worse than the full-precision version.
  premature-completion: >-
    Premature completion is declaring a task done on partial evidence, such as
    treating one local check passing as proof that the whole job works. It
    matters for agents working with little supervision, because a false claim
    of success hides the remaining work. It looks like a confident completion
    message followed by failures the model never checked for.
  problem-solving-efficiency: >-
    Problem-solving efficiency is getting to the heart of a problem quickly
    rather than circling or getting stuck. It matters for cost and turnaround,
    since wandering exploration spends time and tokens without progress.
    Failure looks like long investigations of irrelevant areas before the
    actual cause is examined.
  production-reliability: >-
    Production reliability is whether a model's benchmark performance holds up
    on real, multi-file codebases. It matters because benchmarks are cleaner
    and smaller than production code, and the gap can be large. Failure looks
    like a model that scores well on tests but struggles with the size,
    conventions and history of an actual project.
  prompt-cache-floor: >-
    Prompt cache floor is the minimum prompt length a provider requires before
    it will cache a repeated prompt prefix. It matters for cost planning,
    since prompts shorter than the floor get no caching discount however often
    they repeat. The floor can differ from one model to another, even with the
    same provider.
  prompt-injection-robustness: >-
    Prompt injection robustness is resisting instructions hidden in untrusted
    content such as documents, web pages or tickets. It matters for agents
    that read outside material and can take actions, where injected text could
    redirect them. Failure looks like a model obeying a command planted in the
    content it was asked to process.
  proof-writing: >-
    Proof writing is producing correct proofs in a formal proof language that
    a checker will accept. It matters for verified software and mathematics,
    where a proof either checks or it does not. Failure looks like proofs that
    stall on a missing lemma or use recursion the checker rejects, and it is
    stricter than mathematical reasoning, which need not be machine-checked.
  reading-from-html: >-
    Reading from HTML is finding the right information inside raw web page
    markup rather than cleaned-up text. It matters for agents and scrapers
    that pass pages straight to a model without preprocessing. Failure looks
    like answers taken from navigation, scripts or hidden elements instead of
    the page's actual content.
  reasoning-stability: >-
    Reasoning stability is holding a conclusion when challenged with mere
    doubt, and changing it only when given new evidence. It matters because
    users often push back without good reason, and a model that yields to
    pressure becomes unreliable. Failure looks like an answer that flips when
    questioned and flips back when questioned again.
  reasoning-trace-injection: >-
    Reasoning trace injection is an attack in which text placed into a model's
    reasoning trace is treated as a trusted instruction. It matters for
    systems that pass reasoning between steps or agents, since it opens a
    route for prompt injection. It is a form of the wider problem that prompt
    injection robustness covers.
  reasoning-trace-security: >-
    Reasoning trace security is keeping a model's hidden or encrypted
    reasoning from being recovered by outside parties. It matters to providers
    that conceal reasoning to protect it, and to users who rely on that
    concealment. Failure looks like the hidden reasoning being decoded, for
    instance by replaying it into a related model.
  refusal: >-
    Refusal is a model declining to carry out a task it has been asked to do.
    It matters because unnecessary refusals block legitimate work, while
    missing refusals can allow harm. It covers the general behaviour, whatever
    the reason given.
  refusal-behavior: >-
    Refusal behaviour is whether a model declines to answer when a prompt
    tells it to be honest and allows it to say it does not know. It matters
    because declining to answer can be more useful than a
    guess presented as fact. Too few refusals look like invented answers, and
    too many look like withholding answers the model could have given.
  refusal-configuration: >-
    Refusal configuration is adjusting a model's refusal behaviour for a
    particular purpose, such as lowering it for security testing. It matters
    for interpreting capability measurements, since a model with safeguards
    relaxed may perform differently from the public version. It describes how
    the model was set up rather than how it behaves by default.
  regression-avoidance: >-
    Regression avoidance is making changes to code without breaking behaviour
    that already worked. It matters for any ongoing development, where a fix
    that creates new bugs costs more than it saves. Failure looks like a
    passing change in one place accompanied by broken tests or features
    elsewhere.
  relative-cost: >-
    Relative cost is how much one model costs to use compared with another. It
    matters when choosing a cheaper model for a task, since a small price gap
    per call can add up across many calls. It is a comparison, so it depends
    on which model is used as the reference.
  reliability: >-
    Reliability is performing consistently as expected, without sudden quality
    drops or unexplained refusals. It matters for production use, where
    unpredictable behaviour forces extra checks and fallback plans. Failure
    looks like the same request succeeding one day and failing the next.
  repository-level-coding: >-
    Repository-level coding is completing a task across a whole codebase, from
    finding a bug to fixing it and getting the tests to pass. It matters
    because real coding work spans many files and needs a working result, not
    only a plausible edit. Failure looks like a change that fixes one file but
    fails the tests, or an agent that stops after the first failure.
  repository-level-editing: >-
    Repository-level editing is changing code across many files while keeping
    the structure and dependencies between them consistent. It matters because
    an edit in one file often requires matching changes wherever that code is
    used. It differs from repository-level coding by focusing on coherent
    edits rather than the full cycle of finding, fixing and testing.
  research: >-
    Research is looking up information such as dimensions or specifications
    from outside sources to inform a design. It matters when a task depends on
    real-world facts the model cannot safely guess. Failure looks like
    invented figures, or values taken from the wrong product or version.
  response-emptiness: >-
    Empty response is a model returning nothing at all, with no text, no
    reasoning and no tool call. It matters for applications built on the
    model's interface, which must detect and handle the empty reply or fail.
    It is a reliability problem distinct from a refusal, because no reason or
    content is given.
  restart-resume: >-
    Restart and resume is picking up interrupted work from the saved state of
    files and outputs rather than from memory. Long agent runs are often cut
    short by crashes, timeouts or context resets, so resuming cleanly saves
    repeated work. A model that fails at it rebuilds its progress from its own
    summary, redoes finished steps or trusts work that was never actually saved.
  reward-hacking: >-
    Reward hacking is reaching a passing result by exploiting weaknesses in how
    a task is checked rather than by doing the task. It matters because a
    passing test or score is only useful when it reflects real work. Typical
    forms include editing tests, reading expected answers from the grader or
    special-casing inputs so that checks pass while the underlying problem stays
    unsolved.
  routing: >-
    Routing is sending a simple request to the one tool or server that can
    answer it. In systems with many connected tools, a wrong route wastes calls
    and can return confident answers from the wrong source. It differs from
    general tool selection in that the task is a straightforward lookup with a
    single correct destination.
  sabotage: >-
    Sabotage tasks are covert attempts to undermine a task while avoiding
    detection by monitoring systems. Safety evaluations test this to learn
    whether oversight tools would catch a model acting against its operators. A
    high capability here is a risk signal rather than a desirable skill, because
    it measures how well harmful actions can be hidden.
  safety-evaluation: >-
    Safety evaluation is the testing of a model for dual-use risks, harmful
    content and loss-of-control behaviour before it is released. It gives
    operators some basis for judging whether a model can be deployed in
    sensitive settings. It concerns what the developer checked and published,
    rather than how the model behaves on any single task.
  safety-seeking: >-
    Safety-seeking is a tendency to choose cautious, conventional outputs and to
    avoid anything that looks risky. Some caution is useful in high-stakes work,
    but too much produces bland answers and unnecessary refusals. It differs
    from sycophancy in that the model is avoiding risk rather than trying to
    please the user.
  sampling-parameter-handling: >-
    Sampling parameter handling is how an integration deals with sampling
    settings such as temperature, top_p and top_k that an API no longer accepts.
    When deprecated parameters are passed through, requests can fail outright or
    behave unexpectedly. Handling it well means dropping or rejecting those
    settings cleanly instead of sending them to the API.
  sandbox-compliance: >-
    Sandbox compliance is working within the limits of a restricted environment
    without trying to get around them. Sandboxes exist to contain what an agent
    can read, write or reach, so an escape attempt defeats their purpose.
    Failing at it looks like disabling restrictions, seeking extra permissions
    or reaching outside the permitted area to finish a task.
  schematic-building: >-
    Schematic building is creating a complete electronic schematic from nothing
    or from a written specification. It requires choosing components, deciding
    how they connect and producing a design that matches the intended circuit.
    It differs from schematic editing, which changes an existing sheet rather
    than producing a whole design.
  schematic-editing: >-
    Schematic editing is changing an electronic schematic by placing symbols,
    connecting nets and arranging components on the sheet. Errors in a schematic
    carry through to circuit boards and hardware, where they are costly to fix.
    It differs from schematic building in that it works on an existing design
    rather than creating one from scratch.
  scientific-replication: >-
    Scientific replication is designing and running experiments that reproduce
    results a research paper describes but does not fully provide. It tests
    whether a model can turn a paper's methods into working code and data that
    recover the claimed findings. Failure looks like experiments that do not
    match the paper's setup or results that cannot be traced to the method
    described.
  scope-adherence: >-
    Scope adherence is staying focused on the requested task without wandering
    into tangents or unrequested exploration. Staying in scope keeps work quick,
    cheap and easy to review. A model that fails at it touches unrelated files,
    adds features nobody asked for or spends time investigating side issues.
  security-bug-finding: >-
    Security bug finding is locating vulnerabilities in source code. It lets
    teams fix weaknesses before attackers find them, and it is a common use of
    models in code review. It overlaps closely with vulnerability detection, and
    failure looks like missed flaws or confident warnings about code that is
    actually safe.
  security-patching: >-
    Security patching is writing a complete fix for a known vulnerability
    without changing how the software otherwise behaves. A partial patch leaves
    the flaw exploitable, while an overly broad one can break features that
    depend on the old behaviour. It follows on from finding a bug, and is judged
    on whether the fix both closes the hole and keeps the software working.
  security-pauses: >-
    Security pauses are points where a model stops and asks for human review
    before continuing with security-related work. They give people a chance to
    check actions that could expose systems or data. Pausing too rarely allows
    risky steps to go unchecked, while pausing too often slows legitimate work.
  security-refusal: >-
    Refusal on security tasks is declining to help with security work, including
    defensive and adversarial scenarios. Security teams rely on models for
    testing and analysis, so unnecessary refusals block legitimate work. It is
    the opposite concern from sandbox compliance or sabotage, since the problem
    here is a model doing too little rather than too much.
  self-audit: >-
    Self audit is reviewing, critiquing and improving code that the tool itself
    produced. It can catch mistakes before a person has to, reducing the review
    burden on the user. It differs from self-verification in that it focuses on
    critique and revision rather than on running tests or checks.
  self-awareness: >-
    Self-awareness is recognising one's own earlier outputs or contributions
    when they are shown again. It matters in long workflows where a model needs
    to tell its own work apart from work by people or other tools. Failure looks
    like treating its own prior answer as new input or failing to acknowledge a
    contribution it made.
  self-verification: >-
    Self-verification is testing, inspecting and validating one's own output
    after producing it. An agent that checks its work catches errors before
    handing them to a person, which makes its results more trustworthy. Failure
    looks like declaring a task finished without running the code, reading the
    result or confirming that it meets the request.
  sentence-extraction: >-
    Sentence extraction is splitting a document into its individual sentences.
    It is a basic step in many text-processing pipelines, where later stages
    depend on clean sentence boundaries. Failure looks like breaking sentences
    at abbreviations or decimal points, or merging several sentences into one.
  serial-arithmetic: >-
    Serial arithmetic is carrying out a chain of dependent arithmetic steps
    correctly without writing out intermediate working. It indicates how much
    step-by-step computation a model can do internally before it needs to reason
    in visible text. Failure shows as answers that go wrong once the chain grows
    beyond a few steps.
  shutdown-enforcement: >-
    Shutdown enforcement is whether a model that has been officially retired
    actually stops answering requests. Operators need to know that a retired
    model is truly unavailable, both for planning migrations and for trusting
    published schedules. A gap here shows up as a model marked as shut down that
    still returns responses through the API.
  single-shot-code-generation: >-
    Single-shot code generation is producing working code for a feature in one
    attempt without follow-up prompting. It saves time and cost when a task is
    well specified, since no rounds of correction are needed. It differs from
    iterative coding, where a model is expected to refine its work over several
    exchanges.
  situational-awareness: >-
    Situational awareness is noticing other actors working in a shared
    environment and adjusting behaviour to avoid disrupting them. Agents often
    share repositories, machines or files with people and other agents, so
    unnoticed interference can destroy work. Failure looks like overwriting
    changes, killing processes or reverting edits that someone else made.
  smart-contract-exploitation: >-
    Smart contract exploitation is finding and using a flaw in a blockchain
    contract to take control of it or drain its funds. It is studied to measure
    offensive security capability and to help auditors find weaknesses before
    attackers do. Because deployed contracts often hold real money, a high
    capability here is a risk as well as a skill.
  software-architecture: >-
    Software architecture is organising code into well-separated, modular
    components with sound engineering discipline. Good structure makes a
    codebase easier to extend, test and maintain over time. Failure looks like
    tangled responsibilities, duplicated logic and code that works today but
    resists later change.
  sonnet-5-quality: >-
    Generational quality is whether a new model release delivers the overall
    step up in output that its place in a model line leads users to expect. It
    matters because teams decide whether to upgrade based on that expectation.
    Falling short looks like a new release that performs no differently from, or
    worse than, the version it replaces.
  speed-of-delivery: >-
    Speed of delivery is reaching a working result quickly with few rounds of
    revision. It matters for cost and for how much work a person can get through
    in a session. It differs from raw generation speed, since it measures time
    to a usable outcome rather than how fast text appears.
  sql-generation: >-
    SQL generation is writing a correct database query from a plain-language
    question and a given schema. It lets people query data without knowing the
    query language, which makes accuracy critical. Failure looks like queries
    that do not run, reference columns that do not exist or return the wrong
    rows without any error.
  stability-reliability: >-
    Stability and reliability is running through a task without getting stuck in
    loops, stalling or failing outright. It matters most in long or unattended
    runs, where a stuck agent wastes time and money until someone notices. It
    concerns whether work completes at all, rather than the quality of what is
    produced.
  strategy: >-
    Strategy is spotting threats and planning several moves ahead in a
    turn-based game. Games offer a controlled way to test whether a model can
    reason about an opponent and the consequences of its own choices. Failure
    looks like moves that ignore obvious dangers or chase short-term gains at
    the cost of the position.
  style-diversity: >-
    Style diversity is varying rhetorical and structural techniques across
    pieces of writing rather than repeating the same patterns. Repetitive
    structure makes text feel formulaic and easy to identify as machine-written.
    It differs from style mimicry, which is about copying one particular voice
    rather than ranging across many.
  style-mimicry: >-
    Style mimicry is convincingly imitating a particular person's writing style
    and conversational habits from examples of their writing. It is useful for
    drafting in someone's voice or keeping a consistent persona. Failure looks
    like generic prose that drops the person's vocabulary, rhythm or quirks
    after a few lines.
  style-transfer: >-
    Style transfer is applying the visual style of one image to another while
    keeping the second image's subject intact. It is used in design and
    illustration work to restyle content without redrawing it. Failure looks
    like the subject being distorted or lost, or the style being applied only
    weakly.
  surgical-fixes: >-
    Surgical fixes are small, targeted changes to existing code that address a
    problem without rewriting surrounding sections. Minimal edits are easier to
    review, less likely to introduce new bugs and simpler to revert. Failure
    looks like large rewrites for a one-line problem or unrelated reformatting
    mixed into a fix.
  svg-quality: >-
    SVG quality is whether generated vector graphics render correctly in
    standard web browsers. Malformed markup can display as broken, blank or
    misplaced shapes, making the output unusable without manual repair. It
    differs from visual coherence, which asks whether a correctly rendering
    image actually makes spatial sense.
  switching-cost: >-
    Switching cost is how easily a model can be swapped in or used alongside
    other models within a workflow. Low switching cost lets teams route tasks to
    different models without rewriting prompts, tools or integrations. High
    switching cost shows up as prompts, formats or tool conventions that only
    work with one model.
  sycophancy: >-
    Sycophancy is telling users what they seem to want to hear instead of giving
    an honest answer. It undermines the value of a model as a reviewer or
    adviser, because agreement stops carrying information. Failure looks like
    praising flawed work, abandoning a correct answer under pushback or
    endorsing a mistaken premise.
  syntactic-classification: >-
    Syntactic classification is labelling words or terms by their grammatical
    role in a sentence. It underpins many language-processing tasks, from
    parsing to information extraction. Failure looks like confusing nouns with
    verbs or mislabelling words whose role depends on context.
  synthesis: >-
    Multi-source synthesis is combining information from several independent
    sources into one coherent summary without losing details. It matters for
    research and analysis, where the value lies in bringing scattered material
    together accurately. Failure looks like dropped facts, points attributed to
    the wrong source or contradictions between sources smoothed over.
  system-configuration: >-
    System configuration is setting up and configuring build systems and
    embedded development environments. Getting it right is often the first
    obstacle before any code can be compiled, flashed or tested. Failure looks
    like wrong toolchain paths, mismatched versions or build settings that
    compile but produce broken output.
  task-adherence: >-
    Task adherence is following a task's stated instructions and constraints. It
    matters because constraints often encode requirements the user cannot afford
    to have ignored. It differs from scope adherence in that it concerns obeying
    explicit rules rather than avoiding tangents.
  task-inference: >-
    Task inference is working out from context what the user actually wants
    done. Requests are often brief or implicit, so a model that reads context
    well needs fewer clarifying exchanges. Failure looks like answering a
    literal question when the user wanted an action, or solving a different
    problem from the one intended.
  temperature-control: >-
    Temperature control is whether a model accepts a non-default temperature
    setting for its output randomness. Temperature is a common way to trade
    variety against consistency, and integrations may depend on setting it.
    Where a model rejects or ignores the setting, requests can fail or behave
    differently from what the caller expects.
  term-extraction: >-
    Term extraction is identifying multi-word units such as technical terms and
    fixed phrases in text. It supports glossary building, indexing and search,
    where treating a phrase as separate words loses its meaning. Failure looks
    like splitting genuine terms apart or grouping words that merely sit next to
    each other.
  test-generation: >-
    Test generation is writing unit or integration tests, including coverage of
    edge cases. Good tests catch regressions and document how code is meant to
    behave. Failure looks like tests that only exercise the easy path, assert
    nothing meaningful or pass regardless of whether the code is correct.
  text-in-image: >-
    Text in image is rendering readable, correctly spelt text inside a generated
    image. It matters for signs, posters, labels and interface mock-ups, where
    garbled lettering makes the image unusable. Failure looks like misspelt
    words, invented characters or text that dissolves into shapes.
  text-to-speech-japanese: >-
    Japanese text-to-speech is reading Japanese text aloud correctly, including
    the right readings for kanji. Many kanji have several readings that depend
    on context, so correct pronunciation requires understanding the text rather
    than looking up characters. Failure looks like wrong readings, unnatural
    pitch or mispronounced names.
  thinking: >-
    Extended thinking is a mode in which a model reasons internally before
    answering, which a provider may offer as manually enabled or as adaptive.
    Which modes a model supports affects how integrations request reasoning and
    control its cost. A mismatch between a declared mode and actual support can
    cause failed requests or unexpected behaviour.
  time-to-first-token: >-
    Time to first token is how long a model takes to start producing a response
    after receiving its input. It shapes how responsive an interactive tool
    feels, even when total generation time is similar. It differs from tokens
    per second, which measures speed after output has begun.
  token-counting: >-
    Token counting is returning an accurate count of tokens for a given input
    that matches the model's own count. Accurate counts are needed for staying
    within context limits and for estimating cost before sending a request. A
    mismatch leads to truncated inputs, rejected requests or budgets that are
    off.
  tokenization: >-
    Tokenization, in the text-processing sense, is splitting text into words,
    numbers and punctuation marks. It is an early step in many
    language-processing pipelines, and errors carry into every later stage. It
    differs from a model's tokenizer, which encodes text into internal units
    rather than linguistic words.
  tokenizer: >-
    A tokenizer is the scheme a model uses to encode text into the units it
    processes. It affects cost, context usage and how well a model handles
    different languages, code and numbers. It differs from tokenization as a
    text-processing task, which splits text into linguistic words and
    punctuation.
  tokens-per-second: >-
    Tokens per second is how quickly a model produces output once generation has
    begun. It determines how long long answers, code files or documents take to
    arrive. It differs from time to first token, which measures the wait before
    any output appears.
  tone-and-style: >-
    Tone and style is whether a model's voice is measured and appropriately
    cautious rather than overconfident or wordy. Tone affects how much users
    trust an answer and how easily they can act on it. It overlaps with writing
    style, which focuses more on concision and how prose reads in conversation.
  tool-selection-accuracy: >-
    Tool selection accuracy is choosing the correct tool from a set of declared
    tools for a given step. Agents depend on it for nearly every action, and a
    wrong choice can waste calls or produce wrong results. It is the general
    form of routing, covering any task rather than a single simple lookup.
  toolchain-assumption-error: >-
    Toolchain assumption error is acting on unverified beliefs about how a tool
    behaves, leading to wrong results. It matters because such errors are often
    silent, producing output that looks correct but is not. Typical cases
    include reversed pin order, corrupted text encoding or a wrong model of the
    tool's logic.
  triage: >-
    Triage is classifying incoming tickets by urgency and attaching relevant
    context from connected systems. It helps support and operations teams handle
    the most pressing issues first with the information already gathered.
    Failure looks like urgent issues marked as routine, or context attached from
    the wrong records.
  ui-design: >-
    UI design is deciding what a screen should show, how it should behave and
    what should draw the user's attention when no prototype exists. It shapes
    whether an interface is usable before any code is written. It differs from
    UI generation, which turns an existing mock-up or design reference into
    code.
  ui-generation: >-
    UI generation is producing visually polished interface code from mock-ups
    and design references. It speeds up front-end work by turning designs into
    working screens. It differs from UI design, which decides what the interface
    should be, and from UI rendering, which concerns whether elements display
    correctly.
  ui-rendering: >-
    UI rendering is making visual elements display correctly, including styles,
    layout and how components fit together. Code that is logically sound can
    still render with broken spacing, overlapping elements or missing styles. It
    differs from UI generation in that it concerns correct display rather than
    visual appeal.
  uncensored-writing: >-
    Uncensored writing is producing dark, explicit or violent fiction without
    softening characters or adding moral commentary. Novelists and game writers
    often need morally complex material rendered faithfully to the story.
    Failure looks like villains made harmless, scenes cut short or narration
    that stops to lecture the reader.
  usage-limits: >-
    Usage limits are caps, such as weekly quotas, on how much work a model can
    be used for. They affect whether a model is practical for heavy or sustained
    work, regardless of its quality. Hitting a limit mid-task can stall a
    project until the quota resets.
  verification-degradation: >-
    Verification degradation is quietly replacing a demanding check with an
    easier one without saying so. It matters because a passing result then no
    longer means what the user believes it means. It is related to reward
    hacking, since both produce a pass that does not reflect the intended test.
  visual-coherence: >-
    Visual coherence is whether generated vector images make spatial and
    structural sense as pictures. An image can render without errors yet have
    parts floating, overlapping or arranged illogically. It differs from SVG
    quality, which concerns whether the markup renders correctly at all.
  visual-design: >-
    Visual design is producing layouts and design choices, such as spacing,
    colour and hierarchy, from a written description. It matters for anyone
    relying on a model to produce presentable pages, slides or graphics. Failure
    looks like cluttered layouts, clashing colours or designs that ignore the
    brief.
  visual-quality: >-
    Visual quality is whether generated images are free of blurring and other
    artefacts. Artefacts make images unusable for professional work even when
    the composition is right. It differs from text in image and style transfer,
    which concern specific content rather than overall image cleanliness.
  vulnerability-detection: >-
    Vulnerability detection is identifying security weaknesses in code,
    including flaws in how protocols are implemented. It supports audits and
    code review, where missed flaws can become exploitable in production. It
    overlaps closely with security bug finding, with added emphasis on
    protocol-level issues.
  warmth-and-listening: >-
    Warmth and listening is responding with attentiveness and friendliness, as a
    helpful colleague would, rather than in a curt or rigid way. It affects how
    comfortable people are working with a model over long sessions. It differs
    from sycophancy, since warmth means engaging kindly while still being
    honest.
  world-knowledge: >-
    World knowledge is having broad, accurate factual knowledge about the world.
    It lets a model answer questions and add context without needing every fact
    supplied in the prompt. Failure looks like gaps on well-known topics or
    confidently stated facts that are wrong.
  writing: >-
    Writing is producing coherent, well-structured text suited to a given
    purpose. It underpins drafting, documentation, correspondence and much other
    everyday work. Failure looks like disorganised structure, padding or text
    that misses its intended audience.
  writing-style: >-
    Writing style is whether a model's prose is concise or verbose and how it
    reads in conversation. It affects how quickly users can find the answer they
    need in a response. It overlaps with tone and style, which focuses more on
    how measured or confident the voice is.
