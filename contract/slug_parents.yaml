# Parent headings for the board sections. #410.
#
# A READ-TIME grouping of `board_entry.slug` for navigation. Nothing here is a
# counting unit and nothing here rewrites a leaf.
#
# THE PROPERTY THIS FILE EXISTS TO HOLD, AND THE ONE TO CHECK A CHANGE AGAINST:
#
#     A PARENT GROUPS FOR READING AND NEVER IMPLIES THE LEAVES ARE THE SAME
#     MEASUREMENT.
#
#   It is why a wrong member list is cheap - it costs a reader one click, not
#   the board a wrong number - and it is the only part of this file reviewable
#   by reading, since the member lists are one reader's judgement over 296
#   slugs. The check it licenses: DOES A PARENT PUT TWO SLUGS TOGETHER THAT A
#   QUOTE PROVES ARE DIFFERENT THINGS? `osworld-verified` beside `osworld-2`
#   passes, because a parent is not a merge and filing them adjacently is how a
#   reader notices three of the four are one benchmark (#407).
#
# ⚠ THIS IS NOT `capabilities.yaml`. That file is the CLOSED, 12-key counting
#   vocabulary: it keys `cell`, it drives `n_eff`, and `judge/pages/capability.py`
#   refuses a key it does not contain. THIS FILE KEYS NOTHING. It maps the open
#   display vocabulary onto headings, and the capability page never reads it.
#
# THREE CONSTRAINTS SERVING THE PROPERTY, EACH WITH A TEST:
#   1. no voice counts   - this schema has no field for one, and
#                          `test_a_parent_counts_leaves_not_voices` refuses any
#                          key matching voices|n_eff|weight|score|consensus.
#                          A parent renders HOW MANY LEAVES, never how many
#                          reports: summing leaf reports double-counts every
#                          document that appears under two leaves (measured:
#                          55 against a true union of 51 on `coding`, 7.8% over)
#                          AND sums a figure that is already a floor.
#   2. no catch-all      - `forbidden_parents` below, and no parent name may
#                          equal an existing leaf slug. `extraction.faithfulness`
#                          took 12 facial-recognition claims without complaint;
#                          `quality`, `reliability`, `judgment` and
#                          `general-purpose` are live leaves today and are
#                          harmless only because each is a singleton.
#   3. no rewriting      - leaf -> parent only. There is no field that could
#                          name a replacement slug. `normalise_slug` still
#                          refuses synonym folds; a parent is not a fold, and
#                          `merged` COLLAPSES a leaf while a parent does not.
#
# A slug absent from this file is UNGROUPED. Absence is the default and is not a
# defect (rule 6). There is deliberately NO `other` PARENT: a leaf nobody has
# filed is shown as not yet filed, never under a heading invented to hold it.
#
# CAPABILITIES WERE RE-FILED 2026-10-14 (PROPOSED, AWAITING REVIEW). The
# 2026-09-23 map covered 170 of the 736 capability leaves on the local copy -
# the rest were extractor-made names, most with one report. Every one of the
# 736 was read and filed under ten headings, each either KEPT or proposed to
# MERGE into a kept capability, or proposed for DECLINE.
# `docs/proposals/capability_curation_2026_10_14.py` holds that proposal and
# generates the `capability` block below; edit it there and re-run, not here.
# The merges and declines are RULINGS on `board_entry` that a person applies
# (rule 10) - this file only says where each name is filed, so a merged name
# that still has unruled rows groups beside the capability it was meant to
# join. On the Board the headings render as boxes, and a box opens its leaves.
#
# ⚠ `best_for` IS ABSENT ON PURPOSE AND IS NOT AN OVERSIGHT. Parents there are
#   DEFERRED pending #412: `coding-agent` holds 142 of 282 entries and, read in
#   full on 2026-09-23, 106 of the 142 (74.6%) do not belong under it at all -
#   51.4% name no task of any kind. A parent map over a section whose largest
#   leaf is three-quarters misfiled is tidiness above a broken leaf. That
#   section wants `coding-agent` SPLIT, and before that the extractor repair.
#
# NO COUNTS IN THIS FILE, per rule 11 and by demonstration: the proposal behind
# it went stale three times in 47 minutes (capability 710 -> 712 -> 716). Every
# figure quoted above is a dated record from that document, and the live ones
# are recomputable with
# `docs/measurements/slug-parent-clustering-2026-09-23.py`.
#
# Clustering made 2026-09-23 by anooj. Reviewed by parvathibntglobal on #410,
# who took the shape and supplied the property above. Capability block re-filed
# 2026-10-14 by anooj - awaiting review.

version: 1
clustered_on: 2026-09-23
clustered_by: anooj

#: Names a parent may never take. Each is wide enough to accept anything, which
#: is the property that made `extraction.faithfulness` absorb facial
#: recognition silently and positively.
forbidden_parents:
  - general
  - general-purpose
  - general-intelligence
  - overall
  - misc
  - other
  - quality
  - capabilities

#: THE HEADING A READER SEES. Every leaf has a display `name` because the
#: extractor is told to produce one - "Two to four words, title case ... This is
#: the heading the board renders" - and parents were the one heading with no
#: such rule, so the board would have put `reasoning-and-math` directly above
#: `Reasoning`, `CoT controllability` and `Over-thinking`. A hyphenated machine
#: string on top of title-cased human ones. Raised by @parvathibntglobal on
#: #416, and added here rather than later because this file is the reviewed
#: artefact and a field added afterwards is a second contract change.
#:
#: KEPT SEPARATE FROM `sections` ON PURPOSE. Those lists are generated from
#: `docs/measurements/slug-parent-clustering-2026-09-23.py` and are compared
#: against it; interleaving hand-written display text into machine-generated
#: structure is how the two drift. This block is hand-written and nothing else
#: is.
#:
#: The LOADER falls back to the slug when a name is missing, so a new parent
#: renders rather than crashing. A TEST requires every parent to have one, so a
#: new parent cannot quietly ship nameless. Permissive code, complete contract.
