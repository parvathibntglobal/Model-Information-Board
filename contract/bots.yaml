# ============================================================================
#  The known-bot list. Rule 5 puts a filter rule in `contract/`, and this is it.
#
#  SHARED. Changes go through a PR — this file DROPS DOCUMENTS.
#
#  ⚠ NEEDS E2's SIGN-OFF, per the lane rule on contract/.
#
#  Loaded by `collect/triage/bots.py`; consumed by
#  `collect/triage/gates.py:known_bot` (the gate) and `counted_bot` (the flag).
#  Until this file existed the gate reported UNAVAILABLE for every document in
#  the corpus, and every survival figure computed in that state was an upper
#  bound. First run with it: `docs/the-three-dead-gates-2026-09-08.md`.
#
#  TWO LISTS PER SOURCE, AND THE SPLIT IS RULE 8
#  ----------------------------------------------
#      accounts:   GATED. The document is DROPPED.
#      counted:    FLAGGED and KEPT. Recorded, never acted on.
#
#  Rule 8's reviewer question is *what population was this filter's error rate
#  measured on, and did the filter, or anything upstream of it, choose that
#  population?* The two lists below answer it differently, which is the whole
#  reason there are two:
#
#    `accounts` — 26 accounts where GITHUB SAYS SO. `GET /users/{login}`
#      returns `user.type == "Bot"`, which is the platform declaring it. We
#      chose nothing, so there is no population of ours for an error rate to
#      hide in. Gated.
#
#    `counted` — 7 accounts where WE say so. They carry `bot` in the login and
#      `user.type == "User"`, and they were found by grepping `bot` out of the
#      logins in an export WE gathered. That is the trap rule 8 names, and
#      `FacultativeObligatoryBotContract` is what it looks like when it fires:
#      almost certainly a person with a joke name, one comment. Counted, so the
#      cost of acting on them is visible before anybody does.
#
#  PROMOTION IS A MOVE, NOT AN ADDITION. `_source_of` REFUSES an id present in
#  both lists: it would be dropped and counted, and the counted figure would
#  stop meaning "what this judgement would cost if promoted". Moving an id
#  changes `BotList.fingerprint`, so a verdict that changed because this file
#  changed cannot be mistaken for one that did not.
#
#  KEYED ON THE STABLE ACCOUNT ID, NEVER THE LOGIN
#  ------------------------------------------------
#  A login is mutable wherever renames exist, so a list keyed on one silently
#  stops matching after a rename — and silence is the failure this gate exists
#  to prevent. `login` is recorded beside each id FOR A HUMAN REVIEWING THE
#  FILE and is never matched on; a list of bare numbers is a list nobody can
#  re-review. `comments_in_export` is the count from the population below, kept
#  so the busiest entries are obvious and a reviewer knows what removing one
#  would cost.
#
#  NO PATTERN FIELD, ON PURPOSE. A regex over logins would filter
#  `FacultativeObligatoryBotContract` and `releasebot` the helpful maintainer
#  alike. `github.py:is_bot` already refuses the string heuristic and records
#  that the `[bot]`-suffix agreement it was measured against had a denominator
#  of two accounts.
#
#  THE POPULATION, STATED (rule 7)
#  --------------------------------
#  33 accounts carrying `bot` in the login, of 1,099 distinct accounts over
#  2,016 comments in the GitHub comment export, read 2026-09-07 via
#  `GET /users/{login}` one account at a time.
#  `docs/measurements/bot-account-ids-2026-09-07.json`.
#
#  **THAT IS NOT A CENSUS OF BOTS ON GITHUB.** It is every account in one
#  export whose login contains `bot`. An automated account named `deploy-helper`
#  is not in it and would not be found by this method — so the list is a floor
#  on what it catches, and the gate's UNAVAILABLE-per-source design is what
#  keeps that from reading as completeness.
#
#  ONLY GITHUB IS DECLARED. The other four platforms are absent rather than
#  empty, deliberately: `bots.py` reports UNAVAILABLE per source, so the
#  count shrinks platform by platform as each is read. Writing `accounts: []`
#  for reddit would claim somebody looked, and nobody has.
# ============================================================================

