# The board's three surfaces, and the vocabulary each one rules by.
#
# WHY THIS FILE EXISTS
# --------------------
# The board renders three sections and only one of them had a vocabulary.
# `capabilities.yaml` has named the capability keys since the beginning; "Best
# for" and "Metrics" had nothing, so the classifier had nothing to file into and
# two thirds of the board could only ever render its empty state.
#
# Rule 5: config in versioned YAML, not code. These keys decide what the board
# can say, so they are reviewable in a diff rather than buried in a prompt.
#
# THE THREE SURFACES ARE THREE VIEWS OF ONE CORPUS, NOT THREE BUCKETS.
# The board's own copy says "three ways into the same evidence". One quote about
# a slow coding agent legitimately informs all three: the FIGURE lands on the
# metric page, the BEHAVIOUR on `ops.latency_ttft`, and the JOB on the coding
# agent page. So a claim carries a LIST of sections, never exactly one, and
# every claim still names a `capability` regardless of which sections it feeds.
#
# KEYS ARE PREFIXED ON PURPOSE. `job.*` and `metric.*` cannot collide with a
# capability key, so a key names its own surface and nothing has to guess.
# `ops.latency_ttft` (a capability — does it respond promptly) and
# `metric.latency_ttft` (an axis — how many milliseconds) are different
# questions about the same subject, and the prefix is what keeps them apart.
#
# ⚠ NOT YET RATIFIED. `contract/` gets two eyes (CLAUDE.md working agreement).
# The capability list is ratified and unchanged; the job and metric lists below
# are a FIRST PROPOSAL derived from the eight jobs and six axes the demo build
# carried (`board-and-blogs-record.md` §2). They need a reviewer before a run
# writes cells against them.

version: "0.1-proposed"

# ── BEST FOR ────────────────────────────────────────────────────────────────
# Answers "I have this job — which model?". A job is a TASK SOMEONE RUNS, not a
# quality a model has. If it cannot be the object of "I need a model to ___",
# it is not a job and probably belongs in `capabilities.yaml`.
jobs:
  - key: job.coding_agent
    name: Coding agent
    definition: >
      Autonomous multi-step code changes in a real repository — read files, edit
      them, run tests, iterate. The job is the whole loop, not one completion.

  - key: job.rag_qa
    name: RAG question answering
    definition: >
      Answering questions against your own retrieved documents, where the
      answer must come from the supplied context rather than from memory.

  - key: job.structured_extraction
    name: Structured extraction
    definition: >
      Pulling named fields out of unstructured text into a fixed shape —
      invoices, contracts, emails to JSON.

  - key: job.text_classification
    name: Text classification
    definition: >
      Labelling text into a fixed, known set of categories at volume, where
      cost per item and consistency matter more than eloquence.

  - key: job.long_document_summarization
    name: Long-document summarisation
    definition: >
      Condensing a long document faithfully, where the failure that matters is
      a confident summary that drops or invents a load-bearing detail.

  - key: job.sql_generation
    name: SQL generation
    definition: >
      Turning a natural-language question into a query against a known schema
      that runs and returns the right rows.

  - key: job.translation
    name: Translation
    definition: >
      Translating between language pairs. Reports are only comparable within a
      pair — a model strong on European pairs may be weak on Hindi or Arabic,
      and the page shows that as a split rather than an average.

  - key: job.multimodal_document
    name: Multimodal document reading
    definition: >
      Reading images, PDFs and screenshots — charts, tables, scanned forms —
      where the input is not text.

# ── METRICS ─────────────────────────────────────────────────────────────────
# Answers "what is this number, and what does it not tell you?". A metric is a
# MEASURED AXIS with a unit. Every metric page states the unit, where the figure
# came from, and what the figure cannot tell you.
#
# `basis` IS REQUIRED ON EVERY RECORDED FIGURE, and it is the field that keeps
# this section honest:
#     stated    the provider says so — a spec sheet, a docs page, a launch post
#     reported  somebody measured it themselves and said what they got
# These are different facts from different sources and the board REFUSES TO
# MERGE THEM (`board-and-blogs-record.md`: context-window shows 2M stated
# against ~200k reported-usable, side by side). Averaging a stated figure with a
# reported one produces a number nobody measured — rule 3.
metrics:
  - key: metric.cost_per_million_tokens
    name: Cost per million tokens
    unit: USD per 1M tokens
    definition: >
      Published price per million tokens. Input and output are priced
      differently and must never be collapsed into one figure.
    cannot_tell_you:
      - Cost per TASK, which depends on how many tokens the model spends
      - Whether cached reads applied, which changes the bill severalfold
      - Whether a cheaper model needed more retries to get the same result
      - Host markup on open weights, where the price belongs to the host

  - key: metric.latency_ttft
    name: Time to first token
    unit: milliseconds
    definition: >
      How long until the first token arrives. Distinct from total time, and it
      is the figure a streaming UI actually feels.
    cannot_tell_you:
      - Total completion time, which throughput decides
      - Reasoning effort, where the same model at max differs from itself at low
      - Region and time of day
      - Whether the figure was a cold or warm start

  - key: metric.throughput_tps
    name: Throughput
    unit: tokens per second
    definition: >
      Output tokens produced per second once generation has started.
    cannot_tell_you:
      - Time to first token, which is a separate axis
      - Concurrency the figure was measured at
      - Whether the host was rate-limiting
      - Batch versus interactive mode

  - key: metric.context_window
    name: Context window
    unit: tokens
    definition: >
      How much input the model accepts. STATED and REPORTED-USABLE are recorded
      side by side and never merged — the advertised ceiling and the point where
      engineers report recall falling off are different facts.
    cannot_tell_you:
      - Effective recall across the window, which is `context.effective_window`
      - Where in the window attention degrades
      - Output limit, which is a separate cap
      - Cost of filling it

  - key: metric.max_output_tokens
    name: Maximum output tokens
    unit: tokens
    definition: >
      The cap on a single response. A truncated answer is often this and not a
      capability failure, which is why it is recorded as its own axis.
    cannot_tell_you:
      - Whether the model stops well before the cap on its own
      - Whether reasoning tokens count against it
      - Verbosity at default settings

  - key: metric.swe_bench
    name: SWE-bench Verified
    unit: percent resolved
    definition: >
      A CITATION, never a re-computation. The board cites published eval results
      and does not run the suite: owning a benchmark would close the validity
      question to it. What the page adds is the headroom and contamination note.
    cannot_tell_you:
      - Whether the suite is saturated or contaminated
      - The scaffold the score was obtained with, which moves it substantially
      - Performance on your codebase, in your language
      - Whether the vendor or a third party ran it
