# How often the scheduler fetches each tracked model, and how much a fetch reads.
#
# ⚠ PROPOSED 2026-10-05 ON BRANCH anooj_001 - contract/ gets two eyes; this
#   reaches main only through a reviewed PR. The values are the ones
#   judge/scheduler.py carried as code constants since #494 (merged
#   2026-09-28), moved here unchanged so rule 5 holds. Changing them is a
#   separate decision.
#
# READ BY judge/scheduler.py `policy()`. Every key is required and must be a
# positive integer; absent or anything else raises (rule 6, rule 12) - there is
# no default in code.

version: "0.1"
status: proposed

#: Hours after a model's last SUCCESSFUL fetch before it is due again.
#:
#: 60 HOURS = EVERY THIRD NIGHT, SO EVERY TRACKED MODEL TWICE A WEEK OR MORE
#: (2026-10-21, anooj; was `cadence_days: 7`). The workflow runs nightly, so a
#: model fetched one night is due again three nights later: 72 h minus how far
#: into that night's run it was fetched. Hours rather than days because of that
#: offset - `3 days` would miss the third night for any model fetched after the
#: run started, and slip it to every fourth (1.75 a week). 60 h holds for a run
#: up to 12 h late, and stays above the 48 h of the second night.
#:
#: NOT ONE BIG RUN TWICE A WEEK, AND MEASURED: over the 35 ok fetches of the 21
#: days to 2026-10-21 (shared DB fetch_log), a fetch took 28 min median, 79 p90;
#: one at <= 25 threads 11 min median, 21 p90. 32 tracked models in one job is
#: about 6 h against the 6 h limit and a 300-minute launch deadline, and would
#: meet the daily extraction budget. Nightly, it is about 11 models a night.
cadence_hours: 60

#: FETCH_MAX_THREADS for a model's first-ever fetch: its whole backlog is unread.
first_fetch_thread_cap: 100

#: FETCH_MAX_THREADS for a refresh: most of the backlog is already extracted.
refresh_thread_cap: 25

#: FRESH EVIDENCE ONLY: days back a thread's newest dated post may be, for a
#: fetch to extract it (2026-10-26, anooj). The goal is fresh data twice a
#: week, so an unread thread whose every post is older than this is LEFT, not
#: extracted - it stays stored and is never deleted. Applies to every fetch,
#: scheduled or from the Admin button.
#:
#: Dated by `document.created_at`, when the author posted. A thread with no
#: dated post cannot be judged fresh and is not selected; each run COUNTS
#: those and the stale ones on its E5 stage line, so "left because old or
#: undated" never reads as "nothing to read" (rule 4, rule 6).
extraction_window_days: 14

#: THREADS READ AT ONCE IN E5 (2026-11-13, anooj; for review). Extraction is one
#: model call per thread, and it was made one at a time: E5 was 57-61% of every
#: fetch's time (fetch_log, runs since 2026-11-10: agent first fetches median 26
#: min of which E5 15; model first fetches 85 of which 52; refreshes 16 of which
#: 5). Up to this many calls are now in flight together. Only the CALL runs in
#: parallel: verifying each quote, storing it and the ledger row stay one thread
#: at a time, in thread order, on the run's own connection (judge/pipeline.py
#: `run_all`). 1 is the old serial behaviour exactly.
#:
#: THE CAP CAN BE PASSED BY AT MOST (this - 1) CALLS. `check_before_call` runs
#: before each call is SENT, and a call's cost is known only when it returns, so
#: up to this many can be paid for after the last check. At about $0.0005 per
#: thread (2026-11-12, 6 agent first fetches, 69-90 threads each, $0.035-0.046
#: per fetch) that is about $0.0015 at 4 - stated, not hidden.
#:
#: Required, a positive integer; a missing or bad value refuses (rule 12).
extract_concurrency: 4
