# How often the scheduler fetches each tracked model, and how much a fetch reads.
#
# ⚠ PROPOSED 2026-10-05 ON BRANCH anooj_001 - contract/ gets two eyes; this
#   reaches main only through a reviewed PR. The values are the ones
#   judge/scheduler.py carried as code constants since #494 (merged
#   2026-09-28), moved here unchanged so rule 5 holds. Changing them is a
#   separate decision.
#
# READ BY judge/scheduler.py `policy()`. Every key is required and must be a
# positive integer; absent or anything else raises (rule 6, rule 12) - there is
# no default in code.

version: "0.1"
status: proposed

#: Hours after a model's last SUCCESSFUL fetch before it is due again.
#:
#: 60 HOURS = EVERY THIRD NIGHT, SO EVERY TRACKED MODEL TWICE A WEEK OR MORE
#: (2026-10-21, anooj; was `cadence_days: 7`). The workflow runs nightly, so a
#: model fetched one night is due again three nights later: 72 h minus how far
#: into that night's run it was fetched. Hours rather than days because of that
#: offset - `3 days` would miss the third night for any model fetched after the
#: run started, and slip it to every fourth (1.75 a week). 60 h holds for a run
#: up to 12 h late, and stays above the 48 h of the second night.
#:
#: NOT ONE BIG RUN TWICE A WEEK, AND MEASURED: over the 35 ok fetches of the 21
#: days to 2026-10-21 (shared DB fetch_log), a fetch took 28 min median, 79 p90;
#: one at <= 25 threads 11 min median, 21 p90. 32 tracked models in one job is
#: about 6 h against the 6 h limit and a 300-minute launch deadline, and would
#: meet the daily extraction budget. Nightly, it is about 11 models a night.
cadence_hours: 60

#: FETCH_MAX_THREADS for a model's first-ever fetch: its whole backlog is unread.
first_fetch_thread_cap: 100

#: FETCH_MAX_THREADS for a refresh: most of the backlog is already extracted.
refresh_thread_cap: 25

#: FRESH EVIDENCE ONLY: days back a thread's newest dated post may be, for a
#: fetch to extract it (2026-10-26, anooj). The goal is fresh data twice a
#: week, so an unread thread whose every post is older than this is LEFT, not
#: extracted - it stays stored and is never deleted. Applies to every fetch,
#: scheduled or from the Admin button.
#:
#: Dated by `document.created_at`, when the author posted. A thread with no
#: dated post cannot be judged fresh and is not selected; each run COUNTS
#: those and the stale ones on its E5 stage line, so "left because old or
#: undated" never reads as "nothing to read" (rule 4, rule 6).
extraction_window_days: 14

#: REDDIT COMMENTS ONLY FOR A POST THE WINDOW CAN STILL REACH (2026-11-19,
#: anooj; 30 days approved by Parvathi on #639). On a refresh, a Reddit search hit posted
#: longer ago than this is stored WITHOUT its comments request, and does not
#: use one of the fetch's comment slots, so the slot goes to a fresher post.
#: Not on a first fetch (it reads the backlog without the window). An undated
#: post is never treated as old. Must be >= extraction_window_days.
#:
#: Why: the search ranks by relevance and returns months-old threads. Their
#: comments are fetched and stored, and the extraction above never reads them.
#: The search shows the post's date, not its newest comment's, so the cutoff is
#: on the post and wider than the window.
#:
#: MEASURED 2026-11-19 (read-only, shared DB). Population: the 1,383 thread
#: contexts with a Reddit root assembled 12-19 Nov, 244 of which had a comment
#: inside the 14-day window when assembled. That population was chosen by the
#: Reddit search and RapidAPI, not by this rule (rule 8).
#:
#:     cutoff   comment requests moved   threads with a fresh comment lost
#:     14 d     617 (45%)                40 of 244 (16%)
#:     30 d     439 (32%)                15 of 244 (6%)     <- chosen
#:     60 d     234 (17%)                 6 of 244 (2.5%)
#:
#: "Moved", not saved: a fetch still makes up to its 5 comment requests, and
#: the slots an old thread would have used go to fresher threads. Requests fall
#: in total only on a fetch with fewer than 5 fresh posts to use them on.
#:
#: A lost thread's post is still stored, but this arm will never fetch its
#: comments, because a post only gets older. So the 15 are a real cost, stated
#: here so a reviewer can trade it against the 439 requests moved. All 15 were
#: first seen together with their comments (0 had their post stored by an
#: earlier fetch; measured 2026-11-19 for #639), so re-fetching a held post
#: whose comment count has grown would not have saved them; whether it saves
#: later ones is measurable once this rule has run (follow-up, #639).
reddit_comments_max_post_age_days: 30

#: THREADS READ AT ONCE IN E5 (2026-11-13, anooj; for review). Extraction is one
#: model call per thread, and it was made one at a time: E5 was 57-61% of every
#: fetch's time (fetch_log, runs since 2026-11-10: agent first fetches median 26
#: min of which E5 15; model first fetches 85 of which 52; refreshes 16 of which
#: 5). Up to this many calls are now in flight together. Only the CALL runs in
#: parallel: verifying each quote, storing it and the ledger row stay one thread
#: at a time, in thread order, on the run's own connection (judge/pipeline.py
#: `run_all`). 1 is the old serial behaviour exactly.
#:
#: THE CAP CAN BE PASSED BY AT MOST (this - 1) CALLS. `check_before_call` runs
#: before each call is SENT, and a call's cost is known only when it returns, so
#: up to (this - 1) more can be paid for after the last check. Per call, as
#: measured by Parvathi on the #632 review over the 2,984 `extract` rows in
#: spend_ledger since 2026-11-06: median $0.0017, 95th percentile $0.0031, max
#: $0.0069. So at 4 the overshoot is typically about $0.005 and at most about
#: $0.02 - stated, not hidden. (Was "$0.0005 per thread", from 6 agent first
#: fetches: a per-thread average, not a per-call cost, and too low.)
#:
#: Required, a positive integer; a missing or bad value refuses (rule 12).
extract_concurrency: 4

#: WHICH OPENROUTER HOSTS MAY SERVE deepseek-v4-flash - never which model
#: (judge/extract/client.py `extractor_provider`). Read by the extractor (E5) and
#: by the evidence feed's paraphrases and summaries (judge/feed/llm.py), which
#: call the same model.
#:
#: THE ONLY SOURCE, since 2026-11-26 (#677 review, Parvathi: "contract only").
#: Until then the three nightly workflows, Railway and .env each carried
#: EXTRACTOR_PROVIDER_SORT / _IGNORE, so one decision lived in five places. A
#: process that still sets either variable gets a loud warning and the variable
#: is IGNORED. A replay that must pin one host passes `provider=` to
#: `OpenRouterClient` explicitly; nothing reads the environment for it.
#:
#:   sort    throughput | price | latency. A PREFERENCE, not a ban: measured
#:           2026-10-01, with no preference deepseek-v4-flash went to
#:           OpenInference at ~9 min/thread and truncated with no claims;
#:           `throughput` took 9-36 s/thread. A failed call can still fall back
#:           to any host, which is why `ignore` exists.
#:   ignore  hosts never used. OpenInference since 2026-10-01 (a fallback there
#:           took 9.5 min, truncated, no claims, $0.0216 billed). DeepInfra since
#:           2026-11-25: from 14 Nov its deepseek-v4-flash answered "no claim" to
#:           nearly every thread (14-24 Nov: 1,518 threads read by DeepInfra
#:           alone, 125 verified quotes; the other hosts, 2,351 threads, 5,453;
#:           fetch_log `upstreams`). Replayed 2026-11-25, the same 14 threads
#:           pinned to each host: DeepInfra 0 quotes on all 14, Wafer 9 on 4; and
#:           2 of 4 feed batches got no paraphrase from DeepInfra. Before 14 Nov it
#:           did as well as the others (13 Nov: 368 threads, 631 quotes), so it
#:           may come back off this list on a new replay. An empty list is
#:           allowed and means "rule none out".
#:
#: Both keys required; a missing or unknown value refuses (rule 12).
extractor_provider:
  sort: throughput
  ignore: [DeepInfra, OpenInference]
