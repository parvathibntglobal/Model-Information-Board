# The assistants assistantbenchmark.com scores, held as REGISTRY ROWS ONLY
# (anooj, 2026-11-12).
#
#   python scripts/load_unpolled_models.py --apply --path contract/assistantbenchmark_models.yaml
#
# WHY A SEPARATE FILE FROM `agent_models.yaml`. That file is the list of agents
# the nightly agent fetch searches for (`tracked_agents.yaml` must equal it), and
# every one of its aliases is a `snapshot` (its header, point 1). These rows are
# neither: they are not fetched nightly, and most carry a compound alias that
# files at `family` specificity. Putting them there would break both rules on
# purpose; a file of their own keeps those rules true and makes "registry only"
# visible in the name.
#
# WHAT THEY ARE FOR. One canonical id per assistant, so the board can file any
# evidence about them that arrives through other searches, and the benchmark
# section can track the assistantbenchmark results against the same ids. The
# grouping on the AI assistants page puts all of them under "Works for you".
#
# THE SOURCE. assistantbenchmark.com scores 30 assistants (read 2026-11-12).
# Muse, Grok Bot and Dots are already in `agent_models.yaml`; these are 24 of
# the other 27 (three held, below). Each row was drafted from the assistant's
# assistantbenchmark page and its official site (maker = the company in the site
# footer where the page names none) and reviewed by anooj on 2026-11-12. Row
# comments name the page, the site and the company only. NO SCORE from the site
# is stored: it has no published formula, and rule 3 forbids a synthesised
# number.
#
# ⚠ WHAT A REVIEWER SHOULD KNOW
# 1. MAKER UNKNOWN on 11 rows -> `unknown/<name>` and provider 'unknown'. Not
#    guessed (rule 6). Rename the id when the maker is confirmed. A page shows no
#    maker for these, never the word "unknown".
# 2. AN ID IS AN ALIAS TOO (#624 review). The loader builds alias rows from the
#    canonical id AND its local part (collect/registry/aliases.py), filed at
#    `snapshot`. So an ordinary-word name (Town, Tab, Catch, Shuffle, Poke, Caddy,
#    Orchid, Kicker, Boba, Dazzle, Brea, Tomo, Pally, Orbits, Hark) is never the
#    local part: the local part is the compound alias the official site or its
#    domain uses (`town/town-com`, `unknown/tab-bot`, `cognition/poke-com`), so
#    no bare word reaches the alias table (rule 10). The same goes for short
#    tokens prose produces by accident: Wajo's "Fo" is `wajo/wajo-fo`, and szn
#    ("season" in slang) is `unknown/theszn-ai`.
#    tests/test_assistantbenchmark_registry.py checks every key the loader would
#    write, including the id-built ones, and refuses any of 3 characters or fewer.
# 3. THREE ARE HELD, never loaded until each has an alias that is not an
#    ordinary word or phrase:
#      Instinct  no source-backed alias (its site writes only the bare word); maker
#                unknown; relation to OpenInstinct (below) unstated.
#      Folk      its only alias, "folk app", is also how people name the folk CRM
#                (folk.app), so it would pull in CRM posts.
#      Del       its only alias, "withdel", needs the spaced rendering "with del",
#                an ordinary phrase that matching folds to the same key.
#
# NO FIGURES: identity and aliases only, as in `agent_models.yaml`.

version: "1.0"
provenance: seed

models:
  # Hark: https://assistantbenchmark.com/agents/hark | site https://hark.com/ | maker: unknown
  - canonical_id: 'unknown/hark-pro'
    provider: 'unknown'
    display_name: 'Hark'
    aliases:
      surface: 'hark pro'
      variants: ['hark-pro', 'harkpro']

  # Town: https://assistantbenchmark.com/agents/town | site https://www.town.com/ | maker: town
  - canonical_id: 'town/town-com'
    provider: 'town'
    display_name: 'Town'
    aliases:
      surface: 'town.com'
      variants: ['town com', 'town-com', 'towncom']

  # Tomo: https://assistantbenchmark.com/agents/tomo | site https://tomo.ai/ | maker: unknown
  - canonical_id: 'unknown/tomo-ai'
    provider: 'unknown'
    display_name: 'Tomo'
    aliases:
      surface: 'tomo ai'
      variants: ['tomo-ai', 'tomoai']

  # Pally: https://assistantbenchmark.com/agents/pally | site https://pally.com/ | maker: pally
  - canonical_id: 'pally/pally-app'
    provider: 'pally'
    display_name: 'Pally'
    aliases:
