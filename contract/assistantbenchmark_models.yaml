# The assistants assistantbenchmark.com scores, held as REGISTRY ROWS ONLY
# (anooj, 2026-11-12).
#
#   python scripts/load_unpolled_models.py --apply --path contract/assistantbenchmark_models.yaml
#
# WHY A SEPARATE FILE FROM `agent_models.yaml`. That file is the list of agents
# the nightly agent fetch searches for (`tracked_agents.yaml` must equal it), and
# every one of its aliases is a `snapshot` (its header, point 1). These rows are
# neither: they are not fetched nightly, and most carry a compound alias that
# files at `family` specificity. Putting them there would break both rules on
# purpose; a file of their own keeps those rules true and makes "registry only"
# visible in the name.
#
# WHAT THEY ARE FOR. One canonical id per assistant, so the board can file any
# evidence about them that arrives through other searches, and the benchmark
# section can track the assistantbenchmark results against the same ids. The
# grouping on the AI assistants page puts all of them under "Works for you".
#
# THE SOURCE. assistantbenchmark.com scores 30 assistants (read 2026-11-12).
# Muse, Grok Bot and Dots are already in `agent_models.yaml`; these are the
# other 27 less Instinct (held, see below). Each row was drafted from the
# assistant's assistantbenchmark page and its official site (maker from the
# site footer where the page names none) and reviewed by anooj on 2026-11-12.
# NO SCORE from the site is stored: it has no published formula, and rule 3
# forbids a synthesised number.
#
# ⚠ WHAT A REVIEWER SHOULD KNOW
# 1. MAKER UNKNOWN on 12 rows -> `unknown/<name>` and provider 'unknown'. Not
#    guessed (rule 6). Rename the id when the maker is confirmed.
# 2. ORDINARY-WORD NAMES (Town, Tab, Catch, Shuffle, Folk, Poke, Del, Caddy,
#    Orchid, Kicker, Boba, Dazzle, Brea, Tomo, Pally, Orbits, Hark) carry only a
#    compound alias the official site or its domain uses; never the bare word
#    (rule 10). That alias is not the id's local part, so the loader files it at
#    `family` specificity: never searched, resolving at family level. Fine for
#    registry-only rows; whether these ids should change shape so they file as
#    `snapshot` is a ruling for the review, not taken here.
# 3. INSTINCT IS HELD: no source-backed alias exists (its site writes only the
#    bare word) and the loader needs one normalised key. Its maker is unknown and
#    its relation to OpenInstinct (below) is unstated.
#
# NO FIGURES: identity and aliases only, as in `agent_models.yaml`.

version: "1.0"
provenance: seed

models:
  # Hark: https://assistantbenchmark.com/agents/hark | site https://hark.com/ | maker: none; site footer says only 'Hark (c) 2026' (self-named, no entity)
  - canonical_id: 'unknown/hark'
    provider: 'unknown'
    display_name: 'Hark'
    aliases:
      surface: 'hark pro'
      variants: ['hark-pro', 'harkpro']

  # Town: https://assistantbenchmark.com/agents/town | site https://www.town.com/ | maker: official site footer '(c) Town.com, Inc.'; assistantbenchmark page names no entity
