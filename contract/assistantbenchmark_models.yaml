  # szn: https://assistantbenchmark.com/agents/szn | site https://theszn.ai/ | maker: unknown
  - canonical_id: 'unknown/theszn-ai'
    provider: 'unknown'
    display_name: 'szn'
    aliases:
      surface: 'theszn ai'
      variants: ['theszn-ai', 'thesznai']

  # Catch: https://assistantbenchmark.com/agents/catch | site https://catchagent.ai/ | maker: unknown
  - canonical_id: 'unknown/catch-ai'
    provider: 'unknown'
    display_name: 'Catch'
    aliases:
      surface: 'catch ai'
      variants: ['catch-ai', 'catchai']

  # Tab: https://assistantbenchmark.com/agents/tab | site https://tab.bot/ | maker: unknown
  - canonical_id: 'unknown/tab-bot'
    provider: 'unknown'
    display_name: 'Tab'
    aliases:
      surface: 'tab bot'
      variants: ['tab-bot', 'tabbot']

  # Zapia: https://assistantbenchmark.com/agents/zapia | site https://zapia.com/ | maker: unknown
  - canonical_id: 'unknown/zapia'
    provider: 'unknown'
    display_name: 'Zapia'
    aliases:
      surface: 'zapia'
      # the loader wants spaced/hyphenated/joined forms; a coined one-word name has
