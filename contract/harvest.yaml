# ============================================================================
#  Harvest sweep budget — what collect/ is allowed to spend, per cadence.
#
#  SHARED, and additive: this file takes nothing out of `queries.yaml`, which
#  states plainly that it "makes NO claim about request shape, request count,
#  scoping or budget". That claim is correct and this is where the budget
#  went instead. Rule 5 puts it in versioned YAML rather than a constant in a
#  test, so changing it produces a diff somebody can argue with.
#
#  WHY THE CAP IS PER CADENCE AND NOT PER SWEEP
#
#  There was one number, 900, applied to everything. PR #8 added a positive
#  query for each of the eight loud-failure capabilities, taking the sweep
#  from 16 entries to 24 and from 896 requests to 1,344 — 49% over a cap that
#  nobody re-costed before the merge.
#
#  The instinct is to raise the constant. That is the wrong move, because the
#  two halves of the sweep are not paying for the same thing:
#
#    NEGATIVE queries, and POSITIVE queries for the four silent-failure
#    capabilities, feed THE GATE. The advisor cannot approve a cheaper model
#    without them, and for a silent failure "nobody complained" is not
#    evidence, because you would not find out. These have to be current, so
#    they run nightly.
#
#    POSITIVE queries for the eight loud-failure capabilities feed THE MODEL
#    PAGE. queries.yaml says so in its own rationale: "These exist for the
#    MODEL PAGE, not for the gate." A page whose positive evidence is up to
#    six days old is a page nobody can tell from a current one. The gate does
#    not read them at all.
#
#  So they run weekly, and the daily sweep comes back to 896 — under the cap
#  that already existed, without that cap being touched.
#
#  A cadence is not a priority ranking. The loud positives are not less
#  important; queries.yaml is emphatic that dropping them produces a page
#  built from a corpus only ever searched for complaints. They are less
#  URGENT, which is a different axis, and it is the one a budget can spend.
#
#  MEASURED 2026-08-14, against the 10 seeded models and the two-repo sweep
#  scope, through `plan_searches` rather than by multiplying in a comment:
#
#      daily    16 entries -> 896 requests, 29.9 min at 30 req/min
#      weekly    8 entries -> 448 requests, 14.9 min at 30 req/min
#      (before)  24 entries -> 1,344 requests, 44.8 min
#
#  Amortised, the split costs 960 requests a day against 1,344 — and the
#  daily number is what the rate limit actually constrains.
#
#  ⚠ HEADROOM ON THE DAILY SWEEP IS 4 REQUESTS, which is none. One more alias
#  variant, or one more capability, breaks it. That is the cap working as
#  intended — it forces the next person to make the decision on purpose
#  rather than discover the cost in production.
#
#  WHICH LEVERS ACTUALLY MOVE IT, MEASURED 2026-08-14 AT REGISTRY SCALE
#
#  An earlier version of this file named three: a narrower sweep scope, fewer
#  alias variants, a longer cadence. **One of those three does nothing**, and
#  a contract naming an inert lever is worse than naming two, because
#  somebody reaches for it at the cap and finds it does not move.
#
#  The poller takes the registry from 11 models to fifty-odd. Costed through
#  `plan_searches`:
#
#      11 models ->  56 rendered forms ->   896 requests   (headroom 4)
#      20 models -> 102 rendered forms ->  1,629 requests  OVER by 729
#      50 models -> 255 rendered forms ->  4,073 requests  OVER by 3,173, 4.5x
#
#    NARROWER SCOPE — DOES NOTHING. Measured: one repo in scope and two repos
#      in scope both cost 896 requests. Scope is a qualifier INSIDE a query,
#      not a multiplier of queries; it changes what comes back and never how
#      many requests are issued. It is a precision lever, not a budget one,
#      and it was wrong to list it here.
#
#    FEWER ALIAS VARIANTS — works, at a price paid elsewhere. Fitting 900 at
#      16 daily entries needs 56 rendered forms TOTAL, which at 50 models is
#      1.1 per model against 5.1 today. `check_spelling_coverage` in
#      registry.yaml requires three renderings per model, so this lever
#      closes the gap only by breaking that rule — and #5 records that the
#      attribution side must not narrow as a side effect of a harvest saving.
#
#    LONGER CADENCE — cannot close it at this scale. At 50 models even ONE
#      daily entry costs 255 requests, and the gate's irreducible set is the
#      12 negatives at 3,055. Moving entries to weekly bought the PR #8
#      overrun back; it does not buy the poller back.
#
#  WHAT DOES CLOSE IT: PARTITION THE MODELS ACROSS NIGHTS.
#
#      1 night  -> 50.0 models -> 4,073 requests  OVER
#      2 nights -> 25.0 models -> 2,036 requests  OVER
#      5 nights -> 10.0 models ->   815 requests  OK
#      7 nights ->  7.1 models ->   582 requests  OK
#
#  ⚠ AND ITS COST IS NOT A BUDGET COST. A rotation changes what "daily" MEANS
#  for a given model: on a five-night rotation a model's evidence is up to
#  five days old, and the gate reads it as current because nothing records
#  when that model was last swept. That is rule 4 with a date on it — an
#  absence of recent evidence rendering as an absence of problems. A rotation
#  therefore needs a per-model last-swept timestamp before it is safe, and
#  that is a contract decision rather than a scheduler setting.
#
#  Raising the number remains the one option that is not a decision.
#
#  WHICH CADENCE AN ENTRY GETS IS DERIVED, NOT LISTED HERE.
#
#  It is a function of `stance` in queries.yaml and `failure_mode` in
#  capabilities.yaml, both of which already exist and are Engineer 2's to
#  set. A list of entry names here would be a second place to change when a
#  capability is added, and the kind that goes stale silently. See
#  `collect/adapters/queries/cadence.py`.
# ============================================================================

version: "1.0"


#: Requests per sweep, per cadence. The ceiling, not the target.
#:
#: `daily` is unchanged from the single per-sweep cap it replaces. That is
#: deliberate: the fix for a 49% overrun is not a bigger number.
sweep_budget:

  daily:
    max_requests: 900
    #: At GitHub's observed 30 search requests/minute (contract/sources.yaml).
    #: The minute figure is the one that survives a rate-limit change, so it
    #: is checked too rather than left implied by the request count.
    max_minutes: 35

  weekly:
    max_requests: 600
    max_minutes: 25


#: Days between sweeps. Read by the scheduler; recorded here so the cost
#: figures above can be re-derived rather than trusted.
cadence_days:
  daily: 1
  weekly: 7


# ============================================================================
#  ROTATION STALENESS BOUND  (#33, Q3)
#
#  The tracked set cannot grow past what the sweep can refresh before the
#  evidence decays. A 340-model rotation takes ~31 nights; judge/vet/weight.py
#  sets HALF_LIFE_DAYS_FAST = 30 for ops.latency_ttft — so a full pass would
#  refresh evidence more slowly than it decays and never catch up. last_swept_at
#  makes that visible; only a smaller tracked set closes it.
#
#  So the model count is NOT chosen — it FALLS OUT of a defended staleness bound.
#  `assert_staleness_within_bound` fails loudly when the tracked set's implied
#  rotation would exceed the bound, the same shape as `assert_within_budget`:
#  adding a model either fits or fails, and "77 was a limit" need not be
#  remembered.
#
#      models_per_night   = daily.max_requests // requests_per_model
#      rotation_nights    = ceil(tracked_count / models_per_night)   = staleness
#      assert staleness  <= staleness_bound_days
#
rotation:
  #: The maximum staleness the sweep will defend, in days. 7 is under a quarter
  #: of the 30-day fast half-life and a natural weekly cadence, and it happens to
  #: buy 77 slots against the daily cap — comfortably more than the ~50 the
  #: poller surfaces as slot-worthy. Chosen as a bound; the model count derives.
  staleness_bound_days: 7

  #: Requests to sweep ONE model, MEASURED not modelled (#33): 56 rendered forms
  #: x 16 request-issuing daily entries = 896 at 11 seeded models -> 81.45 per
  #: model, reproducing harvest.yaml's independently measured 4,073 at 50. A
  #: build fixture: when the tracked set changes shape this is re-measured
  #: rather than trusted.
  requests_per_model: 81.45


# ============================================================================
#  SIEVE LOCALITY
#
#  How far apart `topic` and `signal` may be, in characters, and still count
#  as one claim. Subject is deliberately not constrained: naming the model
#  once is how a post establishes what it is about, and a blog post that names
#  it in the introduction and reports the failure in the conclusion is the
#  ordinary shape rather than the exception.
#
#  WHY THERE IS A NUMBER HERE AT ALL. The first nine-feed blog harvest kept
#  exactly one document:
#
#      vickiboykis.com/2026/04/20/build-yourself-flowers/, 41,956 characters
#        subject  `flash 2.5`  "ran it through gemini flash 2.5 ... to break
#                              into paragraphs"
#        topic    `extract`    "i extracted each entry ... full metadata" —
#                              a museum API, not the model
#        signal   `held up`    "you're just going to get held up with your
#                              product" — meaning DELAYED
#
#  Three unrelated passages in one long essay, counted as a claim, because
#  nothing required them to be near each other. Blog articles have a median of
#  8,191 characters against GitHub's 2,228, so the same sieve was quietly
#  stricter on one platform than the other and had no way to know it.
#
#  MEASURED 2026-08-14 over 111 blog articles and 174 distinct GitHub
#  candidates. Every passing document, by the gap between its closest
#  topic-signal pair:
#
#      0      langchain#34371   "Pydantic Invalid For Json Schema ..."
#      356    aider#3713        diff edit format, `search block`
#      496    aider#3895        diff edit format, `search block`
#      3899   vickiboykis       the blog false positive above
#      4027   langchain#33651   the GitHub false positive
#
#  The two known false positives are the two far ones, and nothing sits
#  between 496 and 3899. That empty band is the whole argument — and it is
#  evidence for THE BAND, not for a particular number inside it.
#
#  WHY 1200 AND NOT 2000. The measurement does not distinguish them: every
#  value in (496, 3899) keeps and drops exactly the same documents on this
#  data. The number was chosen inside a band the data identified, and the
#  choice within the band is judgement, so here is the judgement:
#
#    scale        ~1200 characters is two or three paragraphs, plausibly the
#                 unit "the claim and what it is about" occupies. 2000 is a
#                 page; 600 is one paragraph.
#
#    asymmetry    and it points tighter than it first appears. Too loose
#                 admits co-occurrence artefacts, which cost extraction budget
#                 and lean on `yields_claim_when` downstream. Too tight
#                 silently drops evidence, normally the worse failure here —
#                 except that raw payloads are immutable and content-hash
#                 addressed, so a window that is too tight is fixed by
#                 RE-SIEVING the store. A document the sieve dropped is
#                 recoverable; a document never fetched is not. That makes the
#                 tighter end the cheaper mistake.
#
#                 The rejected text really is on disk, FOR THE PAGES THAT WERE
#                 STORED, and that qualifier is part of the claim rather than
#                 an exception to it. `search()` writes the search response to
#                 `raw/` BEFORE the sieve runs, so a hit the sieve threw away
#                 still has its title and body stored — but only page 1 is
#                 written. At `max_pages=1`, the default and every run so far,
#                 page 1 IS the result set and this holds unconditionally.
#                 Raise `max_pages` and pages 2+ are sieved and never stored.
#
#                 See the note in collect/adapters/github.py, which exists
#                 because reading "search, sieve, fetch" invites the opposite
#                 inference — and it was made. `pages_fetched`/`pages_stored`
#                 on `harvest_run` are proposed on #5 so a re-sieve can say
#                 "this run stored page 1 of 4" rather than leaving the reader
#                 to assume completeness.
#
#    reversibility  cheaper than first written here. Moving the window is this
#                 one line plus a re-sieve, and a re-sieve costs NOTHING: the
#                 text is local. A document the new window newly KEEPS costs
#                 one targeted REST call for its body — never a re-search,
#                 which is the rate-limited half (30/minute against core's
#                 5,000/hour, issue #4). So widening later is paid for per
#                 recovered document rather than per query, and the tighter
#                 end is cheaper to be wrong at than this file first claimed.
#
#                 The recovery is only ever as complete as the store, so the
#                 honest form of the claim is "recoverable for the pages that
#                 were stored" — true unconditionally at today's
#                 `max_pages=1`, and false the moment that changes without the
#                 coverage record proposed on #5.
#
#  So disagreeing with 1200 is cheap, and nothing measured argues against a
#  different value in the band.
#
#  THE CURVES DID NOT DIVERGE, which is why this is ONE number and not one per
#  source type. Both channels lose every far document by 3200 and keep every
#  near one from 600 up. Had they diverged, the number would have belonged per
#  source type and that would have been a contract question rather than a
#  rendering one.
#
#  ⚠ PROVISIONAL BY CONSTRUCTION. With one known-false positive per channel
#  and five passing documents in total, this measures how many documents a
#  window DROPS and cannot measure whether it drops real evidence. There is no
#  corpus with real positives in it yet. On blogs that is gated on the
#  registry rather than the sieve: 24.3% of articles name a versioned model
#  and only 6.6% name one the registry carries, so the corpus is thin for a
#  reason this number cannot fix.
#
#  WHAT WOULD REVISE IT: a re-run against a current registry, once the poller
#  has replaced contract/seed_models.yaml and the corpus contains documents
#  that are genuinely evidence. If real positives turn out to sit beyond 1200,
#  this is too tight and the measurement that says so does not exist yet.
#
#  Remove the key to disable locality entirely — absent means no window, which
#  is the pre-2026-08-14 behaviour.
# ============================================================================

sieve:
  locality_window: 1200


# ============================================================================
#  SPECIFICITY — E4's floor, and the ranking key E3 will later read
#
#  SHARED. Agreed with Engineer 2 on docs/specificity-score-report.md §7.
#
#  Five components, each COUNTED from the document text by
#  collect/triage/specificity.py. No language model participates: this is the
#  gate that decides whether a document costs an extraction call, and rule 2
#  forbids a model in counting, weighting, gating or ranking.
#
#  THIS IS NOT judge/vet/weight.py's f_specificity. Different granularity
#  (document vs claim), different inputs (counted vs two extractor-emitted
#  booleans), different range. They must never be merged AND NEVER COMPARED —
#  a reader seeing 0.7 in both will want them to mean the same thing.
#
#  THE WEIGHTS ARE PROVISIONAL, AND THIS IS THE SAME POSITION locality_window
#  WAS IN. Nothing measures them. There is no corpus labelled for specificity
#  to fit them against, so these five numbers are judgement stated as
#  judgement:
#
#    has_error_strings  highest, because a machine-emitted failure is the one
#                       signal a human cannot produce by having an opinion
#    has_numbers        a quantity with a unit is the difference between "it
#                       was slow" and "p95 was 4.2s"
#    has_code           a repro, a config, or a traceback someone pasted
#    names_version      necessary for attribution and cheap to satisfy, so it
#                       is weighted below the three that indicate measurement
#    has_conditions     LOWEST, and the weakest detector of the five: it reads
#                       stated values for conditions.yaml's three dimensions
#                       and a document can state a condition in prose it will
#                       not see
#
#  WHAT WOULD REVISE THEM: a re-score of the 174 GitHub candidates and 111
#  blog articles already in the raw store, against the ~10-15% triage survival
#  figure. That is a re-score and not a fetch, because raw payloads are
#  immutable and content-hash addressed. If the floor drops 90% of documents,
#  either these weights or the detectors are wrong.
#
#  A MISSING KEY HERE IS NOT A DEFAULT. Unlike sieve.locality_window, whose
#  absence disables locality, an absent weight RAISES. A scorer with no
#  weights would write zeroes into a real column, and a zero is a definite
#  value where the truth is "not configured" (rule 6).
# ============================================================================

specificity:

  # ⚠ PROVISIONAL · INTRA-CHANNEL ONLY · NEVER CALIBRATED
  #
  # A weight in a contract file with no caveat reads as a decision somebody
  # made. Nobody made these. They are five judgement calls, and #24 closed with
  # a ruling that bounds what they may be used for.
  #
  #   THE COMPOSITE MAY NOT COMPARE ACROSS CHANNELS. EVER.
  #
  # Engineer 2's argument, and it goes further than the measurement did:
  # has_error_strings (0.30) and names_version (0.15) are 0.45 of the weight,
  # and on this corpus both are largely a proxy for MEDIUM — 42.0% against 3.6%
  # and 48.3% against 6.3%, GitHub against blogs. So the composite ranks media
  # while wearing the clothes of ranking documents. A cross-channel sort by
  # specificity_score is a sort by "is this GitHub" with extra steps.
  #
  # Measured means, docs/measurements/specificity-backfill.md: github 0.527,
  # blogs 0.286. Blogs are the ONLY positive-evidence channel (collect/CLAUDE.md),
  # so a cross-channel sort demotes exactly the evidence the product exists to
  # find. Rule 4 arriving somewhere new: absence of an error string scored as
  # absence of specificity.
  #
  # AND THIS IS WHY "DO NOT CALIBRATE YET" IS A SAFE ANSWER RATHER THAN A
  # DEFERRAL. The floor does not read these weights at all — it is a five-way OR
  # over the components (see floor_clears_on). Every gate that drops a document
  # today is weight-independent and stays correct under any weighting. The
  # weights only order documents that have already been kept, and while that
  # ordering is intra-channel the bias above cannot express itself.
  #
  # What would change that: any corpus-wide "best evidence" list, triage
  # priority queue, or cross-source ranking. If one is proposed, calibration
  # stops being optional and this block is where the argument belongs.

  weights:
    has_error_strings: 0.30
    has_numbers:       0.25
    has_code:          0.20
    names_version:     0.15
    has_conditions:    0.10

  # The floor from docs/logic-and-workflow.md §8: "no numbers, no error
  # strings, no code, no conditions, no version named -> opinion, not
  # evidence".
  #
  # LISTED AS WHAT CLEARS IT, NOT AS A THRESHOLD ON THE COMPOSITE, and the
  # difference is not cosmetic. The floor is a five-way OR over the components:
  # it does not read the weights at all, so its verdicts are as solid as the
  # detectors. A cutoff on the weighted sum is a DIFFERENT RULE that merely
  # agrees with it today — `score > 0` and `any(component)` happen to coincide
  # while every weight is positive.
  #
  # They diverge the moment anyone calibrates. The weights above are
  # provisional and nothing measures them yet; the first re-score that moves
  # one to zero, or introduces a threshold above zero, separates the two rules
  # silently. Writing the floor as a component list means a weight change
  # cannot alter which documents are dropped, only how the survivors rank.
  #
  # A document with none of these is retained and not sent to the extractor.
  # A document that has never been SCORED is neither — see FloorVerdict.UNKNOWN.
  floor_clears_on:
    - has_numbers
    - has_error_strings
    - has_code
    - has_conditions
    - names_version


# ============================================================================
#  EVIDENCE TIER BY WHAT THE EVIDENCE CARRIES
#
#  ⚠ RULED 2026-08-30. E2 delegated the tier decision to E1 and asked for
#    Option 2 of docs/proposals/for-engineer-2-tier-a-is-unreachable-by-
#    construction.md, capped at B. This block is that ruling. It supersedes
#    `evidence_tier_by_speaking`, which keyed on `speaking` alone and is gone.
#
#  WHAT WAS WRONG WITH KEYING ON `speaking` ALONE: `TIER_WEIGHT`'s own glosses
#  describe HOW CHECKABLE a report is, and `speaking` describes WHOSE report it
#  is. Two axes, one key. An engineer who publishes repro steps and numbers, and
#  an engineer who writes "opus feels slow", were both `own-experience` and
#  therefore both tier D - an 8.3x difference in the gloss, collapsed to nothing
#  by the key. Measured: 0 of 197 stored claims across three platforms reached
#  A, B or C, because no value the extractor can emit mapped above D. Tiers
#  worth 1.00, 0.65 and 0.35 were unreachable BY CONSTRUCTION.
#
#  THE KEY IS NOW (speaking, has_repro_steps, has_numbers). Both booleans are
#  already on `claim`; nothing new is extracted and no model call is added.
#
#  THE ORDER THE OLD BLOCK CALLED NON-PROVISIONAL IS PRESERVED. A vendor is
#  still below a relay, and a relay still below first-hand. Only `own-experience`
#  gained rungs, and it gained them upward from D, so no claim moves DOWN under
#  this ruling.
#
#  ── THE CAP IS B, AND THAT IS RULE 8, NOT MODESTY ─────────────────────────
#
#  `has_repro_steps` is the extractor's own boolean and its error rate has never
#  been measured against a population it did not choose. Round 3 of the golden
#  set is what would measure it and it is UNLABELLED. Rule 8 says an unmeasured
#  check ships as a weight and never as a gate: `evidence_tier` IS a weight
#  (`f_evidence`), the gate is `n_eff >= 3.0`, so shipping this is inside the
#  rule - but promoting to A on that boolean would make the extractor's
#  self-report the thing that clears the bar tier A's gloss reserves for
#  "published harness/prompts, N runs, numbers; or a GitHub repro". A stays a
#  rung a human confirms. Promote to A when round 3 is labelled and the booleans
#  have a measured error rate, and not before.
#
#  ── has_numbers IS FALSIFIED BY CODE BEFORE IT MAY PROMOTE ────────────────
#
#  `claim.has_numbers` is self-reported by the extractor. `document.has_numbers`
#  is the same question asked of the same text by CODE, and
#  collect/triage/specificity.py states its one-directional standing: it
#  FALSIFIES and it cannot confirm.
#
#    document.has_numbers False  ->  a claim asserting has_numbers is a
#                                    fabrication. There are no numbers to quote.
#    document.has_numbers True   ->  says NOTHING about whether THIS quote
#                                    contains one.
#
#  So the promotion requires BOTH, and that is the falsifier used as a veto
#  rather than as a confirmation: code can block a promotion, code never grants
#  one. A NULL `document.has_numbers` is not a veto and not a confirmation - it
#  is absent, so the numbers rung is not reached and the run says how many
#  claims that happened to (rule 6: absent stays absent, and say so).
#
#  There is NO code-side falsifier for `has_repro_steps`. That asymmetry is a
#  second reason B is the ceiling, and it is not a gap to be closed by inventing
#  one: `document.has_code` is a different question, and reading it as a repro
#  check is the class of error recorded in docs/measurements/control-and-reshape.md.
#
#  ── WHAT THIS BLOCK DOES NOT FIX, AND IT MAKES IT WORSE ───────────────────
#
#  ⚠ `has_numbers` AND `has_repro_steps` NOW PRICE ONCE IN THE TIER AND ONCE IN
#    `f_specificity`. The old block named this and used it as the argument for
#    NOT promoting: "raising the tier on the same signals would price one fact
#    twice - the defect this project has already recorded under `version_named`".
#    E2's ruling overrides the conclusion; it does not make the objection false.
#
#    Measured on the factors as they stand:
#
#      f_specificity   version only         0.44
#                      version + both       0.86      1.95x
#      f_evidence      D -> B                         5.42x
#      combined lift on one claim                    10.6x
#
#    A claim carrying both signals is now worth 10.6x a bare opinion, of which
#    1.95x is counted twice. De-duplicating means dropping `has_numbers` (0.2)
#    and `has_repro_steps` (0.4) from `specificity_factor()`, which changes every
#    stored weight in a second way and is a SEPARATE ruling. It is not taken
#    here. Recorded so the next reader finds a known over-weight rather than
#    discovers one.
#
#  ── THE VENDOR CASE, CHECKED BEFORE THIS LANDED ───────────────────────────
#
#  `vendor-about-own-product` HAS NO RUNGS. A vendor announcement stays F (0.02)
#  however many numbers it carries, so a correctly-filed launch post cannot get
#  heavier under this change. Verified against the one instance held locally:
#  the auto-mode post's "none of the 720 attack attempts succeeded" is
#  `vendor-about-own-product` with `has_numbers: true`, and it stays F.
#
#  THE RESIDUAL RISK IS A MISFILED ONE, and E6 does not cover it. E6's five
#  triggers are affiliate_link, sponsored_disclosure, discount_code,
#  syndicated_duplicate and predates_model - NONE of them detects a vendor
#  announcement. So wiring E6 (2026-08-29) did not and could not guard this;
#  what guards it is `speaking`, which is the extractor's own label and is
#  unmeasured on the same golden-set round. An announcement the extractor files
#  as `own-experience` carries numbers by construction and would promote.
#  `judge/reweight.py` COUNTS those - promotions on documents whose host is a
#  provider domain - and reports them per model. A count, not a gate: rule 8,
#  and it is the population round 3 should be asked about first.
# ============================================================================

evidence_tier_rules:

  # ⚠ PROVISIONAL IN THE SAME SENSE AS specificity.weights: nothing has
  #   calibrated the DISTANCE between these tiers. What is not provisional is
  #   the ORDER. The values 1.00/0.65/0.35/0.12/0.04/0.02 live in
  #   judge/vet/weight.py TIER_WEIGHT and are NOT changed by this ruling.
  #
  #   An absent or unknown key here does NOT fall back to a tier. `compute()`
  #   refuses and names the gap, per the 2026-08-21 ruling that a weighting
  #   input may not have a silent default.

  own-experience:
    # Both signals. "detailed first-hand build report: task, versions,
    # conditions" - B's own gloss, and the ceiling this ruling allows.
    repro_steps_and_numbers:  B
    # One of the two. C's gloss says "qualitative first-hand with conditions";
    # this keys on one-of-two rather than on conditions, because
    # `has_conditions` is a DOCUMENT-level boolean that is False on all 7
    # populated rows and NULL on 57 - keying C on it would make C unreachable
    # in the same way `speaking` made B unreachable. This is the rung to
    # revisit first when round 3 is labelled.
    one_of_the_two:           C
    # Unchanged. "bare first-hand opinion".
    neither:                  D

  # UNCHANGED, AND NO RUNGS. Numbers in a relay are still someone else's
  # numbers; numbers in a launch post are still the vendor's.
  relayed-from-elsewhere:     E
  vendor-about-own-product:   F

  # WEIGHTING ONLY. `speaking` never gates storage, and the reason is that the
  # field has never run: its accuracy is unmeasured on exactly the decision it
  # would be making. A claim the model mislabels must still exist, or a
  # mislabelling is invisible and unfixable. Recorded here because a future
  # reader will otherwise wonder why F is stored at all rather than dropped.
  not_a_storage_gate: true


# ============================================================================
#  DEDUPE — FR-16. Syndicated copies contribute to REACH, never to WEIGHT.
#
#  SHARED. One blog syndicated four times and quoted twice is one person, and
#  counted naively it looks like six-source consensus — so the publication gate
#  would pass on a single voice. That is what this block governs.
#
#  ⚠ ONE METHOD, NOT TWO, AND THE MEASUREMENT IS WHY.
#
#  collect/CLAUDE.md specified MinHash below ~200 tokens and simhash above.
#  Measured over 79 ground-truth duplicate pairs and 951 stranger pairs from
#  3,767 Reddit documents, the split is not supported: MinHash separates better
#  at EVERY length, and simhash's margin at 400-800 tokens is ONE BIT of 64.
#  Re-run in simhash's conventional word-3-gram tf-weighted form its margins
#  were 0-12 bits, so that is not an artefact of the feature choice.
#
#  document.simhash therefore stays NULL. That is a measured decision, not an
#  unimplemented column. Full curve: docs/measurements/dedupe-threshold.md.
#
#  ⚠ min_tokens_for_signature IS A FLOOR, NOT A SWITCH.
#
#  Below it no signature is computed, because neither method separates
#  duplicates from strangers there. What still applies below the floor is
#  certainty rather than similarity: platform-declared crossposts, and exact
#  normalised match with the [deleted]/[removed] sentinels excluded — those
#  appear 57 and 38 times as identical bodies of DISTINCT comments in one
#  corpus, and merging them would collapse a thread.
#
#  THE BAND THE DATA SUPPORTS IS (50, 200). Failure is demonstrated below 50
#  tokens; success is demonstrated at 200. The two bands between carry n=2 and
#  n=4 true pairs, which is too thin to claim either way, so every value in
#  (50, 200) is consistent with the evidence and the choice inside it is
#  judgement:
#
#    collect/CLAUDE.md — "Over-clustering is worse than under-clustering.
#    Merging two genuinely independent reports destroys corroboration, which is
#    the only thing separating 'someone said this' from 'this is probably
#    true'."
#
#  A HIGHER floor merges fewer documents, so conservative means high, and the
#  lane's own rule says which direction conservative is. 200 is the top of the
#  band. It is the same number collect/CLAUDE.md already carried and it does
#  not mean the same thing — that one switched between methods.
#
#  PROVISIONAL. 79 true pairs is thin, all of them Reddit self-syndication and
#  crossposts; the corpus contains no blog syndication at all, so nothing here
#  is measured on the channel FR-16's own example is about.
#
#  WHAT WOULD REVISE IT: true pairs in the 50-200 band, where n is 2 and 4, and
#  any blog syndication once more feeds are harvested. If pairs at 60 tokens
#  separate as cleanly as those at 200, the floor should come down and more
#  documents become deduplicable.
# ============================================================================

dedupe:

  #: Whitespace tokens of signature text below which no signature is computed.
  #: A floor, not a method switch. See the band argument above.
  min_tokens_for_signature: 200

  #: Estimated Jaccard at or above which two signatures are one document.
  #: The tightest passing band measured true pairs from 0.62 and strangers to
  #: 0.16, so 0.80 sits inside a wide gap rather than on a boundary — and high
  #: is the safe end, because over-merging destroys corroboration.
  similarity_threshold: 0.80
