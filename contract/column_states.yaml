  board_entry:
    axis_quoted:
      known_gap: the writer is #368 item 3 (store_entries, beside axis_slug) and the renderer is item 4 (db.js/views.js) - both hers, both held until this column exists
      reviewed: true
      state: unwired
      why: >-
        Added by 20260921T1330 for #368. Three states - NULL predates the
        check, true means the axis was copied and found in the quote, false
        means checked and not backed by it. UNWIRED on purpose and briefly:
        the writer is item 3 and the page is item 4, both hers, and she is
        holding them until this column exists rather than writing against one
        that does not. Declared rather than deferred (rule 9): the readers are
        named and the reason they cannot read yet is that the column landed
        first, by agreement.
    axis_verbatim:
      known_gap: the writer is #368 item 3; the value already exists on the extraction schema and is discarded at write time
      reviewed: true
      state: unwired
      why: >-
        Added by 20260921T1330. The benchmark name copied from the quote.
        Carried on the extraction schema since #385 and thrown away at write
        time - `axis_slug()` used it to set `slug` and discarded it - so a
        stored row could not be asked what its slug came from. Intended reader
        is the metrics page via #368 item 4.
    subject_verbatim:
      known_gap: the writer is #368 item 3; same discard, and it is the field the Spotify/Gemini misattribution turns on
      reviewed: true
      state: unwired
      why: >-
        Added by 20260921T1330. The model name copied from the quote, NULL
        when the quote named none. The live case: three entries attribute a
        capability to google/gemini-2.5-flash from a Spotify post whose quotes
        say only "the worker model". NULL here beside a non-NULL
        model_version_id means the attribution was inferred from the document
        rather than read from the quote. Intended reader is the same page.
    basis:
      reviewed: true
      state: read
    claim_id:
      reviewed: true
      state: read
      why: 'Written so an entry can be traced back to the claim it came from. It was write_only until
        2026-09-14, when the reader it was kept for finally arrived: scripts/repair_board_entry_quotes.py
        joins through it to reach claim.quote_raw_offset, because the board''s copy of the quote carries
        no offset of its own and the span that re-slices it lives on the claim. "A reader will want it
        the first time somebody asks why a section ranks where it does" was the stated expectation; the
        actual first reader asked something narrower - where in the source this quote was cut from - and
        the trace was there because it had been kept.

        '
    created_at:
      reviewed: true
      state: defaulted
      why: 'DEFAULT now(), never written by us - the INSERT does not name it - and read by board_sections
        and evidence_for_model to order newest-first. Declared `read` at first, which the audit correctly
        refused: `read` asserts written-and-read, and the discovered state was UNWRITTEN, read. Same shape
        and same declaration as capability_candidate.created_at.

        '
    definition:
      reviewed: true
      state: read
    document_id:
      reviewed: true
      state: read
    id:
      reviewed: true
      state: read
      why: 'The primary key, and the ON CONFLICT target that makes a re-run idempotent. No PAGE selects
        it back - every page reader groups by section and slug, because a board section is a group of
        entries rather than a row - but it stopped being write_only on 2026-09-14.
        scripts/repair_board_entry_quotes.py both reads and rewrites it, and the reason is the property
        this column has that a surrogate key would not: `entry_id()` hashes the quote INTO the id, so a
        repaired quote belongs under a different id. Leaving the id alone would have left a key that no
        longer describes its content, and the next correct run would have computed the right hash, missed
        the ON CONFLICT, and appended a second row beside the repaired one. The script verifies the
        derivation reproduces the stored id on every planned row before it rewrites any.

        '
    model_scope:
      reviewed: true
      state: write_only
      why: 'searched | mentioned | NULL. Written by judge/store/board_entries.py:store_entries from the
        run''s own subject; read by nothing yet. DECLARED RATHER THAN DEFERRED (rule 9): the intended
        reader is the board itself, which should say which population a section''s counts were drawn from
        - a model searched exhaustively and one mentioned once in a comparison currently contribute to
        the same figure with nothing distinguishing them (rule 7). It cannot read it yet because that
        is a change to what the page MEANS and is a product decision, not a query change. Recorded now
        because the distinction used to live in the id SHAPE by accident and stopped being visible on
        2026-09-11 when the read path learned to resolve both shapes to one name.

        '
    model_version_id:
      reviewed: true
      state: read
    name:
      reviewed: true
      state: read
    pipeline_version:
      reviewed: true
      state: read
      why: 'Part of the natural key, so a re-run at a new version appends rather than colliding. Same
        role as on `claim` and `thread_extraction`. Read since 2026-09-14 by
        scripts/repair_board_entry_quotes.py, which must feed the row''s OWN stored version back into
        `entry_id()` to recompute a key - using today''s version would silently rekey an old row into a
        new generation and break exactly the idempotence this column exists to provide.

        '
    polarity:
      reviewed: true
      state: read
    proposer_model:
      reviewed: true
      state: write_only
      why: 'Which model classified the row, for when the extractor changes and a board section needs attributing
        to one or the other. Recorded now because it cannot be reconstructed later.

        '
    quote:
      reviewed: true
      state: read
    quote_verified:
      reviewed: true
      state: read
      why: 'CHECKed true by the table. The column exists so the database refuses an unverified quote
        rather than trusting the writer - rule 1 restated in the schema - and no page selects it, because
        every row that exists has already satisfied it. Read since 2026-09-14 by
        scripts/repair_board_entry_quotes.py, and read there for the opposite purpose to a page''s: it
        counts the true rows before and after its UPDATE and rolls back if the number moves. A repair
        that alters what "verified" covers would be a worse defect than the one it repairs, so the
        invariant is checked rather than assumed. That is a read of the column as an ASSERTION, not as
        data - the distinction #275 is about.

        '
