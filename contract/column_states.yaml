      reviewed: true
      state: read
      why: lifted for the same reason, and /fetch/runs still matches on the run_id prefix rather than
        this. Read since 2026-09-14 by judge/fetch_reaper.py, which carries the run's own value onto the
        end record it appends - the reaper writes a line ABOUT a run rather than one of its own, so
        every lifted column on that row has to come from the run rather than from the reaper.
    payload:
      reviewed: true
      state: read
      why: selected — the line verbatim, which is what the fetch view renders
    recorded_at:
