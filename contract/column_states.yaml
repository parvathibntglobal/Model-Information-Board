    quota_reset_seconds:
      reviewed: true
      state: read
      why: 'PROMOTED FROM write_only; THE NAMED READER WAS BUILT. It was declared unconsumed with the
        usage panel as its blocked intended reader, because the panel had no window display - it said
        "monthly" and no measurement supported that. The panel now has one: judge/app.py _QUOTA_SELECT
        selects it, and _quota_window dates the next boundary from read_at + this header, in preference
        to the measured anchor. NULL stays "not recorded" and never "resets now" (rule 6) - every row
        written before the writer carried this column is NULL, and _quota_window falls back to the
        measured anchor rather than inventing a boundary.'
    read_at:
      reviewed: true
      state: read
      why: selected, and compared in the upsert's WHERE so the newest READING wins rather than the newest
        write
    read_by:
      reviewed: true
      state: read
      why: selected; says whether a harvest, a sweep or a probe took the reading
    recorded_at:
      reviewed: true
      state: write_only
      why: written explicitly - the upsert's DO UPDATE sets recorded_at = now(), so a re-read of an existing
        meter refreshes it rather than leaving the DEFAULT from the first insert. Nothing reads it back;
        it exists to separate when the reading was TAKEN (read_at) from when it reached the table, which
        a backfill makes differ by days
