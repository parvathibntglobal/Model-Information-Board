# Declared state of every schema column.
#
# ⚠ contract/ IS SHARED. Adding a column means adding a line here, and that is
#   the point: the state is DECLARED rather than DISCOVERED.
#
# THE PROPERTY THIS GUARDS
#
# Not "every column is read" - write_only is often correct, and five columns
# below are deliberately so. The property is that somebody wrote down which,
# and why. 138 of 306 columns were in a state nobody had declared when this
# file was generated (docs/measurements/column-audit-306-columns.md).
#
# tests/test_column_states.py asserts:
#   1. every column in the live schema has an entry here   <- fails on the 307th
#   2. the discovered state matches the declared one, unless `known_gap` says
#      why it does not
#
# Step 1 is the value. A snapshot of today's 306 passes forever and says nothing
# about the next column. Same arrangement as cli.py's AST guard, where read-only
# commands must be listed explicitly so an unclassified one fails rather than
# running unguarded - and for the reason that guard records: a behavioural test
# cannot see a path that never had a check.
#
# STATES
#
#   read               written, and read by a SELECT in this repository
#   read_not_by_query  READ, by something the static audit cannot see - YAML,
#                      config, a person reading the row. Requires `why` naming
#                      the reader. This exists so reads-through-YAML are a
#                      declared state rather than a growing exception list
#   write_only         written deliberately and not read. Requires `why`
#   generated          a GENERATED column. Never written by us
#   defaulted          a DB DEFAULT supplies it. Never written by us
#   unwired            a reader exists and the writer is a known missing stage.
#                      Requires `known_gap` naming what is missing
#   reserved           neither written nor read, deliberately, awaiting a stage
#
# `reviewed: false` means THIS ENTRY IS A SNAPSHOT, not a decision - the state
# was discovered by the audit and nobody has ruled on it. It is not a pass. The
# count of them is the remaining debt and the test prints it.

