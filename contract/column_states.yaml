        in collect/ops/chain.py and by scripts/triage_stored_corpus.py; read by scripts/corpus_inventory.py.
        The `why` above said "a consumer exists; the writer is Stage(''triage'', run=None) in chain.py"
        and the `known_gap` said "E2''s lane - triage is unwired". BOTH WERE TRUE AND THE GAP WAS THE
        DANGEROUS HALF: a known_gap exempts an entry from the mismatch check, so this column could gain
        its first writer and nothing would notice - exactly what happened to `filter_reasons` above, one
        column earlier, for the same reason. The gap is removed rather than reworded. NOTE THAT `document.status`
        IS STILL UNWRITTEN and that is deliberate rather than pending: two of six gates cannot run, so
        rule 8 keeps triage a recorded field and `status` is the gate action judge/ filters on'
