  rapidapi_quota_reading:
    id:
      reviewed: true
      state: write_only
      why: 'CORRECTED AFTER THE AUDIT DISAGREED. Declared `read` first, copying spend_ledger.id -
        and the audit discovered "written, UNREAD". The audit is right and the copy was wrong:
        spend_ledger.id earns `read` on TWO readers, `on conflict (id) do nothing` AND `where id =
        any(...)` in scripts/backfill_telemetry.py. This table has only the first, and a conflict
        target is not a read the column scan can see. The deduplication is real and happens at
        write time; it is simply not a SELECT. Intended reader is the usage panel''s quota series,
        which cannot read it yet because that display is not built and the table holds no rows
        until its migration is applied (rule 9).'
    key_fingerprint:
      reviewed: true
      state: write_only
      why: 'DECLARED UNCONSUMED, intended reader named (rule 9). Which SUBSCRIPTION this reading is of,
        sha256(key)[:12] and never the key. Load-bearing for the series specifically: without it a run of
        readings spanning a key change reads as ONE counter that jumped, which is a wrong finding rather than a
        missing one. NULL is "not recorded", never "a different account". The intended reader is the usage
        panel''s quota series, which cannot read it yet because that display is not built - the table is new and
        holds no rows until the first metered call after its migration is applied.'
    machine:
      reviewed: true
      state: write_only
      why: 'DECLARED UNCONSUMED, intended reader named (rule 9). Which host OBSERVED the reading - provenance, not
        ownership; the counter belongs to the subscription named by key_fingerprint. In the hash so two hosts
        reading one shared counter in the same instant are two observations rather than a duplicate. The
        intended reader is the usage panel''s quota series, which cannot read it yet because that display is not
        built - the table is new and holds no rows until the first metered call after its migration is applied.'
    meter:
      reviewed: true
      state: read
      why: 'PROMOTED FROM write_only; THE NAMED READER WAS BUILT. The blocked intended reader was the usage
        panel''s quota series, and judge/app.py _rapidapi_series is now it - this column is the WHERE clause
        that scopes the series to one arm, so a reading history is per-meter rather than two subscriptions
        interleaved. Still deliberately NOT a foreign key to rapidapi_quota: that table holds only the latest
        row per meter, and a history deletable by tidying the thing it is the history OF is not a history.'
    observed_at:
      reviewed: true
      state: write_only
      why: 'DECLARED UNCONSUMED, intended reader named (rule 9). When THIS call recorded the reading, microseconds -
        distinct from read_at, which is second resolution. It exists because hashing read_at (spend_ledger''s
        scheme) would give two calls in the same second carrying the same figures one id, and `do nothing` would
        drop the second. That is the case this table is FOR: an unmoved counter between two calls is the
        consumption signal, so the lost row would be the one carrying the finding. The intended reader is the
        usage panel''s quota series, which cannot read it yet because that display is not built - the table is
        new and holds no rows until the first metered call after its migration is applied.'
    quota_limit:
      reviewed: true
      state: write_only
      why: 'DECLARED UNCONSUMED, intended reader named (rule 9). The denominator as this reading stated it, never
        inherited from another reading - the arms are separately metered. The intended reader is the usage
        panel''s quota series, which cannot read it yet because that display is not built - the table is new and
        holds no rows until the first metered call after its migration is applied.'
    quota_remaining:
      reviewed: true
      state: read
      why: 'PROMOTED FROM write_only; THE NAMED READER WAS BUILT. The blocked intended reader was the usage
        panel''s quota series, and judge/app.py _rapidapi_series is now it - selected, and differenced between
        the first and last reading to give consumption. The select excludes NULLs rather than reading them as
        zero, because a reading that stated no remainder is not a counter at zero (rule 6), and a rate needs two
        points, so `readings: 1` renders as no rate rather than as no consumption.'
    quota_reset_seconds:
      reviewed: true
      state: write_only
      why: 'DECLARED UNCONSUMED, intended reader named (rule 9). Seconds remaining until this meter''s window
        resets, as read. Carried from the first row so window BOUNDARIES are datable without a backfill - which
        could not supply it anyway, the header having never been stored. A boundary is where this jumps up
        instead of counting down. The intended reader is the usage panel''s quota series, which cannot read it
        yet because that display is not built - the table is new and holds no rows until the first metered call
        after its migration is applied.'
    read_at:
      reviewed: true
      state: read
      why: 'PROMOTED FROM write_only; THE NAMED READER WAS BUILT. The blocked intended reader was the usage
        panel''s quota series, and judge/app.py _rapidapi_series is now it - selected, ordered by, and the span
