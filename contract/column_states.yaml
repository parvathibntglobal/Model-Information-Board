        what stops a syndicated copy counting as an independent voice
    is_self_post:
      reviewed: true
      state: read
      why: 'ADDED 2026-09-08 (migration 20260908T1500) so triage.gates.pure_link_post has an input for
        the first time - it read `Document.is_self_post` from the day it was written and no column carried
        it, so the gate returned NOT_APPLICABLE on all 5,010 triaged documents in the first real run.
        Written by collect/adapters/reddit_write.py and collect/adapters/documents.py (Hacker News drafts),
        and backfilled from stored payloads by scripts/backfill_is_self_post.py - 1,517 rows placed, 852
        self posts and 665 link posts. SELECTed by collect/triage/run.py:_SELECT and passed to the gate,
        which now fires on 1,517 documents and drops 224. THREE STATES AND ALL THREE MEAN SOMETHING (rule
        6): true a self/text post, false a LINK submission, NULL the platform has no such notion for this
        record - a blog article, a GitHub issue, and A COMMENT ON ANY PLATFORM, which is permanent rather
        than a gap. NO DEFAULT, deliberately: `false` is a definite claim and pure_link_post DROPS a link
        post with no commentary, so a default would have turned 6,502 unknowns into droppable documents.
        1,482 reddit rows are still NULL for three different reasons - 1,234 payloads absent from the
        backfilling host, 247 present and not JSON, 1 a comment - and only the last is correct rather
        than fixable. The POSTER''S COMMENTARY is deliberately not a column: it is `selftext`, which text_ref
        already addresses, and collect/triage/run.py:_own_commentary reads it from the payload'
    lang:
      reviewed: true
      state: read
      why: 'UN-RESERVED 2026-09-08 as write_only, and READ THE SAME DAY - the two changes landed hours
        apart and the discovered-state check caught the second, which is the guard doing its job twice
        on one column. Written by collect/adapters/documents.py for the five new platforms; SELECTed by
        collect/triage/run.py:_SELECT and passed to triage.gates.wrong_language. ⚠ READ IS NOT ACTED ON.
        That gate returns UNAVAILABLE for every document because no detector is installed and no allow-list
        is configured, and it returns NOT_APPLICABLE for a NULL - so the value reaches a gate that currently
        decides nothing, and this column is `read` by the audit''s definition (a SELECT in this repository)
        rather than by consequence. Measured on the first triage run: wrong-language ran on 0 of 5,010
        triaged. THE VALUE IS THE PLATFORM''S OWN FIELD AND NEVER AN INFERENCE (dev.to''s `language`,
        X''s `lang`), which is why rule 8 makes it a recorded field rather than a gate input. Enabled
        at collection time because the input CANNOT BE BACK-FILLED without re-reading every stored payload.
        NULL stays NULL - a platform that declares no language gets no guess (rule 6), and 6,502 existing
        rows keep their NULLs, which is why a detector alone would still leave this gate with no input
        on the stored corpus'
