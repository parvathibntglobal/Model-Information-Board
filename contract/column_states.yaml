      reviewed: true
      why: >-
        as dedup_cluster_id
      known_gap: >-
        E1's lane - dedupe is unwired
    lang:
      state: read
      reviewed: true
      why: >-
        UN-RESERVED 2026-09-08 as write_only, and READ THE SAME DAY - the two changes landed hours apart and the discovered-state check caught the second, which is the guard doing its job twice on one column. Written by collect/adapters/documents.py for the five new platforms; SELECTed by collect/triage/run.py:_SELECT and passed to triage.gates.wrong_language. ⚠ READ IS NOT ACTED ON. That gate returns UNAVAILABLE for every document because no detector is installed and no allow-list is configured, and it returns NOT_APPLICABLE for a NULL - so the value reaches a gate that currently decides nothing, and this column is `read` by the audit's definition (a SELECT in this repository) rather than by consequence. Measured on the first triage run: wrong-language ran on 0 of 5,010 triaged. THE VALUE IS THE PLATFORM'S OWN FIELD AND NEVER AN INFERENCE (dev.to's `language`, X's `lang`), which is why rule 8 makes it a recorded field rather than a gate input. Enabled at collection time because the input CANNOT BE BACK-FILLED without re-reading every stored payload. NULL stays NULL - a platform that declares no language gets no guess (rule 6), and 6,502 existing rows keep their NULLs, which is why a detector alone would still leave this gate with no input on the stored corpus
