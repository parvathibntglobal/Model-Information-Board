  fetch_log:
    at:
      reviewed: true
      state: read
      why: 'the line''s own timestamp is inside `payload` too, and the fetch view still renders it from
        there. This lifted copy stopped being unread on 2026-09-14: judge/fetch_reaper.py groups the
        whole table by run and takes max(at) to find runs that have gone silent, which is a per-run
        aggregate the payload copy cannot answer without opening every line''s JSON. The column was
        lifted so a run could be summarised cheaply and this is the first query that actually needed
        that.'
    id:
      reviewed: true
      state: read
      why: content id; `on conflict (id) do nothing` in both the live mirror and the backfill, which is
        what makes replaying a run's file free
    kind:
      reviewed: true
      state: read
      why: 'lifted from the payload so a run could be summarised without reading every line, and for a
        year nothing did. judge/fetch_reaper.py now does exactly that: `HAVING bool_or(kind = ''end'')
        = false` is how a run with no end record is found, over the whole table, without opening a
        single payload. Checked before relying on it - `kind` and `payload->>''kind''` disagree on 0
        rows - because a lifted copy that had drifted from its source would make the reaper miss
        finished runs and mark them abandoned.'
