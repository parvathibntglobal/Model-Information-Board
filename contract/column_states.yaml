    id: {state: read, reviewed: false}
    is_self_post:
      state: read
      reviewed: true
      why: >-
        ADDED 2026-09-08 (migration 20260908T1500) so triage.gates.pure_link_post has an input for the first time - it read `Document.is_self_post` from the day it was written and no column carried it, so the gate returned NOT_APPLICABLE on all 5,010 triaged documents in the first real run. Written by collect/adapters/reddit_write.py and collect/adapters/documents.py (Hacker News drafts), and backfilled from stored payloads by scripts/backfill_is_self_post.py - 1,517 rows placed, 852 self posts and 665 link posts. SELECTed by collect/triage/run.py:_SELECT and passed to the gate, which now fires on 1,517 documents and drops 224. THREE STATES AND ALL THREE MEAN SOMETHING (rule 6): true a self/text post, false a LINK submission, NULL the platform has no such notion for this record - a blog article, a GitHub issue, and A COMMENT ON ANY PLATFORM, which is permanent rather than a gap. NO DEFAULT, deliberately: `false` is a definite claim and pure_link_post DROPS a link post with no commentary, so a default would have turned 6,502 unknowns into droppable documents. 1,482 reddit rows are still NULL for three different reasons - 1,234 payloads absent from the backfilling host, 247 present and not JSON, 1 a comment - and only the last is correct rather than fixable. The POSTER'S COMMENTARY is deliberately not a column: it is `selftext`, which text_ref already addresses, and collect/triage/run.py:_own_commentary reads it from the payload
    is_canonical_in_cluster:
