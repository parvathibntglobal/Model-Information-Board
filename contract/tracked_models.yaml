# The models the board puts on its registry page, and why it is a list.
#
# WHY THIS FILE EXISTS
#
# `model_version` holds 344 rows because the OpenRouter poll brings back every
# model the router carries. That is the right thing for the registry to HOLD and
# the wrong thing for a page to SHOW: a reader looking for the models this board
# has opinions about does not want a router's catalogue.
#
# Until 2026-09-15 the page solved that by not reading the registry at all —
# `web/src/api/index.js` returned a hardcoded array of two models and never
# called the backend. So the page called "The registry" rendered a constant, its
# summary line ("Two models are being tracked") was a string, and the hosted
# build and the local one disagreed because they were different constants. This
# file replaces the constant with config, which is rule 5: configuration lives in
# versioned YAML where a change is reviewable.
#
# ⚠ A PRICE IS NEVER WRITTEN HERE.
#
#   `registry` names a row in `model_version` and every figure — price, context,
#   flags — is read from it live. Writing a price into this file would be a
#   number with no provenance and no way to go stale visibly, which is the
#   opposite of what `pricing_history` and the 24-hour price-change rule exist
#   for. An entry with `registry: null` shows "no rate", and that is the honest
#   state rather than a gap to be filled in by hand.
#
# ⚠ WHY FIVE OF THESE HAVE NO REGISTRY ROW, AND WHY THAT IS NOT A TODO.
#
#   `model_version.price_in` is USD PER 1M TOKENS (contract/tables.sql:39; the
#   page labels it "PER MTOK · IN / OUT"). That unit fits a language model. It
#   does not fit the rest:
#
#       an image model   is priced per image
#       a video model    per second of output
#       a speech model   per character, or per minute of audio
#
#   So there is no number that could go in those columns and be true. The block
#   is the UNIT, not the plumbing: wiring an ElevenLabs or Ideogram adapter would
#   not help, because what it returned could not be expressed in per-million
#   tokens without becoming a different quantity wearing that label. Pricing
#   these needs its own unit-carrying shape, the way `board_entry` carries
#   `unit` beside `value_verbatim`. Recorded here so the next reader knows it was
#   decided rather than missed.
#
# `kind` says which of those a row is, so the page can say why a rate is absent
# instead of leaving a reader to assume the model is free.
#
# FIFTEEN, DOWN FROM THIRTY ON 2026-09-15. Parvathi named fifteen to drop after
# seeing them on the page. They were not chosen by a rule - eleven were image,
# video and speech models, but two were language models the registry prices
# perfectly well (Gemini 3.1 Pro, Qwen3.6 27B) - so this list is editorial and
# the file is the only record of it. That is the point of it being config.
#
# ⚠ FIVE OF THE FIFTEEN THAT STAYED ARE ALSO UNDISCUSSED: GPT-5.5 Codex,
#   Recraft V4.1 Pro, Wan 3.0, ElevenLabs v3, Qwen3.5 Omni Flash. They read
#   "nobody has discussed this" exactly like the ones that went, so if the
#   intent was "remove everything with no evidence" they were missed rather
#   than kept. Recorded rather than acted on, because guessing at an editorial
#   intent is how a list quietly becomes something nobody chose.
#
# THREE FROM THE SOURCE LIST WERE NEVER HERE. `OPS-Agentic-Search` is described
# by that list itself as "System Architecture" - an agent ensemble rather than a
# model. `Zonos2 8B / Kokoro 82M` and `Realtime TTS-2 / Luna TTS` each named two
# products joined by a slash, and picking one would have been a guess.

version: 1

models:
  # ── the four the board already holds evidence for ────────────────────────
  # These lead the page because a fetch has actually run against them. The
  # first three came from the hosted build's hardcoded list; the fourth is the
  # model Anooj's runs have been reading.
  - name: Claude Fable 5.1
    registry: anthropic/claude-fable-5-1
    kind: text
  - name: GPT 6 Astra
    registry: openai/gpt-6-astra
    kind: text
  - name: DeepSeek V4 Pro
    registry: deepseek/deepseek-v4-pro
    kind: text
  - name: MiniMax M3
    registry: minimax/minimax-m3
    kind: text

  # ── the rest of the tracked set, in the order of the source list ─────────
  - name: Claude Opus 5
    registry: anthropic/claude-opus-5
    kind: text
  - name: GPT-5.6 Sol
    registry: openai/gpt-5.6-sol
    kind: text
  - name: Grok 4.6
    registry: x-ai/grok-4.6
    kind: text
  - name: GLM 5.3
    registry: z-ai/glm-5.3
    kind: text
  - name: Qwen3.8 Max
    registry: qwen/qwen3.8-max
    kind: text
  - name: Kimi K3
    registry: moonshotai/kimi-k3
    kind: text

  # Named on the source list, absent from the router's catalogue. `registry:
  # null` is a measurement, not a gap: the poll has run and these are not in it.
  - name: GPT-5.5 Codex
    registry: null
    kind: text
    absent_because: not carried by the OpenRouter poll

  # ── image ────────────────────────────────────────────────────────────────
  - name: Recraft V4.1 Pro
    registry: null
    kind: image

  # ── video ────────────────────────────────────────────────────────────────
  - name: Wan 3.0
    registry: null
    kind: video

  # ── speech ───────────────────────────────────────────────────────────────
  - name: ElevenLabs v3
    registry: null
    kind: speech
  - name: Qwen3.5 Omni Flash
    registry: null
    kind: speech
