# The models the board puts on its registry page, and why it is a list.
#
# WHY THIS FILE EXISTS
#
# `model_version` holds 344 rows because the OpenRouter poll brings back every
# model the router carries. That is the right thing for the registry to HOLD and
# the wrong thing for a page to SHOW: a reader looking for the models this board
# has opinions about does not want a router's catalogue.
#
# Until 2026-09-15 the page solved that by not reading the registry at all —
# `web/src/api/index.js` returned a hardcoded array of two models and never
# called the backend. So the page called "The registry" rendered a constant, its
# summary line ("Two models are being tracked") was a string, and the hosted
# build and the local one disagreed because they were different constants. This
# file replaces the constant with config, which is rule 5: configuration lives in
# versioned YAML where a change is reviewable.
#
# ⚠ A PRICE IS NEVER WRITTEN HERE.
#
#   `registry` names a row in `model_version` and every figure — price, context,
#   flags — is read from it live. Writing a price into this file would be a
#   number with no provenance and no way to go stale visibly, which is the
#   opposite of what `pricing_history` and the 24-hour price-change rule exist
#   for. An entry with `registry: null` shows "no rate", and that is the honest
#   state rather than a gap to be filled in by hand.
#
# ⚠ EVERY ENTRY BUT ONE HAS A REGISTRY ROW, AND THEY GOT THERE TWO DIFFERENT
#   WAYS. The exception is Gemini 3.8 Flash - see its entry below.
#
#   Three of the five were seated on 2026-09-15 from contract/unpolled_models.yaml
#   so the page could link them - Recraft V4.1 Pro, ElevenLabs v3, Qwen3.5 Omni
#   Flash. They have a registry ROW and still no PRICE, and that is the honest
#   end state rather than a half-finished one: the row gives them an identity
#   and a model page, and the columns below stay empty because the unit does
#   not fit. Seating a model is not the same as pricing one.
#
#   `model_version.price_in` is USD PER 1M TOKENS (contract/tables.sql:39; the
#   page labels it "PER MTOK · IN / OUT"). That unit fits a language model. It
#   does not fit the rest:
#
#       an image model   is priced per image
#       a video model    per second of output
#       a speech model   per character, or per minute of audio
#
#   So there is no number that could go in those columns and be true. The block
#   is the UNIT, not the plumbing: wiring an ElevenLabs or Ideogram adapter would
#   not help, because what it returned could not be expressed in per-million
#   tokens without becoming a different quantity wearing that label. Pricing
#   these needs its own unit-carrying shape, the way `board_entry` carries
#   `unit` beside `value_verbatim`. Recorded here so the next reader knows it was
#   decided rather than missed.
#
#   ⚠ AND IT IS NOT "THE REGISTRY HAS NO IMAGE MODELS", which is what an earlier
#     draft of this note said. `google/gemini-3.1-flash-image` is in the poll and
#     priced, because OpenRouter carries image GENERATION from the big LLM
#     providers and those are billed per million tokens like their text siblings.
#     What is absent is the standalone image, video and speech VENDORS. The line
#     is the billing unit, not the medium.
#
#   THE FOURTH AND FIFTH WERE NOT SEATED, BECAUSE THEY DID NOT NEED TO BE.
#   Wan 3.0 was dropped at Parvathi's request. GPT-5.5 Codex turned out to name
#   a model the registry already holds under a different spelling - see the note
#   on its entry below, which is the only place in this file where a `registry:`
#   value is an INTERPRETATION of the source list rather than a lookup of it.
#
# `kind` says which of those a row is, so the page can say why a rate is absent
# instead of leaving a reader to assume the model is free.
#
# THIRTEEN, AND THE ARITHMETIC IS WORTH KEEPING: thirty on 2026-09-15, less
# fifteen Parvathi named after seeing them on the page, less three more the same
# day, plus Gemini 3.8 Flash on 2026-09-16.
#
# The fifteen were not chosen by a rule - eleven were image, video and speech
# models, but two were language models the registry prices perfectly well
# (Gemini 3.1 Pro, Qwen3.6 27B) - so this list is editorial and the file is the
# only record of it. That is the point of it being config.
#
# ⚠ THE LAST THREE OUT WENT FOR THREE DIFFERENT REASONS THAT LOOK IDENTICAL
#   FROM THE PAGE - all three showed nothing.
#
#   All three showed 0 claims and 0 board_entry rows, checked before removing
#   rather than assumed, so no removal took a visible figure off the page. WHY
#   each was empty is the part that differs, and it is the part a bare "we
#   removed the empty ones" would have thrown away.
#
#   Qwen3.8 Max HAS NEVER BEEN SEARCHED FOR. It carries zero `model_alias` rows,
#   so `_variants_for` returns an empty list and a fetch against it searches no
#   terms at all. It is attested in docs/proposals/alias-surfaces-tracked-set.yaml
#   (`seated_by: launch-window`, 7 mentions) but absent from the reviewed
#   manifest, so seating it was a review act nobody had taken. Its silence is
#   OURS, not the corpus's.
#
#   Qwen3.5 Omni Flash WAS searched, and the search could not have worked. Its
#   four alias variants are one surface punctuated four ways -
#   `qwen3.5 omni flash`, `qwen3.5-omni-flash`, `qwen35omniflash`,
#   `qwen3.5omniflash` - and the harvest searches the first three per platform.
#   So all three slots went to spellings of a phrase nobody types; it never
#   looked for `qwen omni` or `omni flash`. That is the exact failure
#   `_order_variants` was written to prevent, and it could not: the ordering can
#   only promote a distinct surface when one exists, and I seated this model from
#   contract/unpolled_models.yaml with `query_variants` output alone. ElevenLabs
#   v3 got one hand-added surface and that judgement is noted in that file; this
#   model and Recraft V4.1 Pro got none.
#
#   RECRAFT V4.1 PRO WENT TOO, LATER THE SAME DAY, AND IT WENT FOR A THIRD
#   REASON THAT MUST NOT BE FILED WITH THE OTHER TWO.
#
#     Qwen3.8 Max         never searched   - the silence was ours
#     Qwen3.5 Omni Flash  looked, found nothing - 3 naming threads read, 0 claims
#     Recraft V4.1 Pro    NEVER LOOKED     - see below
#
#   ⚠ IT WAS REMOVED BEFORE IT WAS READ, NOT BECAUSE IT WAS READ.
#
#     Its fetch harvested 184 documents - 183 from Reddit, 1 from dev.to - and
#     they were scored and assembled into thread_contexts. Then the run was
#     killed at E4, before the extractor read a single one. `thread_extraction`
#     holds nothing for it.
#
#     So its 0 claims and 0 board_entry rows are an absence WE CAUSED, not one
#     we found, and this note is here so nobody later reads the empty row as a
#     finding about the model. Rule 4, applied to the list itself. It shares the
#     one-surface variant gap described above, so a completed run may well have
#     found little - but "may well have" and "did not" are different claims and
#     only one of them was ever tested.
#
#     Parvathi's call, taken with that stated. Recorded rather than smoothed
#     over, because a removal that looks evidence-based and is not is the kind
#     of thing this file exists to prevent.
#
#   WHAT REMOVAL DOES NOT UNDO. All three keep their `model_version` row, and
#   Qwen3.5 Omni Flash and Recraft V4.1 Pro keep their `model_alias` rows:
#   `model_alias` is append-only under FR-4 and a window close would assert a
#   surface STOPPED MEANING a model, which is false. So the registry still holds
#   them and only the page stops listing them. That is the honest end state.
#
# ⚠ ONE OF THE TWELVE THAT STAYED IS ALSO UNDISCUSSED: ElevenLabs v3. It reads
#   "nobody has discussed this" exactly like the ones that went, so if the intent
#   was "remove everything with no evidence" it was missed rather than kept.
#   Recorded rather than acted on, because guessing at an editorial intent is how
#   a list quietly becomes something nobody chose.
#
#   It is also the ONLY one of the three seated models still here, and the only
#   one that got a hand-added surface (`elevenlabs v3`) rather than mechanical
#   spellings alone. Whether that is why it is the survivor is not something this
#   file can claim - its own fetch run died at thread 2 of 24, so it has not been
#   read either.
#
#   This note used to name five, and three of those names have since been
#   resolved rather than left. Wan 3.0 and Qwen3.5 Omni Flash were dropped at
#   Parvathi's request. GPT-5.5 Codex is NOT undiscussed - re-pointed at
#   `openai/gpt-5.5` it is the single most-discussed model in the whole corpus,
#   228 attested mentions. It read as silent only because it was pointed at
#   nothing.
#
# THREE FROM THE SOURCE LIST WERE NEVER HERE. `OPS-Agentic-Search` is described
# by that list itself as "System Architecture" - an agent ensemble rather than a
# model. `Zonos2 8B / Kokoro 82M` and `Realtime TTS-2 / Luna TTS` each named two
# products joined by a slash, and picking one would have been a guess.

version: 1

models:
  # ── the four the board already holds evidence for ────────────────────────
  # These lead the page because a fetch has actually run against them. The
  # first three came from the hosted build's hardcoded list; the fourth is the
  # model Anooj's runs have been reading.
  - name: Claude Fable 5.1
    registry: anthropic/claude-fable-5-1
    kind: text
  - name: GPT 6 Astra
    registry: openai/gpt-6-astra
    kind: text
  - name: DeepSeek V4 Pro
    registry: deepseek/deepseek-v4-pro
    kind: text
  - name: MiniMax M3
    registry: minimax/minimax-m3
    kind: text

  # ── the rest of the tracked set, in the order of the source list ─────────
  - name: Claude Opus 5
    registry: anthropic/claude-opus-5
    kind: text
  - name: GPT-5.6 Sol
    registry: openai/gpt-5.6-sol
    kind: text
  - name: Grok 4.6
    registry: x-ai/grok-4.6
    kind: text
  - name: GLM 5.3
    registry: z-ai/glm-5.3
    kind: text
  # Qwen3.8 Max was here until 2026-09-15. Dropped at Parvathi's request; see
  # the note at the top of this file for what it and Qwen3.5 Omni Flash had in
  # common, and what each leaves behind.
  - name: Kimi K3
    registry: moonshotai/kimi-k3
    kind: text

  # ⚠ THE SOURCE LIST SAID "GPT-5.5 Codex". THIS ROW IS `openai/gpt-5.5`, AND
  #   THE DIFFERENCE IS THE WHOLE NOTE.
  #
  #   It carried `registry: null` until 2026-09-15 and rendered as an
  #   unclickable row, because nothing named `gpt-5.5-codex` exists to point at.
  #   What was actually checked, against the shared registry:
  #
  #       the codex line, in full   gpt-5-codex, gpt-5.1-codex,
  #                                 gpt-5.1-codex-max, gpt-5.1-codex-mini,
  #                                 gpt-5.2-codex, gpt-5.3-codex
  #       the 5.5 line, in full     openai/gpt-5.5, openai/gpt-5.5-pro
  #       their intersection        EMPTY
  #
  #   So the poll carries both lines exhaustively and does not carry a 5.5-codex.
  #   That is unlike Recraft, ElevenLabs and Qwen3.5 Omni Flash, whose absence
  #   has a structural cause - OpenRouter lists no standalone image or speech
  #   vendor. Here the poll demonstrably reaches both neighbourhoods. An absence
  #   in the middle of a range the poll covers is evidence the name is wrong,
  #   not evidence the poll is short.
  #
  #   AND THE CORPUS AGREES. Five claims quote the word "codex" and every one
  #   uses it as the HARNESS, not a model suffix:
  #
  #       "GPT-5.6 Sol on Codex CLI: 16.2% resolution"
  #       "GPT-6 Astra on Codex CLI: 33.8% resolution"
  #       "gpt-5.3-codex model is not supported when using Codex with a ChatGPT account"
  #
  #   Zero claims name a 5.5 codex. Meanwhile `gpt 5.5` is the most-attested
  #   surface in docs/proposals/alias-surfaces-tracked-set.yaml - 228 mentions,
  #   with `gpt-5.5` at a further 204. Engineers talk about this model
  #   constantly; they have never once called it codex.
  #
  #   So "GPT-5.5 Codex" reads as GPT-5.5 used THROUGH Codex, and the model is
  #   `openai/gpt-5.5`.
  #
  #   ⚠ WHY POINT RATHER THAN SEED. Seating an invented `openai/gpt-5.5-codex`
  #     through contract/unpolled_models.yaml would also have produced a page.
  #     It would have been PERMANENT: `model_alias` is append-only under FR-4
  #     and `tracked_load` states the reason - closing a window to undo a
  #     mistaken load "would assert that a surface STOPPED MEANING a model on
  #     the day we noticed our error". This line is config, and a reviewer who
  #     disagrees reverts one word. Between a reversible reading and an
  #     irreversible invention, the reading wins.
  #
  #   ⚠ THE PAGE WILL NOW SAY "OpenAI: GPT-5.5", NOT "GPT-5.5 Codex", because
  #     every displayed figure is read from the registry row. That is the point
  #     rather than a side effect: the board shows the model it actually has.
  - name: GPT-5.5 Codex
    registry: openai/gpt-5.5
    kind: text

  # ⚠ ADDED 2026-09-16 AT PARVATHI'S REQUEST, AND IT IS THE ONLY ENTRY HERE
  #   WITH `registry: null`. That is deliberate and it is not a TODO.
  #
  #   ATTESTED BUT NOT POLLED. One claim names it, from Hacker News:
  #
  #       "can do 7.2 serial arithmetic steps in a forward pass vs 4.1 for the
  #        next best model (Gemini 3.8 Flash/Fable 5.1)"
  #
  #   So an engineer wrote it and the model is real. The OpenRouter poll does
  #   not carry it: the flash line runs gemini-3-flash-preview, 3.5-flash,
  #   3.6-flash, 3.7-flash and stops.
  #
  #   ⚠ AND THAT IS A DIFFERENT ABSENCE FROM GPT-5.5 CODEX'S. There the poll
  #     covered both neighbourhoods exhaustively and the hole was in the MIDDLE,
  #     which is evidence a name is wrong. Here 3.8 sits BEYOND the end of the
  #     line - the ordinary shape of a model newer than the poll's snapshot.
  #
  #   WHY NOT SEATED THROUGH contract/unpolled_models.yaml, WHICH WOULD HAVE
  #   GIVEN IT A PAGE. That file is for models "the poll will NEVER bring" -
  #   Recraft, ElevenLabs, Qwen Omni are absent because OpenRouter lists no
  #   standalone image or speech vendor, which is structural and permanent.
  #   Google's flash line is polled exhaustively, so OpenRouter will carry this
  #   the day it ships. Seeding it would write a `provenance: seed` row that the
  #   poll later replaces with `polled` - and from then on
  #   `_refuse_provenance_downgrade` would make unpolled_models.yaml unloadable,
  #   which is exactly how seed_models.yaml became unloadable with seven of its
  #   eleven polled.
  #
  #   So `registry: null` is the measurement, and the file's own rule applies:
  #   it "shows no rate, and that is the honest state rather than a gap to be
  #   filled in by hand". The row becomes clickable and priced on its own the
  #   first time the poll returns it, with no edit here.
  - name: Gemini 3.8 Flash
    registry: null
    kind: text
    absent_because: not yet carried by the OpenRouter poll

  # ── image ────────────────────────────────────────────────────────────────
  # THE ONE IMAGE MODEL THE POLL DOES CARRY, and it is why the note above is
  # worded the way it is. OpenRouter lists image GENERATION from the big LLM
  # providers - this one is priced per million tokens like its text siblings -
  # while the standalone image, video and speech vendors are absent entirely.
  # So "the registry does not carry image models" would have been too strong.
  - name: Nano Banana 2
    registry: google/gemini-3.1-flash-image
    kind: image
  # Recraft V4.1 Pro was here until 2026-09-15. Dropped at Parvathi's request.
  # ⚠ REMOVED BEFORE IT WAS READ, NOT BECAUSE IT WAS READ - see the top of this
  #   file. That distinction is the whole reason this comment exists.


  # ── speech ───────────────────────────────────────────────────────────────
  - name: ElevenLabs v3
    registry: elevenlabs/eleven-v3
    kind: speech
  # Qwen3.5 Omni Flash was here until 2026-09-15, one day after it was seated.
  # Dropped at Parvathi's request. See the note at the top of this file.
