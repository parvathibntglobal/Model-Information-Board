# ============================================================================
# WHICH PAGES ARE WORTH INDEXING (SEO item 5) - PROPOSED 2026-10-09, NOT RATIFIED
# ============================================================================
#
# ⚠ A CONTRACT CHANGE, AND IT IS PROPOSED, NOT TAKEN. `contract/` gets two
#   eyes (CLAUDE.md). It ships on branch anooj_002seo for review and reaches
#   main only when a second person has read it.
#
# ⚠ NOTHING HERE MAKES THE SITE INDEXABLE. web/index.html carries
#   `noindex, nofollow` and governs every page; a page can only make that
#   stricter (web/src/seo/head.js). This decides which pages STAY out of search
#   engines once that tag is lifted - so the board does not launch two thousand
#   pages that each rest on one person's comment.
#
# READ BY judge/seo.py, ONLY. Every key below is required; a missing or
# malformed one raises rather than defaulting (rules 5 and 12).
#
# WHY "DISTINCT VOICES", COUNTED ON THE PUBLIC VIEW. A page's evidence is what
# a public visitor would see, so withheld sources (contract/publication.yaml)
# are not counted even when the server runs the internal view. Voices, not
# reports: one person posting five times is one voice (the board counts people
# the same way). Two voices is the smallest number that is not one person's
# opinion.
#
# MEASURED 2026-10-09 on the local restore of the 2026-10-07 shared-database
# backup, public view (reddit, arxiv, x withheld; 606 board entries withheld):
#
#   page kind                         pages   1 voice    >=2 voices
#   job page (/board/jobs/:slug)        178   154 (87%)      22
#   capability page                     401   334 (83%)      60
#   metric page                         237   188 (79%)      41
#   model in a section (drill-down)   1,640   ~84%          224
#   model page (/models/:id)            247   157 have no public entry;
#                                              of the 90 that do, 70 have >=2
#
# So `min_voices: 2` keeps about 417 of about 2,700 evidence pages. Re-measure
# before launch: the corpus will be larger, and these counts are a record of
# 2026-10-09, not a description of today (rule 11).
#
# RULE 8, ANSWERED. This is not a filter on evidence: every page still renders
# for every visitor and every link to it still works. It decides only what a
# search engine is invited to list. A wrong `noindex` costs a page its search
# listing (recoverable, visible in /seo/indexable); a wrong `index` puts a
# one-comment page in front of searchers as if it were a finding.
#
# THE PUBLIC ADDRESSES (proposed 2026-10-20, branch seo/parvathi). The board's
# own pages - /board and /models - have been signed-in since 2026-10-15, so the
# lists below now name the PUBLIC pages that show the same evidence. Before
# this, `always` named two login walls and every public page outside it fell to
# noindex the moment the site opened (web/src/seo/pages.js: noindexFor).
# The thresholds are unchanged.
# ============================================================================

version: 1

pages:
  # /reviews/{jobs|capabilities|metrics}/:slug - and for a job, also the
  # picker's /best-ai-model/:slug (same evidence, asked as "which model")
  section:
    min_voices: 2
  # one model inside one section: tallied only - no public page shows it
  model_in_section:
    min_voices: 2
  # /ai-models/:canonical_id and /reviews/models/:canonical_id - and the
  # picker's /alternatives/:name (what else engineers report working there)
  model:
    min_voices: 2

# Structural pages with no evidence threshold: they list or explain, and every
# visitor needs them to find the pages above.
always:
  - /
  - /blogs
  - /tools
  - /best-ai-model
  - /ai-model-pricing
  - /token-counter
  - /local-llm-vram-calculator
  - /ai-models
  - /ai-models/latest
  - /compare
  - /reviews
  - /reviews/jobs
  - /reviews/capabilities
  - /reviews/metrics
  - /glossary
  - /methodology

# One provider's alternatives (/alternatives/<provider>, e.g. /alternatives/openai;
# 2026-10-22): the other providers' models engineers reported on the same jobs
# and capabilities. Listed once the provider has this many models whose own
# alternatives page is listed; with one, it would repeat that model's page.
provider_alternatives:
  min_models: 2

# A comparison of two models (/compare/<a>-vs-<b>; review of #552, item 9,
# option A): listed when BOTH models have at least this many distinct public
# voices in one shared job, capability or metric - the count every threshold
# here uses (pages.section.min_voices). Both must be in the catalogue and the
# registry, so the page can open. Three-way comparisons are never listed.
# Measured 2026-10-21 on the local database: 2 -> 727 pairs (46 models),
# 3 -> 418, 5 -> 177. Each listed pair is a pre-rendered page at build time.
compare_pairs:
  min_voices: 2

# One type of model (/ai-models/image, /ai-models/video...; 2026-10-21): the
# models of that type engineers reported on. A type with too few of them is a
# near-empty list, so it is invited only once it shows this many.
model_types:
  min_reported_models: 2

# Glossary term pages (/glossary/:slug) are listed from glossary.yaml by
# judge/seo.py: reviewed copy, no evidence threshold.

# Blog posts: approved posts only (judge/blog_store.py). A pending or rejected
# post is never indexable, whatever this file says elsewhere.
blog_posts: approved_only

# Never indexable, at any evidence level: the signed-in pages. The bare
# /compare tool page is listed above; a comparison of named models
# (/compare?ids=...) is combinatorial and stays off this list, so it is noindex.
never:
  - /login
  - /admin
  - /board
  - /models
  - /seo-keywords
  - /benchmarks
  - /price-changes
  - /news
