# ============================================================================
#  Condition dimensions — v1.0
#
#  SHARED. Changes go through a PR.
#
#  A cell is (model_version, capability, condition_bucket). These three
#  dimensions define the bucket.
#
#  WHY THIS EXISTS
#
#  Most disagreements are not disagreements. They are different situations.
#
#      8 engineers say tool calling works fine   — all at ≤5 tools
#      4 engineers say it breaks                 — all at 6+ tools
#
#  Averaged, that publishes "mediocre at tool calling" — true-ish, useless,
#  and it buries the actual rule. Bucketed, it publishes:
#
#      "Praised for tool calling in simple loops; two engineers report
#       schema failures at 6+ tools."
#
#  That second sentence is the answer. Condition buckets are what make it
#  possible, and they are NOT a deferrable nicety.
#
#  BANDS ARE FIXED, not continuous, because buckets must be countable.
#  A claim with an unknown value for a dimension goes to `unknown` and
#  is usable only for cells where that dimension does not apply.
# ============================================================================

version: "1.0"

dimensions:

  - key: tool_count
    description: How many tools were in scope when the behaviour was observed.
    why: >
      Many models degrade sharply past roughly 10–20 tools. A benchmark run
      at 5 tools predicts nothing about behaviour at 40, so a claim without
      a tool count cannot be compared to one that has it.
    bands: ["none", "1-5", "6-15", "16+", "unknown"]

  - key: context_size
    description: Input size at which the behaviour was observed.
    why: >
      The same model is a different model at 4k and at 400k. Long-context
      claims are meaningless without the length they were observed at.
    bands: ["<8k", "8k-32k", "32k-128k", "128k+", "unknown"]

  - key: schema_enforced
    description: Whether provider-side structured-output enforcement was on.
    why: >
      Enforcement guarantees schema validity at the API layer. A model that
      fails free-form JSON may be perfectly usable with it enabled — so a
      complaint about invalid JSON means something completely different
      depending on this flag.
    bands: ["on", "off", "unknown"]

  # --------------------------------------------------------------------------
  #  ⚠ TWO CHANGES, 2026-08-21, BY ENGINEER 1. BOTH NEED ENGINEER 2's SIGN-OFF.
  #     contract/ is shared. One is a new dimension (a bucket-space change);
  #     the other RENAMED `structured_mode` to `schema_enforced` above.
  #
  #     THE RENAME WAS NOT ASKED FOR. E1 took it because the measurement said
  #     the new field alone does not work, and because it costs no migration
  #     TODAY: 0 of 6 stored condition_bucket values carry the old prefix
  #     (4 claim rows, 2 cell rows, all `context_size:unknown`). It will never
  #     be cheaper. Revert is a find-and-replace across five files.
  #
  #  WHY: a bool had taken three strings.
  #
  #      'xhigh'      -> structured_mode   twice, on qwen-38-27b
  #      'auto mode'  -> structured_mode   once, on the auto-mode post,
  #                                        and it cost 4 claims
  #
  #  THE FIRST DIAGNOSIS WAS WRONG AND THE PROBE SAYS SO. We recorded it as
  #  "no field for the thing, so it goes somewhere wrong rather than nowhere".
  #  Adding `reasoning_effort` — with a description naming 'auto mode' as its
  #  own example, and a pointer in `structured_mode`'s description — changed
  #  NOTHING: 3 of 4 claims still misfiled, reasoning_effort null, three draws
  #  out of three. Renaming the bool to `schema_enforced` and changing nothing
  #  else stopped it dead, with reasoning_effort='auto' on 4 of 4, three draws
  #  out of three. Deleting the bool did the same.
  #
  #  So the value was going to the field whose NAME matched the document's
  #  words — "auto mode" to the only field ending in `_mode`. A FIELD NAME
  #  OUTRANKS EVERY DESCRIPTION, including the description of the field that
  #  should have won.
  #
  #  THE RULE THAT FALLS OUT, and it belongs in this file because this file
  #  names things: DO NOT NAME A DIMENSION AFTER A WORD THE CORPUS USES IN
  #  ANOTHER SENSE. `tool_count` and `context_size` are safe; `*_mode` was not.
  #
  #  Population: one document, one extractor (google/gemini-2.5-flash), three
  #  arms, three draws each. The draws were byte-identical, so they show the
  #  effect is stable at temperature 0 rather than that it generalises.
  #  `docs/measurements/the-effort-dimension.md`
  # --------------------------------------------------------------------------
  - key: reasoning_effort
    description: How much thinking the model was asked to do, if the report says.
    why: >
      The same model at low and at max effort differs more than two models at
      the same effort — on latency by a large factor, and on multi-step
      reasoning by enough to invert a comparison. A latency complaint at max
      effort and a latency complaint at low effort are not the same claim, and
      averaging them publishes a sentence that is true of neither.

      `auto` is a band rather than an omission, and that is deliberate. "The
      provider chose the effort" is a real, stated, comparable condition and it
      is NOT the same as "the report does not say" — one is a setting somebody
      selected, the other is missing data. Collapsing them would convert an
      observed condition into an absence, which is rule 6.
    bands: ["off", "low", "medium", "high", "max", "auto", "unknown"]
    # Vendor names map onto these bands and the band list is what we count:
    #   minimal/none -> off      xhigh/highest/max -> max
    #   auto/dynamic/router -> auto
    # NOT DONE, all three needing E2's call rather than mine:
    #   1. no capability is reasoning_effort-DOMINANT yet (see below). Until one
    #      is, this dimension is recorded and never bucketed on.
    #   2. `contract/queries.yaml` has no query carrying
    #      `records_condition: reasoning_effort`, so nothing is retrieved FOR
    #      this dimension - it is only picked up incidentally.
    #   3. `ops.latency_ttft` is the capability this most obviously dominates,
    #      and moving it off `context_size` would rebucket every existing
    #      latency claim. That is a re-run, not an edit.


# ----------------------------------------------------------------------------
#  Bucket key format:  "<dimension>:<band>"     e.g.  tools:6-15
#
#  A claim carries the full `conditions` object; `condition_bucket` is the
#  single dimension that dominates for that capability:
#
#      tool_calling.*            → tool_count
#      context.effective_window  → context_size
#      format.structured_output  → schema_enforced
#      everything else           → context_size
#
#  Q5 reads the cell AT THE TASK'S BUCKET. A 12-tool task looks up
#  `tools:6-15`, never the model's flattering overall average.
# ----------------------------------------------------------------------------

dominant_dimension:
  "tool_calling.schema_accuracy":         tool_count
  "tool_calling.long_chain_reliability":  tool_count
  "context.effective_window":             context_size
  "format.structured_output":             schema_enforced
  "instruction.adherence":                context_size
  "summarization.fidelity":               context_size
  "extraction.faithfulness":              context_size
  "code.editing_diff_fidelity":           context_size
  "code.generation":                      context_size
  "reasoning.multistep":                  context_size
  "over_refusal":                         context_size
  "ops.latency_ttft":                     context_size
  # Cost scales with what was sent and generated, so the bucket that
  # discriminates is the same one latency uses. NOT a cost-specific
  # dimension: adding one multiplies every cell in the table, and
  # `conditions.yaml` already argues three is the minimum that captures
  # what people report.
  "cost.efficiency":                      context_size
  "cost.per_task":                        context_size


# ----------------------------------------------------------------------------
#  Later (see BUILD-PLAN.md §8): thinking mode, effort tier, serving provider,
#  framework/scaffold, temperature, region, quantisation. Each adds real
#  discrimination and multiplies the cells — three is the minimum that
#  captures the failures people actually report.
# ----------------------------------------------------------------------------
