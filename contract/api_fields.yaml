# WHICH API FIELDS HAVE A READER. Generated by `scripts/audit_api_fields.py`,
# reviewed by hand. #275's declaration half.
#
# state       consumed | no_consumer
#             What the audit DISCOVERED. `tests/test_an_emitted_field_has_a_reader.py`
#             fails when a field's discovered state stops matching the one here,
#             so a field losing its last reader is a red test rather than a
#             quiet change.
#
# reviewed    false means SNAPSHOT: nobody has read this row and decided the
#             state is right. It is not an endorsement, and the gate says how
#             many rows are still in that condition on every run.
#
#             true means somebody looked. A `no_consumer` row that is reviewed
#             needs a `why` - a field with no reader is rule 9's defect, and
#             "we know, and here is the reason" is the only thing that makes it
#             a decision rather than an oversight.
#
# ⚠ ROUTES THIS CANNOT ANALYSE ARE NOT IN THIS FILE. They are waived, listed on
#   every run of the audit, and never fail the build. See the module docstring:
#   a check that blocks on what it cannot understand gets disabled, and the
#   waiver list is the output that matters.
#
# ⚠ AND `consumed` IS NOT PROOF. The detector over-counts readers - a generic
#   name matches an access to a different field of the same name. `no_consumer`
#   is therefore a FLOOR, and this file's silence is weaker than its statements.
