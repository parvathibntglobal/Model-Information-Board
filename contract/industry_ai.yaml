# THE INDUSTRY AI AGENT (2026-11-20): data about AI in five industries.
# Design, stages and the team's checklist: docs/industry-ai-agent.md.
#
# A SEPARATE LANE from the model board. scripts/run_industry_ai.py harvests
# with the queries below, keeps what passes the code rules below, and labels
# each kept item with its domain(s) and a content type. No language model is
# called anywhere in this lane. The signed-in "AI in industries" page
# (/ai-in-industries) shows the counts; it never shows post text.
#
# EVERYTHING THE TEAM TUNES IS IN THIS FILE: queries, feeds, terms, excluded
# phrases and patterns. Change them here, never in code. After a change,
# `python scripts/run_industry_ai.py --relabel` re-applies the rules to every
# stored item without a single request. This file is under contract/, so a
# change is a PR with a second reviewer.
#
# HOW MATCHING WORKS (collect/industry_ai/rules.py):
#   * a TERM (ai_terms, domain_terms, context words) is a plain phrase, matched
#     case-insensitively as whole words; a space, hyphen or underscore inside it
#     matches any of the three ("credit-card" = "credit card");
#   * a PATTERN (*_patterns, exclude_phrases) is a Python regular expression,
#     matched case-insensitively. Write \b for a word boundary and \d for a digit.
#   * only an item's TITLE and BODY are read - never its comments.

version: 1

# Bump when the rules change meaning, so stored labels say which rules made them.
pipeline_version: iai-1

run:
  # false refuses a harvest (scripts/run_industry_ai.py exits before any
  # request); --plan, --dry-run and --relabel still work. Deletes nothing.
  enabled: true
  cadence: weekly
  # Items posted earlier than this many days ago are not kept (first harvest:
  # how far back to look).
  window_days: 365
  # REQUEST CAPS PER PLATFORM PER RUN. Reddit and X are metered (RapidAPI) and
  # share their monthly quota with the model fetch - keep these small. A query
  # that would pass its platform's cap is not run, and the run log says so.
  max_requests:
    # Sized for the five active domains (2026-11-20): ~20 grouped X queries x 5 pages,
    # and per domain ~3 subreddit listings + 4 searches on Reddit.
    reddit: 40
    x: 110
    github: 10
    hackernews: 25
    devto: 25
    bluesky: 25
    feeds: 30
  # Search result pages per query. An X query that clubs at least
  # `x_clubbed_min_keywords` quoted keywords with OR gets `x_clubbed` pages: one
  # page of 20 posts cannot hold six keywords' worth (#644 review, point 10;
  # measured 2026-11-20: a six-keyword query returned 100 distinct posts over 5
  # pages, with more after). Size `max_requests.x` for it.
  pages_per_query:
    reddit: 1
    x: 1
    x_clubbed: 5
  # 5, not 6 (anooj, 2026-11-20): a keyword list rarely splits into sixes, and a
  # five-keyword remainder deserves its five pages too.
  x_clubbed_min_keywords: 5
  # Below this many characters of title + body (links removed), an item is too
  # short to say anything and is dropped as `too_short`.
  min_text_chars: 40
  # How close a context word must be to an ambiguous domain term, in words.
  context_window_words: 12
  # Engagement at or below this is flagged `low_engagement` (a flag, never a drop).
  low_engagement_max: 0

# Appended to every query on these platforms, where the platform supports it.
# The X suffix is X's own syntax and is UNTESTED on our route (twitter241, a
# scraper): the first dry run should record one X query with and without it.
# An X query plus this suffix must stay within 480 characters (refused if not).
# REDDIT IGNORES QUOTES, MINUS SIGNS AND OR on our route (collect/adapters/
# reddit.py): a Reddit search is loose words, and the sieve decides.
query_suffix:
  x: "lang:en -is:retweet -hiring -giveaway"

# AI TERMS. An item must name at least one (title or body). Registry model
# names are added at run time, read-only.
ai_terms:
  - artificial intelligence
  - machine learning
  - deep learning
  - generative AI
  - gen AI
  - genai
  - LLM
  - LLMs
  - large language model
  - language model
  - ChatGPT
  - GPT
  - Claude
  - Gemini
  - Copilot
  - Llama
  - Mistral
  - DeepSeek
  - Perplexity
  - AI agent
  - AI agents
  - agentic
  - AI assistant
  - AI model
  - AI tool
  - AI tools
  - AI-powered
  - neural network
  - computer vision
  - NLP
  - RAG
  - chatbot

# THE BARE WORD "AI" counts as an AI term when written in capitals, as a whole
# word: "AI fraud detection" counts; "ai" in lower case, and ".ai" (a file type
# or a web domain, removed below), do not.

# REMOVED FROM THE TEXT BEFORE ANY TERM IS MATCHED, in every domain.
global_exclude_phrases:
  - '\.ai\b'                       # Adobe Illustrator files, .ai domains
  - '\bai file'
  - '\bartificial insemination\b'
  - '\bA\.I\. Artist\b'

# DROPPED: spam, scams and engagement bait.
spam_patterns:
  - '\bAI trading bot'
  - '\b\d{3,}\s?% (returns?|profit|gains?)'
  - '\bsignals? group\b'
  - '\bguaranteed (profit|returns?|income)\b'
  - '\b(pump|moon(ing)?|100x)\b.*\b(crypto|token|coin)\b'
  - '\blike (and|&) (retweet|rt|share)\b'
  - '\bcomment ["''“]?AI["''”]? (and|&) I.?ll (dm|send)'
  - '\bgiveaway\b'
  - '\bfollow (me )?for more\b'

# DROPPED: a course, webinar or event post that is mainly a sign-up ad...
ad_patterns:
  - '\bregister (now|today|here)\b'
  - '\benrol+ (now|today)\b'
  - '\blimited (seats|spots)\b'
  - '\blink in (my )?bio\b'
  - '\bsign up (now|today|free)\b'
  - '\b(use|with) (code|coupon)\b'
  - '\b\d{1,2}\s?% off\b'
# ...UNLESS it also teaches something: then it is kept, as `how_to`.
teach_patterns:
  - '\bhow to\b'
  - '\bstep[- ]by[- ]step\b'
  - '\bhere(’|'')?s how\b'
  - '\bguide\b'
  - '\btutorial\b'
  - '\bexample\b'
  - '\blesson\b'

# DROPPED: hiring and job posts.
hiring_patterns:
  - '\bwe(’|'')?re hiring\b'
  - '\bnow hiring\b'
  - '\bjob (opening|opportunity|posting)\b'
  - '\bapply (now|here|today)\b'
  - '\bopen (role|position)s?\b'
  - '\b(linkedin\.com/jobs|greenhouse\.io|lever\.co|workable\.com)\b'

# DROPPED: sponsored, affiliate or discount content.
promo_patterns:
  - '#(ad|sponsored|partner)\b'
  - '\b(sponsored|paid partnership|in partnership with)\b'
  - '[?&](ref|aff|affiliate|via)=\w+'
  - '\bpromo code\b'
  - '\bdiscount code\b'

# CONTENT TYPE: the first type in `type_order` with a matching pattern wins.
# An item that matches none is `discussion`.
type_order: [use_case, how_to, tool_or_product, research, news, discussion]
type_patterns:
  use_case:
    - '\bwe (deployed|rolled out|implemented|integrated|launched|use|are using|started using|switched to)\b'
    - '\b(in|into) production\b'
    - '\b(a|our|the|in) pilot\b|\bpilot (program|programme|project|study|scheme|phase)s?\b|\bpiloted\b|\bpiloting (a|an|the|our)\b'
    - '\bour (team|firm|practice|clinic|hospital|hotel|bank|company|department|agency) (uses|is using|started using|has been using|now uses)\b'
    - '\bI (used|use|tried|have been using|started using) (\w+ ){0,3}(to|for)\b'
    - '\bsince (january|february|march|april|may|june|july|august|september|october|november|december)\b'
    - '\bautomated (our|the)\b'
    - '\b(cut|reduced|saved|lowered) (\w+ ){0,3}by \d'
    - '\bcase study\b'
  how_to:
    - '\b\d+ (helpful |useful |best |great )?(prompts|tips|ways|tricks)\b'
    - '\bhow to\b'
    - '\bguide\b'
    - '\btutorial\b'
    - '\bstep[- ]by[- ]step\b'
    - '\bcheat ?sheet\b'
    - '\bprompts? for\b'
    - '\bcourse\b'
  tool_or_product:
    - '\b(launched|introducing|announcing|meet)\b'
    - '\bopen[- ]source\b'
    - '\bgithub\.com/'
    - '\bour (new )?(tool|product|platform|app)\b'
    - '\bI built\b'
    - '\bshow hn\b'
  research:
    - '\barxiv\.org/'
    - '\bdoi\.org/'
    - '\b(study|paper|preprint|survey|meta-analysis)\b'
  news:
    - '\b(announces?|announced|unveils?|will roll out|plans to|is set to)\b'
    - '\breport(s|ed)? that\b'
  discussion:
    - '\?\s*$'
    - '\bwhat do you think\b'
    - '\bwill AI\b'

# A use case's stage, from the first pattern that matches.
stage_patterns:
  pilot:
    - '\b(a|our|the|in) pilot\b|\bpilot (program|programme|project|study|scheme|phase)s?\b|\bpiloted\b|\bpiloting (a|an|the|our)\b'
    - '\btrial(led|ing)?\b'
  deployed:
    - '\b(in|into) production\b'
    - '\b(deployed|rolled out|implemented|went live)\b'
    - '\bwe (use|are using)\b'
  first_hand:
    - '\bI (used|use|tried|have been using|started using)\b'

# THE DOMAINS. For each:
#   kind             industry | function (a function cuts across industries)
#   active           true = harvested by a run; false = kept in the file, not run
#                    (the CLI's --domains narrows WITHIN the active ones)
#   definition       what is in scope (the page shows it)
#   domain_terms     at least one must appear, outside the excluded phrases
#   ambiguous_terms  a term with other meanings counts only with one of its
#                    context words within `run.context_window_words`
#   exclude_phrases  removed before domain terms are matched
#   queries          per platform; a query's domain is a HINT, confirmed by terms
#   feeds            feed ids from contract/sources.yaml `feeds:` (each has a
#                    terms ruling there; add new feeds there first)
#   groups           OPTIONAL: named groups inside the domain, each with its own
#                    name, definition, domain_terms, ambiguous_terms,
#                    exclude_phrases and queries. A group's exclusions apply to
#                    its own terms only; the domain's apply to all of them.
# Any other key is refused, not ignored: an unimplemented block would look like
# it is working.

# ── TEXT RETENTION (anooj, 2026-11-24) ───────────────────────────────────────
# A ROW IS NEVER DELETED; ITS TEXT IS. Every harvested post is stored, dropped
# ones too, because the page's "Filtered out" counts are counted from them (rule 4)
# and the filters are not measured yet (rule 8): deleting on labelling would make a
# wrong drop unrecoverable. But two kinds of text should not sit in the shared
# database for good:
#   dropped       spam, sign-up ads, hiring, sponsored - nobody needs the words
#                 once the first-run review and the §7 hand-check have read them;
#   kept_domains  domains whose posts are people's own lives - Personal: debts,
#                 diet, parenting, relationships.
# So after `clear_text_after_days`, counted from when this lane FIRST STORED the
# post (`first_seen_at`), its title and body are emptied and `text_cleared_at` set.
# The row, its labels and its counts stay. A cleared row is NOT re-labelled: empty
# text would be re-judged ("no AI term") and the drop counts would shift, so it
# keeps the labels it had (store.load_items leaves it out). 30 days covers the
# first-run review and the hand-check. A post in a kept domain AND another is
# cleared: it is still someone's own life.
#
# WHAT THIS DOES NOT COVER, AND WHY IT DOES NOT NEED TO (#656 review). The harvest's
# raw search pages carry every post's full text too. They are NOT mirrored to the
# shared store (`raw_blob`): scripts/run_industry_ai.py builds this lane's raw store
# with remote=None (anooj, 2026-11-24), so on a GitHub runner they go when the run
# ends, and on a person's machine they stay in that machine's local raw folder.
# This block clears `iai_item` and nothing else - there is no other shared copy.
#
# PERSONAL POSTS LOSE THEIR WORDS AFTER 30 DAYS: anything drafted from them (a post,
# a guide) has to quote within that window.
retention:
  clear_text_after_days: 30
  dropped: true
  kept_domains: [personal]

# ── THE OBSERVER: watch lists (anooj, 2026-11-20) ─────────────────────────────
# The Industry AI agent's twin. The queries under `domains:` find posts BY KEYWORD;
# these lists find them BY WHO OR WHERE - the newest posts of chosen communities,
# accounts and lists, with no keyword. Same pipeline, same tables, same page:
#   * a watched post needs an AI term; an industry term is OPTIONAL. With one, it is
#     filed under EVERY domain whose terms it names (flag `domain_from_terms`); with
#     none it is kept as "General AI" (flag `general_ai`), counted apart from
#     "domain unconfirmed" (which means a keyword query's own domain did not confirm).
#   * every source is a query key `watch:<platform>:<source>` with its own yield in
#     the run log, so a source that brings nothing is flagged for pruning.
#   * its own switch (`enabled`) and its own request caps, so watching can never
#     starve the keyword queries. Off until its first dry run.
# Lists are capped at 20 per platform for now. Checked 2026-11-20: the 13 Bluesky
# handles resolve (public getProfile); the HN authors have posts (Algolia
# author_<name>); X `from:` clubbing returns only the listed accounts' posts on our
# route (1 request) - but one prolific account filled a page (swyx 16 of 20 over
# five accounts), so X is paged over `lookback_days`, not read a page at a time.
# The Reddit and X names are checked by the first dry run's per-source yield.
# dev.to tags, GitHub repos and newsletters are designed but not built yet, so they
# are not listed: an unread list would be refused.
watch:
  enabled: false
  # How far back a watched source is read on each run (the run's window for watch
  # queries; X adds it as `since:`).
  lookback_days: 7
  # Watch requests per platform per run, separate from run.max_requests.
  max_requests: {reddit: 25, x: 30, bluesky: 20, hackernews: 15}
  # X pages per clubbed account query, and how many accounts one query clubs.
  x_pages: 10
  x_club_max: 10
  # Replies excluded in the first test runs (anooj, 2026-11-20); kept later.
  x_suffix: "-filter:replies"
  reddit: [ChatGPTPro, AI_Agents, ArtificialInteligence, PromptEngineering, vibecoding, ClaudeAI, ClaudeCode, OpenAI, LocalLLaMA, GeminiAI, cursor, LLMDevs, aipromptprogramming, AIAssisted, ChatGPTPromptGenius, perplexity_ai, midjourney, StableDiffusion, MachineLearning, Anthropic]
  x: [karpathy, sama, simonw, emollick, AndrewYNg, swyx, gdb, ylecun, jeremyphoward, amasad, rauchg, OfficialLoganK, goodside, alliekmiller, lennysan, danshipper, levelsio, hwchase17, alexalbert__, rowancheung]
  bluesky: [simonwillison.net, emollick.bsky.social, natolambert.bsky.social, minimaxir.bsky.social, vickiboykis.com, garymarcus.bsky.social, melaniemitchell.bsky.social, eugeneyan.com, howard.fm, swyx.io, randomwalker.bsky.social, hamel.bsky.social, karpathy.bsky.social]
  hackernews:
    lists: [show_hn, ask_hn, front_page]
    # tptacek on probation: very prolific, mostly not about AI; kept only if his
    # first-run yield passes the sieve often.
    authors: [simonw, minimaxir, swyx, jph00, karpathy, tptacek]
  # ONE PERSON, SEVERAL HANDLES (2026-11-20). Six watched people post on two or three
  # platforms. Without this map a person counts as one author PER PLATFORM, and their
  # same post on X and Bluesky stays two items. Measured 2026-11-20 over one 7-day
  # window of the X, Bluesky and HN watch lists: Ethan Mollick 18 Bluesky + 17 X posts
  # kept (2 "distinct authors"), Simon Willison 4 + 4 + 5 (3); 3 same-text cross-posts,
  # of which the existing dedupe caught 1. With the map, a person is ONE author, and a
  # person's same text on two platforms is folded as `cross_post` (a share). Every
  # handle must already be in its platform's list above; a handle in two people, or a
  # person on one platform, is refused. Never guessed: only people written here link.
  #
  # `bluesky_did` (2026-11-24, #653 review): the Bluesky account's permanent id. A
  # Bluesky post names its author only by DID, so with it a post found by a KEYWORD
  # query links to its person too, and a `from:<handle>` post whose author is another
  # DID - a handle that changed hands - links to no one. Resolved by hand on
  # 2026-11-24 through com.atproto.identity.resolveHandle on api.bsky.app (the adapter's
  # own host), all six HTTP 200. Re-resolve when a Bluesky handle here changes.
  people:
    simon_willison: {x: simonw, bluesky: simonwillison.net, hackernews: simonw,
                     bluesky_did: "did:plc:kft6lu4trxowqmter2b6vg6z"}
    andrej_karpathy: {x: karpathy, bluesky: karpathy.bsky.social, hackernews: karpathy,
                      bluesky_did: "did:plc:j7gi6r4kh6uof7rfrqpm3fej"}
    swyx: {x: swyx, bluesky: swyx.io, hackernews: swyx,
           bluesky_did: "did:plc:xxuso5disl5vq5xfzlr7mf52"}
    ethan_mollick: {x: emollick, bluesky: emollick.bsky.social,
                    bluesky_did: "did:plc:flxq4uyjfotciovpw3x3fxnu"}
    jeremy_howard: {x: jeremyphoward, bluesky: howard.fm, hackernews: jph00,
                    bluesky_did: "did:plc:ihze7dasblwewgunyesfbm23"}
    max_woolf: {bluesky: minimaxir.bsky.social, hackernews: minimaxir,
                bluesky_did: "did:plc:oxaernim5mj2mmy3ytrvb42n"}
  # A CROSS-POST IS THE SAME POST, NOW, ON ANOTHER PLATFORM (#653 review). Dedupe pass 3
  # folds a person's same text only when the posts are on DIFFERENT platforms, within
  # this many hours of the earlier one, and - when both carry an article link - with
  # the same link. Undated posts are never folded (rule 6). Measured 2026-11-24: all 3
  # folds in a 7-day watch harvest were read by eye and all 3 were true cross-posts,
  # 0 to 4 minutes apart. 6 hours is wide of that and far from a template intro reused
  # days later for a different link; a wrong fold hides a post, a missed one adds one.
  cross_post_hours: 6

# ── THE DOMAINS: our 20 persona umbrellas (anooj, 2026-11-20) ─────────────────
# Generated from the persona keyword work; edit freely here from now on.
#   * kind: industry (where the work is done) or function (a role in every industry).
#   * active: the FIVE for the first test run are the umbrellas with the highest share of
#     keywords showing strong AI evidence (Reddit top-25 for "<keyword> AI", phrase + an AI
#     term counted in code; or 25+ HN posts/comments with the phrase and "AI", last 730 days;
#     both checks 2026-11-20): marketing 20/23, design_creative 18/23, security_it 16/24,
#     retail 15/23, personal 15/25. RECOUNTED 2026-11-20 (#645 review, point 1): a keyword
#     carrying "AI" itself passes that test by construction, so those are left out of the
#     count - leaders_founders fell from 14/23 to 10/19 and personal took its place. The
#     rest are complete and switched off. The X AI group no longer has the bare word
#     `agent` (travel, real-estate and support agents; #645 review, point 4).
#   * domain_terms: our two-word workflow keywords (one keyword, one umbrella). Parvathi's five
#     domains (finance, healthcare, hospitality, engineering, governance) keep their own terms,
#     ambiguous terms, exclusions and queries; ours are added after hers.
#   * x.search: keywords clubbed with OR, ~6 per query and never under 5 where the list allows,
#     ANDed with an AI group - measured 2026-11-20: 100 distinct posts over 5 pages, 89 with a
#     keyword, 92 with an AI term (11 of 20 without the AI group).
#   * reddit.search / hackernews / devto / bluesky / github: each list's best-evidenced
#     keywords. Reddit ignores quotes and minus signs on our route; the sieve decides.
#   * feeds: empty until each feed has a terms ruling in contract/sources.yaml.

