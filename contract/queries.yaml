# ============================================================================
#  Harvest queries — v1.0
#
#  SHARED. Changes go through a PR: this file decides what the board can ever
#  know. Harvest is entirely query-driven, so a capability nobody searches for
#  has empty cells forever, no matter how much engineers discuss it.
#
#  ┌──────────────────────────────────────────────────────────────────────┐
#  │  DRAFT — SEMANTIC HALF ONLY. Engineer 2 wrote the meaning; the       │
#  │  rendering is Engineer 1's, per the split agreed on issue #5.        │
#  └──────────────────────────────────────────────────────────────────────┘
#
#  WHY THERE ARE NO QUERY STRINGS IN THIS FILE
#
#  Issue #4 measured that GitHub Search silently discards `(a OR b)` grouping
#  and `wildcard*` terms. It does not error. Every template written in that
#  syntax collapses to its alias, and nine of ten such queries exceeded the
#  1,000-result ceiling at a median of 13,038 matches.
#
#  Issue #5 measured why, and it is worse: quoting does not bind either.
#  `"sonnet claude 5"` — the same words reversed — returns 545 against the
#  correct order's 540, and a trailing numeral is matched against the ISSUE
#  NUMBER, so `"claude sonnet 5"` collects issue #5 from 89 unrelated repos.
#
#  So a rendered query string in a platform-neutral file is a string that is
#  true for no platform. This file therefore carries TERM SETS as data.
#
#  THE TERMS ARE A SIEVE FIRST AND A SEARCH SECOND.
#
#  The first draft treated blogs as the exception, because RSS has no search
#  and the terms had to be a post-fetch filter there. Engineer 1's review
#  inverted that, correctly: blogs are the MODEL, not the exception.
#
#  82% of the signal terms here are multi-word. No index treats a multi-word
#  term as a phrase - GitHub reads "should have been null" as four ANDs and
#  returns 1,836 unrelated results. A local substring match reads it as the
#  exact phrase, which no index can. So the same terms that are close to
#  meaningless in a query are precise in a sieve:
#
#      RETRIEVAL   broad and cheap, whatever an index honours. Its only job
#                  is to produce candidate documents. Precision here is not
#                  worth paying for, because the index cannot deliver it.
#      SIEVE       local, exact, identical on all three platforms. This is
#                  where the terms do their actual work.
#
#  One sieve component, three platforms. Blogs skip the first step entirely.
#
#  That is also why prefix stems are acceptable in `signal` - `moralis` in a
#  sieve matches moralising and moralised, where as a search term it matches
#  nothing at all. Terms are written for the sieve. If one is also a usable
#  search term, that is a bonus for the adapter to exploit, not a constraint
#  on this file.
#
#  That is ruling (b) from issue #5: what was measured is a property of one
#  index, not of the model's name or of the capability. This file makes NO
#  claim about request shape, request count, scoping or budget. It said so
#  and then prescribed a GitHub rendering anyway, which Engineer 1 costed at
#  30.9 hours - 79x BUILD-PLAN's budget. That line is gone. Rendering is
#  collect/'s, without a suggestion from here.
#
#  WHAT EACH ENTRY CARRIES
#
#    capability          a key from capabilities.yaml. FR-7 checks all 12 appear
#    stance              negative | positive. FR-8 checks every capability has
#                        at least one negative, mechanically rather than by
#                        reading the terms
#    intent              what this query is trying to find, in words
#    terms.subject       ALL must appear. Always the alias
#    terms.topic         ANY-OF. Names the capability
#    terms.signal        ANY-OF. Carries the stance
#    records_condition   the dimension a result must state to be bucketable
#    yields_claim_when   what has to be true for extraction to produce a claim
#                        rather than discard the document
#
#  `yields_claim_when` is the half that is genuinely Engineer 2's. A query
#  that retrieves 500 documents which all fail it is a query that costs rate
#  limit and produces nothing, and that is invisible from the collect/ side
#  because the documents look like hits.
#
#  THE THREE THINGS EVERY RESULT NEEDS, stated once instead of twelve times:
#
#    1. NAMES A MODEL SPECIFICALLY ENOUGH TO RESOLVE. A bare family name
#       resolves at `specificity: family`, which never counts as independent
#       corroboration. "the cheap Anthropic one" yields nothing.
#    2. FIRST-HAND. What the writer observed, not what they expect, predict,
#       or read elsewhere. A post reporting someone else's benchmark is a
#       citation, not evidence.
#    3. DESCRIBES BEHAVIOUR, NOT SENTIMENT. "It's bad at tool calling" has no
#       verifiable span worth quoting. "It passed a string where the schema
#       said integer, on the 4th call" does.
#
#  Per-entry `yields_claim_when` states only what is ADDITIONAL to those three.
#
#  EVERY CAPABILITY CARRIES BOTH STANCES.
#
#  FR-8 requires a negative query for all twelve, and its wording should
#  widen: what is actually needed is both stances for every capability, with
#  the silent-failure rule as a strict subset of that.
#
#  For the four SILENT-failure capabilities a positive query is what makes the
#  gate reachable at all - "nobody complained" is not evidence when you would
#  not find out, so positive consensus is required and cannot be reached by a
#  query set that only looks for complaints.
#
#  For the eight LOUD ones the gate does not need it and the MODEL PAGE does.
#  The first draft stopped at four for that reason and produced a corpus that
#  would have been searched for complaints only, across two-thirds of the
#  board. See the rationale block above those eight entries.
#
#  TERM RULES, both learned from the first live GitHub run:
#
#    1. A signal term is MULTI-WORD AND CARRIES A RELATION, or it is a single
#       word rare enough that its presence in model-related text implies the
#       claim - and that second case needs a per-term justification, not an
#       assumption. `accurate` produced both false positives of the first run
#       on its own, matching inside marketing copy and inside a prompt string.
#       The allowlist is in tests/test_queries_contract.py, with a reason
#       beside each entry, so a bare adjective is a decision rather than a
#       slip.
#
#    2. NOUN-FINAL TERMS ARE WRITTEN SINGULAR, AND THE SIEVE IS REQUIRED TO
#       STEM THE FINAL WORD. Stated as a requirement because it is not free:
#       the sieve stems single words and matches multi-word terms exactly, so
#       `invalid argument` does not currently reach "invalid arguments" any
#       more than the plural reached the singular case from the first live run.
#
#       Writing singular without the stemming trades one blind spot for
#       another rather than removing it - measured against the sieve as it
#       stands, 275 of 275 multi-word terms in this file fail to match their
#       own plural. The same argument that justifies stemming a single word
#       applies to the final noun of a phrase, and the existing MIN_STEM_LENGTH
#       guard already stops the short-word cases (`key` reaching `keyword`).
#
#       Until that lands, a term whose plural or singular differs materially
#       should carry BOTH forms rather than rely on the stem.
#
#  Placeholders: `{alias}` is issued once per alias variant, not once per
#  model. `{alias_b}` is any other model in the registry — substitution only.
# ============================================================================

version: "1.0"


queries:

  # ═══════════════════════════ LOUD FAILURES ═══════════════════════════
  #  You find out in seconds. A validation retry is a real mitigation, so
  #  weaker evidence is acceptable and a negative query alone is enough.

  - capability: instruction.adherence
    stance: negative
    intent: >
      Someone who declared an output contract - a shape, a length cap, "no
      preamble" - and got something else back. The valuable reports are the
      ones where it held for a while and then drifted, because that is the
      failure a short test never finds.
    terms:
      subject: ["{alias}"]
      topic: ["instruction", "system prompt", "output format", "the format",
              "told it to", "asked it to"]
      signal: ["didn't follow", "does not follow", "doesn't follow",
               "ignores the instruction", "ignored the instruction",
               "ignores the format", "adds preamble", "added preamble",
               "won't stick to", "stopped obeying", "stopped following",
               "keeps adding", "drifted from the format"]
    records_condition: context_size
    yields_claim_when: >
      The instruction and the deviation are both stated. "Ignores
      instructions" is unusable; "asked for JSON only and it prefixed
      'Here's the JSON:'" is a claim. Reports of drift should record roughly
      how far in it started, since that is the condition.

  - capability: format.structured_output
    stance: negative
    intent: >
      Malformed or unparseable structured output against a declared schema.
    terms:
      subject: ["{alias}"]
      topic: ["json", "structured output", "response format", "schema",
              "json mode", "json_schema", "json schema", "pydantic"]
      signal: ["invalid json", "failed to parse", "extra key", "extra keys", "trailing comma",
               "wraps it in markdown", "code fence", "unparseable",
               "missing required field", "invalid for json schema",
               "not valid json"]
    records_condition: structured_mode
    yields_claim_when: >
      IT SAYS WHETHER PROVIDER-SIDE ENFORCEMENT WAS ON. This one matters more
      than any other condition in the file: enforcement guarantees validity at
      the API layer, so the same complaint means opposite things depending on
      the flag. A report that does not say lands in `structured_mode:unknown`
      and can never corroborate a claim in either band - which makes it
      near-worthless despite looking like a clean hit.

  - capability: tool_calling.schema_accuracy
    stance: negative
    intent: >
      Arguments that do not conform to the declared schema - wrong types,
      invented enum values, missing required fields - and tools invented that
      were never declared.
    terms:
      subject: ["{alias}"]
      topic: ["tool calling", "function calling", "tool use", "tool_choice",
              "function call", "tool schema"]
      # `invalid argument` singular, not plural: the sieve matches phrases
      # exactly, and the live run turned up "Request contains an invalid
      # argument" which the plural form missed entirely. Every noun-final term
      # in this file is written singular for that reason.
      signal: ["invalid argument", "invalid arguments", "wrong type", "wrong parameter",
               "invented a tool", "made up a tool", "hallucinated a function",
               "not in the schema", "missing required field",
               "tool that is not", "not in the list", "no such tool"]
    records_condition: tool_count
    yields_claim_when: >
      HOW MANY TOOLS WERE IN SCOPE. Without it the claim lands in
      `tools:unknown` and cannot be compared to anything - and this capability
      is the one where the condition changes the answer most sharply. A report
      naming the tool count is worth several that do not.

  - capability: tool_calling.long_chain_reliability
    stance: negative
    intent: >
      Multi-step sequences where step N depends on step N-1, and recovery
      after a tool returns an error. The characteristic report is positional:
      it worked for six calls and broke on the seventh.
    terms:
      subject: ["{alias}"]
      topic: ["tool chain", "multi-step", "agent loop", "agentic", "chained",
              "sequence of call", "after the error"]
      signal: ["fails at the", "failed at the", "loops forever", "infinite loop",
               "gets stuck", "forgets what it called", "never recovered",
               "never recovers", "repeats the same call", "gave up after"]
    records_condition: tool_count
    yields_claim_when: >
      The chain length or tool count is stated, and ideally WHERE it broke.
      "Fails on long chains" is sentiment. "Held for six calls, looped on the
      seventh with 12 tools registered" is the claim this capability exists
      for, and it carries its own condition.

  - capability: code.editing_diff_fidelity
    stance: negative
    intent: >
      Applying a change to existing code and emitting it usably - a valid
      diff, a matching search/replace block, no truncation. Deliberately
      separate from generation: models routinely write correct code and
      cannot produce a clean patch of it.
    terms:
      subject: ["{alias}"]
      topic: ["diff", "patch", "search and replace", "edit block", "apply the edit",
              "unified diff", "SEARCH/REPLACE"]
      signal: ["breaks the diff", "didn't match", "failed to apply",
               "truncat", "rest unchanged", "omitted the rest",
               "wrong line number", "wrong line numbers", "malformed patch", "search block"]
    records_condition: context_size
    yields_claim_when: >
      The FILE SIZE or edit context is recoverable, because this failure is
      overwhelmingly a length effect - the same model patches a 40-line file
      cleanly and truncates a 2,000-line one. A report with no size is a
      claim about a model in general, which is the shape averaging produces
      and buckets exist to avoid.

  - capability: code.generation
    stance: negative
    intent: >
      New code from a specification that does not work - APIs that do not
      exist, imports that are wrong, code that does not compile.
    terms:
      subject: ["{alias}"]
      topic: ["generated", "wrote the code", "code generation", "asked it to write",
              "scaffold", "boilerplate"]
      signal: ["doesn't compile", "does not compile", "hallucinated the api",
               "no such method", "wrong import", "made up a function",
               "deprecated api", "wrong signature", "does not exist in the"]
    records_condition: context_size
    yields_claim_when: >
      The LANGUAGE OR LIBRARY is named. "Bad at code" is unusable; "invented
      a `pandas.read_parquet` kwarg that does not exist" is a claim, and the
      library is what makes it checkable by a reader. Note that a wrong API
      may be a knowledge-cutoff artefact rather than a capability failure -
      if the post says the API is new, that is a cutoff fact, not a claim.

  - capability: over_refusal
    stance: negative
    intent: >
      Refusing benign requests, or moralising preamble that breaks a strict
      output contract. The pipeline-relevant harm is the second: an
      over-cautious model silently corrupts a fixed output shape.
    terms:
      subject: ["{alias}"]
      topic: ["refused", "refusal", "safety filter", "guardrail", "won't answer",
              "declined"]
      # `moralis` / `moraliz` are SIEVE PREFIXES, matching moralising and
      # moralized without needing both spellings twice. As search terms they
      # match nothing - there is no prefix matching, and Engineer 1 measured
      # `"gemini flash" moraliz` returning exactly one result: issue #4 of
      # this repository, which quotes the template these stems came from.
      # Kept deliberately, and named so no adapter tries to issue them.
      signal: ["as an ai", "refuses ordinary", "lectured me", "moralis", "moraliz",
               "nothing wrong with the request", "false refusal",
               "unnecessary disclaimer", "declined a perfectly",
               "refused a benign", "safety filter fired"]
    records_condition: context_size
    yields_claim_when: >
      THE REQUEST IS DESCRIBED WELL ENOUGH TO JUDGE IT BENIGN. This is the
      capability where the corpus is most polluted by people annoyed at a
      correct refusal. If the reader cannot tell what was asked, there is no
      claim - only a complaint. Vetting is not a substitute for this; by then
      the quote is already attached.

  - capability: ops.latency_ttft
    stance: negative
    intent: >
      Time to first token, throughput, and variance under load. For
      open-weight models this is a property of the HOST, never the model.
    terms:
      subject: ["{alias}"]
      topic: ["latency", "ttft", "time to first token", "throughput",
              "tokens per second", "response time", "p95", "p99"]
      signal: ["too slow", "times out", "timed out", "latency spike",
               "high variance", "unusable in production", "degraded under load",
               "slow in practice", "seconds to first token"]
    records_condition: context_size
    yields_claim_when: >
      THE HOST OR PROVIDER IS NAMED for any open-weight model, and the
      measurement is a number rather than an adjective. "Slow" is worthless
      here in a way it is not elsewhere, because this capability's whole
      content is the number. Claims older than about a month should be
      expected to have decayed - the 30-day half-life exists for this
      capability specifically, and a query set that only ever returns
      year-old posts is producing nothing usable.


  # ═══════════════════════════ SILENT FAILURES ══════════════════════════
  #  Wrong data enters the system looking correct and stays. POSITIVE
  #  CONSENSUS IS REQUIRED, so each of these carries both stances. A negative
  #  query alone can never approve a cheaper model for one of them - which is
  #  the single recommendation this product exists to make.

  - capability: context.effective_window
    stance: negative
    intent: >
      Where accuracy actually collapses, which is routinely a fraction of the
      advertised window. This feeds FR-31, a HARD FILTER, so a claim here
      excludes models from recommendations - which means a vague one does
      damage that never surfaces on a page.
    terms:
      subject: ["{alias}"]
      topic: ["context", "long context", "context window", "recall", "needle",
              "long document", "large input"]
      signal: ["loses recall", "forgets the middle", "falls apart", "degrades past",
               "stops using the", "ignores the earlier", "lost in the middle",
               "only reliable up to", "fell off past", "recall dropped"]
    records_condition: context_size
    yields_claim_when: >
      A NUMBER, OR A RANGE, FOR WHERE IT DEGRADED. This is the strictest
      `yields_claim_when` in the file and it should be enforced hardest: a
      claim without a threshold cannot populate `reported_low`, and a
      fabricated `reported_low` silently excludes qualified models from every
      long-context recommendation with nothing on the page to disagree with.
      "Bad at long context" is not a claim about this capability. "Recall fell
      off a cliff somewhere past 180k in our RAG eval" is.

  - capability: context.effective_window
    stance: positive
    intent: >
      Reports of the window holding at a stated size. Necessary because
      FR-31 filters on the reported figure, and with only negative evidence
      the reported range has a floor and no ceiling.
    terms:
      subject: ["{alias}"]
      topic: ["context", "long context", "recall", "full context", "large input"]
      signal: ["held up at", "no degradation at", "still accurate at", "fine at",
               "recall stayed", "handled the whole", "full window without"]
    records_condition: context_size
    yields_claim_when: >
      The size it held at is stated. A positive claim with no number cannot
      raise a ceiling and so cannot do the job this query exists for.

  - capability: summarization.fidelity
    stance: negative
    intent: >
      Omission of load-bearing facts. Fluency is not the axis - a fluent
      summary that silently drops a critical clause reads as excellent and is
      the exact failure this capability tracks.
    terms:
      subject: ["{alias}"]
      topic: ["summary", "summarize", "summarise", "summarizing", "condense",
              "digest", "tldr", "recap"]
      signal: ["dropped the", "left out the", "missed the", "omitted the",
               "made something up", "hallucinated", "lost the detail",
               "buried the", "misread the", "never mentioned the"]
    records_condition: context_size
    yields_claim_when: >
      WHAT WAS DROPPED, not that something was. The distinction is the whole
      capability: "summaries are bad" is sentiment, "it dropped the
      cancellation clause from every contract summary" is a claim a reader can
      check and another engineer can recognise.

  - capability: summarization.fidelity
    stance: positive
    intent: >
      THE HIGHEST-VALUE POSITIVE QUERY IN THE FILE. Summarisation is the
      canonical silent-failure capability and the canonical cheap-model
      substitution. Without positive consensus here the advisor can never
      approve a cheaper summariser, which is the single recommendation this
      product exists to make - so if this query set returns nothing, the
      product does not work, however well everything else runs.
    terms:
      subject: ["{alias}"]
      topic: ["summary", "summarize", "summarise", "condense", "digest", "recap"]
      # `accurate` and `faithful` were here and are gone. In the first live
      # GitHub run `accurate` produced both of the run's two false positives
      # on its own - matching inside a pasted marketing sentence and inside a
      # prompt string in a code block. A single common adjective cannot carry
      # a positive claim: it lives in marketing copy, prompt strings and API
      # docs, which is most of what a naive retrieval returns. Terms here now
      # carry a RELATION - what held, for how long, noticed by whom.
      signal: ["held up", "good enough", "no complaint from", "no complaints from",
               "no regression", "no regressions",
               "nobody noticed", "still running", "kept it in production",
               "no quality drop", "faithful to the source", "months without"]
    records_condition: context_size
    yields_claim_when: >
      It reports an OUTCOME OVER TIME, not a first impression. "Tried it and
      it seems fine" is a first impression; "ran it on 40k tickets a week for
      three months, no complaints from the team that reads them" is positive
      evidence of a silent failure NOT occurring, which is the only way that
      absence can be observed. Prefer these heavily in vetting.

  - capability: extraction.faithfulness
    stance: negative
    intent: >
      Typed fields from messy input. Null discipline - inventing a value for
      a field that genuinely is not there - is the dominant cheap-model
      failure and the reason this is separate from structured output: the
      JSON is perfectly valid and the value is fiction.
    terms:
      subject: ["{alias}"]
      topic: ["extraction", "extract", "parse", "structured field", "populate",
              "pull out the", "field extraction"]
      signal: ["invented a value", "made up a value", "hallucinated the",
               "should have been null", "wasn't in the document",
               "filled in a field", "guessed the", "not in the source"]
    records_condition: context_size
    yields_claim_when: >
      THE FIELD WAS ABSENT FROM THE SOURCE and the model supplied a value
      anyway. That is the specific failure. A wrong-but-present value is a
      different and much less interesting problem, and conflating them makes
      the cell mean nothing.

  - capability: extraction.faithfulness
    stance: positive
    intent: >
      Reports of correct null discipline in production. Same reasoning as
      summarisation: silent failures cannot be cleared by an absence of
      complaints.
    terms:
      subject: ["{alias}"]
      topic: ["extraction", "extract", "parse", "structured field", "populate"]
      signal: ["correctly returned null", "didn't invent", "no hallucinated field",
               "matched the source", "held up", "no regression", "no regressions",
               "nulls were right"]
    records_condition: context_size
    yields_claim_when: >
      Volume or duration is stated. Null discipline holding on ten documents
      is not evidence; holding across a production run is.

  - capability: reasoning.multistep
    stance: negative
    intent: >
      Multi-step deduction, decomposition, and holding constraints across a
      chain. Silent because a confidently wrong chain is indistinguishable
      from a right one without checking the answer.
    terms:
      subject: ["{alias}"]
      topic: ["reasoning", "multi-step", "multistep", "planning", "decompose",
              "chain of thought", "step by step", "constraint"]
      signal: ["falls apart on", "can't follow the", "confidently wrong",
               "lost the constraint", "skipped a step", "wrong conclusion",
               "plausible but wrong", "didn't notice the"]
    records_condition: context_size
    yields_claim_when: >
      The CHAIN IS DESCRIBED well enough that the reader can see where it
      broke. This capability attracts the vaguest posts in the corpus - "bad
      at reasoning" is the single most common unusable sentence about models -
      so this filter will do more work here than anywhere else.

  - capability: reasoning.multistep
    stance: positive
    intent: >
      Reports of a chain holding under stated conditions. Required for the
      same reason as the other three silent capabilities.
    terms:
      subject: ["{alias}"]
      topic: ["reasoning", "multi-step", "planning", "decompose", "constraint"]
      signal: ["held the constraint", "got it right", "followed the chain",
               "no reasoning error", "matched the expected", "as good as",
               "held up"]
    records_condition: context_size
    yields_claim_when: >
      The task's difficulty is recoverable. "Reasoned well" about a trivial
      task is not evidence for a task that is not trivial.


  # ══════════ POSITIVE QUERIES FOR LOUD CAPABILITIES ══════════
  #
  #  These exist for the MODEL PAGE, not for the gate.
  #
  #  The gate only needs positive consensus for silent failures, so the first
  #  draft said positive queries for loud capabilities were "permitted and not
  #  required" and stopped at four. That was right for the advisor and wrong
  #  for the product.
  #
  #  A model page shows every capability with the evidence behind it. With
  #  negative-only queries on eight of twelve, two-thirds of that page would be
  #  built from a corpus we only ever searched for complaints in. It compounds:
  #  GitHub is structurally negative - nobody opens an issue to say something
  #  worked - and carries the highest base trust at 0.95. So the most trusted
  #  source is the negative one, and for eight capabilities it was the only one
  #  queried.
  #
  #  The page would read harsher than reality and nothing on it would say so.
  #  Not a broken page - a page that looks like engineers dislike the model.
  #  That is rule 6 again: a missing input rendering as a confident answer.
  #
  #  WHY THIS COULD NOT WAIT FOR THE VOCABULARY TO SETTLE. Adding a capability
  #  later is cheap - it backfills by re-reading the immutable raw store.
  #  Adding a QUERY later is not: documents it would have found were never
  #  fetched, and there is nothing to re-read. Queries decide what you have;
  #  capabilities decide how you read it. Only one of those is recoverable.

  - capability: instruction.adherence
    stance: positive
    intent: >
      An output contract that held, especially across a long run rather than
      a first try.
    terms:
      subject: ["{alias}"]
      topic: ["instruction", "system prompt", "output format", "the format"]
      signal: ["stuck to the format", "held the format", "never added preamble",
               "followed the instruction", "no preamble", "exactly what I asked"]
    records_condition: context_size
    yields_claim_when: >
      Adherence is reported over a run, not a try. Instruction-following
      failures are drift failures - they appear at turn 30, not turn 1 - so a
      single successful call is not evidence that the contract holds.

  - capability: format.structured_output
    stance: positive
    intent: >
      Structured output that parsed reliably, with the enforcement flag stated.
    terms:
      subject: ["{alias}"]
      topic: ["json", "structured output", "response format", "schema",
              "json mode", "json_schema"]
      signal: ["always valid json", "never malformed", "parsed cleanly",
               "no parse error", "schema held", "zero invalid"]
    records_condition: structured_mode
    yields_claim_when: >
      SAME CONDITION AS THE NEGATIVE, and it matters more here. "Valid JSON
      every time" with provider enforcement ON is a claim about the API layer,
      not about the model, and reading it as the latter would recommend a
      model for free-form structured output it may fail at.

  - capability: tool_calling.schema_accuracy
    stance: positive
    intent: >
      Arguments that conformed, at a stated tool count.
    terms:
      subject: ["{alias}"]
      topic: ["tool calling", "function calling", "tool use", "tool schema"]
      signal: ["arguments were correct", "never invented a tool", "schema held",
               "no invalid argument", "stuck to the schema", "always picked the right"]
    records_condition: tool_count
    yields_claim_when: >
      The tool count is stated. A positive report at 3 tools says nothing
      about 30, and this capability degrades sharply with count - so an
      unbucketed positive is the most misleading kind of evidence here.

  - capability: tool_calling.long_chain_reliability
    stance: positive
    intent: >
      A chain that completed, or recovered from a tool error, at a stated
      length.
    terms:
      subject: ["{alias}"]
      topic: ["tool chain", "multi-step", "agent loop", "agentic", "chained"]
      signal: ["completed the chain", "recovered from the error", "no loop",
               "finished all", "ran the whole", "held for"]
    records_condition: tool_count
    yields_claim_when: >
      The chain LENGTH is stated. "Handles chains well" is the sentiment this
      capability exists to replace with a number.

  - capability: code.editing_diff_fidelity
    stance: positive
    intent: >
      Patches that applied, at a stated file size.
    terms:
      subject: ["{alias}"]
      topic: ["diff", "patch", "search and replace", "edit block", "unified diff"]
      signal: ["applied cleanly", "diff applied", "patch applied",
               "no truncation", "matched every time", "never had to fix"]
    records_condition: context_size
    yields_claim_when: >
      The file size is recoverable. This failure is overwhelmingly a length
      effect, so a positive report with no size is a claim about small files
      presented as a claim about the capability.

  - capability: code.generation
    stance: positive
    intent: >
      Generated code that worked, with the language or library named.
    terms:
      subject: ["{alias}"]
      topic: ["generated", "wrote the code", "code generation", "scaffold"]
      signal: ["compiled first try", "compiled cleanly", "worked first time",
               "ran unmodified", "correct import", "no edit needed"]
    records_condition: context_size
    yields_claim_when: >
      The language or library is named, same as the negative. A positive
      report about a mainstream library says little about a niche one, and
      the library is what makes the claim checkable.

  - capability: over_refusal
    stance: positive
    intent: >
      Benign requests answered without refusal or disclaimer. Worth querying
      because over-refusal is the capability where the negative corpus is
      most polluted by people annoyed at correct refusals - a positive corpus
      is the only counterweight.
    terms:
      subject: ["{alias}"]
      topic: ["refusal", "refused", "safety filter", "guardrail", "declined"]
      signal: ["never refused", "no refusal", "no disclaimer", "no lecture",
               "answered without", "didn't moralis"]
    records_condition: context_size
    yields_claim_when: >
      The domain is described. "Never refuses anything" is not credible and
      not useful; "ran 40k medical-summary prompts, no refusals" is both.

  - capability: ops.latency_ttft
    stance: positive
    intent: >
      Latency that held, with a number and a host.
    terms:
      subject: ["{alias}"]
      topic: ["latency", "ttft", "time to first token", "throughput",
              "tokens per second", "response time"]
      signal: ["fast enough", "consistent latency", "low ttft", "no timeout",
               "held under load", "p95 was", "ms to first token"]
    records_condition: context_size
    yields_claim_when: >
      A NUMBER AND A HOST, same as the negative. This capability's entire
      content is the number, and for open weights it is a property of the
      host. Claims decay on a 30-day half-life, so an old positive is close
      to worthless.


# ----------------------------------------------------------------------------
#  SUBSTITUTION — cross-capability, its own pass, a bonus in vetting.
#
#  "We moved our summariser to X and it held" is a direct report of exactly
#  the decision this board exists to inform, and it is the only pattern that
#  reports a MIGRATION rather than an impression. It is also the pattern most
#  damaged by issue #4: it is pure phrase matching, and phrase matching does
#  not exist on GitHub. It lives predominantly on blogs, which is the second
#  reason that adapter is not optional.
#
#  `direction: decided_at_extraction` — THE ONLY MACHINE-READABLE CONSTRAINT
#  IN THIS FILE, and it is here rather than a `platforms:` list on purpose.
#
#  Seven of these topic terms embed `{alias_b}` in a DIRECTIONAL phrase:
#  "replaced X with Y" and "replaced Y with X" are opposite claims built from
#  identical tokens. RETRIEVAL CANNOT TELL THEM APART, so a retrieved set is a
#  direction-blind superset and direction is decided downstream.
#
#  RENAMED, and the old name is worth recording because it asserted a cause the
#  measurements have since contradicted. It said the query means nothing where
#  an index does not BIND a phrase, which implied some index does. None that
#  has been measured does: GitHub ranks rather than binds ("replaced claude
#  with gpt" 53 against the reverse order's 52), and Reddit has no phrase
#  operator at all - it degrades to OR over the tokens, every returned post
#  carrying at least one word and only 24-37% carrying all of them. "context
#  window" at 96% was collocation frequency read as operator behaviour. So the
#  old name described a capability no platform has, and pointed at the wrong
#  remedy: a better index.
#
#  The new name states the REMEDY rather than the obstacle. Direction is not
#  something retrieval can be made to carry; it is read from the text, by the
#  one stage allowed to read text. An LLM may propose, it may never decide -
#  and direction is a proposal about what a sentence says, verified against a
#  verbatim quote like every other claim.
#
#  `platforms: [blogs, reddit]` would have been the shorter way to say it and
#  it is the wrong one: it writes today's measurement of one index into a
#  platform-neutral file, which is exactly what ruling (b) removed. That
#  argument survived the rename intact and is better supported now than when
#  it was written - a platform list naming Reddit as a phrase-binding platform
#  would today be WRONG rather than merely stale.
#
#  Retrieval MAY be direction-blind; extraction enforces direction from the
#  quote. Engineer 1's observation that this collapses 90 ordered model pairs
#  to 45 is a rendering decision and theirs to take.
# ----------------------------------------------------------------------------

substitution:

  - stance: positive
    direction: decided_at_extraction
    intent: >
      A migration from one model to another that was kept.
    terms:
      subject: ["{alias}"]
      topic: ["replaced {alias_b}", "switched from {alias_b}", "moved off {alias_b}",
              "migrated from {alias_b}", "instead of {alias_b}", "swapped {alias_b}"]
      signal: ["held up", "no regression", "no regressions", "nobody noticed", "saved us",
               "cheaper per", "still running", "kept it in production",
               "months later"]
    records_condition: context_size
    yields_claim_when: >
      BOTH MODELS RESOLVE, the workload is named, and the migration STUCK.
      A migration announced is a plan; a migration still in place months
      later is evidence. If only one model resolves it is an impression about
      that model, not a substitution - route it to the capability query
      instead of discarding it.

  - stance: negative
    direction: decided_at_extraction
    intent: >
      A migration that was reverted. Rarer, and worth more per instance than
      any other document in the corpus: it is a direct measurement of the
      recommendation this board would have made, and of it being wrong.
    terms:
      subject: ["{alias}"]
      topic: ["switched back", "reverted to", "went back to", "rolled back",
              "moved back to {alias_b}"]
      signal: ["regression after", "quality dropped", "started failing",
               "complaint from", "wasn't worth", "had to revert"]
    records_condition: context_size
    yields_claim_when: >
      The REASON for the revert is stated and attaches to a capability. A
      revert for cost, contract, or compliance reasons is not evidence about
      the model. Route the reason to its capability; a revert with no stated
      reason is a strong signal with nothing to attach it to.


# ============================================================================
#  THE AUTOMATED CHECK — FR-7 and FR-8
#
#  IMPLEMENTED in tests/test_queries_contract.py. It was a comment in the
#  first draft, and the 12/12 was verified by hand in a throwaway script -
#  which is FR-7's acceptance ("fails the build") not being met by the file
#  that claims to meet it. Engineer 1 caught it, having shipped the same
#  defect in collect/http.py the same morning.
#
#  The test asserts, all mechanically:
#
#    1. every `key` in capabilities.yaml appears as a `capability` here   FR-7
#    2. every capability has at least one entry with stance: negative     FR-8
#    3. every capability whose failure_mode is `silent` also has at least
#       one entry with stance: positive
#    4. no `capability` here is absent from capabilities.yaml
#    5. `records_condition` matches conditions.yaml's dominant_dimension
#    6. every entry carries a non-empty intent and yields_claim_when
#
#  The third is not in FR-8's wording and should be. A silent-failure
#  capability with only negative queries can never reach positive consensus,
#  so the gate can never pass, so the cell can never publish - and it fails as
#  an ABSENCE, with a capability that simply never appears on any page and
#  nothing to disagree with. That is rule 6, and the check is where it gets
#  caught cheaply.
#
#  Failing this test is the "fails the build" FR-7 asks for. Adding a
#  capability without its queries then stops being a silent no-op.
#
#  CURRENT COVERAGE is not restated here. It was - "12 negative, 4 positive" -
#  and it went stale the moment PR #8 took the positives to twelve. Nothing
#  failed, because a comment cannot fail, which is the class that bites later.
#  The counts live in tests/test_queries_contract.py, which breaks when they
#  are wrong. Same reason BUILD-PLAN 3.2 and 3.3 stopped carrying copies of
#  CLAUDE.md and tables.sql.
#
#  WHAT THIS FILE DOES NOT DECIDE
#
#  Rendering, syntax, scoping, request count, request budget, and which alias
#  forms each platform issues. All of that is collect/'s, and issue #5 ruling
#  (b) is why: what was measured on GitHub is a property of GitHub's index,
#  and encoding it here would make it true for Reddit and blogs, which it is
#  not.
#
#  `direction: decided_at_extraction` is the one exception, and it is not a
#  rendering instruction - it states WHERE DIRECTION IS DECIDED, which is a
#  fact about the pipeline rather than about any platform's index, and leaves
#  each adapter to decide what to do about retrieving a direction-blind set.
#
#  Reddit and blog matching have not been measured at all. What an adapter
#  does about that is collect/'s to decide, and this file does not say.
#
#  The first draft said "the default for an unmeasured platform is to issue
#  every form". That was a rendering default - the expensive kind, and the
#  same cartesian shape that cost 30.9 hours on GitHub, applied by default to
#  two platforms nobody has measured - sitting in the file that disclaims
#  rendering. Removed rather than reversed: picking the opposite default
#  would still be picking one.
#
#  On blogs the question does not arise at all. There is no search, so alias
#  form is a sieve concern there, and the sieve matches every form locally
#  whatever an adapter would have "issued".
# ============================================================================
