# THE HARDWARE THE LOCAL VRAM TOOL OFFERS (PROPOSED 2026-10-23,
# docs/proposals/can-i-run-it.md). Rule 5: a device is added here by a commit.
#
# `memory_gib` is the device's memory as the vendor sells it. GPU vendors write
# "GB" and mean GiB (an "8 GB" card has 8 x 2^30 bytes), so the number is used
# as GiB unchanged. Apple's unified memory is the same.
#
# EACH DEVICE CITES THE PAGE ITS FIGURE IS CHECKED ON (`source`, a key below).
# Checked 2026-10-23: Parvathi spot-checked 41 of the first 51 on #559 and found
# none wrong; the rest were checked by fetching each page and finding the figure
# - Intel B580 and A770, T4, L4, A100 40/80, H100, the RTX 3050 Laptop 4GB, the
# RTX 4070 Ti ("12 GB GDDR6X" on the compare page) and the Mac Studio's 256 and
# 512 GB. 48 of the 54 are checked.
#
# ⚠ THE SIX AMD CARDS ARE NOT YET CHECKED. amd.com timed out or dropped the
#   connection on every product page on 2026-10-23, for us and for the
#   reviewer. Their figures are AMD's published sizes as commonly listed, and
#   stay marked here until a page loads.
#
# kind
#   discrete   a graphics card. The page lets a reader pick 1 to 4 of them.
#   unified    a Mac. The GPU may use only a share of it, by memory size
#              (local_inference.yaml `apple_gpu_share`).

# The headings the page groups devices under, in this order.
groups:
  - {id: geforce, label: NVIDIA GeForce}
  - {id: geforce_laptop, label: NVIDIA GeForce laptop}
  - {id: radeon, label: AMD Radeon}
  - {id: arc, label: Intel Arc}
  - {id: mac, label: Mac (unified memory)}
  - {id: datacentre, label: Data centre and cloud}

