# THE HARDWARE THE LOCAL VRAM TOOL OFFERS (PROPOSED 2026-10-23,
# docs/proposals/can-i-run-it.md). Rule 5: a device is added here by a commit.
#
# `memory_gib` is the device's memory as the vendor sells it. GPU vendors write
# "GB" and mean GiB (an "8 GB" card has 8 x 2^30 bytes), so the number is used
# as GiB unchanged. Apple's unified memory is the same.
#
# ⚠ NOT YET CHECKED ENTRY BY ENTRY. Every figure here is the vendor's published
#   memory size, written from the product names; `source` names where each one
#   is checked. The review of this file is that check - a wrong figure here is
#   a wrong "fits" on every model, so it is reviewed rather than trusted.
#
# kind
#   discrete   a graphics card. The whole of `memory_gib` is available to the
#              model, less the runtime overhead (local_inference.yaml).
#   unified    a Mac. The GPU may use only a share of it by default
#              (local_inference.yaml `apple_gpu_share`), which the tool applies.
#
# `count` is NOT here: the page lets a reader pick 1, 2, 3 or 4 of a discrete
# card ("Dual RTX 4090"), and local_inference.yaml says what splitting costs.

# Each source is where its devices' figures are checked, and `label` is the
# heading the page groups them under, in this order.
sources:
  nvidia: {label: NVIDIA GeForce, url: "https://www.nvidia.com/en-us/geforce/graphics-cards/compare/"}
  nvidia_laptop: {label: NVIDIA GeForce laptop, url: "https://www.nvidia.com/en-us/geforce/laptops/compare/"}
  amd: {label: AMD Radeon, url: "https://www.amd.com/en/products/graphics/desktops/radeon.html"}
  intel: {label: Intel Arc, url: "https://www.intel.com/content/www/us/en/products/details/discrete-gpus/arc.html"}
  apple: {label: Mac (unified memory), url: "https://www.apple.com/mac/compare/"}
  nvidia_datacenter: {label: Data centre and cloud, url: "https://www.nvidia.com/en-us/data-center/"}

