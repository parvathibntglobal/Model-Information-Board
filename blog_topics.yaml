# THE BLOG'S TOPIC HARVEST (2026-10-16, anooj): general AI, not only models.
#
# The first blog read only board entries - what engineers said about MODELS -
# so a reader searching "what is a System 1 model?" or "what is RAG?" found
# nothing here. This file drives a second, separate harvest for the blog:
#
#   arxiv     the newest papers in the categories below, from the official API
#             (contract/sources.yaml `arxiv-api-terms`, its rate guidance)
#   feeds     every blog feed contract/sources.yaml already reviews (robots and
#             terms checked per feed, the same gate the evidence harvest uses)
#
# What is stored is what the publisher syndicates - a title, the abstract or
# the feed summary, the authors, the date and the link - never a full article
# (scripts/harvest_topics.py, table topic_item). No model is called.
#
# TOPICS ARE CURATED, NOT COMPUTED (rule 10): which phrases count as one topic
# is a person's ruling. The harvest lists EMERGING TERMS - phrases recurring in
# recent titles that no topic covers - for a person (or Claude Code, proposing)
# to adopt as a new topic below. That is how this list follows the field.
#
# Required keys; absent raises (rule 12): judge/topics.py.

arxiv:
  # The categories the blog follows (team, 2026-10-16): AI, machine learning,
  # computation and language, software engineering. Queried ONE AT A TIME, so
  # a busy category cannot crowd a quieter one (cs.SE) out of the newest pages.
  categories: [cs.AI, cs.LG, cs.CL, cs.SE]
  # Pages of the newest submissions per category per harvest (50 papers a page,
  # one request every 3 seconds as arXiv asks).
  pages_per_category: 3

# THE PLATFORM ARMS (2026-10-18, anooj: "arXiv, Hacker News, dev.to and Hugging
# Face have free APIs - track these subjects there"). Each topic's own `terms`
# are the queries: the first `queries_per_topic` of them, so the list order is
# the priority. Through the same gated adapters the model fetch uses
# (contract/sources.yaml rulings; Hugging Face daily papers sit outside its ruling's
# wording until docs/proposals/huggingface-papers-in-topic-harvest.md is
# reviewed). Items older than `window_days` are not stored. Required: absent
# raises (scripts/harvest_topics.py).
platforms:
  queries_per_topic: 2
  window_days: 30
  hackernews: {per_query: 20, min_points: 3}
  devto: {per_query: 15}
  # Hugging Face: the papers it FEATURES each day, one request a day of the
  # window - not a keyword search (relevance-ordered; 25 of 750 hits in window).
  huggingface_papers: {daily: true}

window_days: 14          # a topic's items are counted over this many days
synthesis_min_items: 2   # this many items on one topic -> one combined article
emerging:
  min_items: 3           # a phrase must recur in this many recent titles
  window_days: 30
  max_terms: 25

# WHAT A TOPIC POST MAY BE WRITTEN FROM (generate_sample_blogs.py --topic-pack).
posts:
  # ARXIV IS A SOURCE OF A POST (anooj, 2026-10-16): the team read arXiv's API
  # terms - publishing is allowed with the acknowledgement below on the page.
  # What is quoted is the abstract the API returns (arXiv's metadata), with the
  # paper's title and a link to its abstract page; never the PDF.
  # ⚠ contract/sources.yaml `arxiv-api-terms` still reads
  # internal-development-only. Its update is proposed in
  # docs/proposals/arxiv-in-blog-posts.md (contract/, two eyes) and must land
  # BEFORE a post quoting arXiv is approved for the public page. Required.
  arxiv_as_source: true
  # Shown on every post that draws on an arXiv source (views.js). Required
  # while arxiv_as_source is true.
  arxiv_acknowledgement: "Thank you to arXiv for use of its open access interoperability."
  # WHICH SOURCES A POST TAKES FIRST (generate_sample_blogs.topic_docs). A
  # topic term in the TITLE counts most, then in the summary; an item that
  # also names one of these focus terms ranks higher, because the blog is about
  # language models and the field around them. A WEIGHT, NOT A GATE (rule 8):
  # nothing is dropped for lacking one. Measured 2026-10-16 before this: a debate
  # on AI agents drew robot-pursuit papers, and an interpretability post drew
  # two quantum-circuit papers through the word "circuits".
  focus_terms: [language model, language models, LLM, LLMs, transformer, transformers, chatbot,
                foundation model, foundation models, GPT, coding agent, coding agents, AI agent, AI agents,
                LLM agent, LLM agents, reasoning model, reasoning models]
  # Sources are taken from this many days back, newest first - an explainer of
  # RAG may rest on a good post from last month.
  source_window_days: 120
  max_sources: 6
  # A source with less text than this is skipped for a post (2026-10-18): a
  # Hacker News story with no comments yet, a one-line blurb. Required.
  min_source_chars: 400
  # THE BOARD BRIDGE (2026-10-18, anooj: "combine the model fetch data with the
  # blogs, only where there is a genuine connection"). A topic post may also be
  # written from engineer discussions on the model board - but only a thread
  # whose VERIFIED quotes match this topic's own `terms` at least
  # `min_matching_quotes` times, so one passing word does not make a link. The
  # link is decided by that regex, in code, never by the writer. Reddit and X
  # threads are left out (they may appear only as embeds, contract/
  # publication.yaml), so a bridged thread is always quotable with a link.
  # Bridged threads take slots within the format's source range, never more
  # than `max_threads`, and never all of them. Required: absent raises.
  board_bridge: {max_threads: 2, min_matching_quotes: 2}

