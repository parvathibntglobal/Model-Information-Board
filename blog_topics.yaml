  - key: robotics
    name: Robotics and embodied AI
    terms: [robotics, embodied, robot learning, vision-language-action]
  - key: code-generation
    name: Code generation and coding agents
    terms: [code generation, coding agent, coding agents, software engineering agent, SWE-bench, program synthesis]
  - key: embeddings
    name: Embeddings and vector search
    terms: [embedding model, embedding models, vector search, vector database, dense retrieval]
  - key: prompting
    name: Prompting and in-context learning
    terms: [prompt engineering, in-context learning, few-shot, prompt optimization]
  - key: hallucination
    name: Hallucination and factuality
    terms: [hallucination, hallucinations, factuality, grounding]
  - key: memory
